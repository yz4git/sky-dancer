name: Apply V25 Energy Load Final Once

on:
  push:
    branches: [arcade-run-v25-coordinated-flight-20260911]
    paths:
      - ".github/v25-energy-load-final.py"
      - ".github/workflows/v25-energy-load-final-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arcade-run-v25-coordinated-flight-20260911
      - run: python3 .github/v25-energy-load-final.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeV25CoordinatedFlight.ts
          git commit -m "Arcade Run V25: finalize maneuver energy load"
          git push origin HEAD:arcade-run-v25-coordinated-flight-20260911
