name: Arcade V10.2 Course Visual Audit Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/arcade-v102-course-audit-once.yml"

permissions:
  contents: write

env:
  SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome

jobs:
  visual-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version
      - name: Inject deterministic V10.2 audit bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/SkyDancerArcadeMode.tsx')
          s=p.read_text()
          needle='''        demoRef.current = demo;'''
          index=s.rfind(needle)
          assert index >= 0
          insert='''        demoRef.current = demo;\n        const webglAuditDemo = demo as SkyDancerArcadeWebGLDemo;\n        (globalThis as unknown as { __skyDancerV102Audit?: { setCourse: (stageId: Parameters<typeof skyDancerArcadeStageById>[0], progress: number) => unknown } }).__skyDancerV102Audit = {\n          setCourse: (stageId, progress) => {\n            const target = webglAuditDemo as unknown as Record<string, any>;\n            const runtime = target.runtime as Record<string, any>;\n            const stage = skyDancerArcadeStageById(stageId);\n            const p = Math.max(0, Math.min(.82, progress));\n            runtime.stage = stage;\n            runtime.status = "paused";\n            runtime.statusBeforePause = "running";\n            runtime.stageTime = stage.durationSeconds * p;\n            runtime.distance = runtime.stageTime * stage.courseSpeed;\n            runtime.enemies = []; runtime.projectiles = []; runtime.hazards = []; runtime.impactEvents = [];\n            runtime.playerHp = 100; runtime.playerX = 0; runtime.playerY = 0;\n            const snapshot = runtime.getSnapshot();\n            for (let i = 0; i < 90; i += 1) {\n              target.sync(snapshot, 1 / 60);\n              target.previousSnapshot = snapshot;\n            }\n            target.camera.updateMatrixWorld();\n            target.cinematic.render(target.scene, target.camera, snapshot.turboActive, target.presentationFx);\n            target.onSnapshot(snapshot);\n            return {\n              stageId: stage.id,\n              title: stage.title,\n              progress: p,\n              distance: runtime.distance,\n              cameraRoll: target.camera.rotation.z,\n              cameraX: target.camera.position.x,\n              cameraY: target.camera.position.y,\n              hp: snapshot.playerHp,\n            };\n          },\n        };'''
          s=s[:index]+insert+s[index+len(needle):]
          p.write_text(s)
          PY
      - name: Build Pages audit target
        run: npm run build:pages
      - name: Start local Pages target
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-dancer-v102-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-dancer-v102-http.log
          exit 1
      - name: Capture dynamic course frames
        run: node scripts/webgl-arcade-v102-course-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-dancer-v102-course-${{ github.sha }}
          path: artifacts/arcade-v102-course
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary V10.2 audit files
        if: success()
        run: |
          set -euo pipefail
          git checkout -- app/SkyDancerArcadeMode.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/webgl-arcade-v102-course-audit.mjs .github/workflows/arcade-v102-course-audit-once.yml
          git commit -m "Remove V10.2 temporary course visual audit files"
          git push