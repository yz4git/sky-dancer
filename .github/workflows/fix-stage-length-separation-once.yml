name: Fix Stage Length and Separation Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-stage-length-separation-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply longer-stage and separation fix
        run: |
          node .github/fix-stage-length-separation.mjs
          git diff --check
      - name: Fast behavioral tests
        run: npm run test:fast
      - name: Pages build and render
        run: npm run test:pages
      - name: Arcade TypeScript check
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Validate artifact
        run: npm run validate:artifact
      - name: Commit verified fix
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git rm .github/fix-stage-length-separation.mjs .github/workflows/fix-stage-length-separation-once.yml
          git add src tests
          git diff --cached --check
          git commit -m "Double stage length and separate enemy formations"
          git push origin HEAD:main
