name: SKY RAID V23c enemy packages roster one-shot

on:
  push:
    paths:
      - .github/workflows/sky-raid-enemy-packages-v23b-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Validate and apply V23 enemy package patches
        run: |
          node --check .github/sky-raid-v23b-patch.mjs
          node --check .github/sky-raid-v23c-roster-seed.mjs
          node .github/sky-raid-v23b-patch.mjs
          node .github/sky-raid-v23c-roster-seed.mjs
          git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate product implementation
        run: |
          npm run test:fast
          npm run check:arcade
          npm run lint

      - name: Inject webdriver-only audit hooks
        run: python3 scripts/inject-sky-raid-v17-audit-hook.py

      - name: Build audited Pages artifact
        run: npm run build:pages

      - name: Browser setup
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime artifacts/sky-raid-v17
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/sky-raid-v23c-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-raid-v23c-http.log
          exit 1

      - name: Real browser WebGL playcheck
        run: node scripts/webgl-sky-raid-camera-edge-v17.mjs

      - name: Restore audit-only source injections
        if: always()
        run: git restore src/sky/SkyDancerSkyRaidFlight.ts src/sky/SkyDancerCombatDecisionV45.ts src/sky/SkyDancerAirCombatFxV18.ts

      - name: Commit V23 enemy packages
        run: |
          rm .github/workflows/sky-raid-enemy-packages-v23b-once.yml
          rm .github/sky-raid-v23b-patch.mjs
          rm .github/sky-raid-v23c-roster-seed.mjs
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/SkyDancerSkyRaidRules.ts src/sky/SkyDancerSkyRaidEnemyDoctrine.ts src/cart/CartRoguePhase67TurboHunt.ts src/sky/SkyDancerFlightCombat.ts src/sky/SkyDancerSkyRaid.ts tests/sky-sky-raid.test.ts scripts/webgl-sky-raid-camera-edge-v17.mjs .github/workflows/sky-raid-enemy-packages-v23b-once.yml .github/sky-raid-v23b-patch.mjs .github/sky-raid-v23c-roster-seed.mjs
          git diff --cached --check
          git commit -m "Differentiate SKY RAID enemy packages by act"
          git push origin HEAD:main

      - name: Upload visual audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-raid-v23c-enemy-packages-audit
          path: artifacts/sky-raid-v17
          if-no-files-found: warn
          retention-days: 7
