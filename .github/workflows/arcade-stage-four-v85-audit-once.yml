name: Arcade Stage Four V8.5 Audit Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/arcade-stage-four-v85-audit-once.yml"

permissions:
  contents: write

concurrency:
  group: arcade-stage-four-v85-audit-once
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SKY_DANCER_STAGE_AUDIT_VISUAL: "1"
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
      SKY_DANCER_AUDIT_DIR: artifacts/arcade-stage-four-v85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version
      - run: npm run build:pages
      - name: Expand four-stage capture matrix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/webgl-arcade-stage-identity-audit.mjs')
          t=p.read_text()
          t=t.replace('{ id: "red-canyon", short: "CANYON", name: "RED CANYON", focus: false }','{ id: "red-canyon", short: "CANYON", name: "RED CANYON", focus: true }')
          t=t.replace('{ id: "volcano-core", short: "VOLCANO", name: "VOLCANO CORE", focus: false }','{ id: "volcano-core", short: "VOLCANO", name: "VOLCANO CORE", focus: true }')
          old='const expectedCaptures = visualAudit ? (item.stage === "ice-cavern" || item.stage === "orbital-ascent" ? 4 : 1) : 0;'
          new='const expectedCaptures = visualAudit ? 4 : 0;'
          if old not in t: raise SystemExit('capture contract not found')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Start local Pages build
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-dancer-v85-four-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-dancer-v85-four-http.log
          exit 1
      - name: Capture Canyon Ice Volcano Orbit
        run: node scripts/webgl-arcade-stage-identity-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-dancer-stage-four-v85-${{ github.sha }}
          path: artifacts/arcade-stage-four-v85
          if-no-files-found: error
          retention-days: 14
      - name: Remove one-shot workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/arcade-stage-four-v85-audit-once.yml
          git commit -m "Remove final four-stage V8.5 audit workflow"
          git push origin HEAD:main
