name: Temporary Sky Dancer Source Export

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/source-export.yml"

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules --exclude=.next --exclude=.vinext --exclude=.sites-runtime --exclude=dist --exclude=out -czf /tmp/sky-dancer-main-source.tar.gz .
          git rev-parse HEAD > /tmp/sky-dancer-main-sha.txt
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: sky-dancer-main-source
          path: |
            /tmp/sky-dancer-main-source.tar.gz
            /tmp/sky-dancer-main-sha.txt
          retention-days: 1
