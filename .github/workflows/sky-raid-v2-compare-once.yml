# SKY RAID V15 — 3D combat altitude + lock/hit feedback audit
name: SKY RAID V2 visual compare
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sky-raid-v2-compare-once.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Integrate SKY RAID altitude with lock and missiles
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"{label}: marker missing in {path}")
              p.write_text(s.replace(old, new, 1))

          # --- Player weapon logic: use the actual SKY RAID player altitude. ---
          path = 'src/sky/SkyDancerPlayerWeapons.ts'
          p = Path(path)
          s = p.read_text()
          old = '''  altitudeMeters: number;
            distance: number;
            angle: number;
          }'''
          new = '''  altitudeMeters: number;
            playerAltitudeMeters: number;
            altitudeDeltaMeters: number;
            distance: number;
            angle: number;
            signedAngle: number;
          }'''
          if old not in s: raise SystemExit('lock snapshot fields marker missing')
          s = s.replace(old, new, 1)

          old = '''interface WeaponSessionView {
            enemies: CartEnemyState[];'''
          new = '''interface WeaponSessionView {
            skyDancerPlayerAltitudeMeters?: number;
            enemies: CartEnemyState[];'''
          if old not in s: raise SystemExit('weapon session marker missing')
          s = s.replace(old, new, 1)

          old = '''function normalizeAngle(value: number): number {
            let angle = value;
            while (angle > Math.PI) angle -= Math.PI * 2;
            while (angle < -Math.PI) angle += Math.PI * 2;
            return angle;
          }
          '''
          new = old + '''
          function playerAltitudeMeters(session: WeaponSessionView): number {
            const altitude = Number(session.skyDancerPlayerAltitudeMeters ?? 0);
            return Number.isFinite(altitude) ? altitude : 0;
          }
          '''
          if old not in s: raise SystemExit('normalizeAngle marker missing')
          s = s.replace(old, new, 1)

          old = '''  const px = session.car.position.x;
            const pz = session.car.position.z;
            const heading = session.car.heading;
            let best: CartEnemyState | null = null;'''
          new = '''  const px = session.car.position.x;
            const pz = session.car.position.z;
            const heading = session.car.heading;
            const playerAltitude = playerAltitudeMeters(session);
            let best: CartEnemyState | null = null;'''
          if old not in s: raise SystemExit('chooseTarget header missing')
          s = s.replace(old, new, 1)
          s = s.replace(
              'const distance = skyDancerDistance3DV43(px, 0, pz, enemy.x, altitude, enemy.z);',
              'const distance = skyDancerDistance3DV43(px, playerAltitude, pz, enemy.x, altitude, enemy.z);',
              1,
          )
          s = s.replace(
              'const verticalPenalty = Math.abs(altitude) * 0.12;',
              'const verticalPenalty = Math.abs(altitude - playerAltitude) * 0.12;',
              1,
          )

          old = '''  const launchSpeed = 24 + Math.min(4.5, Math.abs(session.car.forwardVelocity) * 0.14);
            const targetAltitude = target ? getSkyDancerEnemyAltitudeMetersV43(target) : 0;'''
          new = '''  const launchSpeed = 24 + Math.min(4.5, Math.abs(session.car.forwardVelocity) * 0.14);
            const playerAltitude = playerAltitudeMeters(session);
            const targetAltitude = target ? getSkyDancerEnemyAltitudeMetersV43(target) : playerAltitude;'''
          if old not in s: raise SystemExit('launch altitude marker missing')
          s = s.replace(old, new, 1)
          s = s.replace(
              'Math.atan2(targetAltitude, Math.max(8, horizontalDistance)) * 0.28',
              'Math.atan2(targetAltitude - playerAltitude, Math.max(8, horizontalDistance)) * 0.28',
              1,
          )
          s = s.replace('    altitudeOffsetMeters: 0,\n', '    altitudeOffsetMeters: playerAltitude,\n', 1)
          old = '''      ? skyDancerDistance3DV43(session.car.position.x, 0, session.car.position.z, target.x, targetAltitude, target.z)'''
          new = '''      ? skyDancerDistance3DV43(session.car.position.x, playerAltitude, session.car.position.z, target.x, targetAltitude, target.z)'''
          if old not in s: raise SystemExit('launch distance marker missing')
          s = s.replace(old, new, 1)

          old = '''export function getSkyDancerPlayerLockSnapshotV45(session: CartArenaSession): SkyDancerPlayerLockSnapshotV45 {
            const view = session as unknown as WeaponSessionView;
            const target = chooseTarget(view);'''
          new = '''export function getSkyDancerPlayerLockSnapshotV45(session: CartArenaSession): SkyDancerPlayerLockSnapshotV45 {
            const view = session as unknown as WeaponSessionView;
            const playerAltitude = playerAltitudeMeters(view);
            const target = chooseTarget(view);'''
          if old not in s: raise SystemExit('lock function header missing')
          s = s.replace(old, new, 1)
          old = '''      vulnerable: false,
                altitudeMeters: 0,
                distance: Number.POSITIVE_INFINITY,
                angle: 0,
              };'''
          new = '''      vulnerable: false,
                altitudeMeters: 0,
                playerAltitudeMeters: playerAltitude,
                altitudeDeltaMeters: 0,
                distance: Number.POSITIVE_INFINITY,
                angle: 0,
                signedAngle: 0,
              };'''
          if old not in s: raise SystemExit('no lock return marker missing')
          s = s.replace(old, new, 1)

          old = '''    view.car.position.x,
                0,
                view.car.position.z,
                target.x,
                altitudeMeters,
                target.z,
              );
              const angle = Math.abs(normalizeAngle(Math.atan2(dx, dz) - view.car.heading));'''
          new = '''    view.car.position.x,
                playerAltitude,
                view.car.position.z,
                target.x,
                altitudeMeters,
                target.z,
              );
              const signedAngle = normalizeAngle(Math.atan2(dx, dz) - view.car.heading);
              const angle = Math.abs(signedAngle);'''
          if old not in s: raise SystemExit('target lock distance marker missing')
          s = s.replace(old, new, 1)

          old = '''    vulnerable: decision.vulnerable,
                altitudeMeters,
                distance,
                angle,
              };'''
          new = '''    vulnerable: decision.vulnerable,
                altitudeMeters,
                playerAltitudeMeters: playerAltitude,
                altitudeDeltaMeters: altitudeMeters - playerAltitude,
                distance,
                angle,
                signedAngle,
              };'''
          if old not in s: raise SystemExit('target lock return marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # --- SKY RAID publishes its actual flight altitude into combat state. ---
          replace_once(
              'src/sky/SkyDancerSkyRaid.ts',
              '''  const flight = flightControllerFor(demo).step(delta, base.heading, demo.steer, base.boostActive);
            demo.playerVisual.position.y = 0.62 + flight.altitude;''',
              '''  const flight = flightControllerFor(demo).step(delta, base.heading, demo.steer, base.boostActive);
            (demo.session as unknown as { skyDancerPlayerAltitudeMeters?: number }).skyDancerPlayerAltitudeMeters = flight.altitude;
            demo.playerVisual.position.y = 0.62 + flight.altitude;''',
              'SKY RAID combat altitude publication',
          )

          # Add a modest turbo pull-back/FOV lift after the normal chase calculation.
          path = 'src/sky/SkyDancerSkyRaid.ts'
          p = Path(path)
          s = p.read_text()
          old = '''    const chaseDistance = 9.6 + Math.min(4.0, speed * 0.085);
                const lookAhead = 6.8 + Math.min(5.2, speed * 0.105);'''
          new = '''    const turboCamera = snapshot.boostActive ? 1 : 0;
                const chaseDistance = 9.6 + Math.min(4.0, speed * 0.085) + turboCamera * 2.2;
                const lookAhead = 6.8 + Math.min(5.2, speed * 0.105) + turboCamera * 3.2;'''
          if old not in s: raise SystemExit('SKY RAID chase camera tuning marker missing')
          s = s.replace(old, new, 1)
          old = '''    this.camera.rotateZ(bank * 0.075);
              };'''
          new = '''    this.camera.rotateZ(bank * 0.075);
                if (turboCamera > 0) {
                  this.camera.fov = Math.min(96, this.camera.fov + 2.8);
                  this.camera.updateProjectionMatrix();
                }
              };'''
          if old not in s: raise SystemExit('SKY RAID camera tail marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # --- V43 render path: SKY RAID uses direct altitude units, older modes keep compression. ---
          path = 'src/sky/presentation/SkyDancerV43VerticalCombatPass.ts'
          p = Path(path)
          s = p.read_text()
          marker = '''interface PlayerMissileVisual {
            root: THREE.Group;
            flame: THREE.Mesh<THREE.ConeGeometry, THREE.MeshBasicMaterial>;
          }
          '''
          helper = marker + '''
          function verticalWorldOffset(meters: number): number {
            const skyRaid = typeof document !== "undefined" && document.documentElement.dataset.skyDancerMode === "sky-raid";
            return skyRaid ? meters : meters / SKY_DANCER_VERTICAL_RENDER_METERS_PER_UNIT;
          }
          '''
          if marker not in s: raise SystemExit('V43 helper marker missing')
          s = s.replace(marker, helper, 1)
          s = s.replace(
              'vertical.altitudeOffsetMeters / SKY_DANCER_VERTICAL_RENDER_METERS_PER_UNIT',
              'verticalWorldOffset(vertical.altitudeOffsetMeters)',
          )
          s = s.replace(
              'missile.altitudeOffsetMeters / SKY_DANCER_VERTICAL_RENDER_METERS_PER_UNIT',
              'verticalWorldOffset(missile.altitudeOffsetMeters)',
          )
          p.write_text(s)

          # --- V45 hierarchy: carry lock serials and render all combat altitude consistently. ---
          path = 'src/sky/presentation/SkyDancerV45DecisionHierarchyPass.ts'
          p = Path(path)
          s = p.read_text()
          old = '''  bossMode: "orbit" | "strike" | "break" | null;
            bossCoreOpen: boolean;
          }'''
          new = '''  bossMode: "orbit" | "strike" | "break" | null;
            bossCoreOpen: boolean;
            shotSerial: number;
            hitSerial: number;
          }'''
          if old not in s: raise SystemExit('V45 snapshot fields marker missing')
          s = s.replace(old, new, 1)

          marker = '''interface RibbonPoint {
            position: THREE.Vector3;
            age: number;
          }
          '''
          helper = marker + '''
          function verticalWorldOffset(meters: number): number {
            const skyRaid = typeof document !== "undefined" && document.documentElement.dataset.skyDancerMode === "sky-raid";
            return skyRaid ? meters : meters / SKY_DANCER_VERTICAL_RENDER_METERS_PER_UNIT;
          }
          '''
          if marker not in s: raise SystemExit('V45 helper marker missing')
          s = s.replace(marker, helper, 1)
          s = s.replace(
              'missile.altitudeOffsetMeters / SKY_DANCER_VERTICAL_RENDER_METERS_PER_UNIT',
              'verticalWorldOffset(missile.altitudeOffsetMeters)',
          )
          s = s.replace(
              'vertical.altitudeOffsetMeters / SKY_DANCER_VERTICAL_RENDER_METERS_PER_UNIT',
              'verticalWorldOffset(vertical.altitudeOffsetMeters)',
          )
          old = '''    const playerY = 1.02;
                const positions = this.bossLane.geometry.getAttribute("position") as THREE.BufferAttribute;'''
          new = '''    const playerAltitude = getSkyDancerPlayerLockSnapshotV45(this.runtime.session).playerAltitudeMeters;
                const playerY = 1.02 + verticalWorldOffset(playerAltitude);
                const positions = this.bossLane.geometry.getAttribute("position") as THREE.BufferAttribute;'''
          if old not in s: raise SystemExit('V45 boss player altitude marker missing')
          s = s.replace(old, new, 1)

          old = '''    const lock = getSkyDancerPlayerLockSnapshotV45(this.runtime.session);
                const boss = getLatestSkyDancerBossQualityV34();'''
          new = '''    const lock = getSkyDancerPlayerLockSnapshotV45(this.runtime.session);
                const weapon = getSkyDancerPlayerWeaponState(this.runtime.session);
                const boss = getLatestSkyDancerBossQualityV34();'''
          if old not in s: raise SystemExit('V45 publish decision header missing')
          s = s.replace(old, new, 1)
          old = '''      bossCoreOpen: Boolean(boss?.active && boss.coreOpen),
                };'''
          new = '''      bossCoreOpen: Boolean(boss?.active && boss.coreOpen),
                  shotSerial: weapon.shotSerial,
                  hitSerial: weapon.hitSerial,
                };'''
          if old not in s: raise SystemExit('V45 serial marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # --- V45 HUD: directional lock bracket + player-relative altitude + short HIT confirm. ---
          path = 'app/SkyDancerHudV45.tsx'
          p = Path(path)
          s = p.read_text()
          s = s.replace(
              'import { useEffect, useMemo, useState } from "react";',
              'import { useEffect, useMemo, useRef, useState } from "react";',
              1,
          )

          old = '''function altitudeLabel(value: number): string {
            const rounded = Math.round(Math.abs(value));
            if (value > 1) return `▲ +${rounded}m`;
            if (value < -1) return `▼ -${rounded}m`;
            return "◆ LEVEL";
          }
          '''
          new = old + '''
          function clamp(value: number, min: number, max: number): number {
            return Math.max(min, Math.min(max, value));
          }
          '''
          if old not in s: raise SystemExit('HUD altitude helper marker missing')
          s = s.replace(old, new, 1)

          old = '''export default function SkyDancerHudV45() {
            const [decision, setDecision] = useState<SkyDancerCombatDecisionSnapshotV45 | null>(null);

            useEffect(() => {
              const onDecision = (event: Event) => {
                setDecision((event as CustomEvent<SkyDancerCombatDecisionSnapshotV45>).detail ?? null);
              };
              window.addEventListener(SKY_DANCER_COMBAT_DECISION_EVENT_V45, onDecision);
              return () => window.removeEventListener(SKY_DANCER_COMBAT_DECISION_EVENT_V45, onDecision);
            }, []);'''
          new = '''export default function SkyDancerHudV45() {
            const [decision, setDecision] = useState<SkyDancerCombatDecisionSnapshotV45 | null>(null);
            const [hitPulse, setHitPulse] = useState(false);
            const hitSerialRef = useRef(0);
            const hitTimerRef = useRef<number | null>(null);

            useEffect(() => {
              const onDecision = (event: Event) => {
                const detail = (event as CustomEvent<SkyDancerCombatDecisionSnapshotV45>).detail ?? null;
                if (detail && detail.hitSerial > hitSerialRef.current) {
                  hitSerialRef.current = detail.hitSerial;
                  setHitPulse(true);
                  if (hitTimerRef.current !== null) window.clearTimeout(hitTimerRef.current);
                  hitTimerRef.current = window.setTimeout(() => {
                    hitTimerRef.current = null;
                    setHitPulse(false);
                  }, 180);
                } else if (detail) {
                  hitSerialRef.current = Math.max(hitSerialRef.current, detail.hitSerial);
                }
                setDecision(detail);
              };
              window.addEventListener(SKY_DANCER_COMBAT_DECISION_EVENT_V45, onDecision);
              return () => {
                window.removeEventListener(SKY_DANCER_COMBAT_DECISION_EVENT_V45, onDecision);
                if (hitTimerRef.current !== null) window.clearTimeout(hitTimerRef.current);
              };
            }, []);'''
          if old not in s: raise SystemExit('HUD event handler marker missing')
          s = s.replace(old, new, 1)

          old = '''  const locked = Boolean(decision?.targetEnemyId);
            return <>'''
          new = '''  const locked = Boolean(decision?.targetEnemyId);
            const reticleX = decision ? clamp((decision.signedAngle / 0.78) * 26, -26, 26) : 0;
            const altitudeRatio = decision && Number.isFinite(decision.distance) && decision.distance > 1
              ? clamp(decision.altitudeDeltaMeters / decision.distance, -0.72, 0.72)
              : 0;
            const reticleY = -altitudeRatio * 24;
            return <>'''
          if old not in s: raise SystemExit('HUD locked marker missing')
          s = s.replace(old, new, 1)

          css_marker = '''      .skyDancerV45Lock {
                position: fixed;'''
          css_new = '''      .skyDancerV45Reticle {
                position: fixed;
                z-index: 138;
                width: 39px;
                height: 39px;
                transform: translate(-50%, -50%);
                pointer-events: none;
                display: grid;
                place-items: center;
                color: rgba(255,214,116,.94);
                font: 950 30px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
                text-shadow: 0 0 7px rgba(255,191,72,.72), 0 1px 5px rgba(0,0,0,.9);
                transition: left 80ms linear, top 80ms linear, color 100ms linear, transform 100ms ease-out;
              }
              .skyDancerV45Reticle::before,
              .skyDancerV45Reticle::after {
                content: "";
                position: absolute;
                inset: 3px;
                border: 1px solid currentColor;
                clip-path: polygon(0 0, 28% 0, 28% 4%, 4% 4%, 4% 28%, 0 28%, 0 0, 72% 0, 100% 0, 100% 28%, 96% 28%, 96% 4%, 72% 4%, 72% 0, 100% 72%, 100% 100%, 72% 100%, 72% 96%, 96% 96%, 96% 72%, 100% 72%, 28% 100%, 0 100%, 0 72%, 4% 72%, 4% 96%, 28% 96%, 28% 100%);
              }
              .skyDancerV45Reticle::after {
                inset: 11px;
                opacity: .54;
                transform: rotate(45deg);
              }
              .skyDancerV45Reticle[data-ready="true"] {
                color: rgba(114,255,222,.98);
                transform: translate(-50%, -50%) scale(1.08);
              }
              .skyDancerV45Hit {
                position: fixed;
                z-index: 140;
                left: 50%;
                top: 37%;
                transform: translate(-50%, -50%);
                pointer-events: none;
                color: #efffff;
                padding: 3px 9px;
                border: 1px solid rgba(145,255,236,.86);
                background: rgba(8,66,65,.54);
                box-shadow: 0 0 22px rgba(94,255,222,.42);
                font: 950 clamp(13px,2.2vw,20px)/1 system-ui,sans-serif;
                letter-spacing: .18em;
                text-shadow: 0 0 8px rgba(116,255,235,.72);
              }
              .skyDancerV45Lock {
                position: fixed;'''
          if css_marker not in s: raise SystemExit('HUD CSS marker missing')
          s = s.replace(css_marker, css_new, 1)

          old = '''    {locked && decision && (
                <div
                  className="skyDancerV45Lock"'''
          new = '''    {locked && decision && (
                <div
                  className="skyDancerV45Reticle"
                  data-ready={decision.vulnerable ? "true" : "false"}
                  aria-label="Sky Raid target reticle"
                  style={{
                    left: `calc(50% + ${reticleX.toFixed(2)}vw)`,
                    top: `calc(43% + ${reticleY.toFixed(2)}vh)`,
                  }}
                >
                  <span>◇</span>
                </div>
              )}
              {locked && decision && (
                <div
                  className="skyDancerV45Lock"'''
          if old not in s: raise SystemExit('HUD render marker missing')
          s = s.replace(old, new, 1)
          s = s.replace(
              '{altitudeLabel(decision.altitudeMeters)}',
              '{altitudeLabel(decision.altitudeDeltaMeters)}',
              1,
          )
          old = '''    )}
              {bossDirective && <div className="skyDancerV45BossDirective" aria-label="V45 boss directive">{bossDirective}</div>}'''
          new = '''    )}
              {hitPulse && <div className="skyDancerV45Hit" aria-label="Sky Raid hit confirmation">HIT</div>}
              {bossDirective && <div className="skyDancerV45BossDirective" aria-label="V45 boss directive">{bossDirective}</div>}'''
          if old not in s: raise SystemExit('HUD hit marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Mount only the compact V45 combat HUD into SKY RAID.
          replace_once(
              'app/CartRogueGamePhase13.tsx',
              '''        <SkyDancerSkyRaidOverlay />
                <SkyDancerArcadeVirtualPad />''',
              '''        <SkyDancerSkyRaidOverlay />
                <SkyDancerHudV45 />
                <SkyDancerArcadeVirtualPad />''',
              'SKY RAID V45 HUD mount',
          )

          # Regression contract for the integrated SKY RAID combat stack.
          Path('tests/sky-sky-raid-combat-altitude.test.ts').write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";
          import { readFile } from "node:fs/promises";

          test("SKY RAID propagates rendered altitude into 3D player weapon targeting", async () => {
            const raid = await readFile(new URL("../src/sky/SkyDancerSkyRaid.ts", import.meta.url), "utf8");
            const weapons = await readFile(new URL("../src/sky/SkyDancerPlayerWeapons.ts", import.meta.url), "utf8");
            assert.match(raid, /skyDancerPlayerAltitudeMeters\?: number/);
            assert.match(weapons, /const playerAltitude = playerAltitudeMeters\(session\)/);
            assert.match(weapons, /skyDancerDistance3DV43\(px, playerAltitude, pz/);
            assert.match(weapons, /altitudeOffsetMeters: playerAltitude/);
            assert.match(weapons, /targetAltitude - playerAltitude/);
            assert.match(weapons, /altitudeDeltaMeters: altitudeMeters - playerAltitude/);
            assert.match(weapons, /signedAngle/);
          });

          test("SKY RAID renders V43/V45 combat altitude without legacy compression", async () => {
            const v43 = await readFile(new URL("../src/sky/presentation/SkyDancerV43VerticalCombatPass.ts", import.meta.url), "utf8");
            const v45 = await readFile(new URL("../src/sky/presentation/SkyDancerV45DecisionHierarchyPass.ts", import.meta.url), "utf8");
            assert.match(v43, /return skyRaid \? meters : meters \/ SKY_DANCER_VERTICAL_RENDER_METERS_PER_UNIT/);
            assert.match(v43, /verticalWorldOffset\(missile\.altitudeOffsetMeters\)/);
            assert.match(v45, /verticalWorldOffset\(missile\.altitudeOffsetMeters\)/);
            assert.match(v45, /playerAltitudeMeters/);
            assert.match(v45, /hitSerial: weapon\.hitSerial/);
          });

          test("SKY RAID mounts compact target and hit feedback HUD", async () => {
            const phase = await readFile(new URL("../app/CartRogueGamePhase13.tsx", import.meta.url), "utf8");
            const hud = await readFile(new URL("../app/SkyDancerHudV45.tsx", import.meta.url), "utf8");
            const skyRaidBranch = phase.slice(phase.indexOf('activeRequest?.mode === "sky-raid"'), phase.indexOf('activeRequest && (activeRequest.mode === "arcade-run"'));
            assert.match(skyRaidBranch, /<SkyDancerHudV45 \/>/);
            assert.match(hud, /Sky Raid target reticle/);
            assert.match(hud, /Sky Raid hit confirmation/);
            assert.match(hud, /altitudeLabel\(decision\.altitudeDeltaMeters\)/);
          });
          ''')
          PY

      - name: Regression checks
        run: |
          npm run test:fast
          npm run lint
          npm run build:pages

      - name: Commit SKY RAID 3D combat integration
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add \
            src/sky/SkyDancerPlayerWeapons.ts \
            src/sky/SkyDancerSkyRaid.ts \
            src/sky/presentation/SkyDancerV43VerticalCombatPass.ts \
            src/sky/presentation/SkyDancerV45DecisionHierarchyPass.ts \
            app/SkyDancerHudV45.tsx \
            app/CartRogueGamePhase13.tsx \
            tests/sky-sky-raid-combat-altitude.test.ts
          git commit -m "Integrate SKY RAID altitude with missile combat"
          git push origin HEAD:main

      - name: Inject webdriver-only ACT flight and combat audit hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/sky/SkyDancerSkyRaid.ts')
          s = p.read_text()
          old = 'let latestSkyRaidSnapshot: SkyDancerSkyRaidSnapshot | null = null;\n'
          new = old + 'let skyRaidAuditForcedActId: SkyDancerSkyRaidAct["id"] | null = null;\n'
          if old not in s: raise SystemExit('snapshot marker missing')
          s = s.replace(old, new, 1)

          old = '''  const raid = updateRaid(demo.session as unknown as RaidSession, hunt, 0);
            publishSkyRaidWorldStyle(raid);
          '''
          new = '''  const baseRaid = updateRaid(demo.session as unknown as RaidSession, hunt, 0);
            if (typeof window !== "undefined" && typeof navigator !== "undefined" && navigator.webdriver) {
              (window as unknown as Record<string, unknown>).__skyRaidAuditForceAct = (actId: SkyDancerSkyRaidAct["id"] | null) => {
                skyRaidAuditForcedActId = actId && SKY_DANCER_SKY_RAID_ACTS.some((candidate) => candidate.id === actId) ? actId : null;
              };
            }
            const forcedAct = skyRaidAuditForcedActId
              ? SKY_DANCER_SKY_RAID_ACTS.find((candidate) => candidate.id === skyRaidAuditForcedActId) ?? null
              : null;
            const raid: SkyDancerSkyRaidSnapshot = forcedAct
              ? { ...baseRaid, actIndex: forcedAct.index, actId: forcedAct.id, actLabel: forcedAct.label, actSubtitle: forcedAct.subtitle, setpiece: forcedAct.setpiece, elapsedSeconds: forcedAct.startSeconds + 6, actElapsedSeconds: 6, actSecondsRemaining: Math.max(0, forcedAct.endSeconds - forcedAct.startSeconds - 6), rushActive: false, palette: forcedAct.palette }
              : baseRaid;
            publishSkyRaidWorldStyle(raid);
            if (forcedAct) broadcast(raid);
          '''
          if old not in s: raise SystemExit('raid marker missing')
          s = s.replace(old, new, 1)

          old = '''  visual.arcadeWorld.update(raid.actId, base.x, base.z, base.heading, flight.altitude, raid.elapsedSeconds, delta);

            visual.speedFx.visible = base.boostActive || raid.rushActive;
          '''
          new = '''  visual.arcadeWorld.update(raid.actId, base.x, base.z, base.heading, flight.altitude, raid.elapsedSeconds, delta);
            if (typeof window !== "undefined" && typeof navigator !== "undefined" && navigator.webdriver) {
              (window as unknown as Record<string, unknown>).__skyRaidAuditFlightState = () => {
                demo.scene.updateMatrixWorld(true);
                demo.camera.updateMatrixWorld(true);
                const player = new THREE.Vector3();
                demo.playerVisual.getWorldPosition(player);
                const projected = player.clone().project(demo.camera);
                return {
                  altitude: Number(demo.scene.userData.skyRaidPlayerAltitude ?? 0),
                  verticalSpeed: Number(demo.scene.userData.skyRaidPlayerVerticalSpeed ?? 0),
                  pitch: Number(demo.scene.userData.skyRaidPlayerPitch ?? 0),
                  bank: Number(demo.scene.userData.skyRaidPlayerBank ?? 0),
                  cameraFov: Number(demo.camera.fov.toFixed(3)),
                  boostActive: base.boostActive,
                  freeFlightSectors: Number(demo.scene.userData.skyRaidArcadeFreeFlightSectorCount ?? 0),
                  worldLocked: Boolean(demo.scene.userData.skyRaidArcadeWorldLocked),
                  playerWorld: { x: Number(player.x.toFixed(3)), y: Number(player.y.toFixed(3)), z: Number(player.z.toFixed(3)) },
                  playerNdc: { x: Number(projected.x.toFixed(4)), y: Number(projected.y.toFixed(4)), z: Number(projected.z.toFixed(4)), visible: projected.z > -1 && projected.z < 1 && Math.abs(projected.x) < 1 && Math.abs(projected.y) < 1 },
                };
              };
              (window as unknown as Record<string, unknown>).__skyRaidAuditPrepareCombatTarget = () => {
                const current = demo.session.snapshot();
                const enemies = demo.session.enemies
                  .filter((enemy) => enemy.alive && enemy.nodeId === demo.session.location.node.id)
                  .slice(0, 6);
                const sideX = Math.cos(current.heading);
                const sideZ = -Math.sin(current.heading);
                enemies.forEach((enemy, index) => {
                  const ahead = 10 + index * 1.6;
                  const lateral = (index - (enemies.length - 1) * 0.5) * 1.35;
                  enemy.x = current.x + Math.sin(current.heading) * ahead + sideX * lateral;
                  enemy.z = current.z + Math.cos(current.heading) * ahead + sideZ * lateral;
                  enemy.heading = current.heading + Math.PI;
                });
                return enemies.map((enemy) => ({ id: enemy.id, x: enemy.x, z: enemy.z, kind: enemy.kind }));
              };
            }

            visual.speedFx.visible = base.boostActive || raid.rushActive;
          '''
          if old not in s: raise SystemExit('world update marker missing')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version

      - name: Build audited Pages bundle
        run: npm run build:pages

      - name: Serve build
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-raid-audit-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-raid-audit-http.log
          exit 1

      - name: Capture all SKY RAID acts
        run: node scripts/webgl-sky-raid-v2-compare.mjs

      - name: Run high-altitude combat play audit
        run: |
          cat > /tmp/sky-raid-combat-audit.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/.audit-runtime/node_modules/playwright-core');
          const fs = require('node:fs');
          const path = require('node:path');

          (async () => {
            const out = 'artifacts/sky-raid-v2-compare';
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.SKY_DANCER_CHROME_PATH || '/usr/bin/google-chrome',
              args: ['--use-angle=swiftshader','--enable-webgl','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage'],
            });
            const context = await browser.newContext({ viewport: { width: 844, height: 390 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', m => { if (m.type() === 'error' && !/404/.test(m.text())) errors.push(m.text()); });
            await page.goto(`http://127.0.0.1:4173?menu=1&combatAudit=${Date.now()}`, { waitUntil: 'networkidle', timeout: 60000 });
            const mode = page.locator('button').filter({ hasText: /^\s*SKY RAID/i }).first();
            await mode.click({ force: true });
            await page.waitForTimeout(100);
            await page.locator('button').filter({ hasText: /START/i }).last().click({ force: true });
            await page.locator('canvas[aria-label="Sky Dancer WebGL game view"]').waitFor({ state: 'visible', timeout: 30000 });
            await page.waitForFunction(() => typeof window.__skyRaidAuditFlightState === 'function' && typeof window.__skyRaidAuditPrepareCombatTarget === 'function', null, { timeout: 15000 });

            const pad = page.locator('[aria-label="Sky Raid two-axis flight stick"]');
            const box = await pad.boundingBox();
            if (!box) throw new Error('flight pad missing');
            await page.mouse.move(box.x + box.width * 0.5, box.y + box.height * 0.5);
            await page.mouse.down();
            await page.mouse.move(box.x + box.width * 0.52, box.y + box.height * 0.08, { steps: 7 });
            await page.waitForTimeout(900);
            await page.mouse.up();
            await page.waitForTimeout(100);

            const flightBeforeLock = await page.evaluate(() => window.__skyRaidAuditFlightState());
            if (!(flightBeforeLock.altitude > 5)) throw new Error(`player did not reach combat audit altitude: ${JSON.stringify(flightBeforeLock)}`);

            let prepared = await page.evaluate(() => window.__skyRaidAuditPrepareCombatTarget());
            if (!prepared?.length) throw new Error('no live enemy available for combat audit');
            await page.waitForTimeout(220);

            let decisionDebug = await page.evaluate(() => typeof window.__skyDancerGetV45DecisionHierarchy === 'function' ? window.__skyDancerGetV45DecisionHierarchy() : null);
            if (!decisionDebug?.decision?.targetEnemyId) {
              prepared = await page.evaluate(() => window.__skyRaidAuditPrepareCombatTarget());
              await page.waitForTimeout(220);
              decisionDebug = await page.evaluate(() => typeof window.__skyDancerGetV45DecisionHierarchy === 'function' ? window.__skyDancerGetV45DecisionHierarchy() : null);
            }
            const decision = decisionDebug?.decision;
            if (!decision?.targetEnemyId) throw new Error(`lock failed after deterministic target placement: ${JSON.stringify(decisionDebug)}`);
            if (Math.abs(decision.playerAltitudeMeters - flightBeforeLock.altitude) > 1.5) {
              throw new Error(`lock player altitude mismatch: flight=${flightBeforeLock.altitude}, lock=${decision.playerAltitudeMeters}`);
            }
            const reticle = page.locator('[aria-label="Sky Raid target reticle"]');
            if (!(await reticle.count())) throw new Error('SKY RAID target reticle not visible');
            await page.screenshot({ path: path.join(out, 'raid-combat-high-altitude-lock.png') });

            const beforeHit = Number(decision.hitSerial || 0);
            const shot = page.locator('button[aria-label="Fire missile"]');
            await shot.dispatchEvent('pointerdown', { pointerId: 51, pointerType: 'touch', isPrimary: true, clientX: 760, clientY: 300 });
            await page.waitForTimeout(100);

            await page.waitForFunction(() => {
              const state = typeof window.__skyDancerGetV43VerticalFlight === 'function' ? window.__skyDancerGetV43VerticalFlight() : null;
              return Boolean(state?.playerMissiles?.length);
            }, null, { timeout: 3000 });
            const vertical = await page.evaluate(() => window.__skyDancerGetV43VerticalFlight());
            const missile = vertical.playerMissiles[0];
            if (Math.abs(missile.altitudeOffsetMeters - flightBeforeLock.altitude) > 2.5) {
              throw new Error(`missile spawned at wrong altitude: player=${flightBeforeLock.altitude}, missile=${missile.altitudeOffsetMeters}`);
            }
            await page.screenshot({ path: path.join(out, 'raid-combat-high-altitude-shot.png') });

            let hitObserved = false;
            const deadline = Date.now() + 2600;
            while (Date.now() < deadline) {
              await page.waitForTimeout(80);
              const debug = await page.evaluate(() => typeof window.__skyDancerGetV45DecisionHierarchy === 'function' ? window.__skyDancerGetV45DecisionHierarchy() : null);
              if (Number(debug?.decision?.hitSerial || 0) > beforeHit) {
                hitObserved = true;
                await page.screenshot({ path: path.join(out, 'raid-combat-high-altitude-hit.png') });
                break;
              }
            }
            if (!hitObserved) throw new Error('high-altitude missile did not produce a hit confirmation');

            const baseline = await page.evaluate(() => window.__skyRaidAuditFlightState());
            const turbo = page.locator('button').filter({ hasText: /TURBO/i }).last();
            const turboBox = await turbo.boundingBox();
            if (!turboBox) throw new Error('TURBO button missing');
            await page.mouse.move(turboBox.x + turboBox.width / 2, turboBox.y + turboBox.height / 2);
            await page.mouse.down();
            await page.waitForTimeout(360);
            const turboState = await page.evaluate(() => window.__skyRaidAuditFlightState());
            await page.screenshot({ path: path.join(out, 'raid-combat-turbo-camera.png') });
            await page.mouse.up();
            if (!turboState.playerNdc.visible) throw new Error(`aircraft left frame during TURBO: ${JSON.stringify(turboState)}`);
            if (turboState.boostActive && turboState.cameraFov < baseline.cameraFov + 2) {
              throw new Error(`TURBO camera FOV did not expand: ${baseline.cameraFov} -> ${turboState.cameraFov}`);
            }

            const result = {
              errors,
              flightBeforeLock,
              prepared,
              decision,
              missile,
              hitObserved,
              turbo: { baseline, active: turboState },
            };
            fs.writeFileSync(path.join(out, 'combat-report.json'), JSON.stringify(result, null, 2));
            if (errors.length) throw new Error(`browser errors: ${JSON.stringify(errors)}`);
            await context.close();
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          JS
          node /tmp/sky-raid-combat-audit.cjs

      - name: Assert five-act and flight regression
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open('artifacts/sky-raid-v2-compare/report.json'))
          act1 = report['raid']['acts'][0]
          initial = act1['legacyOwners']['flight']
          maneuver = act1['maneuverFlight']['flight']
          wide = act1['wideClimbTurnFlight']['flight']
          for name, state in [('maneuver', maneuver), ('wide', wide)]:
              ndc = state['playerNdc']
              if not ndc['visible'] or abs(ndc['x']) > 0.58 or not (-0.72 < ndc['y'] < 0.62):
                  raise SystemExit(f'{name}: aircraft framing failed: {ndc}')
          if maneuver['playerWorld']['y'] < initial['playerWorld']['y'] + 7:
              raise SystemExit(f'aircraft visual did not climb enough: {initial["playerWorld"]} -> {maneuver["playerWorld"]}')
          if wide['playerWorld']['y'] < maneuver['playerWorld']['y'] + 5:
              raise SystemExit(f'aircraft visual stopped climbing: {maneuver["playerWorld"]} -> {wide["playerWorld"]}')
          if any(act['forbiddenHud'] for act in report['raid']['acts']):
              raise SystemExit('legacy HUD leaked into SKY RAID')
          if report['raid']['errors']:
              raise SystemExit(f"browser errors: {report['raid']['errors']}")

          combat = json.load(open('artifacts/sky-raid-v2-compare/combat-report.json'))
          if not combat['hitObserved']:
              raise SystemExit('combat audit did not observe hit')
          if abs(combat['decision']['playerAltitudeMeters'] - combat['flightBeforeLock']['altitude']) > 1.5:
              raise SystemExit('lock altitude mismatch')
          if abs(combat['missile']['altitudeOffsetMeters'] - combat['flightBeforeLock']['altitude']) > 2.5:
              raise SystemExit('missile launch altitude mismatch')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-raid-v2-compare
          path: artifacts/sky-raid-v2-compare
          if-no-files-found: error
          retention-days: 7
