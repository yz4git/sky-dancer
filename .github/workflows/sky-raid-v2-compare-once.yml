# V5b isolate CartRogue base world, then capture the real result
name: SKY RAID V2 visual compare
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sky-raid-v2-compare-once.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Isolate SKY RAID from CartRogue base world
        run: |
          python3 -c "from pathlib import Path; p=Path('src/sky/SkyDancerSkyRaid.ts'); s=p.read_text(); old='    previousBuildWorld.call(this);\\n    buildRaidVisuals(this);'; new='    if (!isSkyRaidMode()) previousBuildWorld.call(this);\\n    buildRaidVisuals(this);'; assert old in s; p.write_text(s.replace(old,new,1))"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/sky/SkyDancerSkyRaid.ts
          git commit -m "Remove CartRogue ground from SKY RAID"
          git push origin main
      - name: Regression checks
        run: |
          grep -F 'if (!isSkyRaidMode()) previousBuildWorld.call(this);' src/sky/SkyDancerSkyRaid.ts
          npm run test:fast
          npm run lint
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version
      - name: Build Pages
        run: npm run build:pages
      - name: Serve build
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-raid-audit-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-raid-audit-http.log
          exit 1
      - name: Capture Arcade Run and SKY RAID
        run: node scripts/webgl-sky-raid-v2-compare.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-raid-v2-compare
          path: artifacts/sky-raid-v2-compare
          if-no-files-found: error
          retention-days: 7
