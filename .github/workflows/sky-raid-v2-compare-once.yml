# Full five-act SKY RAID visual audit V7
name: SKY RAID V2 visual compare
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sky-raid-v2-compare-once.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regression checks
        run: |
          npm run test:fast
          npm run lint
      - name: Inject webdriver-only ACT and mesh audit hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/sky/SkyDancerSkyRaid.ts')
          s = p.read_text()
          old = 'let latestSkyRaidSnapshot: SkyDancerSkyRaidSnapshot | null = null;\n'
          new = old + 'let skyRaidAuditForcedActId: SkyDancerSkyRaidAct["id"] | null = null;\n'
          if old not in s:
              raise SystemExit('latest snapshot marker missing')
          s = s.replace(old, new, 1)
          old = '''  const raid = updateRaid(demo.session as unknown as RaidSession, hunt, 0);\n  publishSkyRaidWorldStyle(raid);\n'''
          new = '''  const baseRaid = updateRaid(demo.session as unknown as RaidSession, hunt, 0);\n  if (typeof window !== "undefined" && typeof navigator !== "undefined" && navigator.webdriver) {\n    (window as unknown as Record<string, unknown>).__skyRaidAuditForceAct = (actId: SkyDancerSkyRaidAct["id"] | null) => {\n      skyRaidAuditForcedActId = actId && SKY_DANCER_SKY_RAID_ACTS.some((candidate) => candidate.id === actId) ? actId : null;\n    };\n  }\n  const forcedAct = skyRaidAuditForcedActId\n    ? SKY_DANCER_SKY_RAID_ACTS.find((candidate) => candidate.id === skyRaidAuditForcedActId) ?? null\n    : null;\n  const raid: SkyDancerSkyRaidSnapshot = forcedAct\n    ? {\n        ...baseRaid,\n        actIndex: forcedAct.index,\n        actId: forcedAct.id,\n        actLabel: forcedAct.label,\n        actSubtitle: forcedAct.subtitle,\n        setpiece: forcedAct.setpiece,\n        elapsedSeconds: forcedAct.startSeconds + 1,\n        actElapsedSeconds: 1,\n        actSecondsRemaining: Math.max(0, forcedAct.endSeconds - forcedAct.startSeconds - 1),\n        rushActive: false,\n        palette: forcedAct.palette,\n      }\n    : baseRaid;\n  publishSkyRaidWorldStyle(raid);\n  if (forcedAct) broadcast(raid);\n'''
          if old not in s:
              raise SystemExit('raid visual marker missing')
          s = s.replace(old, new, 1)
          old = '''  visual.arcadeWorld.update(raid.actId, base.x, base.z, base.heading, flight.altitude, raid.elapsedSeconds, delta);\n\n  visual.speedFx.visible = base.boostActive || raid.rushActive;\n'''
          new = '''  visual.arcadeWorld.update(raid.actId, base.x, base.z, base.heading, flight.altitude, raid.elapsedSeconds, delta);\n  if (typeof window !== "undefined" && typeof navigator !== "undefined" && navigator.webdriver) {\n    (window as unknown as Record<string, unknown>).__skyRaidAuditVisibleMeshes = () => {\n      const rows: Array<{ footprint: number; name: string; geometry: string; size: number[]; colors: Array<string | null>; parents: string[]; userData: string[] }> = [];\n      demo.scene.updateMatrixWorld(true);\n      demo.scene.traverse((object) => {\n        if (!(object instanceof THREE.Mesh)) return;\n        let current: THREE.Object3D | null = object;\n        while (current) {\n          if (!current.visible) return;\n          current = current.parent;\n        }\n        const bounds = new THREE.Box3().setFromObject(object);\n        const size = new THREE.Vector3();\n        bounds.getSize(size);\n        const footprint = Math.max(size.x, size.z);\n        if (!Number.isFinite(footprint) || footprint < 18) return;\n        const materials = Array.isArray(object.material) ? object.material : [object.material];\n        const colors = materials.map((material) => {\n          const colored = material as THREE.Material & { color?: THREE.Color };\n          return colored.color instanceof THREE.Color ? `#${colored.color.getHexString()}` : null;\n        });\n        const parents: string[] = [];\n        let parent = object.parent;\n        while (parent && parents.length < 6) {\n          parents.push(parent.name || "(unnamed)");\n          parent = parent.parent;\n        }\n        rows.push({\n          footprint,\n          name: object.name || "(unnamed)",\n          geometry: object.geometry.type,\n          size: [Number(size.x.toFixed(2)), Number(size.y.toFixed(2)), Number(size.z.toFixed(2))],\n          colors,\n          parents,\n          userData: Object.keys(object.userData),\n        });\n      });\n      return rows.sort((a, b) => b.footprint - a.footprint).slice(0, 120);\n    };\n  }\n\n  visual.speedFx.visible = base.boostActive || raid.rushActive;\n'''
          if old not in s:
              raise SystemExit('arcade world update marker missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version
      - name: Build Pages
        run: npm run build:pages
      - name: Serve build
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-raid-audit-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-raid-audit-http.log
          exit 1
      - name: Capture Arcade Run and all SKY RAID acts
        run: node scripts/webgl-sky-raid-v2-compare.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-raid-v2-compare
          path: artifacts/sky-raid-v2-compare
          if-no-files-found: error
          retention-days: 7
