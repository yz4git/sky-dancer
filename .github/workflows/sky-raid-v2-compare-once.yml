# Full five-act SKY RAID visual audit V12 — camera follows rendered aircraft world position
name: SKY RAID V2 visual compare
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sky-raid-v2-compare-once.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Patch camera to rendered aircraft world position
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/sky/SkyDancerSkyRaid.ts')
          s = p.read_text()
          old = '''    const altitude = Number(this.scene.userData.skyRaidPlayerAltitude ?? 0);\n    const verticalSpeed = Number(this.scene.userData.skyRaidPlayerVerticalSpeed ?? 0);\n    const bank = Number(this.scene.userData.skyRaidPlayerBank ?? 0);\n    const speed = Math.abs(snapshot.speed);\n    const forwardX = Math.sin(snapshot.heading);\n    const forwardZ = Math.cos(snapshot.heading);\n    const chaseDistance = 9.6 + Math.min(4.0, speed * 0.085);\n    const chaseHeight = 5.15 + altitude + Math.max(0, verticalSpeed) * 0.025;\n    const lookAhead = 6.8 + Math.min(5.2, speed * 0.105);\n    const lookHeight = 1.55 + altitude + verticalSpeed * 0.018;\n    // SKY RAID is true 360-degree flight, so the final camera must be derived from\n    // aircraft heading in all axes rather than inheriting the car chase X/Z frame.\n    this.camera.position.set(\n      snapshot.x - forwardX * chaseDistance,\n      chaseHeight,\n      snapshot.z - forwardZ * chaseDistance,\n    );\n    this.camera.up.set(0, 1, 0);\n    this.camera.lookAt(\n      snapshot.x + forwardX * lookAhead,\n      lookHeight,\n      snapshot.z + forwardZ * lookAhead,\n    );\n    this.camera.rotateZ(bank * 0.075);\n'''
          new = '''    const bank = Number(this.scene.userData.skyRaidPlayerBank ?? 0);\n    const speed = Math.abs(snapshot.speed);\n    const forwardX = Math.sin(snapshot.heading);\n    const forwardZ = Math.cos(snapshot.heading);\n    const chaseDistance = 9.6 + Math.min(4.0, speed * 0.085);\n    const lookAhead = 6.8 + Math.min(5.2, speed * 0.105);\n    // Read the rendered aircraft itself. Several late Sky Dancer presentation passes\n    // can own vertical transforms, so inferred altitude is not a reliable camera datum.\n    this.playerVisual.updateWorldMatrix(true, false);\n    const playerPosition = new THREE.Vector3();\n    this.playerVisual.getWorldPosition(playerPosition);\n    this.camera.position.set(\n      playerPosition.x - forwardX * chaseDistance,\n      playerPosition.y + 4.55,\n      playerPosition.z - forwardZ * chaseDistance,\n    );\n    this.camera.up.set(0, 1, 0);\n    this.camera.lookAt(\n      playerPosition.x + forwardX * lookAhead,\n      playerPosition.y + 0.95,\n      playerPosition.z + forwardZ * lookAhead,\n    );\n    this.camera.rotateZ(bank * 0.075);\n'''
          if old not in s:
              raise SystemExit('V11 camera block missing')
          p.write_text(s.replace(old, new, 1))

          t = Path('tests/sky-sky-raid-reference-world.test.ts')
          tests = t.read_text()
          tests = tests.replace(
              '  assert.match(source, /snapshot\\.x - forwardX \\* chaseDistance/);\n  assert.match(source, /snapshot\\.z - forwardZ \\* chaseDistance/);',
              '  assert.match(source, /this\\.playerVisual\\.getWorldPosition\\(playerPosition\\)/);\n  assert.match(source, /playerPosition\\.x - forwardX \\* chaseDistance/);\n  assert.match(source, /playerPosition\\.z - forwardZ \\* chaseDistance/);'
          )
          t.write_text(tests)
          PY
      - name: Regression checks
        run: |
          npm run test:fast
          npm run lint
          npm run build:pages
      - name: Commit rendered-aircraft camera fix
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/SkyDancerSkyRaid.ts tests/sky-sky-raid-reference-world.test.ts
          git commit -m "Follow rendered SKY RAID aircraft with camera"
          git push origin HEAD:main
      - name: Inject webdriver-only ACT and flight audit hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/sky/SkyDancerSkyRaid.ts')
          s = p.read_text()
          old = 'let latestSkyRaidSnapshot: SkyDancerSkyRaidSnapshot | null = null;\n'
          new = old + 'let skyRaidAuditForcedActId: SkyDancerSkyRaidAct["id"] | null = null;\n'
          if old not in s: raise SystemExit('snapshot marker missing')
          s = s.replace(old, new, 1)
          old = '''  const raid = updateRaid(demo.session as unknown as RaidSession, hunt, 0);\n  publishSkyRaidWorldStyle(raid);\n'''
          new = '''  const baseRaid = updateRaid(demo.session as unknown as RaidSession, hunt, 0);\n  if (typeof window !== "undefined" && typeof navigator !== "undefined" && navigator.webdriver) {\n    (window as unknown as Record<string, unknown>).__skyRaidAuditForceAct = (actId: SkyDancerSkyRaidAct["id"] | null) => {\n      skyRaidAuditForcedActId = actId && SKY_DANCER_SKY_RAID_ACTS.some((candidate) => candidate.id === actId) ? actId : null;\n    };\n  }\n  const forcedAct = skyRaidAuditForcedActId\n    ? SKY_DANCER_SKY_RAID_ACTS.find((candidate) => candidate.id === skyRaidAuditForcedActId) ?? null\n    : null;\n  const raid: SkyDancerSkyRaidSnapshot = forcedAct\n    ? { ...baseRaid, actIndex: forcedAct.index, actId: forcedAct.id, actLabel: forcedAct.label, actSubtitle: forcedAct.subtitle, setpiece: forcedAct.setpiece, elapsedSeconds: forcedAct.startSeconds + 1, actElapsedSeconds: 1, actSecondsRemaining: Math.max(0, forcedAct.endSeconds - forcedAct.startSeconds - 1), rushActive: false, palette: forcedAct.palette }\n    : baseRaid;\n  publishSkyRaidWorldStyle(raid);\n  if (forcedAct) broadcast(raid);\n'''
          if old not in s: raise SystemExit('raid marker missing')
          s = s.replace(old, new, 1)
          old = '''  visual.arcadeWorld.update(raid.actId, base.x, base.z, base.heading, flight.altitude, raid.elapsedSeconds, delta);\n\n  visual.speedFx.visible = base.boostActive || raid.rushActive;\n'''
          new = '''  visual.arcadeWorld.update(raid.actId, base.x, base.z, base.heading, flight.altitude, raid.elapsedSeconds, delta);\n  if (typeof window !== "undefined" && typeof navigator !== "undefined" && navigator.webdriver) {\n    (window as unknown as Record<string, unknown>).__skyRaidAuditFlightState = () => {\n      demo.scene.updateMatrixWorld(true);\n      demo.camera.updateMatrixWorld(true);\n      const player = new THREE.Vector3();\n      demo.playerVisual.getWorldPosition(player);\n      const projected = player.clone().project(demo.camera);\n      return {\n        altitude: Number(demo.scene.userData.skyRaidPlayerAltitude ?? 0),\n        verticalSpeed: Number(demo.scene.userData.skyRaidPlayerVerticalSpeed ?? 0),\n        bank: Number(demo.scene.userData.skyRaidPlayerBank ?? 0),\n        freeFlightSectors: Number(demo.scene.userData.skyRaidArcadeFreeFlightSectorCount ?? 0),\n        worldLocked: Boolean(demo.scene.userData.skyRaidArcadeWorldLocked),\n        playerWorld: { x: Number(player.x.toFixed(3)), y: Number(player.y.toFixed(3)), z: Number(player.z.toFixed(3)) },\n        playerNdc: { x: Number(projected.x.toFixed(4)), y: Number(projected.y.toFixed(4)), z: Number(projected.z.toFixed(4)), visible: projected.z > -1 && projected.z < 1 && Math.abs(projected.x) < 1 && Math.abs(projected.y) < 1 },\n      };\n    };\n  }\n\n  visual.speedFx.visible = base.boostActive || raid.rushActive;\n'''
          if old not in s: raise SystemExit('world update marker missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version
      - name: Build audited Pages bundle
        run: npm run build:pages
      - name: Serve build
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-raid-audit-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-raid-audit-http.log
          exit 1
      - name: Capture Arcade Run and all SKY RAID acts
        run: node scripts/webgl-sky-raid-v2-compare.mjs
      - name: Assert real climb and camera framing
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open('artifacts/sky-raid-v2-compare/report.json'))
          act1 = report['raid']['acts'][0]
          initial = act1['legacyOwners']['flight']
          maneuver = act1['maneuverFlight']['flight']
          wide = act1['wideClimbTurnFlight']['flight']
          print('initial', initial)
          print('maneuver', maneuver)
          print('wide', wide)
          for name, state in [('maneuver', maneuver), ('wide', wide)]:
              ndc = state['playerNdc']
              if not ndc['visible'] or abs(ndc['x']) > 0.58 or not (-0.72 < ndc['y'] < 0.62):
                  raise SystemExit(f'{name}: aircraft framing failed: {ndc}')
          if maneuver['playerWorld']['y'] < initial['playerWorld']['y'] + 4:
              raise SystemExit(f'aircraft visual did not climb: {initial["playerWorld"]} -> {maneuver["playerWorld"]}')
          if wide['playerWorld']['y'] < maneuver['playerWorld']['y'] + 3:
              raise SystemExit(f'aircraft visual stopped climbing: {maneuver["playerWorld"]} -> {wide["playerWorld"]}')
          if report['raid']['errors']:
              raise SystemExit(f"browser errors: {report['raid']['errors']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-raid-v2-compare
          path: artifacts/sky-raid-v2-compare
          if-no-files-found: error
          retention-days: 7
