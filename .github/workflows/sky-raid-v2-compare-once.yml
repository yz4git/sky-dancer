# SKY RAID V15 final verification after reticle fix
name: SKY RAID V2 visual compare
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sky-raid-v2-compare-once.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Product checks
        run: |
          npm run test:fast
          npm run build:pages
          grep -q 'aria-label="Sky Raid target reticle"' app/SkyDancerHudV45.tsx
          grep -q 'aria-label="Sky Raid hit confirmation"' app/SkyDancerHudV45.tsx
          grep -q 'altitudeOffsetMeters: playerAltitude' src/sky/SkyDancerPlayerWeapons.ts

      - name: Inject webdriver audit hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/sky/SkyDancerSkyRaid.ts')
          s = p.read_text()
          old = 'let latestSkyRaidSnapshot: SkyDancerSkyRaidSnapshot | null = null;\n'
          if old not in s: raise SystemExit('snapshot marker missing')
          s = s.replace(old, old + 'let skyRaidAuditForcedActId: SkyDancerSkyRaidAct["id"] | null = null;\n', 1)
          old = '''  const raid = updateRaid(demo.session as unknown as RaidSession, hunt, 0);\n  publishSkyRaidWorldStyle(raid);\n'''
          new = '''  const baseRaid = updateRaid(demo.session as unknown as RaidSession, hunt, 0);\n  if (typeof window !== "undefined" && typeof navigator !== "undefined" && navigator.webdriver) {\n    (window as unknown as Record<string, unknown>).__skyRaidAuditForceAct = (actId: SkyDancerSkyRaidAct["id"] | null) => {\n      skyRaidAuditForcedActId = actId && SKY_DANCER_SKY_RAID_ACTS.some((candidate) => candidate.id === actId) ? actId : null;\n    };\n  }\n  const forcedAct = skyRaidAuditForcedActId ? SKY_DANCER_SKY_RAID_ACTS.find((candidate) => candidate.id === skyRaidAuditForcedActId) ?? null : null;\n  const raid: SkyDancerSkyRaidSnapshot = forcedAct\n    ? { ...baseRaid, actIndex: forcedAct.index, actId: forcedAct.id, actLabel: forcedAct.label, actSubtitle: forcedAct.subtitle, setpiece: forcedAct.setpiece, elapsedSeconds: forcedAct.startSeconds + 6, actElapsedSeconds: 6, actSecondsRemaining: Math.max(0, forcedAct.endSeconds - forcedAct.startSeconds - 6), rushActive: false, palette: forcedAct.palette }\n    : baseRaid;\n  publishSkyRaidWorldStyle(raid);\n  if (forcedAct) broadcast(raid);\n'''
          if old not in s: raise SystemExit('raid update marker missing')
          s = s.replace(old, new, 1)
          old = '''  visual.arcadeWorld.update(raid.actId, base.x, base.z, base.heading, flight.altitude, raid.elapsedSeconds, delta);\n\n  visual.speedFx.visible = base.boostActive || raid.rushActive;\n'''
          new = '''  visual.arcadeWorld.update(raid.actId, base.x, base.z, base.heading, flight.altitude, raid.elapsedSeconds, delta);\n  if (typeof window !== "undefined" && typeof navigator !== "undefined" && navigator.webdriver) {\n    (window as unknown as Record<string, unknown>).__skyRaidAuditFlightState = () => {\n      demo.scene.updateMatrixWorld(true); demo.camera.updateMatrixWorld(true);\n      const player = new THREE.Vector3(); demo.playerVisual.getWorldPosition(player);\n      const projected = player.clone().project(demo.camera);\n      return { altitude: Number(demo.scene.userData.skyRaidPlayerAltitude ?? 0), cameraFov: Number(demo.camera.fov.toFixed(3)), boostActive: base.boostActive, worldLocked: Boolean(demo.scene.userData.skyRaidArcadeWorldLocked), playerWorld: { x: player.x, y: player.y, z: player.z }, playerNdc: { x: projected.x, y: projected.y, z: projected.z, visible: projected.z > -1 && projected.z < 1 && Math.abs(projected.x) < 1 && Math.abs(projected.y) < 1 } };\n    };\n    (window as unknown as Record<string, unknown>).__skyRaidAuditPrepareCombatTarget = () => {\n      const current = demo.session.snapshot();\n      const enemies = demo.session.enemies.filter((enemy) => enemy.alive && enemy.nodeId === demo.session.location.node.id).slice(0, 3);\n      const sideX = Math.cos(current.heading); const sideZ = -Math.sin(current.heading);\n      enemies.forEach((enemy, index) => { const ahead = 8.5 + index * 1.2; const lateral = (index - 1) * 0.8; enemy.x = current.x + Math.sin(current.heading) * ahead + sideX * lateral; enemy.z = current.z + Math.cos(current.heading) * ahead + sideZ * lateral; enemy.heading = current.heading + Math.PI; });\n      return enemies.map((enemy) => ({ id: enemy.id, x: enemy.x, z: enemy.z, kind: enemy.kind }));\n    };\n  }\n\n  visual.speedFx.visible = base.boostActive || raid.rushActive;\n'''
          if old not in s: raise SystemExit('world marker missing')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Browser setup and audited build
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          npm run build:pages
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/sky-raid-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/sky-raid-http.log; exit 1

      - name: Capture five ACTs
        run: node scripts/webgl-sky-raid-v2-compare.mjs

      - name: High-altitude lock shot hit turbo playcheck
        run: |
          cat >/tmp/combat.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/.audit-runtime/node_modules/playwright-core');
          const fs = require('node:fs');
          const path = require('node:path');
          const out = 'artifacts/sky-raid-v2-compare'; fs.mkdirSync(out, { recursive: true });
          let browser, context, page, failure;
          const watchdog = setTimeout(() => { console.error('AUDIT WATCHDOG'); process.exit(124); }, 80000);
          const shotPath = n => path.join(out, n);
          const screenshot = async n => { try { if (page) await page.screenshot({ path: shotPath(n), timeout: 5000 }); } catch {} };
          const log = (n, v) => console.log('AUDIT', n, v === undefined ? '' : JSON.stringify(v));
          (async () => {
            try {
              browser = await chromium.launch({ headless: true, executablePath: process.env.SKY_DANCER_CHROME_PATH || '/usr/bin/google-chrome', args: ['--use-angle=swiftshader','--enable-webgl','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage'] });
              context = await browser.newContext({ viewport: { width: 844, height: 390 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true });
              page = await context.newPage(); const browserErrors = [];
              page.on('pageerror', e => browserErrors.push(String(e))); page.on('console', m => { if (m.type() === 'error' && !/404/.test(m.text())) browserErrors.push(m.text()); });
              log('menu');
              await page.goto(`http://127.0.0.1:4173?menu=1&a=${Date.now()}`, { waitUntil: 'networkidle', timeout: 30000 });
              await page.locator('button').filter({ hasText: /^\s*SKY RAID/i }).first().click({ force: true, timeout: 10000 });
              await page.waitForTimeout(100); await page.locator('button').filter({ hasText: /START/i }).last().click({ force: true, timeout: 10000 });
              await page.locator('canvas[aria-label="Sky Dancer WebGL game view"]').waitFor({ state: 'visible', timeout: 20000 });
              await page.waitForFunction(() => typeof window.__skyRaidAuditFlightState === 'function' && typeof window.__skyRaidAuditPrepareCombatTarget === 'function', null, { timeout: 12000 });

              log('climb');
              const pad = page.locator('[aria-label="Sky Raid two-axis flight stick"]'); const b = await pad.boundingBox(); if (!b) throw new Error('flight pad missing');
              await page.mouse.move(b.x+b.width*.5,b.y+b.height*.5); await page.mouse.down(); await page.mouse.move(b.x+b.width*.52,b.y+b.height*.08,{steps:7}); await page.waitForTimeout(1100); await page.mouse.up(); await page.waitForTimeout(120);
              const flight = await page.evaluate(() => window.__skyRaidAuditFlightState()); log('flight', flight); if (!(flight.altitude > 5)) throw new Error(`climb failed ${JSON.stringify(flight)}`);

              let prepared = await page.evaluate(() => window.__skyRaidAuditPrepareCombatTarget()); if (!prepared?.length) throw new Error('no enemy'); await page.waitForTimeout(100); prepared = await page.evaluate(() => window.__skyRaidAuditPrepareCombatTarget()); await page.waitForTimeout(120);
              const readDecision = () => page.evaluate(() => typeof window.__skyDancerGetV45DecisionHierarchy === 'function' ? window.__skyDancerGetV45DecisionHierarchy() : null);
              let debug = await readDecision(); if (!debug?.decision?.targetEnemyId) { await page.evaluate(() => window.__skyRaidAuditPrepareCombatTarget()); await page.waitForTimeout(180); debug = await readDecision(); }
              const decision = debug?.decision; log('lock', decision); if (!decision?.targetEnemyId) throw new Error(`lock failed ${JSON.stringify(debug)}`); if (Math.abs(decision.playerAltitudeMeters-flight.altitude)>1.5) throw new Error('lock altitude mismatch');
              if (!(await page.locator('[aria-label="Sky Raid target reticle"]').count())) throw new Error('reticle missing'); await screenshot('raid-combat-high-altitude-lock.png');

              const beforeHit = Number(decision.hitSerial || 0); const shot = page.locator('button[aria-label="Fire missile"]');
              await shot.dispatchEvent('pointerdown',{pointerId:51,pointerType:'touch',isPrimary:true}); await page.waitForTimeout(70); await shot.dispatchEvent('pointerup',{pointerId:51,pointerType:'touch',isPrimary:true});
              await page.waitForFunction(() => { const s = typeof window.__skyDancerGetV43VerticalFlight === 'function' ? window.__skyDancerGetV43VerticalFlight() : null; return Boolean(s?.playerMissiles?.length); }, null, { timeout: 2500 });
              const vertical = await page.evaluate(() => window.__skyDancerGetV43VerticalFlight()); const missile = vertical.playerMissiles[0]; log('missile', missile); if (Math.abs(missile.altitudeOffsetMeters-flight.altitude)>2.5) throw new Error('missile altitude mismatch'); await screenshot('raid-combat-high-altitude-shot.png');

              let hitObserved=false, hitDecision=null; const deadline=Date.now()+4500; while(Date.now()<deadline){ await page.waitForTimeout(70); const d=await readDecision(); if(Number(d?.decision?.hitSerial||0)>beforeHit){hitObserved=true;hitDecision=d.decision;break;} }
              log('hit',{hitObserved,hitDecision}); if(!hitObserved) throw new Error('missile hit not observed'); await screenshot('raid-combat-high-altitude-hit.png');

              const baseline=await page.evaluate(() => window.__skyRaidAuditFlightState()); const turbo=page.locator('button').filter({hasText:/TURBO/i}).last(); const tb=await turbo.boundingBox(); if(!tb) throw new Error('turbo missing');
              await turbo.dispatchEvent('pointerdown',{pointerId:71,pointerType:'touch',isPrimary:true}); await page.waitForTimeout(180); await turbo.dispatchEvent('pointerup',{pointerId:71,pointerType:'touch',isPrimary:true});
              let peak=baseline; for(let i=0;i<14;i++){await page.waitForTimeout(35);const s=await page.evaluate(() => window.__skyRaidAuditFlightState()); if(s.cameraFov>peak.cameraFov) peak=s;}
              log('turbo',{baseline,peak}); if(!peak.playerNdc.visible) throw new Error('aircraft left frame during turbo'); await screenshot('raid-combat-turbo-camera.png');
              const report={browserErrors,flightBeforeLock:flight,prepared,decision,missile,hitObserved,hitDecision,turbo:{baseline,peak}}; fs.writeFileSync(path.join(out,'combat-report.json'),JSON.stringify(report,null,2)); if(browserErrors.length) throw new Error(`browser errors ${JSON.stringify(browserErrors)}`); log('PASS');
            } catch(e) { failure=e; console.error('AUDIT FAIL',e?.stack||e); await screenshot('raid-combat-failure.png'); fs.writeFileSync(path.join(out,'combat-failure.txt'),String(e?.stack||e)); }
            finally { clearTimeout(watchdog); try{await context?.close();}catch{} try{await browser?.close();}catch{} }
            if(failure) process.exitCode=1;
          })();
          JS
          node /tmp/combat.cjs

      - name: Final assertions
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/sky-raid-v2-compare/report.json'))
          if len(r['raid']['acts']) != 5: raise SystemExit('five ACT capture failed')
          if any(a['forbiddenHud'] for a in r['raid']['acts']): raise SystemExit('legacy HUD leak')
          if r['raid']['errors']: raise SystemExit(str(r['raid']['errors']))
          a=r['raid']['acts'][0]; i=a['legacyOwners']['flight']; m=a['maneuverFlight']['flight']; w=a['wideClimbTurnFlight']['flight']
          if m['playerWorld']['y'] < i['playerWorld']['y']+7 or w['playerWorld']['y'] < m['playerWorld']['y']+5: raise SystemExit('climb regression')
          c=json.load(open('artifacts/sky-raid-v2-compare/combat-report.json'))
          if not c['hitObserved']: raise SystemExit('hit missing')
          if abs(c['decision']['playerAltitudeMeters']-c['flightBeforeLock']['altitude'])>1.5: raise SystemExit('lock altitude mismatch')
          if abs(c['missile']['altitudeOffsetMeters']-c['flightBeforeLock']['altitude'])>2.5: raise SystemExit('missile altitude mismatch')
          print('SKY RAID V15 FINAL AUDIT PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-raid-v15-final-audit
          path: artifacts/sky-raid-v2-compare
          if-no-files-found: error
          retention-days: 7
