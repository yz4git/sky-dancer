# SKY RAID V13 — final-owner vertical flight + real browser audit
name: SKY RAID V2 visual compare
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sky-raid-v2-compare-once.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Make SKY RAID own final aircraft altitude
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/sky/SkyDancerSkyRaid.ts')
          s = p.read_text()
          old = '''  demo.scene.userData.skyRaidPlayerAltitude = flight.altitude;\n  demo.scene.userData.skyRaidPlayerVerticalSpeed = flight.verticalSpeed;\n  demo.scene.userData.skyRaidPlayerBank = flight.bank;\n'''
          new = '''  demo.scene.userData.skyRaidPlayerAltitude = flight.altitude;\n  demo.scene.userData.skyRaidPlayerVerticalSpeed = flight.verticalSpeed;\n  demo.scene.userData.skyRaidPlayerPitch = flight.pitch;\n  demo.scene.userData.skyRaidPlayerBank = flight.bank;\n'''
          if old not in s:
              raise SystemExit('flight userData marker missing')
          s = s.replace(old, new, 1)
          old = '''    const bank = Number(this.scene.userData.skyRaidPlayerBank ?? 0);\n    const speed = Math.abs(snapshot.speed);\n    const forwardX = Math.sin(snapshot.heading);\n    const forwardZ = Math.cos(snapshot.heading);\n    const chaseDistance = 9.6 + Math.min(4.0, speed * 0.085);\n    const lookAhead = 6.8 + Math.min(5.2, speed * 0.105);\n    // Read the rendered aircraft itself. Several late Sky Dancer presentation passes\n    // can own vertical transforms, so inferred altitude is not a reliable camera datum.\n    this.playerVisual.updateWorldMatrix(true, false);\n    const playerPosition = new THREE.Vector3();\n    this.playerVisual.getWorldPosition(playerPosition);\n'''
          new = '''    const altitude = Number(this.scene.userData.skyRaidPlayerAltitude ?? 0);\n    const pitch = Number(this.scene.userData.skyRaidPlayerPitch ?? 0);\n    const bank = Number(this.scene.userData.skyRaidPlayerBank ?? 0);\n    const speed = Math.abs(snapshot.speed);\n    const forwardX = Math.sin(snapshot.heading);\n    const forwardZ = Math.cos(snapshot.heading);\n    const chaseDistance = 9.6 + Math.min(4.0, speed * 0.085);\n    const lookAhead = 6.8 + Math.min(5.2, speed * 0.105);\n    // updateVisuals() is followed by older presentation owners that can restore the\n    // aircraft to its ground datum. SKY RAID therefore reasserts its full flight pose\n    // here, at the final camera/presentation stage, before deriving the chase camera.\n    this.playerVisual.position.y = 0.62 + altitude;\n    this.playerVisual.rotation.x = pitch;\n    this.playerVisual.rotation.z = bank;\n    this.playerVisual.updateWorldMatrix(true, false);\n    const playerPosition = new THREE.Vector3();\n    this.playerVisual.getWorldPosition(playerPosition);\n'''
          if old not in s:
              raise SystemExit('V12 camera marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('tests/sky-sky-raid-reference-world.test.ts')
          tests = t.read_text()
          old_test = '''  assert.match(raid, /skyRaidCameraPresentation/);\n  assert.match(raid, /this\\.camera\\.position\\.y \\+= altitude \\* 0\\.94/);\n  assert.match(raid, /altitude \\* 0\\.98/);\n  assert.doesNotMatch(raid, /demo\\.camera\\.position\\.y \\+= flight\\.altitude/);\n'''
          new_test = '''  assert.match(raid, /skyRaidCameraPresentation/);\n  assert.match(raid, /skyRaidPlayerPitch = flight\\.pitch/);\n  assert.match(raid, /this\\.playerVisual\\.position\\.y = 0\\.62 \\+ altitude/);\n  assert.match(raid, /this\\.playerVisual\\.rotation\\.x = pitch/);\n  assert.match(raid, /this\\.playerVisual\\.rotation\\.z = bank/);\n  assert.doesNotMatch(raid, /demo\\.camera\\.position\\.y \\+= flight\\.altitude/);\n'''
          if old_test not in tests:
              raise SystemExit('vertical camera test marker missing')
          t.write_text(tests.replace(old_test, new_test, 1))
          PY
      - name: Regression checks
        run: |
          npm run test:fast
          npm run lint
          npm run build:pages
      - name: Commit final-owner vertical flight
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/SkyDancerSkyRaid.ts tests/sky-sky-raid-reference-world.test.ts
          git commit -m "Keep SKY RAID aircraft at commanded altitude"
          git push origin HEAD:main
      - name: Inject webdriver-only ACT and flight audit hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/sky/SkyDancerSkyRaid.ts')
          s = p.read_text()
          old = 'let latestSkyRaidSnapshot: SkyDancerSkyRaidSnapshot | null = null;\n'
          new = old + 'let skyRaidAuditForcedActId: SkyDancerSkyRaidAct["id"] | null = null;\n'
          if old not in s: raise SystemExit('snapshot marker missing')
          s = s.replace(old, new, 1)
          old = '''  const raid = updateRaid(demo.session as unknown as RaidSession, hunt, 0);\n  publishSkyRaidWorldStyle(raid);\n'''
          new = '''  const baseRaid = updateRaid(demo.session as unknown as RaidSession, hunt, 0);\n  if (typeof window !== "undefined" && typeof navigator !== "undefined" && navigator.webdriver) {\n    (window as unknown as Record<string, unknown>).__skyRaidAuditForceAct = (actId: SkyDancerSkyRaidAct["id"] | null) => {\n      skyRaidAuditForcedActId = actId && SKY_DANCER_SKY_RAID_ACTS.some((candidate) => candidate.id === actId) ? actId : null;\n    };\n  }\n  const forcedAct = skyRaidAuditForcedActId\n    ? SKY_DANCER_SKY_RAID_ACTS.find((candidate) => candidate.id === skyRaidAuditForcedActId) ?? null\n    : null;\n  const raid: SkyDancerSkyRaidSnapshot = forcedAct\n    ? { ...baseRaid, actIndex: forcedAct.index, actId: forcedAct.id, actLabel: forcedAct.label, actSubtitle: forcedAct.subtitle, setpiece: forcedAct.setpiece, elapsedSeconds: forcedAct.startSeconds + 1, actElapsedSeconds: 1, actSecondsRemaining: Math.max(0, forcedAct.endSeconds - forcedAct.startSeconds - 1), rushActive: false, palette: forcedAct.palette }\n    : baseRaid;\n  publishSkyRaidWorldStyle(raid);\n  if (forcedAct) broadcast(raid);\n'''
          if old not in s: raise SystemExit('raid marker missing')
          s = s.replace(old, new, 1)
          old = '''  visual.arcadeWorld.update(raid.actId, base.x, base.z, base.heading, flight.altitude, raid.elapsedSeconds, delta);\n\n  visual.speedFx.visible = base.boostActive || raid.rushActive;\n'''
          new = '''  visual.arcadeWorld.update(raid.actId, base.x, base.z, base.heading, flight.altitude, raid.elapsedSeconds, delta);\n  if (typeof window !== "undefined" && typeof navigator !== "undefined" && navigator.webdriver) {\n    (window as unknown as Record<string, unknown>).__skyRaidAuditFlightState = () => {\n      demo.scene.updateMatrixWorld(true);\n      demo.camera.updateMatrixWorld(true);\n      const player = new THREE.Vector3();\n      demo.playerVisual.getWorldPosition(player);\n      const projected = player.clone().project(demo.camera);\n      return {\n        altitude: Number(demo.scene.userData.skyRaidPlayerAltitude ?? 0),\n        verticalSpeed: Number(demo.scene.userData.skyRaidPlayerVerticalSpeed ?? 0),\n        pitch: Number(demo.scene.userData.skyRaidPlayerPitch ?? 0),\n        bank: Number(demo.scene.userData.skyRaidPlayerBank ?? 0),\n        freeFlightSectors: Number(demo.scene.userData.skyRaidArcadeFreeFlightSectorCount ?? 0),\n        worldLocked: Boolean(demo.scene.userData.skyRaidArcadeWorldLocked),\n        playerWorld: { x: Number(player.x.toFixed(3)), y: Number(player.y.toFixed(3)), z: Number(player.z.toFixed(3)) },\n        playerNdc: { x: Number(projected.x.toFixed(4)), y: Number(projected.y.toFixed(4)), z: Number(projected.z.toFixed(4)), visible: projected.z > -1 && projected.z < 1 && Math.abs(projected.x) < 1 && Math.abs(projected.y) < 1 },\n      };\n    };\n  }\n\n  visual.speedFx.visible = base.boostActive || raid.rushActive;\n'''
          if old not in s: raise SystemExit('world update marker missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version
      - name: Build audited Pages bundle
        run: npm run build:pages
      - name: Serve build
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-raid-audit-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-raid-audit-http.log
          exit 1
      - name: Capture Arcade Run and all SKY RAID acts
        run: node scripts/webgl-sky-raid-v2-compare.mjs
      - name: Assert real climb and stable framing
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open('artifacts/sky-raid-v2-compare/report.json'))
          act1 = report['raid']['acts'][0]
          initial = act1['legacyOwners']['flight']
          maneuver = act1['maneuverFlight']['flight']
          wide = act1['wideClimbTurnFlight']['flight']
          print('initial', initial)
          print('maneuver', maneuver)
          print('wide', wide)
          for name, state in [('maneuver', maneuver), ('wide', wide)]:
              ndc = state['playerNdc']
              if not ndc['visible'] or abs(ndc['x']) > 0.58 or not (-0.72 < ndc['y'] < 0.62):
                  raise SystemExit(f'{name}: aircraft framing failed: {ndc}')
          if maneuver['playerWorld']['y'] < initial['playerWorld']['y'] + 7:
              raise SystemExit(f'aircraft visual did not climb enough: {initial["playerWorld"]} -> {maneuver["playerWorld"]}')
          if wide['playerWorld']['y'] < maneuver['playerWorld']['y'] + 5:
              raise SystemExit(f'aircraft visual stopped climbing: {maneuver["playerWorld"]} -> {wide["playerWorld"]}')
          if report['raid']['errors']:
              raise SystemExit(f"browser errors: {report['raid']['errors']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-raid-v2-compare
          path: artifacts/sky-raid-v2-compare
          if-no-files-found: error
          retention-days: 7
