name: SKY RAID V31 Allocation Pass R4

on:
  push:
    paths:
      - ".github/workflows/sky-raid-v31-allocation-once.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          rm -rf .audit-runtime artifacts/sky-raid-v31-performance
          mkdir -p .audit-runtime artifacts/sky-raid-v31-performance
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Inject webdriver audit clock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/cart/CartRoguePhase67TurboHunt.ts")
          source = path.read_text()
          marker = "function updateDirector(session: MutableHuntSession, state: TurboHuntState, delta: number): void {\n  state.elapsed += delta;"
          replacement = "function updateDirector(session: MutableHuntSession, state: TurboHuntState, delta: number): void {\n  if (typeof window !== \"undefined\" && typeof navigator !== \"undefined\" && navigator.webdriver) {\n    const forcedElapsed = (window as unknown as { __skyRaidAuditElapsedSeconds?: unknown }).__skyRaidAuditElapsedSeconds;\n    if (typeof forcedElapsed === \"number\" && Number.isFinite(forcedElapsed)) state.elapsed = Math.max(0, forcedElapsed);\n  }\n  state.elapsed += delta;"
          if marker not in source:
              raise SystemExit("V31 audit clock marker missing")
          path.write_text(source.replace(marker, replacement, 1))
          PY
      - name: Profile V30 baseline
        run: |
          npm run build:pages
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/v31-baseline.log 2>&1 &
          echo $! >/tmp/v31-baseline.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          SKY_RAID_PERF_LABEL=baseline SKY_RAID_PERF_PORT=4173 node scripts/webgl-sky-raid-v31-perf.mjs
          kill $(cat /tmp/v31-baseline.pid) || true
      - name: Apply V31 optimization
        run: |
          python3 .github/sky-raid-v31-allocation.py
          python3 .github/sky-raid-v31-contract-fix.py
          git diff --check
      - name: Validate V31
        run: |
          npm run test:fast
          npm run check:arcade
          npm run lint
          npm run build:pages
      - name: Playcheck and profile V31
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory out >/tmp/v31-optimized.log 2>&1 &
          echo $! >/tmp/v31-optimized.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          SKY_RAID_PERF_LABEL=optimized SKY_RAID_PERF_PORT=4174 SKY_RAID_PERF_CHECKPOINTS=1 node scripts/webgl-sky-raid-v31-perf.mjs
          kill $(cat /tmp/v31-optimized.pid) || true
      - name: Compare performance
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('artifacts/sky-raid-v31-performance/baseline.json', 'utf8'));
          const opt = JSON.parse(fs.readFileSync('artifacts/sky-raid-v31-performance/optimized.json', 'utf8'));
          const comparison = {
            baseline: base,
            optimized: opt,
            fpsGain: base.fps > 0 ? (opt.fps - base.fps) / base.fps : 0,
            frameGain: base.meanFrameMs > 0 ? (base.meanFrameMs - opt.meanFrameMs) / base.meanFrameMs : 0,
            heapGain: base.heapUsedMB > 0 ? (base.heapUsedMB - opt.heapUsedMB) / base.heapUsedMB : 0,
          };
          fs.writeFileSync('artifacts/sky-raid-v31-performance/comparison.json', JSON.stringify(comparison, null, 2));
          console.log('SKY RAID V31 PERF COMPARISON', JSON.stringify(comparison));
          if (opt.fps < base.fps * 0.88) throw new Error('V31 FPS regression');
          if (opt.meanFrameMs > base.meanFrameMs * 1.12) throw new Error('V31 frame-time regression');
          if (opt.heapUsedMB > base.heapUsedMB * 1.15) throw new Error('V31 heap regression');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          source = Path('src/sky/SkyDancerSkyRaid.ts').read_text()
          ranges = [
              ('function maintainSkyRaidEnemyPresence(', 'function maintainSkyRaidScreenPresence('),
              ('function stepSkyRaidFlight(', 'function applySkyRaidFlightVisuals('),
              ('function updateRaidVisuals(', 'export function installSkyDancerSkyRaid()'),
          ]
          blocks = [source[source.index(a):source.index(b, source.index(a))] for a, b in ranges]
          calls = sum(block.count('session.snapshot()') for block in blocks)
          print('SKY RAID V31 HOT SNAPSHOT CALLS', calls)
          if calls != 0:
              raise SystemExit('hot-path snapshot copy remains')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sky-raid-v31-performance-audit
          path: artifacts/sky-raid-v31-performance
          retention-days: 7
      - name: Commit product
        run: |
          git restore src/cart/CartRoguePhase67TurboHunt.ts
          rm -f .github/sky-raid-v31-allocation.py
          rm -f .github/sky-raid-v31-contract-fix.py
          rm -f scripts/webgl-sky-raid-v31-perf.mjs
          rm -f .github/workflows/sky-raid-v31-allocation-once.yml
          git diff --check
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/SkyDancerSkyRaid.ts tests/sky-sky-raid.test.ts .github scripts
          git diff --cached --check
          git commit -m "Reduce SKY RAID frame allocations"
          git push origin HEAD:main
