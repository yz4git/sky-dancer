          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('artifacts/sky-raid-v31-performance/baseline.json', 'utf8'));
          const opt = JSON.parse(fs.readFileSync('artifacts/sky-raid-v31-performance/optimized.json', 'utf8'));
          const comparison = {
            baseline: base,
            optimized: opt,
            fpsGain: base.fps > 0 ? (opt.fps - base.fps) / base.fps : 0,
            frameGain: base.meanFrameMs > 0 ? (base.meanFrameMs - opt.meanFrameMs) / base.meanFrameMs : 0,
            heapGain: base.heapUsedMB > 0 ? (base.heapUsedMB - opt.heapUsedMB) / base.heapUsedMB : 0,
          };
          fs.writeFileSync('artifacts/sky-raid-v31-performance/comparison.json', JSON.stringify(comparison, null, 2));
          console.log('SKY RAID V31 PERF COMPARISON', JSON.stringify(comparison));
          if (opt.fps < base.fps * 0.88) throw new Error('V31 FPS regressed more than 12%');
          if (opt.meanFrameMs > base.meanFrameMs * 1.12) throw new Error('V31 frame time regressed more than 12%');
