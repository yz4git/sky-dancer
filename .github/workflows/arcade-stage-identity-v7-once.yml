name: Apply Arcade Stage Identity V7 once

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply-arcade-stage-identity-v7.py"
      - ".github/workflows/arcade-stage-identity-v7-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python3 scripts/apply-arcade-stage-identity-v7.py
      - run: npm run test:rules
      - run: npm run lint
      - run: npm run build:pages
      - name: Commit V7 stage identity pass
        run: |
          rm -f scripts/apply-arcade-stage-identity-v7.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Arcade Run V7: signature canyon ice volcano orbit courses"
          git push
