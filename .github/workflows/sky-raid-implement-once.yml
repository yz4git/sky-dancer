name: SKY RAID hybrid mode implementation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sky-raid-implement-once.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Implement SKY RAID
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          # Public mode contract.
          replace(
              "src/sky/arcade/SkyDancerArcadeData.ts",
              'export type SkyDancerGameMode = "turbo-hunt" | "arcade-run" | "stage-practice";',
              'export type SkyDancerGameMode = "turbo-hunt" | "sky-raid" | "arcade-run" | "stage-practice";',
          )

          # Bootstrap the hybrid runtime after the existing phase stack so it can safely decorate it.
          replace(
              "app/CartRogueGamePhase13.tsx",
              'import "../src/sky/SkyDancerTurboInputIsolation";\n',
              'import "../src/sky/SkyDancerTurboInputIsolation";\nimport "../src/sky/SkyDancerSkyRaid";\n',
          )
          replace(
              "app/CartRogueGamePhase13.tsx",
              'import CartTurboHuntHudOverlay from "./CartTurboHuntHudOverlay";\n',
              'import CartTurboHuntHudOverlay from "./CartTurboHuntHudOverlay";\nimport SkyDancerSkyRaidOverlay from "./SkyDancerSkyRaidOverlay";\n',
          )
          replace(
              "app/CartRogueGamePhase13.tsx",
              '  const startRun = (request: SkyDancerStartRequest) => {\n    setCartRunDifficulty(request.difficulty as CartRunDifficulty);',
              '  const startRun = (request: SkyDancerStartRequest) => {\n    document.documentElement.dataset.skyDancerMode = request.mode;\n    setCartRunDifficulty(request.difficulty as CartRunDifficulty);',
          )
          replace(
              "app/CartRogueGamePhase13.tsx",
              '    {activeRequest?.mode === "turbo-hunt" && (',
              '    {(activeRequest?.mode === "turbo-hunt" || activeRequest?.mode === "sky-raid") && (',
          )
          replace(
              "app/CartRogueGamePhase13.tsx",
              '        <CartRogueGame />\n        <CartTurboHuntHudOverlay />',
              '        <CartRogueGame />\n        {activeRequest.mode === "sky-raid" ? <SkyDancerSkyRaidOverlay /> : <CartTurboHuntHudOverlay />}',
          )
          replace(
              "app/CartRogueGamePhase13.tsx",
              '    {activeRequest && activeRequest.mode !== "turbo-hunt" && (\n      <SkyDancerArcadeMode key={runKey} request={activeRequest} onReturnTitle={() => setActiveRequest(null)} />\n    )}',
              '    {activeRequest && (activeRequest.mode === "arcade-run" || activeRequest.mode === "stage-practice") && (\n      <SkyDancerArcadeMode key={runKey} request={activeRequest} onReturnTitle={() => setActiveRequest(null)} />\n    )}',
          )

          # Title/menu integration.
          replace(
              "app/CartGameMenu.tsx",
              '  const gameOver = activeMode === "turbo-hunt" && Boolean(hardSnapshot?.gameOver);',
              '  const gameOver = (activeMode === "turbo-hunt" || activeMode === "sky-raid") && Boolean(hardSnapshot?.gameOver);',
          )
          replace(
              "app/CartGameMenu.tsx",
              '      paintScheme: nextMode === "turbo-hunt" ? undefined : selectedPaintScheme,\n      loadout: nextMode === "turbo-hunt" ? undefined : selectedLoadout,',
              '      paintScheme: nextMode === "turbo-hunt" || nextMode === "sky-raid" ? undefined : selectedPaintScheme,\n      loadout: nextMode === "turbo-hunt" || nextMode === "sky-raid" ? undefined : selectedLoadout,',
          )
          replace(
              "app/CartGameMenu.tsx",
              '    const modeSummary = selectedMode === "arcade-run"\n      ? "BRANCHING FIXED COURSE · 7 SECTIONS · ABOUT 4 MINUTES"\n      : selectedMode === "turbo-hunt"\n        ? "HUNT THE RAID. BREAK THE LINE. KEEP MOVING."\n        : selectedStage\n          ? `${selectedStage.name} · SCORE ATTACK · MASTERY ${selectedMasteryCount}/3`\n          : "CLEAR AN ARCADE STAGE TO UNLOCK PRACTICE";',
              '    const modeSummary = selectedMode === "arcade-run"\n      ? "BRANCHING FIXED COURSE · 7 SECTIONS · ABOUT 4 MINUTES"\n      : selectedMode === "sky-raid"\n        ? "FREE 360° RAID · ARCADE ACTS · SETPIECES · TITAN FINALE · ABOUT 2 MINUTES"\n        : selectedMode === "turbo-hunt"\n          ? "HUNT THE RAID. BREAK THE LINE. KEEP MOVING."\n          : selectedStage\n            ? `${selectedStage.name} · SCORE ATTACK · MASTERY ${selectedMasteryCount}/3`\n            : "CLEAR AN ARCADE STAGE TO UNLOCK PRACTICE";',
          )
          replace(
              "app/CartGameMenu.tsx",
              '    const startLabel = selectedMode === "arcade-run"\n      ? "START ARCADE RUN"\n      : selectedMode === "turbo-hunt"\n        ? hard ? "START HARD HUNT" : "START TURBO HUNT"\n        : "START STAGE PRACTICE";',
              '    const startLabel = selectedMode === "arcade-run"\n      ? "START ARCADE RUN"\n      : selectedMode === "sky-raid"\n        ? hard ? "START ACE SKY RAID" : "START SKY RAID"\n        : selectedMode === "turbo-hunt"\n          ? hard ? "START HARD HUNT" : "START TURBO HUNT"\n          : "START STAGE PRACTICE";',
          )
          replace(
              "app/CartGameMenu.tsx",
              '          {selectedMode !== "turbo-hunt" && (',
              '          {selectedMode !== "turbo-hunt" && selectedMode !== "sky-raid" && (',
              1,
          )
          replace(
              "app/CartGameMenu.tsx",
              '            <button\n              className={`${modeStyles.modeButton} ${selectedMode === "turbo-hunt" ? modeStyles.modeButtonActive : ""}`}\n              onClick={() => setSelectedMode("turbo-hunt")}',
              '            <button\n              className={`${modeStyles.modeButton} ${selectedMode === "sky-raid" ? modeStyles.modeButtonActive : ""}`}\n              onClick={() => setSelectedMode("sky-raid")}\n              aria-pressed={selectedMode === "sky-raid"}\n            >\n              <strong>SKY RAID</strong>\n              <small>FREE 360° · ARCADE ACTS · 2 MIN</small>\n            </button>\n            <button\n              className={`${modeStyles.modeButton} ${selectedMode === "turbo-hunt" ? modeStyles.modeButtonActive : ""}`}\n              onClick={() => setSelectedMode("turbo-hunt")}',
          )
          replace(
              "app/CartGameMenu.tsx",
              '            {selectedMode === "turbo-hunt"\n              ? `GAS = LIFE · RECOVERY CELLS RESTORE GAS · ZERO GAS = GAME OVER${hard ? " · HARD RAID HITS DEAL HEAVY LIFE DAMAGE" : ""}`\n              : selectedMode === "arcade-run"',
              '            {selectedMode === "turbo-hunt"\n              ? `GAS = LIFE · RECOVERY CELLS RESTORE GAS · ZERO GAS = GAME OVER${hard ? " · HARD RAID HITS DEAL HEAVY LIFE DAMAGE" : ""}`\n              : selectedMode === "sky-raid"\n                ? `FREE FLIGHT · 5 ARCADE ACTS · ACT BREAKS REFILL GAS + TURBO · SCORE CHAIN · TITAN AT ~1:45${hard ? " · ACE PRESSURE" : ""}`\n                : selectedMode === "arcade-run"',
          )
          replace(
              "app/CartGameMenu.tsx",
              '            {selectedMode === "turbo-hunt" ? (\n              <><span>DRAG LEFT · STEER</span><span>HOLD TURBO · CHARGE / RELEASE · DASH</span><span>SHOT · MISSILE</span></>\n            ) : (',
              '            {selectedMode === "turbo-hunt" ? (\n              <><span>DRAG LEFT · STEER</span><span>HOLD TURBO · CHARGE / RELEASE · DASH</span><span>SHOT · MISSILE</span></>\n            ) : selectedMode === "sky-raid" ? (\n              <><span>DRAG LEFT · FREE TURN</span><span>SHOT · MISSILE · RAM</span><span>ACT BREAK · CHAIN SCORE</span><span>TITAN FINALE</span></>\n            ) : (',
          )
          replace(
              "app/CartGameMenu.tsx",
              '        {hangarOpen && selectedMode !== "turbo-hunt" && (',
              '        {hangarOpen && selectedMode !== "turbo-hunt" && selectedMode !== "sky-raid" && (',
          )
          replace(
              "app/CartGameMenu.tsx",
              '        <div className={styles.titleFooter}>ONE SKY · TWO STYLES · ELEVEN COURSES</div>',
              '        <div className={styles.titleFooter}>ONE SKY · THREE STYLES · ELEVEN ARCADE WORLDS</div>',
          )
          replace(
              "app/CartGameMenu.tsx",
              '    const failedDifficulty = hardSnapshot.difficulty;\n    const hard = failedDifficulty === "hard";',
              '    const failedDifficulty = hardSnapshot.difficulty;\n    const failedMode: SkyDancerGameMode = activeMode === "sky-raid" ? "sky-raid" : "turbo-hunt";\n    const hard = failedDifficulty === "hard";',
          )
          replace(
              "app/CartGameMenu.tsx",
              '          <div className={styles.gameOverEyebrow}>{hard ? "HARD MODE" : "TURBO HUNT"} · RUN FAILED</div>',
              '          <div className={styles.gameOverEyebrow}>{failedMode === "sky-raid" ? (hard ? "ACE SKY RAID" : "SKY RAID") : hard ? "HARD MODE" : "TURBO HUNT"} · RUN FAILED</div>',
          )
          replace(
              "app/CartGameMenu.tsx",
              '          <button className={styles.retryButton} onClick={() => startGame(failedDifficulty, "turbo-hunt")}>',
              '          <button className={styles.retryButton} onClick={() => startGame(failedDifficulty, failedMode)}>',
          )
          replace(
              "app/CartGameMenu.tsx",
              '            <p>{activeMode === "turbo-hunt" ? "Steering, brake and Turbo input are released while paused." : "Flight, weapons and Turbo input are released while paused."}</p>',
              '            <p>{activeMode === "turbo-hunt" || activeMode === "sky-raid" ? "Steering, weapons and Turbo input are released while paused." : "Flight, weapons and Turbo input are released while paused."}</p>',
          )
          replace(
              "app/CartGameMenu.tsx",
              '                <small>{activeMode === "turbo-hunt" ? "BACK TO THE HUNT" : "BACK TO THE COURSE"}</small>',
              '                <small>{activeMode === "sky-raid" ? "BACK TO THE RAID" : activeMode === "turbo-hunt" ? "BACK TO THE HUNT" : "BACK TO THE COURSE"}</small>',
          )

          replace(
              "app/CartGameMenuModes.module.css",
              '  grid-template-columns: repeat(3, minmax(0, 1fr));',
              '  grid-template-columns: repeat(4, minmax(0, 1fr));',
          )

          # Add focused rules tests to the standard fast suite.
          replace(
              "package.json",
              'tests/sky-arcade-run.test.ts tests/sky-arcade-reference.test.ts"',
              'tests/sky-arcade-run.test.ts tests/sky-arcade-reference.test.ts tests/sky-sky-raid.test.ts"',
          )

          Path("src/sky/SkyDancerSkyRaidRules.ts").write_text(r'''export type SkyDancerSkyRaidActId =
            | "dawn-city"
            | "red-canyon"
            | "cloud-fleet"
            | "storm-carrier"
            | "prism-citadel";

          export interface SkyDancerSkyRaidPalette {
            sky: number;
            fog: number;
            ground: number;
            primary: number;
            secondary: number;
            accent: number;
            enemy: number;
          }

          export interface SkyDancerSkyRaidAct {
            id: SkyDancerSkyRaidActId;
            index: number;
            label: string;
            subtitle: string;
            startSeconds: number;
            endSeconds: number;
            killTarget: number;
            setpiece: "CITY GATES" | "CANYON KNIFE RUN" | "FLEET BREAK" | "THUNDER RAID" | "PRISM SIEGE";
            palette: SkyDancerSkyRaidPalette;
          }

          export const SKY_DANCER_SKY_RAID_ACTS: readonly SkyDancerSkyRaidAct[] = [
            {
              id: "dawn-city", index: 0, label: "DAWN CITY", subtitle: "FREE APPROACH", startSeconds: 0, endSeconds: 24, killTarget: 5, setpiece: "CITY GATES",
              palette: { sky: 0x89d4f1, fog: 0xd6e9ef, ground: 0x294b5f, primary: 0x3f7188, secondary: 0xf2b775, accent: 0x64e8ff, enemy: 0xf16f62 },
            },
            {
              id: "red-canyon", index: 1, label: "RED CANYON", subtitle: "LOW ALTITUDE KNIFE RUN", startSeconds: 24, endSeconds: 48, killTarget: 6, setpiece: "CANYON KNIFE RUN",
              palette: { sky: 0xeaa06e, fog: 0xca7959, ground: 0x6a302d, primary: 0x9e4934, secondary: 0xdf8d4b, accent: 0xffd36d, enemy: 0x56d3ec },
            },
            {
              id: "cloud-fleet", index: 2, label: "CLOUD FLEET", subtitle: "WARSHIP BREAKTHROUGH", startSeconds: 48, endSeconds: 72, killTarget: 7, setpiece: "FLEET BREAK",
              palette: { sky: 0x76c8ee, fog: 0xe5f4fb, ground: 0x6faed0, primary: 0xe5f2f7, secondary: 0x607f94, accent: 0xffcc65, enemy: 0xd9556c },
            },
            {
              id: "storm-carrier", index: 3, label: "STORM CARRIER", subtitle: "THUNDERHEAD INTERCEPT", startSeconds: 72, endSeconds: 96, killTarget: 8, setpiece: "THUNDER RAID",
              palette: { sky: 0x20364d, fog: 0x657d92, ground: 0x15384b, primary: 0x42566b, secondary: 0x7d93a8, accent: 0x91f5ff, enemy: 0xff5f7d },
            },
            {
              id: "prism-citadel", index: 4, label: "PRISM CITADEL", subtitle: "TITAN SIEGE", startSeconds: 96, endSeconds: 120, killTarget: 8, setpiece: "PRISM SIEGE",
              palette: { sky: 0x45396c, fog: 0x8c7bb6, ground: 0x272142, primary: 0x7564a5, secondary: 0x4db6bd, accent: 0xffd96f, enemy: 0xff6e94 },
            },
          ];

          export const SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS = 104;
          export const SKY_DANCER_SKY_RAID_TARGET_SECONDS = 120;

          export function skyDancerSkyRaidActFor(elapsedSeconds: number): SkyDancerSkyRaidAct {
            const elapsed = Math.max(0, elapsedSeconds);
            return SKY_DANCER_SKY_RAID_ACTS.find((act) => elapsed < act.endSeconds) ?? SKY_DANCER_SKY_RAID_ACTS[SKY_DANCER_SKY_RAID_ACTS.length - 1];
          }

          export function skyDancerSkyRaidActSeconds(elapsedSeconds: number, act: SkyDancerSkyRaidAct): number {
            return Math.max(0, elapsedSeconds - act.startSeconds);
          }

          export function skyDancerSkyRaidRushActive(elapsedSeconds: number, act: SkyDancerSkyRaidAct): boolean {
            const local = skyDancerSkyRaidActSeconds(elapsedSeconds, act);
            if (act.index === SKY_DANCER_SKY_RAID_ACTS.length - 1) return local >= 4 && local < 12;
            return (local >= 7 && local < 13) || (local >= 17 && local < 21);
          }

          export function skyDancerSkyRaidPressure(elapsedSeconds: number): number {
            const act = skyDancerSkyRaidActFor(elapsedSeconds);
            const local = skyDancerSkyRaidActSeconds(elapsedSeconds, act);
            const actProgress = Math.min(1, local / Math.max(1, act.endSeconds - act.startSeconds));
            return Math.min(1, 0.18 + act.index * 0.16 + actProgress * 0.16);
          }

          export function skyDancerSkyRaidKillScore(chain: number, turbo: boolean, rush: boolean): number {
            const safeChain = Math.max(1, Math.floor(chain));
            const chainMultiplier = 1 + Math.min(9, safeChain - 1) * 0.15;
            const turboMultiplier = turbo ? 1.35 : 1;
            const rushMultiplier = rush ? 2 : 1;
            return Math.round(100 * chainMultiplier * turboMultiplier * rushMultiplier);
          }

          export function skyDancerSkyRaidMultiplier(chain: number, rush: boolean): number {
            const chainMultiplier = 1 + Math.min(9, Math.max(0, Math.floor(chain) - 1)) * 0.15;
            return Math.round(chainMultiplier * (rush ? 2 : 1) * 100) / 100;
          }
          ''')

          Path("src/sky/SkyDancerSkyRaid.ts").write_text(r'''import * as THREE from "three";
          import { CartArenaSession } from "../cart/CartArenaSession";
          import { CartRogueCanvasPreview } from "../cart/CartRogueCanvasPreview";
          import { CartRogueWebGLDemo } from "../cart/CartRogueWebGLDemo";
          import {
            forceCartTurboHuntBoss,
            getCartTurboHuntSnapshot,
            type CartTurboHuntSnapshot,
          } from "../cart/CartRoguePhase67TurboHunt";
          import {
            SKY_DANCER_SKY_RAID_ACTS,
            SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS,
            skyDancerSkyRaidActFor,
            skyDancerSkyRaidActSeconds,
            skyDancerSkyRaidKillScore,
            skyDancerSkyRaidMultiplier,
            skyDancerSkyRaidPressure,
            skyDancerSkyRaidRushActive,
            type SkyDancerSkyRaidAct,
            type SkyDancerSkyRaidPalette,
          } from "./SkyDancerSkyRaidRules";
          import type { RallyInputState } from "../rally/RallyTypes";

          export interface SkyDancerSkyRaidSnapshot {
            gameMode: "sky-raid";
            actIndex: number;
            actId: SkyDancerSkyRaidAct["id"];
            actLabel: string;
            actSubtitle: string;
            setpiece: SkyDancerSkyRaidAct["setpiece"];
            elapsedSeconds: number;
            actElapsedSeconds: number;
            actSecondsRemaining: number;
            actKills: number;
            actKillTarget: number;
            actBreak: boolean;
            score: number;
            chain: number;
            multiplier: number;
            rushActive: boolean;
            pressure: number;
            bossForced: boolean;
            clear: boolean;
            palette: SkyDancerSkyRaidPalette;
          }

          interface RaidSession {
            gas: number;
            rewardTimer: number;
            lastReward: string | null;
            car: {
              boostActive: boolean;
              boostCharges: number;
              addBoostCharge(amount: number): void;
              definition: { maxSpeed: number; handling: number };
            };
            step(input: RallyInputState, fixedDelta?: number): void;
          }

          interface RaidState {
            active: boolean;
            actIndex: number;
            actKills: number;
            actBreak: boolean;
            previousKills: number;
            previousOrders: number;
            score: number;
            chain: number;
            chainTimer: number;
            bossForced: boolean;
            clearBonus: boolean;
            baseMaxSpeed: number;
            baseHandling: number;
            broadcastClock: number;
          }

          interface RaidWebGLDemo {
            session: CartArenaSession;
            scene: THREE.Scene;
            buildWorld(): void;
            updateVisuals(delta: number): void;
          }

          interface RaidCanvasDemo {
            session: CartArenaSession;
            canvas: HTMLCanvasElement;
            context: CanvasRenderingContext2D;
            draw(): void;
          }

          interface RaidVisualState {
            root: THREE.Group;
            actGroups: THREE.Group[];
            speedFx: THREE.Group;
            lastActIndex: number;
            anchorX: number;
            anchorZ: number;
            anchorHeading: number;
          }

          const raidStateBySession = new WeakMap<object, RaidState>();
          const raidVisualByDemo = new WeakMap<object, RaidVisualState>();
          let latestSkyRaidSnapshot: SkyDancerSkyRaidSnapshot | null = null;

          export const SKY_DANCER_SKY_RAID_SNAPSHOT_EVENT = "sky-dancer-sky-raid-snapshot";

          function isSkyRaidMode(): boolean {
            return typeof document !== "undefined" && document.documentElement.dataset.skyDancerMode === "sky-raid";
          }

          function clamp(value: number, min: number, max: number): number {
            return Math.max(min, Math.min(max, value));
          }

          function stateFor(session: RaidSession, hunt: CartTurboHuntSnapshot): RaidState {
            const key = session as unknown as object;
            const current = raidStateBySession.get(key);
            if (current) return current;
            const created: RaidState = {
              active: true,
              actIndex: 0,
              actKills: 0,
              actBreak: false,
              previousKills: hunt.huntKills,
              previousOrders: hunt.huntOrdersCompleted,
              score: 0,
              chain: 0,
              chainTimer: 0,
              bossForced: false,
              clearBonus: false,
              baseMaxSpeed: session.car.definition.maxSpeed,
              baseHandling: session.car.definition.handling,
              broadcastClock: 0,
            };
            raidStateBySession.set(key, created);
            return created;
          }

          function rewardActBreak(session: RaidSession, state: RaidState, act: SkyDancerSkyRaidAct): void {
            if (state.actBreak) return;
            state.actBreak = true;
            state.score += 1200 + act.index * 350;
            session.gas = Math.min(1, session.gas + 0.08);
            const before = session.car.boostCharges;
            session.car.addBoostCharge(1);
            const turboReward = session.car.boostCharges > before ? " · TURBO +1" : "";
            session.lastReward = `ACT BREAK · ${act.label}${turboReward}`;
            session.rewardTimer = Math.max(session.rewardTimer, 2.2);
          }

          function updateRaid(session: RaidSession, hunt: CartTurboHuntSnapshot, delta: number): SkyDancerSkyRaidSnapshot {
            const state = stateFor(session, hunt);
            const act = skyDancerSkyRaidActFor(hunt.huntElapsedSeconds);
            if (act.index !== state.actIndex) {
              state.actIndex = act.index;
              state.actKills = 0;
              state.actBreak = false;
              session.gas = Math.min(1, session.gas + 0.035);
              session.lastReward = `ACT ${act.index + 1} · ${act.label} · ${act.setpiece}`;
              session.rewardTimer = Math.max(session.rewardTimer, 2.4);
            }

            const rushActive = skyDancerSkyRaidRushActive(hunt.huntElapsedSeconds, act);
            const killDelta = Math.max(0, hunt.huntKills - state.previousKills);
            for (let index = 0; index < killDelta; index += 1) {
              state.chain = Math.min(12, state.chain + 1);
              state.chainTimer = 4.2;
              state.actKills += 1;
              state.score += skyDancerSkyRaidKillScore(state.chain, session.car.boostActive, rushActive);
            }
            state.previousKills = hunt.huntKills;

            const orderDelta = Math.max(0, hunt.huntOrdersCompleted - state.previousOrders);
            if (orderDelta > 0) state.score += orderDelta * 450;
            state.previousOrders = hunt.huntOrdersCompleted;

            state.chainTimer = Math.max(0, state.chainTimer - delta);
            if (state.chainTimer <= 0) state.chain = 0;
            if (state.actKills >= act.killTarget) rewardActBreak(session, state, act);

            const pressure = skyDancerSkyRaidPressure(hunt.huntElapsedSeconds);
            session.car.definition.maxSpeed = Math.max(state.baseMaxSpeed, 23.5 + pressure * 3.1);
            session.car.definition.handling = state.baseHandling * (1 + pressure * 0.08);

            if (!state.bossForced && hunt.huntElapsedSeconds >= SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS) {
              state.bossForced = true;
              state.score += 1000;
              session.lastReward = "FINAL ACT · PRISM TITAN INBOUND";
              session.rewardTimer = Math.max(session.rewardTimer, 3.2);
              forceCartTurboHuntBoss(session as unknown as CartArenaSession);
            }
            const clear = hunt.huntPhase === "clear";
            if (clear && !state.clearBonus) {
              state.clearBonus = true;
              state.score += 5000 + Math.round(Math.max(0, 120 - hunt.huntElapsedSeconds) * 80);
            }

            const actElapsed = skyDancerSkyRaidActSeconds(hunt.huntElapsedSeconds, act);
            return {
              gameMode: "sky-raid",
              actIndex: act.index,
              actId: act.id,
              actLabel: act.label,
              actSubtitle: act.subtitle,
              setpiece: act.setpiece,
              elapsedSeconds: hunt.huntElapsedSeconds,
              actElapsedSeconds: actElapsed,
              actSecondsRemaining: Math.max(0, act.endSeconds - hunt.huntElapsedSeconds),
              actKills: state.actKills,
              actKillTarget: act.killTarget,
              actBreak: state.actBreak,
              score: state.score,
              chain: state.chain,
              multiplier: skyDancerSkyRaidMultiplier(state.chain, rushActive),
              rushActive,
              pressure,
              bossForced: state.bossForced,
              clear,
              palette: act.palette,
            };
          }

          function broadcast(snapshot: SkyDancerSkyRaidSnapshot): void {
            latestSkyRaidSnapshot = { ...snapshot, palette: { ...snapshot.palette } };
            if (typeof window !== "undefined") {
              window.dispatchEvent(new CustomEvent<SkyDancerSkyRaidSnapshot>(SKY_DANCER_SKY_RAID_SNAPSHOT_EVENT, { detail: latestSkyRaidSnapshot }));
            }
          }

          export function getLatestSkyDancerSkyRaidSnapshot(): SkyDancerSkyRaidSnapshot | null {
            return latestSkyRaidSnapshot ? { ...latestSkyRaidSnapshot, palette: { ...latestSkyRaidSnapshot.palette } } : null;
          }

          function material(color: number, emissive = 0): THREE.MeshStandardMaterial {
            return new THREE.MeshStandardMaterial({
              color,
              roughness: 0.72,
              metalness: 0.08,
              flatShading: true,
              emissive: emissive || 0x000000,
              emissiveIntensity: emissive ? 0.52 : 0,
            });
          }

          function box(root: THREE.Group, size: [number, number, number], position: [number, number, number], color: number, emissive = 0): THREE.Mesh {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), material(color, emissive));
            mesh.position.set(...position);
            root.add(mesh);
            return mesh;
          }

          function ring(root: THREE.Group, radius: number, z: number, color: number, y = 5): THREE.Mesh {
            const mesh = new THREE.Mesh(
              new THREE.TorusGeometry(radius, 0.18, 6, 30),
              new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.78, depthWrite: false, blending: THREE.AdditiveBlending }),
            );
            mesh.position.set(0, y, z);
            root.add(mesh);
            return mesh;
          }

          function buildCity(act: SkyDancerSkyRaidAct): THREE.Group {
            const root = new THREE.Group();
            for (let index = 0; index < 18; index += 1) {
              const side = index % 2 === 0 ? -1 : 1;
              const lane = Math.floor(index / 2);
              const height = 10 + (lane % 4) * 5;
              box(root, [4 + lane % 3, height, 4 + (lane + 1) % 3], [side * (18 + (lane % 3) * 7), height * 0.5, -28 + lane * 13], act.palette.primary, lane % 3 === 0 ? act.palette.accent : 0);
            }
            ring(root, 8, 28, act.palette.accent, 7);
            ring(root, 10, 60, act.palette.secondary, 8);
            return root;
          }

          function buildCanyon(act: SkyDancerSkyRaidAct): THREE.Group {
            const root = new THREE.Group();
            for (let index = 0; index < 12; index += 1) {
              const z = -42 + index * 14;
              const height = 7 + (index % 4) * 4;
              box(root, [10 + index % 3 * 3, height, 8], [-28 - (index % 2) * 5, height * 0.5, z], act.palette.primary);
              box(root, [10 + (index + 1) % 3 * 3, height + 2, 8], [28 + (index % 2) * 5, (height + 2) * 0.5, z + 4], act.palette.secondary);
            }
            ring(root, 9, 34, act.palette.accent, 6);
            return root;
          }

          function buildFleet(act: SkyDancerSkyRaidAct): THREE.Group {
            const root = new THREE.Group();
            const carrier = new THREE.Group();
            box(carrier, [9, 3.2, 44], [0, 7, 54], act.palette.primary);
            box(carrier, [31, 0.9, 13], [0, 7.2, 48], act.palette.secondary);
            box(carrier, [4, 7, 8], [3, 10, 62], act.palette.secondary, act.palette.accent);
            box(carrier, [2.5, 1.2, 15], [-8, 8, 44], act.palette.accent, act.palette.accent);
            root.add(carrier);
            for (const side of [-1, 1]) {
              for (let index = 0; index < 3; index += 1) {
                box(root, [4, 1.1, 9], [side * (22 + index * 7), 6 + index, 24 + index * 20], act.palette.secondary, index === 2 ? act.palette.accent : 0);
              }
            }
            ring(root, 8, 30, act.palette.accent, 6);
            return root;
          }

          function buildStorm(act: SkyDancerSkyRaidAct): THREE.Group {
            const root = new THREE.Group();
            for (let index = 0; index < 8; index += 1) {
              const side = index % 2 === 0 ? -1 : 1;
              const z = -30 + Math.floor(index / 2) * 28;
              box(root, [2.4, 16 + (index % 3) * 5, 2.4], [side * 25, 8 + (index % 3) * 2.5, z], act.palette.primary, act.palette.accent);
            }
            for (let index = 0; index < 5; index += 1) {
              const points = [
                new THREE.Vector3(-12 + index * 4, 18, 12 + index * 13),
                new THREE.Vector3(-4 + index * 2, 10, 18 + index * 13),
                new THREE.Vector3(8 - index * 2, 3, 24 + index * 13),
              ];
              const geometry = new THREE.BufferGeometry().setFromPoints(points);
              root.add(new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: act.palette.accent, transparent: true, opacity: 0.76 })));
            }
            ring(root, 8.5, 42, act.palette.accent, 6.5);
            return root;
          }

          function buildPrism(act: SkyDancerSkyRaidAct): THREE.Group {
            const root = new THREE.Group();
            for (let index = 0; index < 9; index += 1) {
              const angle = (index / 9) * Math.PI * 2;
              const radius = 26 + (index % 2) * 8;
              const spire = new THREE.Mesh(new THREE.OctahedronGeometry(3 + (index % 3), 0), material(index % 2 ? act.palette.primary : act.palette.secondary, act.palette.accent));
              spire.scale.y = 2.8 + (index % 3) * 0.6;
              spire.position.set(Math.sin(angle) * radius, 8 + (index % 3) * 3, 46 + Math.cos(angle) * radius);
              root.add(spire);
            }
            ring(root, 8, 26, act.palette.accent, 7);
            ring(root, 12, 54, act.palette.secondary, 9);
            ring(root, 16, 84, act.palette.accent, 11);
            return root;
          }

          function buildActGroup(act: SkyDancerSkyRaidAct): THREE.Group {
            if (act.id === "dawn-city") return buildCity(act);
            if (act.id === "red-canyon") return buildCanyon(act);
            if (act.id === "cloud-fleet") return buildFleet(act);
            if (act.id === "storm-carrier") return buildStorm(act);
            return buildPrism(act);
          }

          function buildSpeedFx(): THREE.Group {
            const root = new THREE.Group();
            const geometry = new THREE.BoxGeometry(0.035, 0.035, 5.5);
            const lineMaterial = new THREE.MeshBasicMaterial({ color: 0xc9f7ff, transparent: true, opacity: 0.48, depthWrite: false, blending: THREE.AdditiveBlending });
            for (let index = 0; index < 24; index += 1) {
              const line = new THREE.Mesh(geometry, lineMaterial);
              const column = index % 8;
              const row = Math.floor(index / 8);
              line.position.set(-12 + column * 3.4, 1.5 + row * 2.4, 8 + (index % 6) * 7);
              root.add(line);
            }
            root.visible = false;
            return root;
          }

          function buildRaidVisuals(demo: RaidWebGLDemo): void {
            if (!isSkyRaidMode()) return;
            const root = new THREE.Group();
            root.name = "sky-raid-arcade-setpieces";
            const actGroups = SKY_DANCER_SKY_RAID_ACTS.map((act, index) => {
              const group = buildActGroup(act);
              group.visible = index === 0;
              root.add(group);
              return group;
            });
            const speedFx = buildSpeedFx();
            speedFx.name = "sky-raid-speed-fx";
            demo.scene.add(root, speedFx);
            raidVisualByDemo.set(demo as unknown as object, {
              root,
              actGroups,
              speedFx,
              lastActIndex: -1,
              anchorX: Number.NaN,
              anchorZ: Number.NaN,
              anchorHeading: 0,
            });
          }

          function updateRaidVisuals(demo: RaidWebGLDemo, delta: number): void {
            const visual = raidVisualByDemo.get(demo as unknown as object);
            if (!visual) return;
            if (!isSkyRaidMode()) {
              visual.root.visible = false;
              visual.speedFx.visible = false;
              return;
            }
            const hunt = getCartTurboHuntSnapshot(demo.session);
            if (!hunt) return;
            const raid = updateRaid(demo.session as unknown as RaidSession, hunt, 0);
            const base = demo.session.snapshot();
            const movedFar = !Number.isFinite(visual.anchorX) || Math.hypot(base.x - visual.anchorX, base.z - visual.anchorZ) > 105;
            if (raid.actIndex !== visual.lastActIndex || movedFar) {
              visual.anchorX = base.x;
              visual.anchorZ = base.z;
              visual.anchorHeading = base.heading;
              visual.root.position.set(base.x, 0, base.z);
              visual.root.rotation.y = base.heading;
              visual.lastActIndex = raid.actIndex;
            }
            visual.actGroups.forEach((group, index) => { group.visible = index === raid.actIndex; });
            visual.root.visible = true;

            const palette = raid.palette;
            if (demo.scene.background instanceof THREE.Color) demo.scene.background.lerp(new THREE.Color(palette.sky), clamp(delta * 2.2, 0, 1));
            if (demo.scene.fog) demo.scene.fog.color.lerp(new THREE.Color(palette.fog), clamp(delta * 2.2, 0, 1));

            visual.speedFx.visible = base.boostActive || raid.rushActive;
            visual.speedFx.position.set(base.x, 1.8, base.z);
            visual.speedFx.rotation.y = base.heading;
            visual.speedFx.children.forEach((line, index) => {
              line.position.z -= delta * (base.boostActive ? 68 : 42);
              if (line.position.z < -8) line.position.z = 30 + (index % 7) * 7;
            });
          }

          export function installSkyDancerSkyRaid(): void {
            const sessionPrototype = CartArenaSession.prototype as unknown as RaidSession;
            const previousStep = sessionPrototype.step;
            sessionPrototype.step = function skyRaidStep(this: RaidSession, input: RallyInputState, fixedDelta = 1 / 60): void {
              previousStep.call(this, input, fixedDelta);
              if (!isSkyRaidMode()) return;
              const hunt = getCartTurboHuntSnapshot(this as unknown as CartArenaSession);
              if (!hunt) return;
              const delta = clamp(fixedDelta, 0, 0.05);
              const snapshot = updateRaid(this, hunt, delta);
              const state = stateFor(this, hunt);
              state.broadcastClock += delta;
              if (state.broadcastClock >= 0.1 || snapshot.actElapsedSeconds < 0.12 || snapshot.clear) {
                state.broadcastClock %= 0.1;
                broadcast(snapshot);
              }
            };

            const webglPrototype = CartRogueWebGLDemo.prototype as unknown as RaidWebGLDemo;
            const previousBuildWorld = webglPrototype.buildWorld;
            webglPrototype.buildWorld = function skyRaidBuildWorld(this: RaidWebGLDemo): void {
              previousBuildWorld.call(this);
              buildRaidVisuals(this);
            };
            const previousUpdateVisuals = webglPrototype.updateVisuals;
            webglPrototype.updateVisuals = function skyRaidUpdateVisuals(this: RaidWebGLDemo, delta: number): void {
              previousUpdateVisuals.call(this, delta);
              updateRaidVisuals(this, delta);
            };

            const canvasPrototype = CartRogueCanvasPreview.prototype as unknown as RaidCanvasDemo;
            const previousDraw = canvasPrototype.draw;
            canvasPrototype.draw = function skyRaidCanvasDraw(this: RaidCanvasDemo): void {
              previousDraw.call(this);
              if (!isSkyRaidMode()) return;
              const hunt = getCartTurboHuntSnapshot(this.session);
              if (!hunt) return;
              const raid = updateRaid(this.session as unknown as RaidSession, hunt, 0);
              const width = this.canvas.clientWidth || this.canvas.width;
              const height = this.canvas.clientHeight || this.canvas.height;
              const color = `#${raid.palette.accent.toString(16).padStart(6, "0")}`;
              this.context.save();
              this.context.strokeStyle = color;
              this.context.globalAlpha = raid.rushActive ? 0.72 : 0.34;
              this.context.lineWidth = Math.max(1.5, width * 0.002);
              for (let index = 0; index < 4; index += 1) {
                const radius = Math.min(width, height) * (0.12 + index * 0.085);
                this.context.beginPath();
                this.context.arc(width * 0.5, height * 0.54, radius, 0, Math.PI * 2);
                this.context.stroke();
              }
              this.context.restore();
            };
          }

          installSkyDancerSkyRaid();
          ''')

