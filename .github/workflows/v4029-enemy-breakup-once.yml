name: Sky Dancer V40.29 Enemy Breakup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v4029-enemy-breakup-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
      SKY_DANCER_STAGE_AUDIT_VISUAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply V40.29 breakup patch
        run: python3 scripts/arcade-run-v4029-enemy-breakup.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Related checks
        run: |
          npm run check:arcade
          node --import tsx --test tests/sky-arcade-v20-enemy-roster.test.ts
          node --import tsx --test tests/sky-arcade-v4028-boss-wreck-presentation.test.ts
          node --import tsx --test tests/sky-arcade-v4029-enemy-breakup.test.ts
          npm run lint
          npm run build:pages
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version
      - name: Start production preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-dancer-v4029-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-dancer-v4029-http.log
          exit 1
      - name: Real Chrome WebGL smoke
        run: |
          node scripts/webgl-smoke-audit.mjs
          node scripts/webgl-arcade-stage-identity-audit.mjs
      - name: Commit verified V40.29 milestone and clean temporary runner
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeWebGLDemo.ts src/sky/arcade/SkyDancerArcadeV4029EnemyBreakup.ts tests/sky-arcade-v4029-enemy-breakup.test.ts
          git rm scripts/arcade-run-v4029-enemy-breakup.py .github/workflows/v4029-enemy-breakup-once.yml
          git commit -m "Arcade Run V40.29: diversify enemy breakup reactions"
          git push origin HEAD:main
