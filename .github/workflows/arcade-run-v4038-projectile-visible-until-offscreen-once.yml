name: Arcade Run V40.38 projectile visible until offscreen

on:
  push:
    branches:
      - chatgpt/v4038-projectile-visible-until-offscreen
    paths:
      - .github/workflows/arcade-run-v4038-projectile-visible-until-offscreen-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply V40.38 offscreen-exit presentation fix
        run: python3 scripts/arcade-run-v4038-projectile-visible-until-offscreen.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify related Arcade Run contracts
        run: |
          npm run check:arcade
          node --import tsx --test tests/sky-arcade-v4034-dodge-counter.test.ts
          node --import tsx --test tests/sky-arcade-v4035-projectile-visibility.test.ts
          node --import tsx --test tests/sky-arcade-v4036-enemy-attack-visual-coherence.test.ts
          node --import tsx --test tests/sky-arcade-v4037-projectile-pass-through.test.ts
          node --import tsx --test tests/sky-arcade-v4038-projectile-visible-until-offscreen.test.ts
          npm run lint
          npm run build
          npm run validate:artifact
      - name: Commit verified V40.38 fix
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeWebGLDemo.ts \
                  src/sky/arcade/SkyDancerArcadeCanvasDemo.ts \
                  tests/sky-arcade-v4038-projectile-visible-until-offscreen.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "Arcade Run V40.38: keep hostile shots visible until offscreen"
          git push origin HEAD:chatgpt/v4038-projectile-visible-until-offscreen
