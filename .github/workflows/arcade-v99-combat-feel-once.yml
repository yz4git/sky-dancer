name: Arcade V9.9 Combat Feel Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/arcade-v99-combat-feel-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply V9.9 combat feel
        run: python3 scripts/apply-arcade-v99-combat-feel.py
      - name: Arcade rules regression
        run: npm run test:rules
      - name: Arcade typecheck
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Pages production build
        run: npm run build:pages
      - name: Commit V9.9 product code and remove temporary files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeProductPresentation.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts tests/sky-arcade-reference.test.ts
          git rm scripts/apply-arcade-v99-combat-feel.py .github/workflows/arcade-v99-combat-feel-once.yml
          git commit -m "Arcade Run V9.9: kinetic combat feedback and debris"
          git push
