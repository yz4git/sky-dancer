name: Arcade Run V20 Apply

on:
  push:
    branches: [arcade-run-v20-enemy-roster-20260908]
    paths:
      - ".github/workflows/arcade-v20-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply V20 source patch
        run: python scripts/apply-v20-enemy-roster.py
      - name: Commit patched source
        run: |
          rm scripts/apply-v20-enemy-roster.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Arcade Run V20: expand enemy aircraft roster"
          git push origin HEAD:arcade-run-v20-enemy-roster-20260908
