name: Arcade Run V40.3 Recovery Drama

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/arcade-run-v403-recovery-drama-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply V40.3 recovery drama
        run: python3 scripts/arcade-run-v403-recovery-drama.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Debug recovery classification
        run: |
          node --import tsx --input-type=module <<'EOF'
          import { skyDancerArcadeV403RecoveryFromMessage } from './src/sky/arcade/SkyDancerArcadeV403WorldBreakRecovery.ts';
          const cases = [
            ['dawn-city','WORLD BREAK · GATE 2 MISSED',true],
            ['red-canyon','WORLD BREAK · KNIFE RUN LOST · 2.1s',false],
            ['cloud-fleet','DECK STRIKE · BRIDGE CORE ESCAPED',true],
            ['storm-carrier','LIGHTNING GRID · STRIKE 2 · MOVE TO LANE',true],
            ['desert-fortress','FORTRESS GATE · BREACH MISSED',false],
            ['ice-cavern','CRYSTAL TUNNEL · COLLAPSE HIT 2',true],
            ['floating-ruins','WARNING · ROUTE UNSTABLE',true],
            ['night-metro','NEON PURSUIT · PHANTOM ESCAPED · GAP 42m',false],
            ['volcano-core','MAGMA PRESSURE · ERUPTION HIT 1 · TURBO NOW',true],
            ['orbital-ascent','ZERO-G ASCENT · DEBRIS STRIKE 1 · FIND AXIS',true],
            ['prism-citadel','TOWER SLALOM REPRISE · SKY 4 FRACTURED',true],
          ];
          for (const [stage,message,expected] of cases) {
            const cue = skyDancerArcadeV403RecoveryFromMessage(stage, message);
            console.log(stage, 'expected=', expected, 'actual=', cue?.retryable, 'headline=', cue?.headline);
          }
          EOF
      - name: Verify V40.3 recovery drama
        run: |
          npm run check:arcade
          node --import tsx --test tests/sky-arcade-v403-world-break-recovery.test.ts tests/sky-arcade-v402-world-break-celebration.test.ts tests/sky-arcade-v401-world-break-polish.test.ts tests/sky-arcade-v40-world-break-phase6.test.ts
          npm run test:fast
          npm run lint
          npm run build:pages
      - name: Commit verified V40.3 recovery drama
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeV403WorldBreakRecovery.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts app/SkyDancerArcadeMode.tsx app/SkyDancerArcadeMode.module.css tests/sky-arcade-v403-world-break-recovery.test.ts
          git commit -m "Arcade Run V40.3: add World Break recovery drama"
          git push origin HEAD:main
