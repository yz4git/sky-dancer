name: SKY RAID surface transition fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sky-raid-surface-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Make SKY RAID ground and city layers act-aware
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # V41: the continuous ground itself must change with the SKY RAID act.
          p = Path('src/sky/presentation/SkyDancerTerrainContinuityV41.ts')
          s = p.read_text()
          s = s.replace(
          'function worldHeight(x: number, z: number): number {\n  const broad = Math.sin(x * 0.0061) * Math.cos(z * 0.0053) * 1.65;\n  const ridge = Math.sin((x + z) * 0.0107 + Math.cos(z * 0.0039)) * 0.92;\n  const secondary = Math.cos((x - z * 0.72) * 0.0141) * 0.48;\n  return GROUND_Y + 0.34 + broad + ridge + secondary;\n}\n\nfunction terrainColor(height: number, x: number, z: number): THREE.Color {\n  const normalized = THREE.MathUtils.clamp((height - (GROUND_Y - 2.8)) / 6.0, 0, 1);\n  const low = new THREE.Color(0x3f6946);\n  const high = new THREE.Color(0x718451);\n  const color = low.lerp(high, normalized);\n  const variation = 0.93 + (Math.sin(x * 0.021) * Math.cos(z * 0.018) * 0.5 + 0.5) * 0.10;\n  return color.multiplyScalar(variation);\n}\n',
          '''type SkyRaidSurfaceStyle = "city" | "mountains" | "clouds" | "storm" | "citadel";\n\nfunction skyRaidSurfaceStyle(): SkyRaidSurfaceStyle | null {\n  if (typeof document === "undefined" || document.documentElement.dataset.skyDancerMode !== "sky-raid") return null;\n  const style = document.documentElement.dataset.skyRaidWorldStyle;\n  return style === "mountains" || style === "clouds" || style === "storm" || style === "citadel" ? style : "city";\n}\n\nfunction worldHeight(x: number, z: number, style: SkyRaidSurfaceStyle): number {\n  const broad = Math.sin(x * 0.0061) * Math.cos(z * 0.0053);\n  const ridge = Math.sin((x + z) * 0.0107 + Math.cos(z * 0.0039));\n  const secondary = Math.cos((x - z * 0.72) * 0.0141);\n  if (style === "mountains") return GROUND_Y - 0.8 + broad * 4.8 + ridge * 3.2 + secondary * 1.4;\n  if (style === "clouds") return GROUND_Y - 8.5 + broad * 0.55 + ridge * 0.32 + secondary * 0.18;\n  if (style === "storm") return GROUND_Y - 2.2 + broad * 2.1 + ridge * 1.7 + secondary * 0.75;\n  if (style === "citadel") {\n    const prism = Math.abs(Math.sin(x * 0.018) * Math.cos(z * 0.016));\n    return GROUND_Y - 0.4 + broad * 1.2 + ridge * 0.8 + prism * 2.4;\n  }\n  return GROUND_Y + 0.34 + broad * 1.65 + ridge * 0.92 + secondary * 0.48;\n}\n\nfunction terrainColor(height: number, x: number, z: number, style: SkyRaidSurfaceStyle): THREE.Color {\n  const normalized = THREE.MathUtils.clamp((height - (GROUND_Y - 10)) / 18.0, 0, 1);\n  const palettes: Record<SkyRaidSurfaceStyle, readonly [number, number]> = {\n    city: [0x3f6946, 0x718451],\n    mountains: [0x5b2f24, 0xb2673f],\n    clouds: [0xb9dce8, 0xf1f7f5],\n    storm: [0x1e2939, 0x46566a],\n    citadel: [0x241d3f, 0x685683],\n  };\n  const [lowHex, highHex] = palettes[style];\n  const color = new THREE.Color(lowHex).lerp(new THREE.Color(highHex), normalized);\n  const variation = 0.91 + (Math.sin(x * 0.021) * Math.cos(z * 0.018) * 0.5 + 0.5) * 0.13;\n  return color.multiplyScalar(variation);\n}\n''')
          s = s.replace(
          '  private centerTileX = Number.NaN;\n  private centerTileZ = Number.NaN;\n',
          '  private centerTileX = Number.NaN;\n  private centerTileZ = Number.NaN;\n  private activeSurfaceStyle: SkyRaidSurfaceStyle = "city";\n')
          s = s.replace(
          '    this.root.visible = true;\n    const nextTileX = Math.floor((snapshot.x + TILE_SIZE * 0.5) / TILE_SIZE);\n    const nextTileZ = Math.floor((snapshot.z + TILE_SIZE * 0.5) / TILE_SIZE);\n    if (nextTileX !== this.centerTileX || nextTileZ !== this.centerTileZ) {\n',
          '    this.root.visible = true;\n    const nextStyle = skyRaidSurfaceStyle() ?? "city";\n    const styleChanged = nextStyle !== this.activeSurfaceStyle;\n    this.activeSurfaceStyle = nextStyle;\n    this.root.userData.skyRaidSurfaceStyle = nextStyle;\n    const nextTileX = Math.floor((snapshot.x + TILE_SIZE * 0.5) / TILE_SIZE);\n    const nextTileZ = Math.floor((snapshot.z + TILE_SIZE * 0.5) / TILE_SIZE);\n    if (styleChanged || nextTileX !== this.centerTileX || nextTileZ !== this.centerTileZ) {\n')
          s = s.replace('          const height = worldHeight(worldX, worldZ);', '          const height = worldHeight(worldX, worldZ, this.activeSurfaceStyle);')
          s = s.replace('          const color = terrainColor(height, worldX, worldZ);', '          const color = terrainColor(height, worldX, worldZ, this.activeSurfaceStyle);')
          p.write_text(s)

          # V36: the dense primary city must not survive canyon/cloud/storm/citadel acts.
          p = Path('src/sky/presentation/SkyDancerV36WorldGeometryPass.ts')
          s = p.read_text()
          marker = 'const GLOBAL_WORLD_DEBUG_KEY = "__skyDancerGetV36WorldDebug";\n'
          helper = '''const GLOBAL_WORLD_DEBUG_KEY = "__skyDancerGetV36WorldDebug";\n\nfunction skyRaidShowsCityGround(): boolean {\n  if (typeof document === "undefined" || document.documentElement.dataset.skyDancerMode !== "sky-raid") return true;\n  return (document.documentElement.dataset.skyRaidWorldStyle ?? "city") === "city";\n}\n'''
          if marker not in s: raise SystemExit('V36 marker missing')
          s = s.replace(marker, helper, 1)
          old = '''    this.terrainRoot.visible = true;\n    this.cityRoot.visible = true;\n    for (const mesh of this.archetypes) mesh.visible = true;\n    this.arterialRoads.visible = true;\n'''
          new = '''    this.terrainRoot.visible = true;\n    const showCityGround = skyRaidShowsCityGround();\n    this.cityRoot.visible = showCityGround;\n    for (const mesh of this.archetypes) mesh.visible = showCityGround;\n    this.arterialRoads.visible = showCityGround;\n'''
          if old not in s: raise SystemExit('V36 visibility block missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # V40: suppress the multi-direction city and roads outside the opening city act.
          p = Path('src/sky/presentation/SkyDancerV40CityExpansionPass.ts')
          s = p.read_text()
          marker = 'const PLAYER_HIT_BURST_V6_SCALE = 0.74;\n'
          helper = '''const PLAYER_HIT_BURST_V6_SCALE = 0.74;\n\nfunction skyRaidShowsCityExpansion(): boolean {\n  if (typeof document === "undefined" || document.documentElement.dataset.skyDancerMode !== "sky-raid") return true;\n  return (document.documentElement.dataset.skyRaidWorldStyle ?? "city") === "city";\n}\n'''
          if marker not in s: raise SystemExit('V40 marker missing')
          s = s.replace(marker, helper, 1)
          old = '    this.root.visible = true;\n    this.reduceInheritedCombatBursts();\n'
          new = '    this.root.visible = skyRaidShowsCityExpansion();\n    this.reduceInheritedCombatBursts();\n'
          if old not in s: raise SystemExit('V40 visibility block missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Extend the pure rules test so the five ACT -> world styles cannot regress.
          p = Path('tests/sky-sky-raid.test.ts')
          s = p.read_text()
          s = s.replace('  skyDancerSkyRaidRushActive,\n', '  skyDancerSkyRaidRushActive,\n  skyDancerSkyRaidWorldStyle,\n')
          append = '''\n\ntest("SKY RAID maps every act to a visibly distinct surface world", () => {\n  assert.deepEqual(\n    SKY_DANCER_SKY_RAID_ACTS.map((act) => skyDancerSkyRaidWorldStyle(act.id)),\n    ["city", "mountains", "clouds", "storm", "citadel"],\n  );\n});\n'''
          if 'visibly distinct surface world' not in s: s += append
          p.write_text(s)
          PY
      - name: Validate
        run: |
          npm run test:fast
          npm run lint
          npm run build:pages
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/sky-raid-surface-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix SKY RAID act-specific ground scenery"
          git push origin main
