# Full visual verification for canyon, ice, volcano and orbital course identities.
# Automatic pushes use the lightweight WebGL smoke workflow instead.
name: Sky Dancer Arcade Stage Identity Full Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sky-dancer-arcade-stage-full-audit
  cancel-in-progress: true

jobs:
  stage-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SKY_DANCER_STAGE_AUDIT_VISUAL: "1"
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install lightweight browser controller
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version
      - run: npm run build:pages
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-dancer-stage-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-dancer-stage-http.log
          exit 1
      - run: node scripts/webgl-arcade-stage-identity-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-dancer-stage-identity-${{ github.sha }}
          path: artifacts/arcade-stage-identity
          if-no-files-found: error
          retention-days: 14
