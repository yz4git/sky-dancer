name: Arcade Ice Wave V8.7 Once

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/apply-ice-wave-v87.py"
      - ".github/workflows/arcade-ice-wave-v87-once.yml"

permissions:
  contents: write

concurrency:
  group: arcade-ice-wave-v87-once
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply V8.7 Ice readable wave
        run: python3 scripts/apply-ice-wave-v87.py
      - name: Rules regression
        run: npm run test:rules
      - name: Lint
        run: npm run lint
      - name: Pages production build
        run: npm run build:pages
      - name: Commit V8.7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeReferenceWorld.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts tests/sky-arcade-reference.test.ts tests/sky-arcade-run.test.ts
          git rm -f scripts/apply-ice-wave-v87.py .github/workflows/arcade-ice-wave-v87-once.yml
          git commit -m "Arcade Run V8.7: expose ice cavern vertical wave"
          git push origin HEAD:main
