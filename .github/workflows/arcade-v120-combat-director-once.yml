name: Arcade V12.0 Combat Director Once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply V12.0 product patch
        run: python3 scripts/apply-arcade-v120-combat-director.py
      - name: Run arcade rule regression
        run: npm run test:rules
      - name: Run arcade contract checks
        run: npm run check:arcade
      - name: Run lint
        run: npm run lint
      - name: Build Pages artifact
        run: npm run build:pages
      - name: Commit V12.0 product
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sky/arcade/SkyDancerArcadeRuntime.ts src/sky/arcade/SkyDancerArcadeV12Director.ts app/SkyDancerArcadeMode.tsx app/SkyDancerArcadeProduct.module.css tests/sky-arcade-run.test.ts
          git commit -m 'Arcade V12.0: add adaptive combat director'
      - name: Cleanup one-shot implementation files
        run: |
          git rm -f scripts/apply-arcade-v120-combat-director.py .github/workflows/arcade-v120-combat-director-once.yml
          git commit -m 'Remove V12.0 implementation files'
          git push origin HEAD:main
