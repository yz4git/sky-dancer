name: Arcade Run V40.39 visual playtest

on:
  push:
    branches:
      - chatgpt/v4039-visual-playtest
    paths:
      - .github/workflows/arcade-v4039-visual-playtest-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply V40.39 combat sightline pass
        run: python3 scripts/arcade-v4039-combat-sightline.py
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Arcade Run changes
        run: |
          npm run check:arcade
          node --import tsx --test tests/sky-arcade-v4034-dodge-counter.test.ts
          node --import tsx --test tests/sky-arcade-v4035-projectile-visibility.test.ts
          node --import tsx --test tests/sky-arcade-v4036-enemy-attack-visual-coherence.test.ts
          node --import tsx --test tests/sky-arcade-v4037-projectile-pass-through.test.ts
          node --import tsx --test tests/sky-arcade-v4038-projectile-visible-until-offscreen.test.ts
          node --import tsx --test tests/sky-arcade-v4039-combat-sightline.test.ts
          npm run test:pwa
          npm run lint
          npm run build
          npm run validate:artifact
          npm run test:pages
      - name: Install headless browser
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve Pages build
        run: |
          python3 -m http.server 4173 --directory out > /tmp/sky-dancer-http.log 2>&1 &
          echo $! > /tmp/sky-dancer-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/sky-dancer-http.log
          exit 1
      - name: Play Arcade Run and capture iPhone landscape frames
        run: node scripts/arcade-v4039-visual-playtest.mjs
      - name: Upload visual playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-v4039-visual-playtest-after
          path: visual-playtest-v4039
          if-no-files-found: error
          retention-days: 3
      - name: Commit verified V40.39 product changes
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add app/SkyDancerArcadeMode.tsx \
                  app/SkyDancerArcadeMode.module.css \
                  tests/sky-arcade-v4039-combat-sightline.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "Arcade Run V40.39: clear climax combat sightlines"
          git push origin HEAD:chatgpt/v4039-visual-playtest
