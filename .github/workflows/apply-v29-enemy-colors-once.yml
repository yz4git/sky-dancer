name: Apply Arcade V29 Enemy Colors Once

on:
  push:
    branches: [arcade-run-v29-enemy-color-identity-20260911]
    paths:
      - ".github/apply-v29-enemy-colors.py"
      - ".github/workflows/apply-v29-enemy-colors-once.yml"

permissions:
  contents: write

jobs:
  apply-test-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arcade-run-v29-enemy-color-identity-20260911
      - name: Apply V29 enemy color integration
        run: python3 .github/apply-v29-enemy-colors.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fast tests
        run: npm run test:fast
      - name: Lint
        run: npm run lint
      - name: Build Pages artifact
        run: npm run build:pages
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version
      - name: Start production preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-dancer-v29-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-dancer-v29-http.log
          exit 1
      - name: Run 844x390 Arcade visual play audit
        run: node scripts/webgl-arcade-run-reference-audit.mjs
      - name: Commit validated V29 source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeEnemyAirframes.ts
          git commit -m "Arcade Run V29: integrate enemy role colors"
          git push origin HEAD:arcade-run-v29-enemy-color-identity-20260911
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-dancer-v29-enemy-colors-${{ github.sha }}
          path: artifacts/arcade-run-reference
          if-no-files-found: warn
          retention-days: 14
