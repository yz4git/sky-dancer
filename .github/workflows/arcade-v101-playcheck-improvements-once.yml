name: Arcade V10.1 Playcheck Improvements Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/arcade-v101-playcheck-improvements-once.yml"

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply V10.1 pacing and readability pass
        run: |
          python3 - <<'PY'
          from pathlib import Path

          systems=Path('src/sky/arcade/SkyDancerArcadeV10Systems.ts')
          s=systems.read_text()
          old='''export function skyDancerArcadeStageEventCheckpoint(progress: number): 0 | 1 | 2 {\n  if (progress >= .62) return 2;\n  if (progress >= .18) return 1;\n  return 0;\n}\n'''
          new='''export function skyDancerArcadeStageEventCheckpoint(progress: number, finalStage = false): 0 | 1 | 2 {\n  // V10.1: keep the second authored course beat out of route selection and out of the boss arena.\n  const secondBeat = finalStage ? .34 : .46;\n  if (progress >= secondBeat) return 2;\n  if (progress >= .18) return 1;\n  return 0;\n}\n\nexport function skyDancerArcadeBossStartProgress(finalStage: boolean): number {\n  // Non-final sections get a clean recovery beat after event #2. The finale still reserves most of its back half for the boss.\n  return finalStage ? .44 : .58;\n}\n'''
          assert old in s
          systems.write_text(s.replace(old,new,1))

          runtime=Path('src/sky/arcade/SkyDancerArcadeRuntime.ts')
          s=runtime.read_text()
          s=s.replace('''  skyDancerArcadeBossPhase,\n  skyDancerArcadeBossPhaseLabel,''','''  skyDancerArcadeBossPhase,\n  skyDancerArcadeBossPhaseLabel,\n  skyDancerArcadeBossStartProgress,''',1)
          s=s.replace('''    const rewindCheckpoint = skyDancerArcadeStageEventCheckpoint(this.stageTime / this.stage.durationSeconds);''','''    const finalStage = this.stage.id === SKY_DANCER_ARCADE_FINAL_STAGE;\n    const rewindCheckpoint = skyDancerArcadeStageEventCheckpoint(this.stageTime / this.stage.durationSeconds, finalStage);''',1)
          s=s.replace('''    if (this.stageTime >= this.stage.durationSeconds * 0.52) this.spawnBoss();''','''    if (this.stageTime >= this.stage.durationSeconds * skyDancerArcadeBossStartProgress(finalStage)) this.spawnBoss();''',1)
          s=s.replace('''    const checkpoint = skyDancerArcadeStageEventCheckpoint(progress);''','''    const checkpoint = skyDancerArcadeStageEventCheckpoint(progress, this.stage.id === SKY_DANCER_ARCADE_FINAL_STAGE);''',1)
          s=s.replace('''    const bossTime = this.stage.durationSeconds * (this.stage.id === SKY_DANCER_ARCADE_FINAL_STAGE ? 0.42 : 0.52);''','''    const bossTime = this.stage.durationSeconds * skyDancerArcadeBossStartProgress(this.stage.id === SKY_DANCER_ARCADE_FINAL_STAGE);''',1)
          s=s.replace('''    if (this.stageTime >= this.nextHazardAt && this.hazards.length < 8) {''','''    if (!this.bossSpawned && this.stageTime >= this.nextHazardAt && this.hazards.length < 8) {''',1)
          s=s.replace('''  private spawnBoss(): void {\n    if (this.bossSpawned) return;\n    this.bossSpawned = true;\n    const final = this.stage.id === SKY_DANCER_ARCADE_FINAL_STAGE;''','''  private spawnBoss(): void {\n    if (this.bossSpawned) return;\n    this.bossSpawned = true;\n    // V10.1: boss ingress owns the arena. Retire leftover wave pressure instead of stacking it under the climax target.\n    for (const enemy of this.enemies) {\n      if (enemy.boss) continue;\n      enemy.alive = false;\n      enemy.locked = false;\n    }\n    this.projectiles = this.projectiles.filter((projectile) => projectile.owner !== "enemy");\n    this.hazards = [];\n    const final = this.stage.id === SKY_DANCER_ARCADE_FINAL_STAGE;''',1)
          runtime.write_text(s)

          presentation=Path('src/sky/arcade/SkyDancerArcadeProductPresentation.ts')
          s=presentation.read_text()
          s=s.replace('''    const salvoSmokeScale = THREE.MathUtils.clamp(1 / Math.sqrt(Math.max(1, playerMissileCount) * .55), .58, 1);''','''    const salvoSmokeScale = THREE.MathUtils.clamp(1 / Math.sqrt(Math.max(1, playerMissileCount) * .68), .5, 1);''',1)
          old='''      const course = arcadeCourseRelativePose(snapshot.stage, snapshot.distance, p.depth);\n      const x = p.x * 8.4 + course.x, y = 1.2 + p.y * 4.9 + course.y, z = -p.depth;\n\n      // V9.6: a real missile silhouette needs a persistent white exhaust mass, not only a neon line.\n      if (p.owner === "player-missile") {\n        this.missilePoint.set(x, y, z);'''
          new='''      const course = arcadeCourseRelativePose(snapshot.stage, snapshot.distance, p.depth);\n      const x = p.x * 8.4 + course.x, y = 1.2 + p.y * 4.9 + course.y, z = -p.depth;\n      // V10.1: preserve a clear aiming cone. White exhaust stays bold off-axis but thins near the reticle where targets must remain readable.\n      const reticleDistance = Math.hypot(p.x - snapshot.playerX, p.y - snapshot.playerY);\n      const reticleSmokeScale = THREE.MathUtils.lerp(.64, 1, THREE.MathUtils.clamp(reticleDistance / .9, 0, 1));\n      const missileSmokeScale = salvoSmokeScale * reticleSmokeScale;\n\n      // V9.6: a real missile silhouette needs a persistent white exhaust mass, not only a neon line.\n      if (p.owner === "player-missile") {\n        this.missilePoint.set(x, y, z);'''
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace('''this.missileSmoke.emit(this.missilePoint, 1.52 * salvoSmokeScale);''','''this.missileSmoke.emit(this.missilePoint, 1.52 * missileSmokeScale);''')
          s=s.replace('''this.missileSmoke.emit(this.missileMidpoint, 1.15 * salvoSmokeScale);''','''this.missileSmoke.emit(this.missileMidpoint, 1.15 * missileSmokeScale);''')
          s=s.replace('''this.missileSmoke.emit(this.missilePoint, 1.24 * salvoSmokeScale);''','''this.missileSmoke.emit(this.missilePoint, 1.24 * missileSmokeScale);''')
          presentation.write_text(s)

          tests=Path('tests/sky-arcade-reference.test.ts')
          s=tests.read_text()
          s=s.replace('''  skyDancerArcadeBossPhase,\n  skyDancerArcadeBossWeakpointOpen,''','''  skyDancerArcadeBossPhase,\n  skyDancerArcadeBossStartProgress,\n  skyDancerArcadeBossWeakpointOpen,''',1)
          old='''  assert.equal(skyDancerArcadeStageEventCheckpoint(.1), 0);\n  assert.equal(skyDancerArcadeStageEventCheckpoint(.2), 1);\n  assert.equal(skyDancerArcadeStageEventCheckpoint(.7), 2);\n  const runtime = new SkyDancerArcadeRuntime({ mode: "stage-practice", difficulty: "normal", seed: 1003 });\n  runtime.triggerStageEvolutionForTests(.2);\n  const first = runtime.getSnapshot();\n  assert.equal(first.stageEventSerial, 1);\n  assert.ok(first.stageEventLabel);\n  runtime.triggerStageEvolutionForTests(.7);'''
          new='''  assert.equal(skyDancerArcadeStageEventCheckpoint(.1), 0);\n  assert.equal(skyDancerArcadeStageEventCheckpoint(.2), 1);\n  assert.equal(skyDancerArcadeStageEventCheckpoint(.45), 1, "route selection must finish before event #2");\n  assert.equal(skyDancerArcadeStageEventCheckpoint(.47), 2);\n  assert.equal(skyDancerArcadeStageEventCheckpoint(.35, true), 2, "finale advances its second beat before the early final boss");\n  assert.ok(skyDancerArcadeBossStartProgress(false) > .47, "normal bosses start after event #2");\n  assert.ok(skyDancerArcadeBossStartProgress(true) > .35, "final boss starts after the compressed final event #2");\n  const runtime = new SkyDancerArcadeRuntime({ mode: "stage-practice", difficulty: "normal", seed: 1003 });\n  runtime.triggerStageEvolutionForTests(.2);\n  const first = runtime.getSnapshot();\n  assert.equal(first.stageEventSerial, 1);\n  assert.ok(first.stageEventLabel);\n  runtime.triggerStageEvolutionForTests(.47);'''
          assert old in s
          s=s.replace(old,new,1)
          # Keep a source-level invariant for the boss arena cleanup so future director edits cannot reintroduce generic pressure stacking.
          marker='''test("V10 Arcade Meta Layer defaults to migrated v2 career records and milestone slots", () => {'''
          guard='''test("V10.1 boss ingress clears prior crossfire and suppresses generic boss hazards", async () => {\n  const source = await import("node:fs/promises").then(fs => fs.readFile(new URL("../src/sky/arcade/SkyDancerArcadeRuntime.ts", import.meta.url), "utf8"));\n  assert.match(source, /projectiles = this\\.projectiles\\.filter\\(\\(projectile\\) => projectile\\.owner !== "enemy"\\)/);\n  assert.match(source, /this\\.hazards = \[\]/);\n  assert.match(source, /if \\(!this\\.bossSpawned && this\\.stageTime >= this\\.nextHazardAt/);\n});\n\n'''
          assert marker in s
          s=s.replace(marker,guard+marker,1)
          tests.write_text(s)
          PY
      - name: Arcade rules regression
        run: npm run test:rules
      - name: Arcade typecheck
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Pages production build
        run: npm run build:pages
      - name: Commit V10.1 product changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/arcade-v101-playcheck-improvements-once.yml
          git add src/sky/arcade/SkyDancerArcadeV10Systems.ts src/sky/arcade/SkyDancerArcadeRuntime.ts src/sky/arcade/SkyDancerArcadeProductPresentation.ts tests/sky-arcade-reference.test.ts
          git commit -m "Arcade Run V10.1: separate boss arena and clear the reticle"
          git push
