name: Arcade Desert V9.3 Once

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/apply-desert-v93.py"
      - ".github/workflows/arcade-desert-v93-once.yml"

permissions:
  contents: write

concurrency:
  group: arcade-desert-v93-once
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply V9.3 Desert Fortress reconstruction
        run: python3 scripts/apply-desert-v93.py
      - name: Rules regression
        run: npm run test:rules
      - name: Lint
        run: npm run lint
      - name: Pages production build
        run: npm run build:pages
      - name: Commit V9.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeReferenceWorld.ts tests/sky-arcade-reference.test.ts
          git rm -f scripts/apply-desert-v93.py .github/workflows/arcade-desert-v93-once.yml
          git commit -m "Arcade Run V9.3: reconstruct Desert Fortress sandwall citadel"
          git push origin HEAD:main
