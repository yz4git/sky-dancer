name: SKY RAID legacy environment ownership fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sky-raid-ground-owner-fix-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Group legacy Sky Dancer environment under one owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/sky/SkyDancerWebGLDemo.ts')
          s = p.read_text()
          old = '''    const legacyEnvironmentBefore = new Set(runtime.scene.children);\n    this.buildTerrain150m(runtime.scene);\n    this.buildCloudDeck(runtime.scene);\n    this.buildAirspaceGuides(runtime.scene);\n    for (const object of runtime.scene.children) {\n      if (!legacyEnvironmentBefore.has(object)) object.userData.skyDancerLegacyEnvironment = true;\n    }\n'''
          new = '''    // Keep every baseline Sky Dancer scenery object under one ownership root.\n    // SKY RAID can then suppress the entire legacy world by hiding the parent,\n    // even if later presentation passes toggle individual child visibility.\n    const legacyEnvironmentRoot = new THREE.Group();\n    legacyEnvironmentRoot.name = "sky-dancer-legacy-environment";\n    legacyEnvironmentRoot.userData.skyDancerLegacyEnvironment = true;\n    this.buildTerrain150m(legacyEnvironmentRoot);\n    this.buildCloudDeck(legacyEnvironmentRoot);\n    this.buildAirspaceGuides(legacyEnvironmentRoot);\n    runtime.scene.add(legacyEnvironmentRoot);\n'''
          if old not in s:
              raise SystemExit('legacy environment construction marker not found')
          s = s.replace(old, new, 1)
          for old_sig, new_sig in [
              ('private buildTerrain150m(scene: THREE.Scene): void', 'private buildTerrain150m(scene: THREE.Object3D): void'),
              ('private buildCloudDeck(scene: THREE.Scene): void', 'private buildCloudDeck(scene: THREE.Object3D): void'),
              ('private buildAirspaceGuides(scene: THREE.Scene): void', 'private buildAirspaceGuides(scene: THREE.Object3D): void'),
          ]:
              if old_sig not in s:
                  raise SystemExit(f'signature marker not found: {old_sig}')
              s = s.replace(old_sig, new_sig, 1)
          p.write_text(s)
          PY
      - name: Verify ownership wiring
        run: |
          grep -n 'sky-dancer-legacy-environment' src/sky/SkyDancerWebGLDemo.ts
          grep -n 'buildTerrain150m(scene: THREE.Object3D)' src/sky/SkyDancerWebGLDemo.ts
          grep -n 'buildCloudDeck(scene: THREE.Object3D)' src/sky/SkyDancerWebGLDemo.ts
          grep -n 'buildAirspaceGuides(scene: THREE.Object3D)' src/sky/SkyDancerWebGLDemo.ts
      - name: Regression checks
        run: |
          npm run test:fast
          npm run lint
          npm run build:pages
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name 'yz4git'
          git config user.email '65384484+yz4git@users.noreply.github.com'
          git add src/sky/SkyDancerWebGLDemo.ts
          git commit -m 'Own SKY RAID legacy environment as one scene root'
          git rm .github/workflows/sky-raid-ground-owner-fix-once.yml
          git commit -m 'Remove SKY RAID ground ownership one-shot workflow'
          git push origin HEAD:main
