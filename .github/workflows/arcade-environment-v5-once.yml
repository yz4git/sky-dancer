name: Apply Arcade Run environment V5 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcade-environment-v5-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python3 scripts/apply-arcade-environment-v5.py
      - run: npm run test:rules
      - run: npm run lint
      - run: npm run build:pages
      - name: Commit V5 improvements
        run: |
          rm -f scripts/apply-arcade-environment-v5.py .github/workflows/arcade-environment-v5-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Arcade Run V5: denser stages, fly-bys and climax kills'
          git push origin HEAD:main
