name: SKY RAID V30 performance retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sky-raid-v30-performance-retry.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies and browser audit runtime
        run: |
          npm ci --no-audit --no-fund
          rm -rf .audit-runtime artifacts/sky-raid-v30-performance
          mkdir -p .audit-runtime artifacts/sky-raid-v30-performance
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0

      - name: Inject webdriver-only audit clock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/cart/CartRoguePhase67TurboHunt.ts")
          source = path.read_text()
          marker = """function updateDirector(session: MutableHuntSession, state: TurboHuntState, delta: number): void {\n  state.elapsed += delta;"""
          replacement = """function updateDirector(session: MutableHuntSession, state: TurboHuntState, delta: number): void {\n  if (typeof window !== \"undefined\" && typeof navigator !== \"undefined\" && navigator.webdriver) {\n    const forcedElapsed = (window as unknown as { __skyRaidAuditElapsedSeconds?: unknown }).__skyRaidAuditElapsedSeconds;\n    if (typeof forcedElapsed === \"number\" && Number.isFinite(forcedElapsed)) state.elapsed = Math.max(0, forcedElapsed);\n  }\n  state.elapsed += delta;"""
          if marker not in source:
              raise SystemExit("V30 audit clock marker missing")
          path.write_text(source.replace(marker, replacement, 1))
          PY

      - name: Build and profile baseline
        run: |
          npm run build:pages
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/sky-raid-v30-baseline.log 2>&1 &
          echo $! >/tmp/sky-raid-v30-baseline.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          SKY_RAID_PERF_LABEL=baseline SKY_RAID_PERF_PORT=4173 node scripts/webgl-sky-raid-v30-perf.mjs
          kill $(cat /tmp/sky-raid-v30-baseline.pid) || true

      - name: Apply V30 product optimization
        run: |
          node .github/sky-raid-v30-performance.mjs
          node .github/sky-raid-v30-contract-fix.mjs
          git diff --check

      - name: Validate optimized product
        run: |
          npm run test:fast
          npm run check:arcade
          npm run lint
          npm run build:pages

      - name: Profile and playcheck optimized product
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory out >/tmp/sky-raid-v30-optimized.log 2>&1 &
          echo $! >/tmp/sky-raid-v30-optimized.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          SKY_RAID_PERF_LABEL=optimized SKY_RAID_PERF_PORT=4174 SKY_RAID_PERF_CHECKPOINTS=1 node scripts/webgl-sky-raid-v30-perf.mjs
          kill $(cat /tmp/sky-raid-v30-optimized.pid) || true

      - name: Compare baseline and optimized frame cost
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('artifacts/sky-raid-v30-performance/baseline.json', 'utf8'));
          const opt = JSON.parse(fs.readFileSync('artifacts/sky-raid-v30-performance/optimized.json', 'utf8'));
          const b = base.median;
          const o = opt.median;
          const taskGain = b.taskMsPerSecond > 0 ? (b.taskMsPerSecond - o.taskMsPerSecond) / b.taskMsPerSecond : 0;
          const fpsGain = b.fps > 0 ? (o.fps - b.fps) / b.fps : 0;
          const frameGain = b.meanFrameMs > 0 ? (b.meanFrameMs - o.meanFrameMs) / b.meanFrameMs : 0;
          const comparison = { baseline: b, optimized: o, taskGain, fpsGain, frameGain };
          fs.writeFileSync('artifacts/sky-raid-v30-performance/comparison.json', JSON.stringify(comparison, null, 2));
          console.log('SKY RAID V30 PERF COMPARISON', JSON.stringify(comparison));
          if (o.fps < b.fps * 0.94) throw new Error('optimized FPS regressed more than 6%');
          if (o.meanFrameMs > b.meanFrameMs * 1.06) throw new Error('optimized frame time regressed more than 6%');
          if (taskGain < 0.03 && frameGain < 0.02 && fpsGain < 0.02) throw new Error('no measurable performance improvement');
          NODE

      - name: Restore audit-only clock
        if: always()
        run: git restore src/cart/CartRoguePhase67TurboHunt.ts

      - name: Upload V30 comparison and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-raid-v30-performance-audit
          path: artifacts/sky-raid-v30-performance
          if-no-files-found: warn
          retention-days: 7

      - name: Commit product and remove one-shot harnesses
        if: success()
        run: |
          rm -f .github/workflows/sky-raid-v30-performance-once.yml
          rm -f .github/workflows/sky-raid-v30-performance-retry.yml
          rm -f .github/sky-raid-v30-performance.mjs
          rm -f .github/sky-raid-v30-contract-fix.mjs
          rm -f scripts/webgl-sky-raid-v30-perf.mjs
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/SkyDancerSkyRaid.ts src/sky/SkyDancerSkyRaidArcadeWorld.ts .github scripts
          git diff --cached --check
          git commit -m "Optimize SKY RAID render hot path"
          git push origin HEAD:main
