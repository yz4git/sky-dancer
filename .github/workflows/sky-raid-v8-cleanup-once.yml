name: SKY RAID V8 cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sky-raid-v8-cleanup-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Remove final stale SKY RAID presentation owners
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Suppress V25 reference-world scenery in both SKY RAID ownership guards.
          p = Path('src/sky/SkyDancerSkyRaidArcadeWorld.ts')
          s = p.read_text()
          old = '''const LEGACY_ENV_PREFIXES = [\n  "sky-dancer-v23-",\n  "sky-dancer-v28-",'''
          new = '''const LEGACY_ENV_PREFIXES = [\n  "sky-dancer-v23-",\n  "sky-dancer-v25-",\n  "sky-dancer-v28-",'''
          if old not in s:
              raise SystemExit('ArcadeWorld prefix marker missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/sky/SkyDancerSkyRaidPresentationGuard.ts')
          s = p.read_text()
          old = '''const LEGACY_ENV_PREFIXES = [\n  "sky-dancer-v23-", "sky-dancer-v28-",'''
          new = '''const LEGACY_ENV_PREFIXES = [\n  "sky-dancer-v23-", "sky-dancer-v25-", "sky-dancer-v28-",'''
          if old not in s:
              raise SystemExit('PresentationGuard prefix marker missing')
          p.write_text(s.replace(old, new, 1))

          # Phase102 cut-in DOM must be truly hidden in SKY RAID, not merely translated offscreen.
          p = Path('src/cart/CartRoguePhase102AnimeCutin.ts')
          s = p.read_text()
          old = '''function hidePresenter(): void {\n  if (!presenter) return;\n  presenter.root.dataset.visible = "false";\n  presenter.currentSerial = -1;\n}\n\nfunction syncPresenter(): void {\n  if (typeof window === "undefined") return;\n  if (isSkyRaidPresentationMode()) {\n    hidePresenter();\n    return;\n  }\n'''
          new = '''function hidePresenter(): void {\n  if (!presenter) return;\n  presenter.root.dataset.visible = "false";\n  if (isSkyRaidPresentationMode()) {\n    presenter.root.hidden = true;\n    presenter.root.setAttribute("aria-hidden", "true");\n  }\n  presenter.currentSerial = -1;\n}\n\nfunction syncPresenter(): void {\n  if (typeof window === "undefined") return;\n  if (isSkyRaidPresentationMode()) {\n    const staleRoot = typeof document !== "undefined" ? document.getElementById(CUTIN_ROOT_ID) : null;\n    if (staleRoot instanceof HTMLDivElement) {\n      staleRoot.hidden = true;\n      staleRoot.setAttribute("aria-hidden", "true");\n    }\n    hidePresenter();\n    return;\n  }\n'''
          if old not in s:
              raise SystemExit('Phase102 hide/sync marker missing')
          s = s.replace(old, new, 1)
          old = '''  const view = ensurePresenter();\n  if (!view || view.currentSerial === active.serial) return;\n  const character = CART_CUTIN_CHARACTERS[active.characterId];\n'''
          new = '''  const view = ensurePresenter();\n  if (!view) return;\n  view.root.hidden = false;\n  view.root.removeAttribute("aria-hidden");\n  if (view.currentSerial === active.serial) return;\n  const character = CART_CUTIN_CHARACTERS[active.characterId];\n'''
          if old not in s:
              raise SystemExit('Phase102 active presenter marker missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify cleanup wiring
        run: |
          grep -n 'sky-dancer-v25-' src/sky/SkyDancerSkyRaidArcadeWorld.ts src/sky/SkyDancerSkyRaidPresentationGuard.ts
          grep -n 'staleRoot.hidden = true' src/cart/CartRoguePhase102AnimeCutin.ts
          grep -n 'view.root.hidden = false' src/cart/CartRoguePhase102AnimeCutin.ts
      - name: Regression checks
        run: |
          npm run test:fast
          npm run lint
          npm run build:pages
      - name: Commit V8 cleanup and remove one-shot workflow
        run: |
          git config user.name 'yz4git'
          git config user.email '65384484+yz4git@users.noreply.github.com'
          git add src/sky/SkyDancerSkyRaidArcadeWorld.ts src/sky/SkyDancerSkyRaidPresentationGuard.ts src/cart/CartRoguePhase102AnimeCutin.ts
          git commit -m 'Remove final stale SKY RAID presentation owners'
          git rm .github/workflows/sky-raid-v8-cleanup-once.yml
          git commit -m 'Remove SKY RAID V8 cleanup one-shot workflow'
          git push origin HEAD:main
