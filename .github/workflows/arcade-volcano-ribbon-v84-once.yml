name: Arcade Volcano Ribbon V8.4 Once

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/apply-volcano-ribbon-v84.py"
      - ".github/workflows/arcade-volcano-ribbon-v84-once.yml"

permissions:
  contents: write

concurrency:
  group: arcade-volcano-ribbon-v84-once
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply V8.4 volcano ribbon
        run: python3 scripts/apply-volcano-ribbon-v84.py
      - name: Rules regression
        run: npm run test:rules
      - name: Lint
        run: npm run lint
      - name: Pages production build
        run: npm run build:pages
      - name: Commit V8.4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f scripts/apply-volcano-ribbon-v84.py .github/workflows/arcade-volcano-ribbon-v84-once.yml
          git commit -m "Arcade Run V8.4: continuous volcano crater ribbon"
          git push origin HEAD:main
