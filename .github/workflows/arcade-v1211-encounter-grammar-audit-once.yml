name: Arcade V12.1.1 Encounter Grammar WebGL Audit
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Inject deterministic V12.1.1 audit bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/sky/arcade/SkyDancerArcadeWebGLDemo.ts')
          s=p.read_text()
          needle='    this.runtime = new SkyDancerArcadeRuntime(options);\n'
          if needle not in s: raise SystemExit('bridge hook missing')
          p.write_text(s.replace(needle,needle+'    Object.assign(window, { __skyDancerV1211AuditDemo: this });\n',1))
          PY
      - name: Build audit target
        run: npm run build:pages
      - name: Start audit target
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/v1211-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v1211-http.log
          exit 1
      - name: Run fixed-clock V12.1.1 WebGL audit
        env:
          SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/webgl-arcade-v1211-encounter-grammar-audit.mjs
      - name: Upload V12.1.1 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-dancer-v1211-encounter-grammar-${{ github.sha }}
          path: artifacts/v1211-encounter-grammar
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup V12.1.1 audit files
        if: always()
        run: |
          git restore src/sky/arcade/SkyDancerArcadeWebGLDemo.ts || true
          rm -rf .audit-runtime artifacts/v1211-encounter-grammar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/webgl-arcade-v1211-encounter-grammar-audit.mjs .github/workflows/arcade-v1211-encounter-grammar-audit-once.yml
          git commit -m 'Remove V12.1.1 Encounter Grammar audit files'
          git push origin HEAD:main
