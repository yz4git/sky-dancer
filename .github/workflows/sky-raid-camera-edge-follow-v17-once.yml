name: SKY RAID final-camera edge-follow V18 audit
# Re-run after authoritative V19 kill feedback fix; final visual review gate.

on:
  push:
    paths:
      - .github/workflows/sky-raid-camera-edge-follow-v17-once.yml
      - app/SkyDancerArcadeVirtualPad.tsx
      - app/SkyDancerArcadeVirtualPad.module.css
      - app/SkyDancerHudV45.tsx
      - app/SkyDancerSkyRaidOverlay.tsx
      - src/cart/CartRoguePhase67TurboHunt.ts
      - src/sky/SkyDancerAirCombatFxV18.ts
      - src/sky/SkyDancerEnemyPopulation.ts
      - src/sky/SkyDancerPlayerWeapons.ts
      - src/sky/SkyDancerWeaponBridge.ts
      - src/sky/SkyDancerSkyRaid.ts
      - src/sky/SkyDancerSkyRaidArcadeWorld.ts
      - src/sky/SkyDancerSkyRaidFlight.ts
      - src/sky/SkyDancerVerticalFlightV43.ts
      - src/sky/presentation/SkyDancerCameraPresentation.ts
      - scripts/webgl-sky-raid-camera-edge-v17.mjs
      - scripts/inject-sky-raid-v17-audit-hook.py

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regression checks
        run: |
          npm run test:fast
          npm run lint
      - name: Inject webdriver-only altitude edge hook
        run: python3 scripts/inject-sky-raid-v17-audit-hook.py
      - name: Build audited Pages artifact
        run: npm run build:pages
      - name: Browser setup
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime artifacts/sky-raid-v17
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/sky-raid-v18-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-raid-v18-http.log
          exit 1
      - name: Real browser altitude-edge playcheck
        run: node scripts/webgl-sky-raid-camera-edge-v17.mjs
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-raid-v18-final-camera-edge-follow
          path: artifacts/sky-raid-v17
          if-no-files-found: warn
          retention-days: 7
