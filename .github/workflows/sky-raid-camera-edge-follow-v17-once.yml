name: SKY RAID camera edge-follow V17 apply

on:
  push:
    paths:
      - .github/workflows/sky-raid-camera-edge-follow-v17-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply camera patch
        run: python3 scripts/sky-raid-camera-edge-follow-v17.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify
        run: |
          npm run test:fast
          npm run lint
          npm run build:pages
      - name: Commit verified camera follow
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/SkyDancerSkyRaid.ts tests/sky-sky-raid-reference-world.test.ts
          git commit -m "Keep SKY RAID aircraft framed at altitude limits"
          git push origin HEAD:main
