name: Arcade V11.4 Mastery Execute

on:
  push:
    branches:
      - main
    paths:
      - .github/v114-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply V11.4 mastery loop
        run: python .github/v114_apply.py
      - name: Make mastery state lint-safe
        run: node scripts/v114-lint-fix.mjs
      - name: Regression tests
        run: npm run test:rules
      - name: Arcade checks
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Production Pages build
        run: npm run build:pages
      - name: Commit product and clean one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeV11Scoring.ts app/CartGameMenu.tsx app/CartGameMenuModes.module.css app/SkyDancerArcadeMode.tsx app/SkyDancerArcadeProduct.module.css tests/sky-arcade-run.test.ts
          git rm -f .github/v114_apply.py .github/v114-trigger.txt scripts/v114-lint-fix.mjs .github/workflows/arcade-v114-execute.yml .github/workflows/arcade-v114-execute-v2.yml .github/workflows/arcade-v114-mastery-loop-once.yml
          git commit -m "Arcade Run V11.4: close the stage mastery loop"
          git push origin HEAD:main
