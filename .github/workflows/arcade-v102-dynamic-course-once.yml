name: Arcade V10.2 Dynamic Course Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/arcade-v102-dynamic-course-once.yml"

permissions:
  contents: write

env:
  SKY_DANCER_V102_REVISION: "2"

jobs:
  evolve-course:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply V10.2 dynamic course pass
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Add authored chicanes / climbs before the boss arena and raise turn limits.
          p=Path('src/sky/arcade/SkyDancerArcadeCoursePath.ts')
          s=p.read_text()
          anchor='''const clamp = (value: number, min: number, max: number) => Math.max(min, Math.min(max, value));\n\nfunction courseCenter'''
          insert='''const clamp = (value: number, min: number, max: number) => Math.max(min, Math.min(max, value));\n\nfunction smoothStep(edge0: number, edge1: number, value: number): number {\n  if (edge0 === edge1) return value < edge0 ? 0 : 1;\n  const t = clamp((value - edge0) / (edge1 - edge0), 0, 1);\n  return t * t * (3 - 2 * t);\n}\n\nfunction routeShift(progress: number, center: number, width: number): number {\n  return smoothStep(center - width, center + width, progress);\n}\n\n/**\n * V10.2: authored lane transfers create real S-turns instead of one broad sinusoid.\n * They return to the baseline before the boss arena so the climax remains readable.\n */\nfunction dynamicCourseDrama(stage: SkyDancerArcadeStageDefinition, progress: number): { x: number; y: number } {\n  const u = clamp(progress, 0, 1);\n  const direction = stage.order % 2 === 0 ? -1 : 1;\n  const lateral = 13.5 + stage.curveStrength * 24 + Math.min(6.5, stage.act * .9);\n  const vertical = 6 + stage.curveStrength * 10 + stage.turbulence * 8;\n  const first = routeShift(u, .102, .03);\n  const second = routeShift(u, .225, .034);\n  const third = routeShift(u, .355, .032);\n  const fourth = routeShift(u, .495, .036);\n  const x = direction * lateral * (first - 2 * second + 2 * third - fourth);\n  const dive = routeShift(u, .145, .034);\n  const recover = routeShift(u, .275, .038);\n  const climb = routeShift(u, .405, .034);\n  const settle = routeShift(u, .525, .035);\n  const y = vertical * (-dive + 1.72 * recover - 1.32 * climb + .6 * settle);\n  return { x, y };\n}\n\nfunction courseCenter'''
          assert anchor in s
          s=s.replace(anchor,insert,1)
          old='''  const authoredU = clamp(u, 0, 1);\n'''
          new='''  const authoredU = clamp(u, 0, 1);\n  const drama = dynamicCourseDrama(stage, authoredU);\n  x += drama.x;\n  y += drama.y;\n'''
          assert old in s
          s=s.replace(old,new,1)
          old_limits='''function limitsFor(stage: SkyDancerArcadeStageDefinition) {\n  switch (stage.biome) {\n    case "canyon": return { yaw: 0.48, pitch: 0.24, bank: 1.48 };\n    case "ice": return { yaw: 0.43, pitch: 0.33, bank: 1.38 };\n    case "volcano": return { yaw: 0.45, pitch: 0.29, bank: 1.44 };\n    case "orbit": return { yaw: 0.39, pitch: 0.34, bank: 1.34 };\n    default: return { yaw: 0.34, pitch: 0.19, bank: 1.28 };\n  }\n}'''
          new_limits='''function limitsFor(stage: SkyDancerArcadeStageDefinition) {\n  switch (stage.biome) {\n    case "canyon": return { yaw: 0.58, pitch: 0.31, bank: 1.7 };\n    case "ice": return { yaw: 0.54, pitch: 0.4, bank: 1.6 };\n    case "volcano": return { yaw: 0.56, pitch: 0.36, bank: 1.66 };\n    case "orbit": return { yaw: 0.5, pitch: 0.42, bank: 1.54 };\n    case "night": return { yaw: 0.57, pitch: 0.3, bank: 1.68 };\n    case "storm": return { yaw: 0.55, pitch: 0.34, bank: 1.64 };\n    default: return { yaw: 0.46, pitch: 0.28, bank: 1.56 };\n  }\n}'''
          assert old_limits in s
          s=s.replace(old_limits,new_limits,1)
          old_bank='''    bank: clamp(-yaw * limits.bank, -0.46, 0.46),'''
          assert old_bank in s
          s=s.replace(old_bank,'''    bank: clamp(-yaw * limits.bank, -0.62, 0.62),''',1)
          p.write_text(s)

          # 2) Make the streamed world visibly roll/pitch with the spline. Ice ribs blend a wider
          # slope sample so a steep local step cannot make every guide rib appear parallel.
          p=Path('src/sky/arcade/SkyDancerArcadeReferenceWorld.ts')
          s=p.read_text()
          old='''      chunk.group.rotation.y=course.yaw*.94;\n      chunk.group.rotation.x=course.pitch*.72;\n      chunk.group.rotation.z=course.bank*.12;'''
          new='''      chunk.group.rotation.y=course.yaw*1.08;\n      chunk.group.rotation.x=course.pitch*.94;\n      chunk.group.rotation.z=course.bank*.38;'''
          assert old in s
          s=s.replace(old,new,1)
          old='''      cue.group.rotation.y=course.yaw*(cue.kind==="ice"?1.05:.98);\n      cue.group.rotation.x=course.pitch*(cue.kind==="ice"?2.15:.78);\n      cue.group.rotation.z=cue.kind==="orbit"\n        ? cue.phase+(distance+cue.depth)*.0068\n        : course.bank*(cue.kind==="ice"?.18:.08);'''
          new='''      const cueAhead=arcadeCourseRelativePose(this.stage,distance,cue.depth+24);\n      const cueSlope=Math.atan2(cueAhead.y-course.y,24);\n      cue.group.rotation.y=course.yaw*(cue.kind==="ice"?1.18:1.1);\n      cue.group.rotation.x=cue.kind==="ice" ? course.pitch*1.5+cueSlope*1.45 : course.pitch*1.02;\n      cue.group.rotation.z=cue.kind==="orbit"\n        ? cue.phase+(distance+cue.depth)*.0068+course.bank*.24\n        : course.bank*(cue.kind==="ice"?.34:.3);'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # 3) Strengthen aircraft attitude and chase-camera lag/parallax through bends.
          p=Path('src/sky/arcade/SkyDancerArcadeWebGLDemo.ts')
          s=p.read_text()
          old='''    const targetRoll = THREE.MathUtils.clamp(-vx * .3, -.48, .48) - snapshot.playerX * .06 + course.bank * .82 + this.playerDamageSign * this.playerDamageKick * .22;\n    const targetPitch = THREE.MathUtils.clamp(vy * .08, -.12, .12) + course.pitch * .46 + this.playerDamageKick * .12;'''
          new='''    const targetRoll = THREE.MathUtils.clamp(-vx * .3, -.48, .48) - snapshot.playerX * .06 + course.bank * 1.08 + this.playerDamageSign * this.playerDamageKick * .22;\n    const targetPitch = THREE.MathUtils.clamp(vy * .08, -.12, .12) + course.pitch * .66 + this.playerDamageKick * .12;'''
          assert old in s
          s=s.replace(old,new,1)
          old='''    const targetX = pose.x + shakeX - nearCourse.x * .018;\n    const targetY = pose.y + shakeY - nearCourse.y * (iceCourse ? 0 : .012);\n    this.camera.position.x += (targetX - this.camera.position.x) * Math.min(1, delta * 4.0);\n    this.camera.position.y += (targetY - this.camera.position.y) * Math.min(1, delta * 4.0);'''
          new='''    // V10.2: the camera trails the local spline while looking into the next turn.\n    // Opposing position lag plus stronger look-ahead creates cornering parallax instead of a centered straight tunnel.\n    const targetX = pose.x + shakeX - nearCourse.x * .052 - course.yaw * 1.65;\n    const targetY = pose.y + shakeY - nearCourse.y * (iceCourse ? .008 : .028) + course.pitch * .9;\n    this.camera.position.x += (targetX - this.camera.position.x) * Math.min(1, delta * 3.35);\n    this.camera.position.y += (targetY - this.camera.position.y) * Math.min(1, delta * 3.5);'''
          assert old in s
          s=s.replace(old,new,1)
          old='''    this.camera.lookAt(\n      pose.lookX + nearCourse.x * .055 + farCourse.x * .028,\n      pose.lookY + nearCourse.y * (iceCourse ? .006 : .07) + farCourse.y * (iceCourse ? 0 : .018),\n      pose.lookZ,\n    );\n    // Bank enough to sell the turn, but do not rotate the horizon so far that the bend disappears.\n    this.camera.rotateZ(pose.roll + course.bank * .32 + nearCourse.bank * .05);'''
          new='''    this.camera.lookAt(\n      pose.lookX + nearCourse.x * .14 + farCourse.x * .06 + course.yaw * 3.6,\n      pose.lookY + nearCourse.y * (iceCourse ? .018 : .105) + farCourse.y * (iceCourse ? .006 : .032) + course.pitch * 2.2,\n      pose.lookZ,\n    );\n    // Stronger horizon roll makes the corridor visibly bank while remaining below motion-sickness territory.\n    this.camera.rotateZ(pose.roll + course.bank * .56 + nearCourse.bank * .14);'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # 4) Regression coverage for the new course language.
          p=Path('tests/sky-arcade-reference.test.ts')
          s=p.read_text()
          imp='''import { arcadeCameraPose } from "../src/sky/arcade/SkyDancerArcadeCamera";'''
          assert imp in s
          s=s.replace(imp,imp+'\nimport { arcadeCoursePose, arcadeCourseRelativePose } from "../src/sky/arcade/SkyDancerArcadeCoursePath";',1)
          marker='''test("all eleven environments have bounded geometry and continuous streaming ownership", () => {'''
          test='''test("V10.2 flight courses contain visible chicanes, vertical beats and bank reversals before the boss", () => {\n  for (const stage of SKY_DANCER_ARCADE_STAGES) {\n    const length = stage.durationSeconds * stage.courseSpeed;\n    const samples = Array.from({ length: 64 }, (_, i) => arcadeCoursePose(stage, length * (i / 63) * .55));\n    const yawRange = Math.max(...samples.map(p => p.yaw)) - Math.min(...samples.map(p => p.yaw));\n    const bankRange = Math.max(...samples.map(p => p.bank)) - Math.min(...samples.map(p => p.bank));\n    const verticalRange = Math.max(...samples.map(p => p.y)) - Math.min(...samples.map(p => p.y));\n    const signs = samples.map(p => p.yaw).filter(value => Math.abs(value) >= .035).map(Math.sign);\n    const signChanges = signs.reduce((count, sign, i) => count + (i > 0 && sign !== signs[i - 1] ? 1 : 0), 0);\n    assert.ok(yawRange > .24, `${stage.id} yaw range ${yawRange} must read as a real turn`);\n    assert.ok(bankRange > .28, `${stage.id} bank range ${bankRange} must visibly reverse`);\n    assert.ok(verticalRange > 4.5, `${stage.id} vertical range ${verticalRange} must climb/dive`);\n    assert.ok(signChanges >= 2, `${stage.id} needs at least two heading reversals, got ${signChanges}`);\n    const ahead = arcadeCourseRelativePose(stage, length * .31, 120);\n    assert.ok(Math.abs(ahead.x) > 3 || Math.abs(ahead.y) > 3, `${stage.id} 120m look-ahead must leave the screen centre`);\n  }\n});\n\n'''
          assert marker in s
          s=s.replace(marker,test+marker,1)
          p.write_text(s)

          # 5) Supersede historical exact-coefficient source assertions with V10.2's stronger camera contract.
          p=Path('tests/sky-arcade-run.test.ts')
          s=p.read_text()
          replacements={
            '''assert.match(webglSource, /course\\.bank \\* \\.32 \\+ nearCourse\\.bank \\* \\.05/);''': '''assert.match(webglSource, /course\\.bank \\* \\.56 \\+ nearCourse\\.bank \\* \\.14/);''',
            '''assert.match(webgl, /nearCourse\\.x \\* \\.055 \\+ farCourse\\.x \\* \\.028/);''': '''assert.match(webgl, /nearCourse\\.x \\* \\.14 \\+ farCourse\\.x \\* \\.06 \\+ course\\.yaw \\* 3\\.6/);''',
            '''assert.match(webgl, /nearCourse\\.y \\* \\(iceCourse \\? \\.006 : \\.07\\)/);''': '''assert.match(webgl, /nearCourse\\.y \\* \\(iceCourse \\? \\.018 : \\.105\\)/);''',
            '''assert.match(webgl, /farCourse\\.y \\* \\(iceCourse \\? 0 : \\.018\\)/);''': '''assert.match(webgl, /farCourse\\.y \\* \\(iceCourse \\? \\.006 : \\.032\\) \\+ course\\.pitch \\* 2\\.2/);''',
          }
          for old,new in replacements.items():
            assert old in s, old
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Arcade rules regression
        run: npm run test:rules
      - name: Arcade typecheck
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Pages production build
        run: npm run build:pages
      - name: Commit V10.2 product changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/arcade-v102-dynamic-course-once.yml
          git add src/sky/arcade/SkyDancerArcadeCoursePath.ts src/sky/arcade/SkyDancerArcadeReferenceWorld.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts tests/sky-arcade-reference.test.ts tests/sky-arcade-run.test.ts
          git commit -m "Arcade Run V10.2: dynamic flight course choreography"
          git push
