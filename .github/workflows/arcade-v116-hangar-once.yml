name: Arcade V11.6 Hangar Loadout Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcade-v116-hangar-once.yml'
      - '.v116-hangar-trigger'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-24.04
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply V11.6 patch
        run: python3 .github/scripts/arcade_v116_hangar_patch.py
      - name: Rules regression
        run: npm run test:rules
      - name: Arcade contract
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Pages product build
        run: npm run build:pages
      - name: Commit product and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sky/arcade/SkyDancerArcadeProgress.ts src/sky/arcade/SkyDancerArcadeData.ts src/sky/arcade/SkyDancerArcadeRuntime.ts src/sky/arcade/SkyDancerArcadeReferenceAirframes.ts src/sky/arcade/SkyDancerArcadeModels.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts app/SkyDancerArcadeMode.tsx app/CartGameMenu.tsx app/CartGameMenuModes.module.css tests/sky-arcade-run.test.ts
          git commit -m 'Arcade Run V11.6: add hangar loadouts and paint selection'
          git push origin HEAD:main
          git rm -f --ignore-unmatch .github/workflows/arcade-v116-hangar-once.yml .github/scripts/arcade_v116_hangar_patch.py .v116-hangar-trigger
          git commit -m 'Remove V11.6 hangar work files'
          git push origin HEAD:main
