name: Arcade V10 Natural Playcheck Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/arcade-v10-natural-playcheck-once.yml"

permissions:
  contents: write

jobs:
  playcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Inject deterministic natural-play bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/sky/arcade/SkyDancerArcadeWebGLDemo.ts')
          s=p.read_text()
          old='''    this.lastFrame = performance.now();\n    this.animationFrame = requestAnimationFrame(this.frame);\n  }'''
          new='''    this.lastFrame = performance.now();\n    this.animationFrame = requestAnimationFrame(this.frame);\n    if (typeof window !== "undefined" && window.location.search.includes("naturalAudit=1")) {\n      cancelAnimationFrame(this.animationFrame);\n      this.animationFrame = 0;\n      (window as unknown as { __skyNaturalAudit?: (command: { frames?: number; x?: number; y?: number; fire?: boolean; lock?: boolean; turbo?: boolean }) => SkyDancerArcadeSnapshot }).__skyNaturalAudit = (command) => this.runNaturalAuditStep(command);\n    }\n  }'''
          assert old in s
          s=s.replace(old,new,1)
          anchor='''  private sync(snapshot: SkyDancerArcadeSnapshot, delta: number): void {'''
          method='''  private runNaturalAuditStep(command: { frames?: number; x?: number; y?: number; fire?: boolean; lock?: boolean; turbo?: boolean }): SkyDancerArcadeSnapshot {\n    this.runtime.setMove(command.x ?? 0, command.y ?? 0);\n    this.runtime.setFire(Boolean(command.fire));\n    this.runtime.setLock(Boolean(command.lock));\n    this.runtime.setTurbo(Boolean(command.turbo));\n    const frames = Math.max(1, Math.min(180, Math.floor(command.frames ?? 1)));\n    let snapshot = this.runtime.getSnapshot();\n    for (let index = 0; index < frames; index += 1) {\n      this.runtime.step(1 / 60);\n      snapshot = this.runtime.getSnapshot();\n      if (index % 6 === 5 || index === frames - 1) {\n        this.sync(snapshot, 1 / 60 * Math.min(6, index + 1));\n        this.previousSnapshot = snapshot;\n      }\n    }\n    this.cinematic.render(this.scene, this.camera, snapshot.turboActive, this.presentationFx);\n    this.onSnapshot(snapshot);\n    return snapshot;\n  }\n\n'''
          assert anchor in s
          s=s.replace(anchor,method+anchor,1)
          p.write_text(s)
          PY
      - name: Audit-only typecheck
        run: npm run check:arcade
      - name: Build Pages
        run: npm run build:pages
      - name: Start local Pages server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-v10-natural-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-v10-natural-http.log
          exit 1
      - name: Play V10 naturally and capture gameplay
        run: node scripts/webgl-arcade-v10-natural-playcheck.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-dancer-v10-natural-playcheck-${{ github.sha }}
          path: artifacts/arcade-v10-natural-playcheck
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary natural-play files
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/webgl-arcade-v10-natural-playcheck.mjs .github/workflows/arcade-v10-natural-playcheck-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove V10 natural playcheck files"
          git push
