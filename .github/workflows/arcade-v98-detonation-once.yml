name: Arcade V9.8 Detonation Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/arcade-v98-detonation-once.yml"

permissions:
  contents: write

concurrency:
  group: arcade-v98-detonation-once
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SKY_DANCER_V98_REVISION: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply V9.8 detonation hierarchy
        run: python3 scripts/apply-arcade-v98-detonation.py
      - name: Retire impact telemetry as transient presentation mail
        run: python3 scripts/fix-arcade-v98-impact-retirement.py
      - name: Arcade rules regression
        run: npm run test:rules
      - name: Arcade typecheck
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Pages production build
        run: npm run build:pages
      - name: Commit V9.8 product code and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeRuntime.ts src/sky/arcade/SkyDancerArcadeProductPresentation.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts tests/sky-arcade-reference.test.ts
          git rm .github/workflows/arcade-v98-detonation-once.yml scripts/apply-arcade-v98-detonation.py scripts/fix-arcade-v98-impact-retirement.py
          git commit -m "Arcade Run V9.8: detonation hierarchy and missile impact punch"
          git push origin HEAD:main
