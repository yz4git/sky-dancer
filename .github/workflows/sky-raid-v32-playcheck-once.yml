name: SKY RAID V32 Playcheck

on:
  push:
    paths:
      - ".github/workflows/sky-raid-v32-playcheck-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          rm -rf .audit-runtime artifacts/sky-raid-v32-playcheck
          mkdir -p .audit-runtime artifacts/sky-raid-v32-playcheck
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Inject audit clock only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/cart/CartRoguePhase67TurboHunt.ts')
          source = path.read_text()
          marker = 'function updateDirector(session: MutableHuntSession, state: TurboHuntState, delta: number): void {\n  state.elapsed += delta;'
          replacement = 'function updateDirector(session: MutableHuntSession, state: TurboHuntState, delta: number): void {\n  if (typeof window !== "undefined" && typeof navigator !== "undefined" && navigator.webdriver) {\n    const forcedElapsed = (window as unknown as { __skyRaidAuditElapsedSeconds?: unknown }).__skyRaidAuditElapsedSeconds;\n    if (typeof forcedElapsed === "number" && Number.isFinite(forcedElapsed)) state.elapsed = Math.max(0, forcedElapsed);\n  }\n  state.elapsed += delta;'
          if marker not in source:
              raise SystemExit('audit clock marker missing')
          path.write_text(source.replace(marker, replacement, 1))
          PY
      - name: Build
        run: npm run build:pages
      - name: Playcheck current product
        run: |
          python3 -m http.server 4176 --bind 127.0.0.1 --directory out >/tmp/v32-playcheck.log 2>&1 &
          echo $! >/tmp/v32-playcheck.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4176/ >/dev/null && break; sleep 1; done
          node scripts/webgl-sky-raid-v32-playcheck.mjs
          kill $(cat /tmp/v32-playcheck.pid) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-raid-v32-playcheck
          path: artifacts/sky-raid-v32-playcheck
          retention-days: 7
