name: Arcade V10.3.5 Background Motion Video Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arcade-v1035-background-motion-video-audit-once.yml"

permissions:
  contents: write

env:
  SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome

jobs:
  video-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version
          ffmpeg -version | head -n 1
      - name: Inject deterministic background-motion audit bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/SkyDancerArcadeMode.tsx');s=p.read_text()
          needle='''        demoRef.current = demo;\n      }'''
          insert='''        demoRef.current = demo;\n        const auditDemo = demo as SkyDancerArcadeWebGLDemo;\n        (globalThis as unknown as { __skyDancerV1035MotionAudit?: { begin: () => unknown; advance: (moveX: number, moveY: number, turbo: boolean, steps: number) => unknown } }).__skyDancerV1035MotionAudit = {\n          begin: () => {\n            const target = auditDemo as unknown as Record<string, any>;\n            cancelAnimationFrame(Number(target.animationFrame) || 0);\n            target.animationFrame = 0;\n            const runtime = target.runtime as Record<string, any>;\n            const stage = skyDancerArcadeStageById("dawn-city");\n            runtime.stage = stage; runtime.status = "running"; runtime.statusBeforePause = "running";\n            runtime.stageTime = stage.durationSeconds * .06; runtime.distance = runtime.stageTime * stage.courseSpeed; runtime.runTimeSeconds = runtime.stageTime;\n            runtime.playerHp = 100; runtime.playerX = 0; runtime.playerY = 0; runtime.enemies = []; runtime.projectiles = []; runtime.hazards = []; runtime.impactEvents = [];\n            runtime.setMove(0,0); runtime.setTurbo(false); runtime.setFire(false); runtime.setLock(false);\n            const snapshot = runtime.getSnapshot(); target.previousSnapshot = snapshot;\n            for (let i=0;i<12;i+=1) target.sync(snapshot,1/60);\n            target.camera.updateMatrixWorld(); target.cinematic.render(target.scene,target.camera,snapshot.turboActive,target.presentationFx); target.onSnapshot(snapshot);\n            return {stageId:stage.id,distance:snapshot.distance,playerX:snapshot.playerX,playerY:snapshot.playerY};\n          },\n          advance: (moveX,moveY,turbo,steps) => {\n            const target = auditDemo as unknown as Record<string, any>;\n            const runtime = target.runtime as Record<string, any>;\n            runtime.setMove(moveX,moveY); runtime.setTurbo(turbo); runtime.setFire(false); runtime.setLock(false);\n            let snapshot = runtime.getSnapshot();\n            for (let i=0;i<steps;i+=1) {\n              runtime.step(1/60);\n              runtime.enemies = []; runtime.projectiles = []; runtime.hazards = []; runtime.impactEvents = []; runtime.playerHp = 100;\n              snapshot = runtime.getSnapshot();\n              target.sync(snapshot,1/60); target.previousSnapshot = snapshot;\n            }\n            target.camera.updateMatrixWorld(); target.cinematic.render(target.scene,target.camera,snapshot.turboActive,target.presentationFx); target.onSnapshot(snapshot);\n            const root = target.scene.getObjectByName("arcade-course-environment");\n            const backdrop = target.scene.getObjectByName("arcade-product-backdrop");\n            const chunks = root ? root.children.filter((child:any)=>/^arcade-course-chunk-/.test(child.name)) : [];\n            const chunkState = chunks.map((chunk:any)=>[chunk.position.x,chunk.position.y,chunk.position.z,chunk.rotation.y,chunk.rotation.x,chunk.rotation.z]);\n            const bank = target.scene.getObjectByName("arcade-city-bank-ribbon-left") as any;\n            let bankMid:null|number[] = null;\n            if (bank) { const a=bank.geometry.getAttribute("position"); const i=Math.floor(a.count*.55); bankMid=[a.getX(i),a.getY(i),a.getZ(i)]; }\n            return {\n              stageId:snapshot.stage.id,distance:snapshot.distance,playerX:snapshot.playerX,playerY:snapshot.playerY,turbo:snapshot.turboActive,\n              camera:[target.camera.position.x,target.camera.position.y,target.camera.position.z,target.camera.rotation.x,target.camera.rotation.y,target.camera.rotation.z],\n              backdrop:backdrop?[backdrop.position.x,backdrop.position.y,backdrop.position.z,backdrop.rotation.x,backdrop.rotation.y,backdrop.rotation.z]:null,\n              chunkState,bankMid,\n            };\n          },\n        };\n      }'''
          assert needle in s,'WebGL demo attachment block changed';p.write_text(s.replace(needle,insert,1))
          PY
      - name: Audit bridge typecheck
        run: npm run check:arcade
      - name: Build Pages audit target
        run: npm run build:pages
      - name: Start local Pages target
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-dancer-v1035-motion-http.log 2>&1 &
          for i in {1..30}; do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/sky-dancer-v1035-motion-http.log; exit 1
      - name: Record current background motion video
        run: node scripts/webgl-arcade-v1035-background-motion-video-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-dancer-v1035-background-motion-video-${{ github.sha }}
          path: artifacts/arcade-v1035-background-motion-video
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary motion audit files
        if: success()
        run: |
          set -euo pipefail
          git checkout -- app/SkyDancerArcadeMode.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/webgl-arcade-v1035-background-motion-video-audit.mjs .github/workflows/arcade-v1035-background-motion-video-audit-once.yml
          git commit -m "Remove V10.3.5 background motion audit files"
          git push
