name: SKY RAID arcade graphics and flight controls

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sky-raid-arcade-flight-once.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add SKY RAID flight model
        run: |
          cat > src/sky/SkyDancerSkyRaidFlight.ts <<'EOF'
          export const SKY_RAID_MIN_ALTITUDE = -10;
          export const SKY_RAID_MAX_ALTITUDE = 28;
          export const SKY_RAID_MAX_BANK = 0.78;
          export const SKY_RAID_MAX_PITCH = 0.32;

          export interface SkyDancerSkyRaidFlightSnapshot {
            altitude: number;
            verticalSpeed: number;
            bank: number;
            pitch: number;
            turnRate: number;
          }

          function clamp(value: number, min: number, max: number): number {
            return Math.max(min, Math.min(max, value));
          }

          function damp(current: number, target: number, response: number, delta: number): number {
            return current + (target - current) * (1 - Math.exp(-Math.max(0, response) * Math.max(0, delta)));
          }

          export function skyRaidHeadingDelta(current: number, previous: number): number {
            let delta = current - previous;
            while (delta > Math.PI) delta -= Math.PI * 2;
            while (delta < -Math.PI) delta += Math.PI * 2;
            return delta;
          }

          export function skyRaidBankTarget(turnRate: number, steer: number): number {
            return clamp(-turnRate * 0.31 - steer * 0.12, -SKY_RAID_MAX_BANK, SKY_RAID_MAX_BANK);
          }

          export function skyRaidPitchTarget(verticalSpeed: number, verticalInput: number, maxVerticalSpeed: number): number {
            const velocityPitch = maxVerticalSpeed > 0 ? -(verticalSpeed / maxVerticalSpeed) * 0.25 : 0;
            return clamp(velocityPitch - verticalInput * 0.045, -SKY_RAID_MAX_PITCH, SKY_RAID_MAX_PITCH);
          }

          export class SkyDancerSkyRaidFlightController {
            private verticalInput = 0;
            private altitude = 0;
            private verticalSpeed = 0;
            private bank = 0;
            private pitch = 0;
            private previousHeading: number | null = null;

            setVerticalInput(value: number): void {
              this.verticalInput = clamp(value, -1, 1);
            }

            reset(): void {
              this.verticalInput = 0;
              this.altitude = 0;
              this.verticalSpeed = 0;
              this.bank = 0;
              this.pitch = 0;
              this.previousHeading = null;
            }

            step(delta: number, heading: number, steer: number, boost: boolean): SkyDancerSkyRaidFlightSnapshot {
              const dt = clamp(delta, 0, 0.05);
              const maxVerticalSpeed = boost ? 17.5 : 12.5;
              const targetVerticalSpeed = this.verticalInput * maxVerticalSpeed;
              this.verticalSpeed = damp(this.verticalSpeed, targetVerticalSpeed, this.verticalInput === 0 ? 4.0 : 6.2, dt);
              if (Math.abs(this.verticalInput) < 0.02) this.verticalSpeed *= Math.exp(-1.25 * dt);
              this.altitude = clamp(this.altitude + this.verticalSpeed * dt, SKY_RAID_MIN_ALTITUDE, SKY_RAID_MAX_ALTITUDE);
              if ((this.altitude <= SKY_RAID_MIN_ALTITUDE && this.verticalSpeed < 0) || (this.altitude >= SKY_RAID_MAX_ALTITUDE && this.verticalSpeed > 0)) this.verticalSpeed = 0;

              let turnRate = 0;
              if (this.previousHeading !== null && dt > 0.0001) {
                turnRate = clamp(skyRaidHeadingDelta(heading, this.previousHeading) / dt, -3.0, 3.0);
              }
              this.previousHeading = heading;
              const targetBank = skyRaidBankTarget(turnRate, steer);
              const bankResponse = Math.abs(targetBank) > Math.abs(this.bank) ? 7.8 : 4.2;
              this.bank = damp(this.bank, targetBank, bankResponse, dt);
              const targetPitch = skyRaidPitchTarget(this.verticalSpeed, this.verticalInput, maxVerticalSpeed);
              this.pitch = damp(this.pitch, targetPitch, 5.6, dt);

              return { altitude: this.altitude, verticalSpeed: this.verticalSpeed, bank: this.bank, pitch: this.pitch, turnRate };
            }
          }
          EOF
      - name: Add Arcade Run based free-flight world owner
        run: |
          cat > src/sky/SkyDancerSkyRaidArcadeWorld.ts <<'EOF'
          import * as THREE from "three";
          import {
            skyDancerArcadeStageById,
            type SkyDancerArcadeStageDefinition,
            type SkyDancerArcadeStageId,
          } from "./arcade/SkyDancerArcadeData";
          import {
            createArcadeCloudMaterial,
            createArcadeFacadeMaterial,
            createArcadeSky,
            referenceAtmosphere,
          } from "./arcade/SkyDancerArcadeReferenceMaterials";
          import type { SkyDancerSkyRaidAct } from "./SkyDancerSkyRaidRules";

          const GROUND_Y = -66.3;
          const RECENTER_DISTANCE = 230;

          function seeded(index: number, salt: number): number {
            const x = Math.sin(index * 91.731 + salt * 47.117) * 43758.5453;
            return x - Math.floor(x);
          }

          function disposeObject(object: THREE.Object3D): void {
            object.traverse((child) => {
              if (!(child instanceof THREE.Mesh) && !(child instanceof THREE.InstancedMesh) && !(child instanceof THREE.Line)) return;
              child.geometry?.dispose();
              const materials = Array.isArray(child.material) ? child.material : [child.material];
              materials.forEach((material) => material?.dispose());
            });
          }

          function basicMaterial(color: number, emissive = 0): THREE.MeshStandardMaterial {
            return new THREE.MeshStandardMaterial({
              color,
              roughness: 0.64,
              metalness: 0.22,
              flatShading: true,
              emissive: emissive || 0x000000,
              emissiveIntensity: emissive ? 0.38 : 0,
            });
          }

          function addCarrier(root: THREE.Group, stage: SkyDancerArcadeStageDefinition, x: number, y: number, z: number, scale = 1): void {
            const carrier = new THREE.Group();
            carrier.name = "sky-raid-arcade-carrier";
            const hull = new THREE.Mesh(new THREE.BoxGeometry(12 * scale, 4 * scale, 54 * scale), basicMaterial(stage.palette.primary));
            const deck = new THREE.Mesh(new THREE.BoxGeometry(38 * scale, 1.1 * scale, 18 * scale), basicMaterial(stage.palette.secondary));
            const tower = new THREE.Mesh(new THREE.BoxGeometry(5 * scale, 10 * scale, 8 * scale), basicMaterial(stage.palette.secondary, stage.palette.accent));
            const glow = new THREE.Mesh(new THREE.BoxGeometry(2 * scale, 1.2 * scale, 18 * scale), new THREE.MeshBasicMaterial({ color: stage.palette.accent, transparent: true, opacity: 0.62, depthWrite: false }));
            hull.position.y = 0;
            deck.position.set(0, 1.2 * scale, -3 * scale);
            tower.position.set(5 * scale, 6 * scale, 8 * scale);
            glow.position.set(-8 * scale, 2.2 * scale, -9 * scale);
            carrier.add(hull, deck, tower, glow);
            carrier.position.set(x, y, z);
            root.add(carrier);
          }

          function addCloudField(root: THREE.Group, stage: SkyDancerArcadeStageDefinition, count: number, storm = false): void {
            const geometry = new THREE.IcosahedronGeometry(1, 1);
            const material = createArcadeCloudMaterial(stage);
            const clouds = new THREE.InstancedMesh(geometry, material, count);
            const dummy = new THREE.Object3D();
            for (let index = 0; index < count; index += 1) {
              const angle = seeded(index, 2) * Math.PI * 2;
              const radius = 55 + seeded(index, 3) * 300;
              const size = 5 + seeded(index, 4) * (storm ? 15 : 11);
              const y = GROUND_Y + 32 + seeded(index, 5) * (storm ? 80 : 54);
              dummy.position.set(Math.sin(angle) * radius, y, Math.cos(angle) * radius);
              dummy.rotation.set(seeded(index, 6) * 0.2, seeded(index, 7) * Math.PI, seeded(index, 8) * 0.14);
              dummy.scale.set(size * (1.3 + seeded(index, 9) * 1.1), size * (0.35 + seeded(index, 10) * 0.38), size);
              dummy.updateMatrix();
              clouds.setMatrixAt(index, dummy.matrix);
            }
            clouds.instanceMatrix.needsUpdate = true;
            clouds.frustumCulled = false;
            clouds.name = "sky-raid-arcade-cloud-field";
            root.add(clouds);
          }

          function addCity(root: THREE.Group, stage: SkyDancerArcadeStageDefinition): void {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const buildings = new THREE.InstancedMesh(geometry, createArcadeFacadeMaterial(false), 84);
            const dummy = new THREE.Object3D();
            const color = new THREE.Color();
            for (let index = 0; index < 84; index += 1) {
              const angle = seeded(index, 20) * Math.PI * 2;
              const radius = 48 + seeded(index, 21) * 285;
              const height = 20 + seeded(index, 22) * 72;
              const width = 6 + seeded(index, 23) * 12;
              const depth = 6 + seeded(index, 24) * 14;
              dummy.position.set(Math.sin(angle) * radius, GROUND_Y + height * 0.5, Math.cos(angle) * radius);
              dummy.rotation.set(0, angle + seeded(index, 25) * 0.45, 0);
              dummy.scale.set(width, height, depth);
              dummy.updateMatrix();
              buildings.setMatrixAt(index, dummy.matrix);
              color.setHex(index % 5 === 0 ? stage.palette.secondary : stage.palette.primary).offsetHSL(0, 0, (seeded(index, 26) - 0.5) * 0.16);
              buildings.setColorAt(index, color);
            }
            buildings.instanceMatrix.needsUpdate = true;
            if (buildings.instanceColor) buildings.instanceColor.needsUpdate = true;
            buildings.name = "sky-raid-arcade-city-facades";
            buildings.frustumCulled = false;
            root.add(buildings);
            addCloudField(root, stage, 36);
          }

          function addCanyon(root: THREE.Group, stage: SkyDancerArcadeStageDefinition): void {
            const rocks = new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 7), basicMaterial(stage.palette.primary), 72);
            const dummy = new THREE.Object3D();
            const color = new THREE.Color();
            for (let index = 0; index < 72; index += 1) {
              const angle = seeded(index, 40) * Math.PI * 2;
              const radius = 70 + seeded(index, 41) * 285;
              const height = 28 + seeded(index, 42) * 72;
              const width = 10 + seeded(index, 43) * 24;
              dummy.position.set(Math.sin(angle) * radius, GROUND_Y + height * 0.5, Math.cos(angle) * radius);
              dummy.rotation.set(0, seeded(index, 44) * Math.PI, (seeded(index, 45) - 0.5) * 0.12);
              dummy.scale.set(width, height, width * (0.7 + seeded(index, 46) * 0.5));
              dummy.updateMatrix();
              rocks.setMatrixAt(index, dummy.matrix);
              color.setHex(index % 4 === 0 ? stage.palette.secondary : stage.palette.primary).offsetHSL(0, 0, (seeded(index, 47) - 0.5) * 0.18);
              rocks.setColorAt(index, color);
            }
            rocks.instanceMatrix.needsUpdate = true;
            if (rocks.instanceColor) rocks.instanceColor.needsUpdate = true;
            rocks.name = "sky-raid-arcade-canyon-masses";
            rocks.frustumCulled = false;
            root.add(rocks);
          }

          function addFleet(root: THREE.Group, stage: SkyDancerArcadeStageDefinition, storm: boolean): void {
            addCloudField(root, stage, storm ? 88 : 104, storm);
            addCarrier(root, stage, 0, -4, 105, storm ? 1.3 : 1.05);
            addCarrier(root, stage, -128, -18, -32, 0.66);
            addCarrier(root, stage, 142, 4, 38, 0.56);
            if (!storm) addCarrier(root, stage, 75, -22, -170, 0.48);
            if (storm) {
              const boltMaterial = new THREE.LineBasicMaterial({ color: stage.palette.accent, transparent: true, opacity: 0.82 });
              for (let index = 0; index < 8; index += 1) {
                const x = -180 + index * 52;
                const z = -125 + (index % 4) * 86;
                const points = [
                  new THREE.Vector3(x, 58, z),
                  new THREE.Vector3(x + 7, 34, z + 5),
                  new THREE.Vector3(x - 4, 12, z + 11),
                  new THREE.Vector3(x + 5, GROUND_Y + 18, z + 17),
                ];
                const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), boltMaterial.clone());
                line.name = "sky-raid-arcade-lightning";
                root.add(line);
              }
            }
          }

          function addCitadel(root: THREE.Group, stage: SkyDancerArcadeStageDefinition): void {
            const spires = new THREE.InstancedMesh(new THREE.OctahedronGeometry(1, 0), basicMaterial(stage.palette.primary, stage.palette.accent), 54);
            const dummy = new THREE.Object3D();
            const color = new THREE.Color();
            for (let index = 0; index < 54; index += 1) {
              const angle = seeded(index, 70) * Math.PI * 2;
              const radius = 54 + seeded(index, 71) * 270;
              const height = 18 + seeded(index, 72) * 55;
              const width = 4 + seeded(index, 73) * 8;
              dummy.position.set(Math.sin(angle) * radius, GROUND_Y + height * 0.58, Math.cos(angle) * radius);
              dummy.rotation.set(0, angle, 0);
              dummy.scale.set(width, height, width);
              dummy.updateMatrix();
              spires.setMatrixAt(index, dummy.matrix);
              color.setHex(index % 3 === 0 ? stage.palette.secondary : stage.palette.primary);
              spires.setColorAt(index, color);
            }
            spires.instanceMatrix.needsUpdate = true;
            if (spires.instanceColor) spires.instanceColor.needsUpdate = true;
            spires.name = "sky-raid-arcade-prism-spires";
            spires.frustumCulled = false;
            root.add(spires);
            for (const radius of [54, 118, 198]) {
              const ring = new THREE.Mesh(new THREE.TorusGeometry(radius, 0.42, 6, 64), new THREE.MeshBasicMaterial({ color: stage.palette.accent, transparent: true, opacity: 0.34, depthWrite: false }));
              ring.rotation.x = Math.PI / 2;
              ring.position.y = GROUND_Y + 2.2;
              root.add(ring);
            }
          }

          export class SkyDancerSkyRaidArcadeWorld {
            private readonly root = new THREE.Group();
            private readonly stageRoot = new THREE.Group();
            private readonly keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
            private readonly fillLight = new THREE.HemisphereLight(0xcceeff, 0x172233, 0.85);
            private sky: THREE.Mesh | null = null;
            private stage: SkyDancerArcadeStageDefinition | null = null;
            private anchorX = Number.NaN;
            private anchorZ = Number.NaN;

            constructor(private readonly scene: THREE.Scene) {
              this.root.name = "sky-raid-arcade-run-world";
              this.stageRoot.name = "sky-raid-arcade-run-stage";
              this.keyLight.name = "sky-raid-arcade-key";
              this.fillLight.name = "sky-raid-arcade-fill";
              this.keyLight.position.set(-80, 120, -60);
              this.root.add(this.stageRoot, this.keyLight, this.fillLight);
              this.scene.add(this.root);
            }

            update(actId: SkyDancerSkyRaidAct["id"], x: number, z: number, altitude: number, elapsed: number): void {
              if (!this.stage || this.stage.id !== actId) this.setStage(actId);
              if (!Number.isFinite(this.anchorX) || Math.hypot(x - this.anchorX, z - this.anchorZ) > RECENTER_DISTANCE) {
                this.anchorX = x;
                this.anchorZ = z;
                this.root.position.set(x, 0, z);
              }
              if (this.sky) this.sky.position.set(x - this.anchorX, altitude * 0.35, z - this.anchorZ);
              if (!this.stage) return;
              const atmosphere = referenceAtmosphere(this.stage);
              if (this.scene.fog instanceof THREE.Fog) {
                this.scene.fog.color.copy(atmosphere.fog);
                this.scene.fog.near = this.stage.biome === "storm" ? 105 : 125;
                this.scene.fog.far = this.stage.biome === "cloud" ? 620 : 700;
              } else {
                this.scene.fog = new THREE.Fog(atmosphere.fog, 125, 700);
              }
              this.scene.background = atmosphere.horizon;
              this.keyLight.color.setHex(atmosphere.key);
              this.keyLight.intensity = atmosphere.keyIntensity;
              this.fillLight.color.copy(atmosphere.cloudLight);
              this.fillLight.groundColor.copy(atmosphere.cloudShadow);
              this.fillLight.intensity = atmosphere.ambient;
              this.stageRoot.traverse((object) => {
                if (object.name !== "sky-raid-arcade-lightning" || !(object instanceof THREE.Line)) return;
                const material = object.material as THREE.LineBasicMaterial;
                material.opacity = 0.18 + Math.pow(Math.max(0, Math.sin(elapsed * 9.3 + object.id)), 14) * 0.78;
              });
            }

            dispose(): void {
              disposeObject(this.root);
              this.root.removeFromParent();
            }

            private setStage(actId: SkyDancerSkyRaidAct["id"]): void {
              while (this.stageRoot.children.length > 0) {
                const child = this.stageRoot.children.pop();
                if (!child) break;
                disposeObject(child);
              }
              if (this.sky) {
                this.sky.removeFromParent();
                disposeObject(this.sky);
                this.sky = null;
              }
              this.stage = skyDancerArcadeStageById(actId as SkyDancerArcadeStageId);
              this.sky = createArcadeSky(this.stage);
              this.sky.name = "sky-raid-arcade-product-sky";
              this.root.add(this.sky);
              if (this.stage.biome === "city") addCity(this.stageRoot, this.stage);
              else if (this.stage.biome === "canyon") addCanyon(this.stageRoot, this.stage);
              else if (this.stage.biome === "cloud") addFleet(this.stageRoot, this.stage, false);
              else if (this.stage.biome === "storm") addFleet(this.stageRoot, this.stage, true);
              else addCitadel(this.stageRoot, this.stage);
              this.root.userData.skyRaidArcadeStage = this.stage.id;
            }
          }
          EOF
      - name: Wire controls, attitude and graphics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/cart/CartRogueDemo.ts')
          s = p.read_text()
          old = '  setSteering(value: number): void;\n  setBoost(active: boolean): void;'
          new = '  setSteering(value: number): void;\n  setVertical?(value: number): void;\n  setBoost(active: boolean): void;'
          if old not in s: raise SystemExit('CartRogueDemo interface marker missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('app/CartRogueGame.tsx')
          s = p.read_text()
          marker = 'import { SkyDancerWebGLDemo } from "../src/sky/SkyDancerWebGLDemo";\n'
          if marker not in s: raise SystemExit('CartRogueGame import marker missing')
          s = s.replace(marker, marker + 'import { normalizeArcadeStick } from "../src/sky/arcade/SkyDancerArcadeInput";\n', 1)
          s = s.replace('  const steerOriginRef = useRef(0);\n', '  const steerOriginRef = useRef(0);\n  const steerOriginYRef = useRef(0);\n', 1)
          old = '''    const sync = () => {\n      const left = keys.has("a") || keys.has("arrowleft");\n      const right = keys.has("d") || keys.has("arrowright");\n      demoRef.current?.setSteering(left === right ? 0 : left ? -1 : 1);\n      demoRef.current?.setBrake(keys.has("s") || keys.has("arrowdown"));\n      demoRef.current?.setBoost(keys.has(" ") || keys.has("shift"));\n    };'''
          new = '''    const sync = () => {\n      const left = keys.has("a") || keys.has("arrowleft");\n      const right = keys.has("d") || keys.has("arrowright");\n      const skyRaid = document.documentElement.dataset.skyDancerMode === "sky-raid";\n      demoRef.current?.setSteering(left === right ? 0 : left ? -1 : 1);\n      if (skyRaid) {\n        const climb = keys.has("w") || keys.has("arrowup");\n        const dive = keys.has("s") || keys.has("arrowdown");\n        demoRef.current?.setVertical?.(climb === dive ? 0 : climb ? 1 : -1);\n        demoRef.current?.setBrake(false);\n      } else {\n        demoRef.current?.setVertical?.(0);\n        demoRef.current?.setBrake(keys.has("s") || keys.has("arrowdown"));\n      }\n      demoRef.current?.setBoost(keys.has(" ") || keys.has("shift"));\n    };'''
          if old not in s: raise SystemExit('keyboard sync marker missing')
          s = s.replace(old, new, 1)
          s = s.replace('if (["ArrowLeft", "ArrowRight", "ArrowDown", " "].includes(event.key)) event.preventDefault();', 'if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(event.key)) event.preventDefault();', 1)
          old = '''    steerOriginRef.current = event.clientX;\n    event.currentTarget.setPointerCapture(event.pointerId);\n    demoRef.current?.setSteering(0);'''
          new = '''    steerOriginRef.current = event.clientX;\n    steerOriginYRef.current = event.clientY;\n    event.currentTarget.setPointerCapture(event.pointerId);\n    demoRef.current?.setSteering(0);\n    demoRef.current?.setVertical?.(0);'''
          if old not in s: raise SystemExit('start steer marker missing')
          s = s.replace(old, new, 1)
          old = '''    const steeringSensitivity = getCartRunModifiers().steeringSensitivity;\n    demoRef.current?.setSteering(Math.max(-1, Math.min(1, ((event.clientX - steerOriginRef.current) / 44) * steeringSensitivity)));'''
          new = '''    const steeringSensitivity = getCartRunModifiers().steeringSensitivity;\n    if (document.documentElement.dataset.skyDancerMode === "sky-raid") {\n      const stick = normalizeArcadeStick(event.clientX - steerOriginRef.current, event.clientY - steerOriginYRef.current, 58, 0.10);\n      demoRef.current?.setSteering(Math.max(-1, Math.min(1, stick.x * steeringSensitivity)));\n      demoRef.current?.setVertical?.(stick.y);\n    } else {\n      demoRef.current?.setSteering(Math.max(-1, Math.min(1, ((event.clientX - steerOriginRef.current) / 44) * steeringSensitivity)));\n    }'''
          if old not in s: raise SystemExit('move steer marker missing')
          s = s.replace(old, new, 1)
          s = s.replace('    demoRef.current?.setSteering(0);\n    if (event.currentTarget.hasPointerCapture(event.pointerId))', '    demoRef.current?.setSteering(0);\n    demoRef.current?.setVertical?.(0);\n    if (event.currentTarget.hasPointerCapture(event.pointerId))', 1)
          s = s.replace('<span>ARCADE TURN · BUILD ×{getCartRunModifiers().steeringSensitivity.toFixed(2)}</span>', '<span>{typeof document !== "undefined" && document.documentElement.dataset.skyDancerMode === "sky-raid" ? "FLIGHT STICK · TURN / CLIMB" : `ARCADE TURN · BUILD ×${getCartRunModifiers().steeringSensitivity.toFixed(2)}`}</span>', 1)
          p.write_text(s)

          p = Path('src/sky/SkyDancerTerrainContinuityV41.ts')
          s = p.read_text()
          old = '''    city: [0x3f6946, 0x718451],\n    mountains: [0x5b2f24, 0xb2673f],\n    clouds: [0xb9dce8, 0xf1f7f5],\n    storm: [0x1e2939, 0x46566a],\n    citadel: [0x241d3f, 0x685683],'''
          new = '''    city: [0x28485b, 0xf2b77a],\n    mountains: [0x6f2f2b, 0xd98245],\n    clouds: [0x6fafd0, 0xe8f4f8],\n    storm: [0x14364c, 0x778da2],\n    citadel: [0x17122f, 0xb69cf4],'''
          if old not in s: raise SystemExit('V41 palette marker missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/sky/SkyDancerSkyRaid.ts')
          s = p.read_text()
          marker = 'import type { RallyInputState } from "../rally/RallyTypes";\n'
          imports = '''import type { RallyInputState } from "../rally/RallyTypes";\nimport { SkyDancerSkyRaidFlightController, type SkyDancerSkyRaidFlightSnapshot } from "./SkyDancerSkyRaidFlight";\nimport { SkyDancerSkyRaidArcadeWorld } from "./SkyDancerSkyRaidArcadeWorld";\n'''
          if marker not in s: raise SystemExit('SkyRaid import marker missing')
          s = s.replace(marker, imports, 1)
          old = '''interface RaidWebGLDemo {\n  session: CartArenaSession;\n  scene: THREE.Scene;\n  buildWorld(): void;\n  updateVisuals(delta: number): void;\n}'''
          new = '''interface RaidWebGLDemo {\n  session: CartArenaSession;\n  scene: THREE.Scene;\n  camera: THREE.PerspectiveCamera;\n  playerVisual: THREE.Group;\n  steer: number;\n  buildWorld(): void;\n  updateVisuals(delta: number): void;\n  setVertical?(value: number): void;\n}'''
          if old not in s: raise SystemExit('RaidWebGLDemo marker missing')
          s = s.replace(old, new, 1)
          old = '''interface RaidVisualState {\n  root: THREE.Group;\n  actGroups: THREE.Group[];\n  speedFx: THREE.Group;\n  lastActIndex: number;\n  anchorX: number;\n  anchorZ: number;\n  anchorHeading: number;\n}'''
          new = '''interface RaidVisualState {\n  root: THREE.Group;\n  actGroups: THREE.Group[];\n  speedFx: THREE.Group;\n  arcadeWorld: SkyDancerSkyRaidArcadeWorld;\n  legacyLayers: THREE.Object3D[];\n  lastActIndex: number;\n  anchorX: number;\n  anchorZ: number;\n  anchorHeading: number;\n}'''
          if old not in s: raise SystemExit('RaidVisualState marker missing')
          s = s.replace(old, new, 1)
          s = s.replace('const raidVisualByDemo = new WeakMap<object, RaidVisualState>();\n', 'const raidVisualByDemo = new WeakMap<object, RaidVisualState>();\nconst raidFlightByDemo = new WeakMap<object, SkyDancerSkyRaidFlightController>();\n', 1)
          marker = '''function suppressTurboHuntBackdrop(scene: THREE.Scene): void {\n'''
          helper = '''function flightControllerFor(demo: RaidWebGLDemo): SkyDancerSkyRaidFlightController {\n  const key = demo as unknown as object;\n  const current = raidFlightByDemo.get(key);\n  if (current) return current;\n  const controller = new SkyDancerSkyRaidFlightController();\n  raidFlightByDemo.set(key, controller);\n  return controller;\n}\n\nconst LEGACY_SKY_RAID_GRAPHIC_PREFIXES = [\n  "sky-dancer-v35-",\n  "sky-dancer-v38-",\n  "sky-dancer-v47-",\n  "sky-dancer-v53-",\n] as const;\n\nfunction collectLegacyRaidLayers(scene: THREE.Scene): THREE.Object3D[] {\n  const layers: THREE.Object3D[] = [];\n  scene.traverse((object) => {\n    if (object.name === "sky-dancer-v50-color-script-sky" || LEGACY_SKY_RAID_GRAPHIC_PREFIXES.some((prefix) => object.name.startsWith(prefix))) layers.push(object);\n  });\n  return layers;\n}\n\nfunction applySkyRaidFlight(demo: RaidWebGLDemo, delta: number): SkyDancerSkyRaidFlightSnapshot {\n  const base = demo.session.snapshot();\n  const flight = flightControllerFor(demo).step(delta, base.heading, demo.steer, base.boostActive);\n  demo.playerVisual.position.y = 0.62 + flight.altitude;\n  demo.playerVisual.rotation.x = flight.pitch;\n  demo.playerVisual.rotation.z = flight.bank;\n  demo.camera.position.y += flight.altitude * 0.72;\n  demo.camera.rotation.z += flight.bank * 0.055;\n  demo.scene.userData.skyRaidPlayerAltitude = flight.altitude;\n  demo.scene.userData.skyRaidPlayerVerticalSpeed = flight.verticalSpeed;\n  demo.scene.userData.skyRaidPlayerBank = flight.bank;\n  return flight;\n}\n\nfunction suppressTurboHuntBackdrop(scene: THREE.Scene): void {\n'''
          if marker not in s: raise SystemExit('suppress marker missing')
          s = s.replace(marker, helper, 1)
          old = '''  const speedFx = buildSpeedFx();\n  speedFx.name = "sky-raid-speed-fx";\n  demo.scene.add(root, speedFx);\n  raidVisualByDemo.set(demo as unknown as object, {\n    root,\n    actGroups,\n    speedFx,\n    lastActIndex: -1,'''
          new = '''  const speedFx = buildSpeedFx();\n  speedFx.name = "sky-raid-speed-fx";\n  demo.scene.add(root, speedFx);\n  const arcadeWorld = new SkyDancerSkyRaidArcadeWorld(demo.scene);\n  const legacyLayers = collectLegacyRaidLayers(demo.scene);\n  root.visible = false;\n  raidVisualByDemo.set(demo as unknown as object, {\n    root,\n    actGroups,\n    speedFx,\n    arcadeWorld,\n    legacyLayers,\n    lastActIndex: -1,'''
          if old not in s: raise SystemExit('buildRaidVisuals marker missing')
          s = s.replace(old, new, 1)
          old = '''  visual.actGroups.forEach((group, index) => { group.visible = index === raid.actIndex; });\n  visual.root.visible = true;\n\n  const palette = raid.palette;\n  if (demo.scene.background instanceof THREE.Color) demo.scene.background.lerp(new THREE.Color(palette.sky), clamp(delta * 2.2, 0, 1));\n  if (demo.scene.fog) demo.scene.fog.color.lerp(new THREE.Color(palette.fog), clamp(delta * 2.2, 0, 1));\n\n  visual.speedFx.visible = base.boostActive || raid.rushActive;\n  visual.speedFx.position.set(base.x, 1.8, base.z);'''
          new = '''  visual.actGroups.forEach((group) => { group.visible = false; });\n  visual.root.visible = false;\n  visual.legacyLayers.forEach((layer) => { layer.visible = false; });\n  const flight = applySkyRaidFlight(demo, delta);\n  visual.arcadeWorld.update(raid.actId, base.x, base.z, flight.altitude, raid.elapsedSeconds);\n\n  visual.speedFx.visible = base.boostActive || raid.rushActive;\n  visual.speedFx.position.set(base.x, 1.8 + flight.altitude, base.z);'''
          if old not in s: raise SystemExit('updateRaidVisuals marker missing')
          s = s.replace(old, new, 1)
          old = '''  const webglPrototype = CartRogueWebGLDemo.prototype as unknown as RaidWebGLDemo;\n  const previousBuildWorld = webglPrototype.buildWorld;'''
          new = '''  const webglPrototype = CartRogueWebGLDemo.prototype as unknown as RaidWebGLDemo;\n  webglPrototype.setVertical = function skyRaidSetVertical(this: RaidWebGLDemo, value: number): void {\n    flightControllerFor(this).setVerticalInput(value);\n  };\n  const previousBuildWorld = webglPrototype.buildWorld;'''
          if old not in s: raise SystemExit('webgl prototype marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tests/sky-sky-raid.test.ts')
