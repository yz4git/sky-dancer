name: Sky Dancer All Stage Visual Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v4022-all-stage-visual-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version
      - name: Build Pages artifact
        run: npm run build:pages
      - name: Start production preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-dancer-v4022-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-dancer-v4022-http.log
          exit 1
      - name: Capture all eleven Arcade stages
        run: node scripts/webgl-all-stage-visual-audit.mjs
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-dancer-all-stage-visual-${{ github.sha }}
          path: artifacts/all-stage-visual
          if-no-files-found: error
          retention-days: 7
