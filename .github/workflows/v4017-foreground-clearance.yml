name: V40.17 Foreground Clearance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v4017-foreground-clearance.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply V40.17 foreground clearance
        run: python3 scripts/apply-v4017-foreground-clearance.py
      - name: Verify targeted Arcade Run paths
        run: |
          npm run check:arcade
          node --import tsx --test tests/sky-arcade-v4010-dynamic-occlusion.test.ts tests/sky-arcade-v4015-stage-readability.test.ts tests/sky-arcade-v4017-foreground-clearance.test.ts
      - name: Commit verified V40.17
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeV4017ForegroundClearance.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts tests/sky-arcade-v4017-foreground-clearance.test.ts
          git commit -m "Arcade Run V40.17: clear foreground sightlines"
          git push origin HEAD:main
