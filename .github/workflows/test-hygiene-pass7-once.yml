name: Test Hygiene Pass 7 Once

on:
  push:
    paths:
      - '.github/workflows/test-hygiene-pass7-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply final test source audit
        run: |
          node .github/test-hygiene-pass7.mjs
          git diff --check
      - name: Fast behavioral tests
        run: npm run test:fast
      - name: Pages build and render
        run: npm run test:pages
      - name: Arcade TypeScript check
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Validate artifact
        run: npm run validate:artifact
      - name: Commit verified cleanup
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git rm .github/test-hygiene-pass7.mjs .github/workflows/test-hygiene-pass7-once.yml
          git add tests
          git diff --cached --check
          git commit -m "Close test source-text allowlist"
          git push origin HEAD:main
