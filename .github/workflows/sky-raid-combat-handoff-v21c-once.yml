name: SKY RAID V21c combat handoff robust audit

on:
  push:
    paths:
      - .github/workflows/sky-raid-combat-handoff-v21c-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply reviewed SKY RAID pass
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path_name, old, new):
              path = Path(path_name)
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected 1 occurrence, found {count}: {old!r}")
              path.write_text(source.replace(old, new, 1))

          replace(
              "src/sky/SkyDancerSkyRaidRules.ts",
              "export const SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS = 104;\nexport const SKY_DANCER_SKY_RAID_TARGET_SECONDS = 120;",
              "export const SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS = 104;\nexport const SKY_DANCER_SKY_RAID_TARGET_SECONDS = 120;\n\n// Free-flight kills need enough time for a real bank/reacquire/lock handoff on phone.\n// Longer than the old 4.2 s timer, but still short enough to reward momentum.\nexport const SKY_DANCER_SKY_RAID_CHAIN_GRACE_SECONDS = 5.6;\n\n// The flagship card is an entrance cue, not a persistent combat overlay.\nexport const SKY_DANCER_SKY_RAID_BOSS_CUE_SECONDS = 2.4;\n\nexport function skyDancerSkyRaidBossCueActive(elapsedSeconds: number, bossForced: boolean): boolean {\n  if (!bossForced) return false;\n  const local = elapsedSeconds - SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS;\n  return local >= 0 && local < SKY_DANCER_SKY_RAID_BOSS_CUE_SECONDS;\n}",
          )
          replace(
              "src/sky/SkyDancerSkyRaid.ts",
              "  SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS,\n",
              "  SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS,\n  SKY_DANCER_SKY_RAID_CHAIN_GRACE_SECONDS,\n",
          )
          replace(
              "src/sky/SkyDancerSkyRaid.ts",
              "state.chainTimer = 4.2;",
              "state.chainTimer = SKY_DANCER_SKY_RAID_CHAIN_GRACE_SECONDS;",
          )
          replace(
              "app/SkyDancerSkyRaidOverlay.tsx",
              "} from \"../src/sky/SkyDancerSkyRaid\";",
              "} from \"../src/sky/SkyDancerSkyRaid\";\nimport { skyDancerSkyRaidBossCueActive } from \"../src/sky/SkyDancerSkyRaidRules\";",
          )
          replace(
              "app/SkyDancerSkyRaidOverlay.tsx",
              "const killCueVisible = snapshot.killCueSecondsRemaining > 0;",
              "const killCueVisible = snapshot.killCueSecondsRemaining > 0;\n  const bossCueVisible = skyDancerSkyRaidBossCueActive(snapshot.elapsedSeconds, snapshot.bossForced);",
          )
          replace(
              "app/SkyDancerSkyRaidOverlay.tsx",
              "snapshot.bossForced && !snapshot.clear",
              "bossCueVisible && !snapshot.clear",
          )
          replace(
              "app/SkyDancerHudV45.tsx",
              "const reticleScale = (decision?.vulnerable ? 1.06 : 1) + rangeEmphasis;",
              "const reticleScale = clamp((decision?.vulnerable ? 1.04 : 1) + rangeEmphasis, 1, 1.12);",
          )
          replace(
              "scripts/webgl-sky-raid-camera-edge-v17.mjs",
              "  await screenshot(\"02-lower-altitude-stop.png\");\n\n  // Force only the live warning presentation",
              "  await screenshot(\"02-lower-altitude-stop.png\");\n  // The dive check holds the real flight-stick pointer down. Release it before\n  // warning/Turbo isolation so later input audits cannot inherit pointer capture.\n  await page.mouse.up();\n\n  // Force only the live warning presentation",
          )
          replace(
              "scripts/webgl-sky-raid-camera-edge-v17.mjs",
              "  await screenshot(\"05-turbo-speed-polish.png\");\n  await page.keyboard.up(\"Space\");\n  await page.waitForTimeout(160);\n  const speedReleaseVisual = await page.evaluate(() => window.__skyRaidGetSpeedPolish?.() ?? null);\n  if (!speedReleaseVisual || speedReleaseVisual.turboHeld !== false || Number(speedReleaseVisual.turboReleaseFx ?? 0) < 0.45) {\n    throw new Error(`Turbo release speed tail is missing: ${JSON.stringify(speedReleaseVisual)}`);\n  }",
              "  await screenshot(\"05-turbo-speed-polish.png\");\n  await page.keyboard.up(\"Space\");\n  // Verify the authoritative input/model state first. The heavy SwiftShader\n  // scene can render fewer frames than wall-clock time suggests, so a fixed\n  // 160 ms delay can still expose the previous presentation snapshot.\n  await page.waitForFunction(\n    () => window.__skyDancerGetTurboState?.()?.held === false,\n    null,\n    { timeout: 3000, polling: 40 },\n  );\n  const turboReleaseState = await page.evaluate(() => window.__skyDancerGetTurboState?.() ?? null);\n  if (!turboReleaseState || Number(turboReleaseState.releaseSerial ?? 0) < 1) {\n    throw new Error(`Turbo release was not registered by the isolated model: ${JSON.stringify(turboReleaseState)}`);\n  }\n  await page.waitForFunction(\n    () => {\n      const visual = window.__skyRaidGetSpeedPolish?.();\n      return visual?.turboHeld === false && Number(visual?.turboReleaseFx ?? 0) >= 0.45;\n    },\n    null,\n    { timeout: 3000, polling: 40 },\n  );\n  const speedReleaseVisual = await page.evaluate(() => window.__skyRaidGetSpeedPolish?.() ?? null);\n  if (!speedReleaseVisual || speedReleaseVisual.turboHeld !== false || Number(speedReleaseVisual.turboReleaseFx ?? 0) < 0.45) {\n    throw new Error(`Turbo release speed tail is missing: ${JSON.stringify(speedReleaseVisual)}`);\n  }",
          )
          replace(
              "scripts/webgl-sky-raid-camera-edge-v17.mjs",
              "warningVisual, speedVisual, speedReleaseVisual, baseline, realClimb",
              "warningVisual, speedVisual, turboReleaseState, speedReleaseVisual, baseline, realClimb",
          )
          replace(
              "tests/sky-sky-raid.test.ts",
              "  SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS,\n",
              "  SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS,\n  SKY_DANCER_SKY_RAID_BOSS_CUE_SECONDS,\n  SKY_DANCER_SKY_RAID_CHAIN_GRACE_SECONDS,\n",
          )
          replace(
              "tests/sky-sky-raid.test.ts",
              "  skyDancerSkyRaidRushActive,\n",
              "  skyDancerSkyRaidRushActive,\n  skyDancerSkyRaidBossCueActive,\n",
          )
          marker = 'test("SKY RAID scoring rewards chain, Turbo and formation rush", () => {'
          added = '''test("SKY RAID free-flight chain window supports a bank, reacquire and relock handoff", () => {\n  assert.ok(SKY_DANCER_SKY_RAID_CHAIN_GRACE_SECONDS >= 5);\n  assert.ok(SKY_DANCER_SKY_RAID_CHAIN_GRACE_SECONDS < 7);\n  const raidSource = readFileSync(new URL("../src/sky/SkyDancerSkyRaid.ts", import.meta.url), "utf8");\n  assert.match(raidSource, /state\\.chainTimer = SKY_DANCER_SKY_RAID_CHAIN_GRACE_SECONDS/);\n});\n\ntest("SKY RAID flagship cue is a short entrance card instead of a persistent combat banner", () => {\n  const trigger = SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS;\n  assert.equal(skyDancerSkyRaidBossCueActive(trigger - 0.01, true), false);\n  assert.equal(skyDancerSkyRaidBossCueActive(trigger, true), true);\n  assert.equal(skyDancerSkyRaidBossCueActive(trigger + SKY_DANCER_SKY_RAID_BOSS_CUE_SECONDS - 0.01, true), true);\n  assert.equal(skyDancerSkyRaidBossCueActive(trigger + SKY_DANCER_SKY_RAID_BOSS_CUE_SECONDS, true), false);\n  assert.equal(skyDancerSkyRaidBossCueActive(trigger, false), false);\n  const overlaySource = readFileSync(new URL("../app/SkyDancerSkyRaidOverlay.tsx", import.meta.url), "utf8");\n  assert.match(overlaySource, /bossCueVisible = skyDancerSkyRaidBossCueActive/);\n  assert.match(overlaySource, /\\{bossCueVisible && !snapshot\\.clear && \\(/);\n  assert.doesNotMatch(overlaySource, /\\{snapshot\\.bossForced && !snapshot\\.clear && \\(/);\n});\n\ntest("SKY RAID phone target reticle keeps distant emphasis below the combat-lane clutter limit", () => {\n  const hudSource = readFileSync(new URL("../app/SkyDancerHudV45.tsx", import.meta.url), "utf8");\n  assert.match(hudSource, /const reticleScale = clamp\\(\\(decision\\?\\.vulnerable \\? 1\\.04 : 1\\) \\+ rangeEmphasis, 1, 1\\.12\\)/);\n});\n\n'''
          replace("tests/sky-sky-raid.test.ts", marker, added + marker)
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate product implementation
        run: |
          npm run test:fast
          npm run lint

      - name: Inject visual-audit-only hooks
        run: python3 scripts/inject-sky-raid-v17-audit-hook.py

      - name: Build Pages artifact
        run: npm run build:pages

      - name: Run real-browser WebGL playcheck
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime artifacts/sky-raid-v17
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/sky-raid-v21c-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node scripts/webgl-sky-raid-camera-edge-v17.mjs

      - name: Restore audit-only injections
        if: always()
        run: git restore src/sky/SkyDancerSkyRaidFlight.ts src/sky/SkyDancerCombatDecisionV45.ts src/sky/SkyDancerAirCombatFxV18.ts

      - name: Commit reviewed implementation
        run: |
          rm -f .github/workflows/sky-raid-combat-handoff-v21b-once.yml .github/workflows/sky-raid-combat-handoff-v21c-once.yml
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/SkyDancerSkyRaidRules.ts src/sky/SkyDancerSkyRaid.ts app/SkyDancerSkyRaidOverlay.tsx app/SkyDancerHudV45.tsx tests/sky-sky-raid.test.ts scripts/webgl-sky-raid-camera-edge-v17.mjs .github/workflows/sky-raid-combat-handoff-v21b-once.yml .github/workflows/sky-raid-combat-handoff-v21c-once.yml
          git diff --cached --check
          git commit -m "Polish SKY RAID combat handoff and targeting"
          git push origin HEAD:main

      - name: Upload audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-raid-v21c-combat-handoff-audit
          path: artifacts/sky-raid-v17
          if-no-files-found: warn
          retention-days: 7
