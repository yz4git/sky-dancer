name: Arcade V12.2 Encounter Continuity Once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply V12.2 continuity patch
        run: |
          python3 scripts/patch-arcade-v122-encounter-continuity.py
          python3 scripts/patch-arcade-v122-continuity-lane-fix.py
      - name: Capture V12.2 regression diagnostics
        id: regression
        shell: bash
        run: |
          set +e
          npm run test:rules 2>&1 | tee /tmp/v122-test.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload V12.2 diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: v122-regression-diagnostics
          path: |
            /tmp/v122-test.log
            src/sky/arcade/SkyDancerArcadeV122EncounterContinuity.ts
            src/sky/arcade/SkyDancerArcadeV122EncounterFlow.ts
            tests/sky-arcade-run.test.ts
          if-no-files-found: warn
      - name: Mark regression failure
        if: steps.regression.outputs.exit_code != '0'
        run: exit 1
