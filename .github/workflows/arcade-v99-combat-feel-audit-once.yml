name: Arcade V9.9 Combat Feel Audit Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/arcade-v99-combat-feel-audit-once.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Inject audit-only V9.9 combat bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/sky/arcade/SkyDancerArcadeWebGLDemo.ts')
          s=p.read_text()
          old='''    this.lastFrame = performance.now();\n    this.animationFrame = requestAnimationFrame(this.frame);\n  }'''
          new='''    this.lastFrame = performance.now();\n    this.animationFrame = requestAnimationFrame(this.frame);\n    if (typeof window !== "undefined" && window.location.search.includes("v99Audit=1")) {\n      (window as unknown as { __skyV99Audit?: (mode: string) => unknown }).__skyV99Audit = (mode: string) => this.runV99Audit(mode);\n    }\n  }'''
          assert old in s
          s=s.replace(old,new,1)
          anchor='''  private syncEffects(snapshot: SkyDancerArcadeSnapshot): void {'''
          method='''  private runV99Audit(mode: string): unknown {\n    const snapshot = this.runtime.getSnapshot();\n    const enemy = snapshot.enemies.slice().sort((a, b) => a.depth - b.depth)[0];\n    if (mode === "status") return { enemyCount: snapshot.enemies.length, enemy: enemy ? { id: enemy.id, depth: enemy.depth, kind: enemy.kind } : null };\n    if (!enemy) return { ok: false, reason: "no-enemy" };\n    const heavyCraft = enemy.kind === "bomber" || enemy.kind === "missile-boat";\n    if (mode === "gun" || mode === "missile") {\n      const missile = mode === "missile";\n      this.applyEnemyHitReaction({ serial: 9000 + (missile ? 2 : 1), enemyId: enemy.id, kind: enemy.kind, x: enemy.x, y: enemy.y, depth: enemy.depth, hpBefore: enemy.hp, hpAfter: Math.max(1, enemy.hp - 1), maxHp: enemy.maxHp, boss: enemy.boss, missile, destroyed: false }, snapshot, heavyCraft);\n      this.cameraImpactKick = Math.max(this.cameraImpactKick, missile ? .32 : .08);\n      return { ok: true, mode, enemyId: enemy.id, depth: enemy.depth, reaction: this.enemyHitReactions.get(enemy.id) };\n    }\n    if (mode === "debris") {\n      const group = this.enemyGroups.get(enemy.id);\n      const position = group?.position.clone() ?? new THREE.Vector3(0, 2, -24);\n      this.presentation.emitHeavyExplosion(position, true);\n      this.cameraImpactKick = Math.max(this.cameraImpactKick, .38);\n      return { ok: true, mode, enemyId: enemy.id, position: position.toArray() };\n    }\n    if (mode === "player") {\n      this.playerDamageKick = 1; this.playerDamageSign = -1; this.cameraImpactKick = Math.max(this.cameraImpactKick, .3); this.cameraShake = Math.min(.8, this.cameraShake + .4);\n      return { ok: true, mode };\n    }\n    return { ok: false, reason: "unknown-mode" };\n  }\n\n'''
          assert anchor in s
          s=s.replace(anchor,method+anchor,1)
          p.write_text(s)
          PY
      - name: Build Pages
        run: npm run build:pages
      - name: Start local Pages server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-v99-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-v99-http.log
          exit 1
      - name: Capture V9.9 combat feel
        run: node scripts/webgl-arcade-v99-combat-feel-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-dancer-v99-combat-feel-${{ github.sha }}
          path: artifacts/arcade-v99-combat-feel
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary audit files
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/webgl-arcade-v99-combat-feel-audit.mjs .github/workflows/arcade-v99-combat-feel-audit-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove V9.9 temporary combat feel audit files"
          git push
