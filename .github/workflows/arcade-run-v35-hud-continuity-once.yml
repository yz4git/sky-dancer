name: Arcade Run V35 HUD continuity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/arcade-run-v35-hud-continuity-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply V35 HUD continuity patch
        run: python3 scripts/arcade-run-v35-hud-continuity.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Arcade Run V35
        run: |
          npm run check:arcade
          node --import tsx --test tests/sky-arcade-v34-ui-microcontinuity.test.ts tests/sky-arcade-v35-hud-continuity.test.ts
          npm run test:fast
          npm run lint
          npm run build:pages
      - name: Commit verified V35 polish
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add app/SkyDancerArcadeMode.tsx app/SkyDancerArcadeMode.module.css
          git commit -m "Arcade Run V35: synchronize HUD continuity"
          git push origin HEAD:main
