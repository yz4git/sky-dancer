name: Arcade All Stage Visual Audit Once

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/webgl-arcade-all-stage-audit.mjs"
      - ".github/workflows/arcade-all-stage-audit-once.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - run: npm run build:pages
      - name: Serve production artifact
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-dancer-all-stage-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-dancer-all-stage-http.log
          exit 1
      - name: Capture every Arcade stage
        run: node scripts/webgl-arcade-all-stage-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-dancer-arcade-all-stage-${{ github.sha }}
          path: artifacts/arcade-all-stage-audit
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary audit harness
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/webgl-arcade-all-stage-audit.mjs .github/workflows/arcade-all-stage-audit-once.yml
          git commit -m "Remove temporary all-stage visual audit harness"
          git push origin HEAD:main
