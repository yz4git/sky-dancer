name: Sky Dancer Audit Tool Syntax

on:
  push:
    branches: [main]
    paths:
      - "scripts/webgl-*.mjs"
      - ".github/workflows/*audit*.yml"
      - ".github/workflows/webgl-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/webgl-*.mjs"
      - ".github/workflows/*audit*.yml"
      - ".github/workflows/webgl-smoke.yml"

permissions:
  contents: read

concurrency:
  group: sky-dancer-audit-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check audit script syntax without installing dependencies
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find scripts -maxdepth 1 -type f -name 'webgl-*.mjs' -print0)
