name: Arcade Run V40.12 Full Run Rhythm

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/arcade-run-v4012-run-rhythm-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply V40.12 full-run rhythm pass
        run: python3 scripts/arcade-run-v4012-run-rhythm.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Relevant V40.12 checks
        run: |
          npm run check:arcade
          node --import tsx --test \
            tests/sky-arcade-v35-hud-continuity.test.ts \
            tests/sky-arcade-v407-full-run-polish.test.ts \
            tests/sky-arcade-v408-cinematic-focus.test.ts \
            tests/sky-arcade-v409-phone-clarity.test.ts \
            tests/sky-arcade-v4010-dynamic-occlusion.test.ts \
            tests/sky-arcade-v4011-screen-stress.test.ts \
            tests/sky-arcade-v4012-run-rhythm.test.ts
      - name: Final verification before deployment
        run: |
          npm test
          npm run lint
          npm run validate:artifact
      - name: Commit verified V40.12 full-run rhythm pass
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add \
            app/SkyDancerArcadeMode.tsx \
            app/SkyDancerArcadeMode.module.css \
            src/sky/arcade/SkyDancerArcadeV4012RunRhythm.ts \
            src/sky/arcade/SkyDancerArcadeWebGLDemo.ts \
            src/sky/arcade/SkyDancerArcadeCanvasDemo.ts \
            tests/sky-arcade-v4012-run-rhythm.test.ts
          git commit -m "Arcade Run V40.12: separate full-run presentation peaks"
          git push origin HEAD:main
