name: Apply Arcade V24 Aircraft Behavior Once

on:
  push:
    branches: [arcade-run-v24-aircraft-behavior-20260908]
    paths:
      - ".github/apply-v24-aircraft-behavior.py"
      - ".github/workflows/apply-v24-aircraft-behavior-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arcade-run-v24-aircraft-behavior-20260908
      - name: Apply V24 aircraft behavior patch
        run: python3 .github/apply-v24-aircraft-behavior.py
      - name: Commit patched runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeRuntime.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts
          if git diff --cached --quiet; then
            echo "V24 patch already applied"
            exit 0
          fi
          git commit -m "Arcade Run V24: aircraft-like enemy steering"
          git push origin HEAD:arcade-run-v24-aircraft-behavior-20260908
