name: Apply Arcade Run wide combat V1 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Arcade Run wide combat V1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Expand arena, enemy movement and missile dodging
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); text=p.read_text()
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1))

          runtime='src/sky/arcade/SkyDancerArcadeRuntime.ts'
          rep(runtime,
