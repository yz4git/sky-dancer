name: SKY RAID V19 combat rhythm one-shot

on:
  push:
    paths:
      - .github/workflows/sky-raid-v19-combat-rhythm-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply V19 warning and formation pass
        run: |
          python3 .github/fix-skyraid-v19-patch.py
          python3 .github/skyraid-v19-patch.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate implementation
        run: |
          npm run test:fast
          npm run lint
      - name: Commit V19 pass
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/SkyDancerAirCombatFxV18.ts src/sky/SkyDancerSkyRaid.ts scripts/inject-sky-raid-v17-audit-hook.py scripts/webgl-sky-raid-camera-edge-v17.mjs tests/sky-sky-raid.test.ts
          git commit -m "Choreograph SKY RAID threat cues and attack waves"
          git push origin HEAD:main
