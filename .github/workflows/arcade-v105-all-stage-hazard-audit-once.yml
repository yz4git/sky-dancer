name: Arcade V10.5 All Stage Hazard Audit Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcade-v105-all-stage-hazard-audit-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version
      - name: Inject temporary V10.5 audit bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/sky/arcade/SkyDancerArcadeWebGLDemo.ts')
          s=p.read_text()
          needle='    this.runtime = new SkyDancerArcadeRuntime(options);\n'
          if needle not in s:
              raise SystemExit('runtime constructor hook not found')
          p.write_text(s.replace(needle, needle+'    Object.assign(window, { __skyDancerV105Demo: this });\n', 1))
          PY
      - name: Build audit target
        run: npm run build:pages
      - name: Start local Pages target
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-v105-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-v105-http.log
          exit 1
      - name: Audit all eleven stages
        env:
          SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/webgl-arcade-v105-all-stage-hazard-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-dancer-v105-all-stage-hazards-${{ github.sha }}
          path: artifacts/v105-all-stage-hazards
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup audit files from main
        if: always()
        shell: bash
        run: |
          git restore src/sky/arcade/SkyDancerArcadeWebGLDemo.ts || true
          rm -rf .audit-runtime artifacts/v105-all-stage-hazards
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/arcade-v105-all-stage-hazard-audit-once.yml scripts/webgl-arcade-v105-all-stage-hazard-audit.mjs
          git commit -m 'Remove V10.5 all-stage hazard audit files'
          git push origin HEAD:main
