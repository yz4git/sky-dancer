          docs = '''# SKY RAID\n\nSKY RAID is Sky Dancer's score-driven free-flight arcade run: mature Arcade Run scenery, full 360-degree control, escalating enemy doctrines, Formation Rush micro-objectives and a flagship finish.\n\n## Official run structure\n\nThe production target is **8 minutes 30 seconds**. The first two Acts breathe for two minutes each; the final three are 90-second escalation stages.\n\n| Act | Timeline | Objective | Combat identity |\n| --- | --- | ---: | --- |\n| DAWN CITY | 0:00–2:00 | 20 kills | Free approach / Gate Spear |\n| RED CANYON | 2:00–4:00 | 22 kills | Low-altitude knife run |\n| CLOUD FLEET | 4:00–5:30 | 18 kills | Warship breakthrough |\n| STORM CARRIER | 5:30–7:00 | 20 kills | Thunderhead intercept |\n| PRISM CITADEL | 7:00–8:30 | 20 kills | Titan siege |\n\nThe **PRISM TITAN enters at 7:30**, reserving roughly the final minute for the climax instead of compressing the boss into the last seconds.\n\n## ACT BREAK\n\nACT BREAK is earned immediately when the Act kill target is reached. There is no hidden minimum-time gate. The rest of that Act becomes FREE HUNT: keep the chain alive, attack Rush windows and build score. BREAK rewards score, fuel and a Turbo charge when capacity allows.\n\n## Formation Rush\n\nRush windows are explicit score attacks inside each Act. Kills score at ×2. Down **4 targets during one Rush** to secure PERFECT RUSH and an additional score bonus. The HUD shows live Rush progress and a result card; the run result tracks the number of PERFECT RUSH clears.\n\n## Chain fairness\n\nThe normal chain grace remains 5.6 seconds, but its timer only burns while at least one live combat target exists. Spawn/transition gaps no longer erase a chain that the player had no opportunity to continue.\n\n## Steering\n\nPhone steering preserves direct response around center and uses a soft outer compression curve. Full stick remains below the inherited controller's snap-turn region, while medium and full deflection still feel different instead of flattening into one hard-clamped value.\n\n## Scoring and result\n\nScore comes from kills, chain multiplier, Turbo, Rush ×2, ACT BREAK, PERFECT RUSH, orders and the final clear/time bonus. Results report **C / B / A / S / S+**, ACT BREAK count, PERFECT RUSH count, max chain and a locally persisted personal best.\n\nTop grades intentionally require more than raw score: S and S+ also require consistent BREAK, chain and Rush execution.\n\n## Mode ownership\n\nSKY RAID owns its flight control, enemy doctrine, world presentation, HUD hierarchy and progression. Campaign choreography and forced-scroll Arcade Run scaffolding must not leak into the mode. iPhone landscape remains the primary presentation target.\n'''
          Path('docs/SKY_RAID.md').write_text(docs)
