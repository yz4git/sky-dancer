name: Apply SKY RAID review pass

on:
  push:
    paths:
      - .github/workflows/apply-sky-raid-review-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Improve combat readability and impact feedback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          # 1) Move doctrine text away from the reticle and reduce center-screen UI weight.
          hud_path = Path('app/SkyDancerHudV45.tsx')
          hud = hud_path.read_text()
          old = '''  const lockX = clamp(reticleX, -18, 18);\n  const lockTopVh = clamp(43 + reticleY - 12, 27, 52);\n'''
          new = '''  const lockSide = reticleX >= 0 ? 1 : -1;\n  const lockX = clamp(reticleX + lockSide * 9.5, -28, 28);\n  const lockTopVh = clamp(43 + reticleY + 8.5, 37, 60);\n'''
          if old in hud:
              hud = hud.replace(old, new, 1)
          elif new not in hud:
              raise SystemExit('V45 lock placement anchor missing')
          replacements = {
              '        width: 50px;\n        height: 50px;': '        width: 42px;\n        height: 42px;',
              '        font: 950 18px/1 ui-monospace, SFMono-Regular, Menlo, monospace;': '        font: 950 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace;',
              '        padding: 3px 10px 4px;\n        color: #efffff;\n        border: 1px solid rgba(145,255,236,.86);\n        background: rgba(8,66,65,.58);\n        box-shadow: 0 0 22px rgba(94,255,222,.42);\n        font: 950 clamp(13px,2.2vw,20px)/1 system-ui,sans-serif;': '        padding: 0;\n        color: #efffff;\n        border: 0;\n        background: transparent;\n        box-shadow: none;\n        font: 950 clamp(9px,1.2vw,12px)/1 system-ui,sans-serif;',
              '        min-width: 118px;\n        max-width: min(38vw, 300px);\n        padding: 3px 8px 4px;': '        min-width: 98px;\n        max-width: min(31vw, 238px);\n        padding: 2px 7px 3px;',
              '        background: linear-gradient(90deg, transparent, rgba(4,31,45,.48) 16%, rgba(4,31,45,.54) 84%, transparent);': '        background: linear-gradient(90deg, transparent, rgba(4,31,45,.30) 16%, rgba(4,31,45,.38) 84%, transparent);',
              '        border-bottom: 1px solid rgba(180,235,247,.28);': '        border-bottom: 1px solid rgba(180,235,247,.20);',
              '        font: 900 clamp(7px,.82vw,9px)/1.05 system-ui,sans-serif;': '        font: 900 clamp(6.5px,.76vw,8.5px)/1.05 system-ui,sans-serif;',
              '        max-width: 34vw;': '        max-width: 27vw;',
              '        .skyDancerV45Lock { top: calc(42% + 41px); padding: 2px 7px 3px; }': '        .skyDancerV45Reticle { width: 38px; height: 38px; }\n        .skyDancerV45Lock { padding: 2px 6px; }',
          }
          for before, after in replacements.items():
              if before in hud:
                  hud = hud.replace(before, after, 1)
              elif after not in hud:
                  raise SystemExit(f'HUD replacement marker missing: {before[:44]}')
          hud_path.write_text(hud)

          overlay_path = Path('app/SkyDancerSkyRaidOverlay.tsx')
          overlay = overlay_path.read_text()
          overlay_replacements = {
              '        top: max(105px, calc(env(safe-area-inset-top) + 95px)) !important;': '        top: max(88px, calc(env(safe-area-inset-top) + 80px)) !important;',
              '        max-width: min(42vw, 340px) !important;': '        max-width: min(34vw, 250px) !important;',
              '        padding: 3px 9px !important;': '        padding: 2px 8px !important;',
              '        font-size: clamp(8px, .95vw, 10px) !important;': '        font-size: clamp(7px, .82vw, 9px) !important;',
              '          top: 103px !important;\n          max-width: min(40vw, 320px) !important;': '          top: 86px !important;\n          max-width: min(34vw, 250px) !important;',
          }
          for before, after in overlay_replacements.items():
              if before in overlay:
                  overlay = overlay.replace(before, after, 1)
              elif after not in overlay:
                  raise SystemExit(f'overlay marker missing: {before[:44]}')
          overlay_path.write_text(overlay)

          # 2) Add a SKY RAID-specific world-space kill burst at the actual 20-64m flight altitude.
          fx_path = Path('src/sky/SkyDancerAirCombatFxV18.ts')
          fx = fx_path.read_text()
          import_anchor = 'import type { SkyDancerFxRuntime } from "./SkyDancerAirCombatFxV2";\n'
          import_insert = import_anchor + 'import { getSkyDancerPlayerWeaponState } from "./SkyDancerPlayerWeapons";\nimport { getSkyDancerEnemyAltitudeMetersV43 } from "./SkyDancerVerticalFlightV43";\n'
          if 'getSkyDancerPlayerWeaponState' not in fx:
              if import_anchor not in fx:
                  raise SystemExit('V18 import anchor missing')
              fx = fx.replace(import_anchor, import_insert, 1)

          interface_anchor = '''interface VerticalState {\n  y: number;\n  verticalSpeed: number;\n  phase: number;\n}\n'''
          interface_insert = interface_anchor + textwrap.dedent('''

          interface RaidImpactBurst {
            root: THREE.Group;
            core: THREE.Mesh;
            hot: THREE.Mesh;
            rings: THREE.Mesh[];
            debris: THREE.Mesh[];
            light: THREE.PointLight;
            life: number;
            maxLife: number;
            strength: number;
            destroyed: boolean;
          }
          ''')
          if 'interface RaidImpactBurst' not in fx:
              if interface_anchor not in fx:
                  raise SystemExit('V18 impact interface anchor missing')
              fx = fx.replace(interface_anchor, interface_insert, 1)

          field_anchor = '  private readonly missileWarningRing: THREE.Mesh<THREE.TorusGeometry, THREE.MeshBasicMaterial>;\n  private builtV18 = false;\n'
          field_insert = '  private readonly missileWarningRing: THREE.Mesh<THREE.TorusGeometry, THREE.MeshBasicMaterial>;\n  private readonly raidImpactBursts: RaidImpactBurst[] = [];\n  private lastPlayerHitSerial = 0;\n  private builtV18 = false;\n'
          if 'raidImpactBursts' not in fx:
              if field_anchor not in fx:
                  raise SystemExit('V18 impact field anchor missing')
              fx = fx.replace(field_anchor, field_insert, 1)

          update_anchor = '    this.updateEnemyThreeDimensionalFlight(snapshot.enemies, snapshot, delta);\n    this.updateMissileWarning(missiles, delta);\n    this.publishFlightDebug(snapshot);\n'
          update_insert = '    this.updateEnemyThreeDimensionalFlight(snapshot.enemies, snapshot, delta);\n    this.updateMissileWarning(missiles, delta);\n    this.detectPlayerWeaponImpact();\n    this.updateRaidImpactBursts(delta);\n    this.publishFlightDebug(snapshot);\n'
          if 'this.detectPlayerWeaponImpact();' not in fx:
              if update_anchor not in fx:
                  raise SystemExit('V18 update anchor missing')
              fx = fx.replace(update_anchor, update_insert, 1)

          method_anchor = '  private publishFlightDebug(snapshot: CartArenaSessionSnapshot): void {\n'
          impact_methods = textwrap.dedent('''
            private detectPlayerWeaponImpact(): void {
              const weapon = getSkyDancerPlayerWeaponState(this.runtimeV18.session);
              if (weapon.hitSerial <= this.lastPlayerHitSerial) return;
              this.lastPlayerHitSerial = weapon.hitSerial;
              const enemy = weapon.lastHitEnemyId
                ? this.runtimeV18.session.enemies.find((candidate) => candidate.id === weapon.lastHitEnemyId) ?? null
                : null;
              const destroyed = Boolean(enemy && !enemy.alive);
              const altitude = enemy
                ? getSkyDancerEnemyAltitudeMetersV43(enemy)
                : Number(this.runtimeV18.scene.userData.skyRaidPlayerAltitude ?? 20);
              const point = new THREE.Vector3(weapon.lastHitX, 0.62 + altitude, weapon.lastHitZ);
              this.spawnRaidImpactBurst(point, destroyed);
              this.runtimeV18.emitImpactSparks(point, destroyed ? 56 : 30);
              this.runtimeV18.scene.userData.skyRaidImpactHitSerial = weapon.hitSerial;
              this.runtimeV18.scene.userData.skyRaidImpactBurstStrength = destroyed ? 1.35 : 0.82;
              if (typeof window !== "undefined" && typeof navigator !== "undefined" && navigator.webdriver) {
                (window as unknown as Record<string, unknown>).__skyRaidGetImpactPolish = () => ({
                  activeBursts: this.raidImpactBursts.length,
                  lastHitSerial: this.lastPlayerHitSerial,
                  lastStrength: Number(this.runtimeV18.scene.userData.skyRaidImpactBurstStrength ?? 0),
                });
              }
            }

            private spawnRaidImpactBurst(position: THREE.Vector3, destroyed: boolean): void {
              while (this.raidImpactBursts.length >= 4) this.disposeRaidImpactBurst(this.raidImpactBursts.shift()!);
              const root = new THREE.Group();
              root.name = destroyed ? "sky-raid-target-down-burst-v18" : "sky-raid-target-hit-burst-v18";
              root.position.copy(position);
              const strength = destroyed ? 1.35 : 0.82;
              const additive = (color: number, opacity: number) => new THREE.MeshBasicMaterial({
                color,
                transparent: true,
                opacity,
                blending: THREE.AdditiveBlending,
                depthTest: false,
                depthWrite: false,
                toneMapped: false,
              });
              const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.56, 1), additive(0xfff7d2, 1));
              core.renderOrder = 1150;
              root.add(core);
              const hot = new THREE.Mesh(new THREE.IcosahedronGeometry(0.94, 1), additive(destroyed ? 0xff7b2f : 0xffbf5b, 0.9));
              hot.renderOrder = 1149;
              root.add(hot);
              const rings: THREE.Mesh[] = [];
              for (let index = 0; index < 2; index += 1) {
                const ring = new THREE.Mesh(new THREE.TorusGeometry(1.02, 0.052, 5, 28), additive(index === 0 ? 0xffffff : 0xffa34d, 0.92));
                ring.rotation.set(index === 0 ? Math.PI / 2 : 0.52, index === 0 ? 0 : 0.62, index * 0.44);
                ring.renderOrder = 1151;
                rings.push(ring);
                root.add(ring);
              }
              const debris: THREE.Mesh[] = [];
              const debrisCount = destroyed ? 16 : 9;
              for (let index = 0; index < debrisCount; index += 1) {
                const piece = new THREE.Mesh(
                  new THREE.TetrahedronGeometry(0.11 + (index % 3) * 0.035, 0),
                  new THREE.MeshBasicMaterial({
                    color: index % 3 === 0 ? 0xffe0a3 : index % 3 === 1 ? 0xff7942 : 0x7f8994,
                    transparent: true,
                    opacity: 0.92,
                    depthWrite: false,
                    toneMapped: false,
                  }),
                );
                const angle = index / debrisCount * Math.PI * 2 + (index % 2) * 0.19;
                piece.userData.angle = angle;
                piece.userData.lift = -0.34 + (index % 5) * 0.21;
                piece.userData.twist = (index % 2 === 0 ? 1 : -1) * (2.8 + (index % 4) * 0.7);
                debris.push(piece);
                root.add(piece);
              }
              const light = new THREE.PointLight(destroyed ? 0xff8b46 : 0xffc768, destroyed ? 8.5 : 4.6, destroyed ? 22 : 12, 2);
              root.add(light);
              this.runtimeV18.scene.add(root);
              const maxLife = destroyed ? 0.88 : 0.44;
              this.raidImpactBursts.push({ root, core, hot, rings, debris, light, life: maxLife, maxLife, strength, destroyed });
            }

            private updateRaidImpactBursts(delta: number): void {
              for (let index = this.raidImpactBursts.length - 1; index >= 0; index -= 1) {
                const burst = this.raidImpactBursts[index];
                burst.life -= delta;
                const ratio = THREE.MathUtils.clamp(burst.life / burst.maxLife, 0, 1);
                const progress = 1 - ratio;
                // Hold the bright impact core for roughly the first 60-70 ms on a kill,
                // then let the shock ring and debris accelerate outward. This gives the
                // impact a hit-stop beat without freezing controls or the simulation.
                const visualProgress = progress < 0.08
                  ? progress * 0.22
                  : 0.0176 + ((progress - 0.08) / 0.92) * 0.9824;
                burst.core.scale.setScalar((0.62 + visualProgress * 3.0) * burst.strength);
                burst.hot.scale.setScalar((0.78 + visualProgress * 2.55) * burst.strength);
                (burst.core.material as THREE.MeshBasicMaterial).opacity = Math.min(1, ratio * 1.28);
                (burst.hot.material as THREE.MeshBasicMaterial).opacity = ratio * 0.82;
                burst.rings.forEach((ring, ringIndex) => {
                  ring.scale.setScalar((0.72 + visualProgress * (burst.destroyed ? 5.7 : 3.8)) * burst.strength);
                  ring.rotation.z += delta * (ringIndex === 0 ? 2.1 : -1.65);
                  (ring.material as THREE.MeshBasicMaterial).opacity = ratio * (ringIndex === 0 ? 0.78 : 0.55);
                });
                burst.debris.forEach((piece) => {
                  const angle = Number(piece.userData.angle ?? 0);
                  const distance = visualProgress * (burst.destroyed ? 8.2 : 4.6) * burst.strength;
                  piece.position.set(
                    Math.sin(angle) * distance,
                    Number(piece.userData.lift ?? 0) * distance + visualProgress * 0.7,
                    Math.cos(angle) * distance,
                  );
                  const twist = Number(piece.userData.twist ?? 0);
                  piece.rotation.x += delta * twist;
                  piece.rotation.z += delta * twist * 0.73;
                  (piece.material as THREE.MeshBasicMaterial).opacity = ratio * 0.88;
                });
                burst.light.intensity = ratio * ratio * (burst.destroyed ? 8.5 : 4.6);
                if (burst.life <= 0) {
                  this.disposeRaidImpactBurst(burst);
                  this.raidImpactBursts.splice(index, 1);
                }
              }
              this.runtimeV18.scene.userData.skyRaidImpactBurstCount = this.raidImpactBursts.length;
            }

            private disposeRaidImpactBurst(burst: RaidImpactBurst): void {
              this.runtimeV18.scene.remove(burst.root);
              burst.root.traverse((object) => {
                if (!(object instanceof THREE.Mesh)) return;
                object.geometry.dispose();
                const materials = Array.isArray(object.material) ? object.material : [object.material];
                materials.forEach((material) => material.dispose());
              });
            }

          ''')
          if 'private detectPlayerWeaponImpact()' not in fx:
              if method_anchor not in fx:
                  raise SystemExit('V18 impact method anchor missing')
              fx = fx.replace(method_anchor, impact_methods + method_anchor, 1)
          fx_path.write_text(fx)

          # 3) Strengthen the existing SKY RAID camera impact only for confirmed kills.
          raid_path = Path('src/sky/SkyDancerSkyRaid.ts')
          raid = raid_path.read_text()
          camera_old = '''  if (weapon.hitSerial > cameraFx.lastHitSerial) {\n    cameraFx.lastHitSerial = weapon.hitSerial;\n    cameraFx.hitKick = 1;\n  }\n  cameraFx.shotKick *= 0.82;\n  cameraFx.hitKick *= 0.84;\n'''
          camera_new = '''  if (weapon.hitSerial > cameraFx.lastHitSerial) {\n    cameraFx.lastHitSerial = weapon.hitSerial;\n    const impactEnemy = weapon.lastHitEnemyId\n      ? this.session.enemies.find((enemy) => enemy.id === weapon.lastHitEnemyId) ?? null\n      : null;\n    cameraFx.hitKick = impactEnemy && !impactEnemy.alive ? 1.42 : 1.05;\n  }\n  cameraFx.shotKick *= 0.82;\n  cameraFx.hitKick *= 0.86;\n'''
          if camera_old in raid:
              raid = raid.replace(camera_old, camera_new, 1)
          elif camera_new not in raid:
              raise SystemExit('SKY RAID camera impact anchor missing')
          raid_path.write_text(raid)

          # 4) Make the browser audit enforce the new visual hierarchy and kill burst.
          audit_path = Path('scripts/webgl-sky-raid-camera-edge-v17.mjs')
          audit = audit_path.read_text()
          impact_anchor = '  const cueOpacity = Number.parseFloat(cueVisual?.opacity ?? "0");\n'
          impact_insert = '''  const impactVisual = await page.evaluate(() => window.__skyRaidGetImpactPolish?.() ?? null);\n  if (!impactVisual || Number(impactVisual.activeBursts ?? 0) < 1 || Number(impactVisual.lastStrength ?? 0) < 1.2) {\n    throw new Error(`TARGET DOWN has no strong world-space impact burst: ${JSON.stringify(impactVisual)}`);\n  }\n''' + impact_anchor
          if 'TARGET DOWN has no strong world-space impact burst' not in audit:
              if impact_anchor not in audit:
                  raise SystemExit('impact audit anchor missing')
              audit = audit.replace(impact_anchor, impact_insert, 1)
          result_anchor = '    cueVisual,\n    targetBefore,\n'
          result_insert = '    cueVisual,\n    impactVisual,\n    targetBefore,\n'
          if '    impactVisual,\n    targetBefore,' not in audit:
              if result_anchor not in audit:
                  raise SystemExit('impact result anchor missing')
              audit = audit.replace(result_anchor, result_insert, 1)

          ui_anchor = '  const combatDiagnostics = await page.evaluate(() => ({\n'
          ui_check = textwrap.dedent('''
            const reticle = page.locator('[aria-label="Sky Raid target reticle"]');
            const decisionCard = page.locator('[aria-label="V45 target decision"]');
            await reticle.waitFor({ state: "visible", timeout: 5000 });
            await decisionCard.waitFor({ state: "visible", timeout: 5000 });
            const reticleBox = await reticle.boundingBox();
            const decisionBox = await decisionCard.boundingBox();
            if (!reticleBox || reticleBox.width > 44 || reticleBox.height > 44) {
              throw new Error(`target reticle is too visually heavy: ${JSON.stringify(reticleBox)}`);
            }
            if (!decisionBox) throw new Error("target doctrine card missing");
            const reticleCenterX = reticleBox.x + reticleBox.width * 0.5;
            const reticleCenterY = reticleBox.y + reticleBox.height * 0.5;
            const decisionCenterX = decisionBox.x + decisionBox.width * 0.5;
            const decisionCenterY = decisionBox.y + decisionBox.height * 0.5;
            if (Math.abs(reticleCenterX - decisionCenterX) < 34 && Math.abs(reticleCenterY - decisionCenterY) < 26) {
              throw new Error(`target doctrine still crowds the reticle: reticle=${JSON.stringify(reticleBox)} decision=${JSON.stringify(decisionBox)}`);
            }

          ''')
          if 'target doctrine still crowds the reticle' not in audit:
              if ui_anchor not in audit:
                  raise SystemExit('UI audit insertion anchor missing')
              audit = audit.replace(ui_anchor, ui_check + ui_anchor, 1)
          report_anchor = '  const report = { desiredPlayerNdcY, baselineFrameTolerance, padBox, visualRingBox, captionBox, combatDiagnostics,'
          report_replacement = '  const report = { desiredPlayerNdcY, baselineFrameTolerance, padBox, visualRingBox, captionBox, reticleBox, decisionBox, combatDiagnostics,'
          if 'reticleBox, decisionBox, combatDiagnostics' not in audit:
              if report_anchor not in audit:
                  raise SystemExit('UI report anchor missing')
              audit = audit.replace(report_anchor, report_replacement, 1)
          audit_path.write_text(audit)

          test_path = Path('tests/sky-sky-raid.test.ts')
          tests = test_path.read_text()
          tests = tests.replace('assert.match(overlaySource, /max-width: min\\(42vw, 340px\\)/);', 'assert.match(overlaySource, /max-width: min\\(34vw, 250px\\)/);')
          tests = tests.replace('assert.match(overlaySource, /font-size: clamp\\(8px, \\.95vw, 10px\\)/);', 'assert.match(overlaySource, /font-size: clamp\\(7px, \\.82vw, 9px\\)/);')
          if 'target doctrine still crowds the reticle' not in tests:
              append_anchor = '  assert.match(auditSource, /cueOpacity < 0\\.85/);\n'
              append_text = append_anchor + '  assert.match(auditSource, /target doctrine still crowds the reticle/);\n  assert.match(auditSource, /TARGET DOWN has no strong world-space impact burst/);\n'
              if append_anchor not in tests:
                  raise SystemExit('feedback test anchor missing')
              tests = tests.replace(append_anchor, append_text, 1)
          if 'SkyDancerAirCombatFxV18.ts' not in tests:
              old_head = '  const overlaySource = readFileSync(new URL("../app/SkyDancerSkyRaidOverlay.tsx", import.meta.url), "utf8");\n  const auditSource = readFileSync(new URL("../scripts/webgl-sky-raid-camera-edge-v17.mjs", import.meta.url), "utf8");\n'
              new_head = old_head + '  const fxSource = readFileSync(new URL("../src/sky/SkyDancerAirCombatFxV18.ts", import.meta.url), "utf8");\n  const hudSource = readFileSync(new URL("../app/SkyDancerHudV45.tsx", import.meta.url), "utf8");\n'
              if old_head not in tests:
                  raise SystemExit('feedback source anchor missing')
              tests = tests.replace(old_head, new_head, 1)
              assertion_anchor = '  assert.match(auditSource, /TARGET DOWN has no strong world-space impact burst/);\n'
              assertion_text = assertion_anchor + '  assert.match(fxSource, /sky-raid-target-down-burst-v18/);\n  assert.match(fxSource, /progress < 0\\.08/);\n  assert.match(hudSource, /width: 42px/);\n  assert.match(hudSource, /lockSide \* 9\\.5/);\n'
              tests = tests.replace(assertion_anchor, assertion_text, 1)
          test_path.write_text(tests)
          PY
      - name: Commit combat readability pass
        run: |
          if git diff --quiet -- app/SkyDancerHudV45.tsx app/SkyDancerSkyRaidOverlay.tsx src/sky/SkyDancerAirCombatFxV18.ts src/sky/SkyDancerSkyRaid.ts scripts/webgl-sky-raid-camera-edge-v17.mjs tests/sky-sky-raid.test.ts; then exit 0; fi
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add app/SkyDancerHudV45.tsx app/SkyDancerSkyRaidOverlay.tsx src/sky/SkyDancerAirCombatFxV18.ts src/sky/SkyDancerSkyRaid.ts scripts/webgl-sky-raid-camera-edge-v17.mjs tests/sky-sky-raid.test.ts
          git commit -m "Clarify SKY RAID combat UI and strengthen target-down impact"
          git push origin HEAD:main
