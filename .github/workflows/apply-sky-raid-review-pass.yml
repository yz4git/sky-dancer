name: Apply SKY RAID review pass

on:
  push:
    paths:
      - .github/workflows/apply-sky-raid-review-pass.yml
      - scripts/apply-sky-raid-final-visual-pass.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Add SKY RAID re-engagement director
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/sky/SkyDancerSkyRaid.ts")
          source = path.read_text()

          if "raidEngagementBySession" not in source:
              source = source.replace(
                  "const raidCameraFxByDemo = new WeakMap<object, RaidCameraFxState>();\n",
                  "const raidCameraFxByDemo = new WeakMap<object, RaidCameraFxState>();\nconst raidEngagementBySession = new WeakMap<object, { cooldown: number; cursor: number }>();\n",
              )

          marker = '''function clamp(value: number, min: number, max: number): number {
            return Math.max(min, Math.min(max, value));
          }
          '''
          if "SKY_RAID_ENGAGEMENT_SLOTS" not in source:
              addition = marker + '''
          const SKY_RAID_ENGAGEMENT_SLOTS = [
            { lateral: -9, forward: 26 },
            { lateral: 9, forward: 31 },
            { lateral: 0, forward: 38 },
            { lateral: -14, forward: 42 },
            { lateral: 14, forward: 36 },
          ] as const;

          /**
           * SKY RAID is an arcade dogfight, not a simulation where every bandit may
           * disappear behind the camera for long periods. Preserve normal AI while
           * at least three aircraft occupy a broad forward engagement cone. Only
           * aircraft already outside that cone are recycled, so on-screen targets
           * never pop or teleport in front of the player.
           */
          function maintainSkyRaidEnemyPresence(session: CartArenaSession, delta: number): void {
            const snapshot = session.snapshot();
            const live = session.enemies.filter(
              (enemy) => enemy.alive && enemy.kind !== "boss" && enemy.nodeId === snapshot.nodeId,
            );
            if (live.length < 2) return;

            const key = session as unknown as object;
            let state = raidEngagementBySession.get(key);
            if (!state) {
              state = { cooldown: 0, cursor: 0 };
              raidEngagementBySession.set(key, state);
            }
            state.cooldown = Math.max(0, state.cooldown - delta);

            const forwardX = Math.sin(snapshot.heading);
            const forwardZ = Math.cos(snapshot.heading);
            const rightX = Math.cos(snapshot.heading);
            const rightZ = -Math.sin(snapshot.heading);
            const local = (enemy: (typeof live)[number]) => {
              const dx = enemy.x - snapshot.x;
              const dz = enemy.z - snapshot.z;
              return {
                enemy,
                forward: dx * forwardX + dz * forwardZ,
                lateral: dx * rightX + dz * rightZ,
              };
            };

            const measured = live.map(local);
            const engaged = measured.filter(
              ({ forward, lateral }) => forward >= 11 && forward <= 52 && Math.abs(lateral) <= 21,
            );
            if (engaged.length >= 3) return;
            if (state.cooldown > 0) return;

            const engagedIds = new Set(engaged.map(({ enemy }) => enemy.id));
            const candidates = measured
              .filter(({ enemy }) => !engagedIds.has(enemy.id))
              .sort((left, right) => {
                const penalty = ({ forward, lateral }: typeof left) =>
                  Math.abs(lateral)
                  + Math.max(0, 11 - forward) * 2.2
                  + Math.max(0, forward - 52) * 1.6;
                return penalty(right) - penalty(left);
              });
            const needed = Math.min(3 - engaged.length, candidates.length, 2);
            for (let index = 0; index < needed; index += 1) {
              const target = candidates[index].enemy;
              const slot = SKY_RAID_ENGAGEMENT_SLOTS[(state.cursor + index) % SKY_RAID_ENGAGEMENT_SLOTS.length];
              target.x = snapshot.x + forwardX * slot.forward + rightX * slot.lateral;
              target.z = snapshot.z + forwardZ * slot.forward + rightZ * slot.lateral;
              target.heading = Math.atan2(snapshot.x - target.x, snapshot.z - target.z);
              target.aiClock = 0;
              target.chargeTime = 0;
            }
            state.cursor = (state.cursor + needed) % SKY_RAID_ENGAGEMENT_SLOTS.length;
            state.cooldown = needed > 0 ? 0.42 : 0.18;
          }
          '''
              if marker not in source:
                  raise SystemExit("clamp insertion marker missing")
              source = source.replace(marker, addition)

          if "maintainSkyRaidEnemyPresence(this as unknown as CartArenaSession, delta);" not in source:
              old = "    const hunt = getCartTurboHuntSnapshot(this as unknown as CartArenaSession);\n    if (!hunt) return;\n    const delta = clamp(fixedDelta, 0, 0.05);"
              new = "    const delta = clamp(fixedDelta, 0, 0.05);\n    maintainSkyRaidEnemyPresence(this as unknown as CartArenaSession, delta);\n    const hunt = getCartTurboHuntSnapshot(this as unknown as CartArenaSession);\n    if (!hunt) return;"
              if old not in source:
                  raise SystemExit("session step insertion marker missing")
              source = source.replace(old, new, 1)

          path.write_text(source)

          test_path = Path("tests/sky-sky-raid.test.ts")
          tests = test_path.read_text()
          anchor = "  assert.match(raidSource, /enemyCombatLane/);\n"
          if "SKY_RAID_ENGAGEMENT_SLOTS" not in tests:
              if anchor not in tests:
                  raise SystemExit("enemy presence test marker missing")
              tests = tests.replace(
                  anchor,
                  anchor
                  + "  assert.match(raidSource, /maintainSkyRaidEnemyPresence/);\n"
                  + "  assert.match(raidSource, /SKY_RAID_ENGAGEMENT_SLOTS/);\n",
              )
          test_path.write_text(tests)
          PY
      - name: Apply SKY RAID enemy presence pass
        run: node scripts/apply-sky-raid-final-visual-pass.mjs
      - name: Commit source improvements
        run: |
          if git diff --quiet -- src/sky/SkyDancerSkyRaid.ts src/sky/SkyDancerVerticalFlightV43.ts app/SkyDancerSkyRaidOverlay.tsx scripts/webgl-sky-raid-camera-edge-v17.mjs tests/sky-sky-raid.test.ts; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/SkyDancerSkyRaid.ts src/sky/SkyDancerVerticalFlightV43.ts app/SkyDancerSkyRaidOverlay.tsx scripts/webgl-sky-raid-camera-edge-v17.mjs tests/sky-sky-raid.test.ts
          git commit -m "Keep SKY RAID dogfights in the forward combat cone"
          git push origin HEAD:main
