name: SKY RAID Arcade Polish Once

on:
  push:
    paths:
      - ".github/workflows/apply-sky-raid-review-pass.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply SKY RAID arcade polish
        run: |
          python3 .github/skyraid-arcade-polish.py
          git diff --check
      - name: Verify repository contract
        run: npm run verify
      - name: Commit verified product
        run: |
          rm -f .github/skyraid-arcade-polish.py
          rm -f .github/workflows/apply-sky-raid-review-pass.yml
          git diff --check
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add -A src/sky/SkyDancerSkyRaidRules.ts src/sky/SkyDancerSkyRaid.ts app/SkyDancerSkyRaidOverlay.tsx app/SkyDancerSkyRaidOverlay.module.css tests/sky-sky-raid.test.ts docs/SKY_RAID.md .github
          git diff --cached --check
          git commit -m "Polish SKY RAID arcade run pacing"
          git push origin HEAD:main
