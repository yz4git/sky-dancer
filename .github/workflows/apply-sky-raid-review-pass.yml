name: Apply SKY RAID review pass

on:
  push:
    paths:
      - .github/workflows/apply-sky-raid-review-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Move enemy altitude ownership to final presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/sky/SkyDancerSkyRaid.ts')
          source = path.read_text()
          old = '''  previousApplyCameraPresentation.call(this, snapshot);
  if (!isSkyRaidMode()) return;
  const altitude = Number(this.scene.userData.skyRaidPlayerAltitude ?? 0);'''
          new = '''  previousApplyCameraPresentation.call(this, snapshot);
  if (!isSkyRaidMode()) return;
  // Older aircraft FX still writes the historical ~1m enemy flight plane during
  // its late presentation update. SKY RAID owns the final render altitude, so
  // restore the shared 20-64m combat band here, immediately before camera/render.
  applySkyRaidEnemyFlightBand(this);
  const altitude = Number(this.scene.userData.skyRaidPlayerAltitude ?? 0);'''
          if 'immediately before camera/render' not in source:
              if old not in source:
                  raise SystemExit('final camera ownership marker missing')
              source = source.replace(old, new, 1)
          path.write_text(source)

          test_path = Path('tests/sky-sky-raid.test.ts')
          tests = test_path.read_text()
          anchor = '  assert.match(raidSource, /applySkyRaidEnemyFlightBand/);\n'
          check = '  assert.match(raidSource, /previousApplyCameraPresentation[\\s\\S]{0,240}applySkyRaidEnemyFlightBand\\(this\\)/);\n'
          if check not in tests:
              if anchor not in tests:
                  raise SystemExit('test marker missing')
              tests = tests.replace(anchor, anchor + check, 1)
          test_path.write_text(tests)
          PY
      - name: Commit final altitude owner
        run: |
          if git diff --quiet -- src/sky/SkyDancerSkyRaid.ts tests/sky-sky-raid.test.ts; then exit 0; fi
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/SkyDancerSkyRaid.ts tests/sky-sky-raid.test.ts
          git commit -m "Keep SKY RAID enemies on the final render flight band"
          git push origin HEAD:main
