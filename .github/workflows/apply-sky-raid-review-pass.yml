name: Apply SKY RAID review pass

on:
  push:
    paths:
      - .github/workflows/apply-sky-raid-review-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Instrument enemy render altitude
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/sky/SkyDancerSkyRaid.ts')
          source = path.read_text()
          old_type = 'const enemyScreenSamples: Array<{ id: string; x: number; y: number; z: number; visible: boolean }> = [];'
          new_type = 'const enemyScreenSamples: Array<{ id: string; x: number; y: number; z: number; visible: boolean; worldY: number; localY: number; boundsY: number; relativeY: number; forward: number; lateral: number }> = [];'
          source = source.replace(old_type, new_type)
          old_push = 'if (enemyScreenSamples.length < 8) enemyScreenSamples.push({ id: enemy.id, x: ndc.x, y: ndc.y, z: ndc.z, visible });'
          new_push = '''if (enemyScreenSamples.length < 8) {
            const boundsCenter = new THREE.Vector3();
            new THREE.Box3().setFromObject(group).getCenter(boundsCenter);
            const dx = world.x - player.x;
            const dz = world.z - player.z;
            enemyScreenSamples.push({
              id: enemy.id,
              x: ndc.x,
              y: ndc.y,
              z: ndc.z,
              visible,
              worldY: world.y,
              localY: group.position.y,
              boundsY: boundsCenter.y,
              relativeY: world.y - player.y,
              forward: dx * forwardX + dz * forwardZ,
              lateral: dx * rightX + dz * rightZ,
            });
          }'''
          if old_push not in source and 'boundsY: boundsCenter.y' not in source:
              raise SystemExit('enemy sample marker missing')
          source = source.replace(old_push, new_push)
          path.write_text(source)
          PY
      - name: Commit diagnostics
        run: |
          if git diff --quiet -- src/sky/SkyDancerSkyRaid.ts; then exit 0; fi
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/SkyDancerSkyRaid.ts
          git commit -m "Expose SKY RAID enemy render altitude diagnostics"
          git push origin HEAD:main
