name: Apply SKY RAID review pass

on:
  push:
    paths:
      - .github/workflows/apply-sky-raid-review-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Keep at least two SKY RAID enemies on screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source_path = Path('src/sky/SkyDancerSkyRaid.ts')
          source = source_path.read_text()

          weak_anchor = "const raidEngagementBySession = new WeakMap<object, { cooldown: number; cursor: number }>();\n"
          weak_insert = weak_anchor + "const raidScreenEngagementByDemo = new WeakMap<object, { nextAllowedAt: number; cursor: number; recycles: number }>();\n"
          if 'raidScreenEngagementByDemo' not in source:
              if weak_anchor not in source:
                  raise SystemExit('screen engagement WeakMap anchor missing')
              source = source.replace(weak_anchor, weak_insert, 1)

          helper = textwrap.dedent('''
          const SKY_RAID_SCREEN_SLOTS = [
            { lateral: -7, forward: 24 },
            { lateral: 7, forward: 29 },
            { lateral: 0, forward: 34 },
            { lateral: -11, forward: 31 },
            { lateral: 11, forward: 36 },
          ] as const;

          /**
           * Simulation-space engagement cannot guarantee phone-screen visibility
           * after pitch, bank, camera framing, and altitude transitions. Use the
           * final camera projection as a second-stage arcade engagement director.
           * Only already-offscreen aircraft are recycled, so visible targets never pop.
           */
          function maintainSkyRaidScreenPresence(
            demo: RaidWebGLDemo,
            snapshot: ReturnType<CartArenaSession["snapshot"]>,
          ): void {
            const live = demo.session.enemies.filter(
              (enemy) => enemy.alive && enemy.kind !== "boss" && enemy.nodeId === snapshot.nodeId,
            );
            if (live.length < 2) return;

            const key = demo as unknown as object;
            let state = raidScreenEngagementByDemo.get(key);
            if (!state) {
              state = { nextAllowedAt: 0, cursor: 0, recycles: 0 };
              raidScreenEngagementByDemo.set(key, state);
            }

            demo.scene.updateMatrixWorld(true);
            demo.camera.updateMatrixWorld(true);
            const measured = live.flatMap((enemy) => {
              const group = demo.enemyGroups.get(enemy.id);
              if (!group) return [];
              const world = new THREE.Vector3();
              group.getWorldPosition(world);
              const ndc = world.clone().project(demo.camera);
              const visible = ndc.z > -1 && ndc.z < 1 && Math.abs(ndc.x) < 0.96 && Math.abs(ndc.y) < 0.94;
              return [{ enemy, group, ndc, visible }];
            });
            const visible = measured.filter((sample) => sample.visible);
            demo.scene.userData.skyRaidScreenPresenceVisible = visible.length;
            demo.scene.userData.skyRaidScreenPresenceRecycles = state.recycles;
            if (visible.length >= 2) {
              state.nextAllowedAt = 0;
              return;
            }

            const now = typeof performance !== "undefined" ? performance.now() * 0.001 : Date.now() * 0.001;
            if (now < state.nextAllowedAt) return;

            const forwardX = Math.sin(snapshot.heading);
            const forwardZ = Math.cos(snapshot.heading);
            const rightX = Math.cos(snapshot.heading);
            const rightZ = -Math.sin(snapshot.heading);
            const candidates = measured
              .filter((sample) => !sample.visible)
              .sort((left, right) => {
                const leftPenalty = Math.abs(left.ndc.x) + Math.abs(left.ndc.y) + Math.abs(left.ndc.z) * 0.12;
                const rightPenalty = Math.abs(right.ndc.x) + Math.abs(right.ndc.y) + Math.abs(right.ndc.z) * 0.12;
                return rightPenalty - leftPenalty;
              });
            const needed = Math.min(2 - visible.length, candidates.length);
            for (let index = 0; index < needed; index += 1) {
              const sample = candidates[index];
              const slot = SKY_RAID_SCREEN_SLOTS[(state.cursor + index) % SKY_RAID_SCREEN_SLOTS.length];
              const x = snapshot.x + forwardX * slot.forward + rightX * slot.lateral;
              const z = snapshot.z + forwardZ * slot.forward + rightZ * slot.lateral;
              sample.enemy.x = x;
              sample.enemy.z = z;
              sample.enemy.heading = Math.atan2(snapshot.x - x, snapshot.z - z);
              sample.enemy.aiClock = 0;
              sample.enemy.chargeTime = 0;
              sample.group.position.x = x;
              sample.group.position.z = z;
              sample.group.position.y = 0.62 + getSkyDancerEnemyAltitudeMetersV43(sample.enemy);
              sample.group.userData.lastX = x;
              sample.group.userData.lastZ = z;
              sample.group.updateMatrixWorld(true);
              state.recycles += 1;
            }
            state.cursor = (state.cursor + needed) % SKY_RAID_SCREEN_SLOTS.length;
            state.nextAllowedAt = now + (needed > 0 ? 0.28 : 0.12);
            demo.scene.userData.skyRaidScreenPresenceRecycles = state.recycles;
          }
          ''')
          publish_anchor = "\nfunction publishSkyRaidWorldStyle(snapshot: SkyDancerSkyRaidSnapshot): void {\n"
          if 'function maintainSkyRaidScreenPresence' not in source:
              if publish_anchor not in source:
                  raise SystemExit('screen presence helper insertion anchor missing')
              source = source.replace(publish_anchor, "\n" + helper + publish_anchor, 1)

          call_anchor = "  this.scene.userData.skyRaidCameraFov = this.camera.fov;\n  if (typeof window !== \"undefined\" && typeof navigator !== \"undefined\" && navigator.webdriver) {\n"
          call_replacement = "  this.scene.userData.skyRaidCameraFov = this.camera.fov;\n  maintainSkyRaidScreenPresence(this, snapshot);\n  if (typeof window !== \"undefined\" && typeof navigator !== \"undefined\" && navigator.webdriver) {\n"
          if 'maintainSkyRaidScreenPresence(this, snapshot);' not in source:
              if call_anchor not in source:
                  raise SystemExit('screen presence call anchor missing')
              source = source.replace(call_anchor, call_replacement, 1)
          source_path.write_text(source)

          audit_path = Path('scripts/webgl-sky-raid-camera-edge-v17.mjs')
          audit = audit_path.read_text()
          low_anchor = '  if (Math.abs(low.playerNdcY) > 0.52) throw new Error(`lower framing too close to edge: ${low.playerNdcY}`);\n  await screenshot("02-lower-altitude-stop.png");\n'
          low_replacement = '  if (Math.abs(low.playerNdcY) > 0.52) throw new Error(`lower framing too close to edge: ${low.playerNdcY}`);\n  if (Number(low.enemyVisible ?? 0) < 2) {\n    throw new Error(`too few enemies remain visible at the SKY RAID lower altitude stop: ${JSON.stringify(low.enemyScreenSamples ?? [])}`);\n  }\n  if (Number(low.enemyCombatLane ?? 0) < 1) {\n    throw new Error(`lower SKY RAID altitude has no enemy in the central combat lane: ${JSON.stringify(low.enemyScreenSamples ?? [])}`);\n  }\n  await screenshot("02-lower-altitude-stop.png");\n'
          if 'too few enemies remain visible at the SKY RAID lower altitude stop' not in audit:
              if low_anchor not in audit:
                  raise SystemExit('lower altitude audit anchor missing')
              audit = audit.replace(low_anchor, low_replacement, 1)
          audit_path.write_text(audit)

          test_path = Path('tests/sky-sky-raid.test.ts')
          tests = test_path.read_text()
          test_anchor = '  assert.match(raidSource, /maintainSkyRaidEnemyPresence/);\n  assert.match(raidSource, /SKY_RAID_ENGAGEMENT_SLOTS/);\n'
          test_replacement = '  assert.match(raidSource, /maintainSkyRaidEnemyPresence/);\n  assert.match(raidSource, /maintainSkyRaidScreenPresence/);\n  assert.match(raidSource, /SKY_RAID_SCREEN_SLOTS/);\n  assert.match(raidSource, /SKY_RAID_ENGAGEMENT_SLOTS/);\n'
          if 'assert.match(raidSource, /maintainSkyRaidScreenPresence/);' not in tests:
              if test_anchor not in tests:
                  raise SystemExit('screen presence regression anchor missing')
              tests = tests.replace(test_anchor, test_replacement, 1)
          if 'assert.match(auditSource, /low\\.enemyVisible/);' not in tests:
              anchor = '  assert.match(auditSource, /high\\.enemyVisible/);\n'
              if anchor not in tests:
                  raise SystemExit('low audit regression anchor missing')
              tests = tests.replace(anchor, anchor + '  assert.match(auditSource, /low\\.enemyVisible/);\n', 1)
          test_path.write_text(tests)
          PY
      - name: Commit screen-space engagement director
        run: |
          if git diff --quiet -- src/sky/SkyDancerSkyRaid.ts scripts/webgl-sky-raid-camera-edge-v17.mjs tests/sky-sky-raid.test.ts; then exit 0; fi
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/SkyDancerSkyRaid.ts scripts/webgl-sky-raid-camera-edge-v17.mjs tests/sky-sky-raid.test.ts
          git commit -m "Keep two SKY RAID enemies visible across altitude transitions"
          git push origin HEAD:main
