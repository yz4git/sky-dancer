name: Arcade V11.5 Mastery Rewards Once

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply V11.5 patch
        run: python3 scripts/apply-arcade-v115-mastery-rewards.py
      - name: Rules regression
        run: npm run test:rules
      - name: Arcade contract
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Pages product build
        run: npm run build:pages
      - name: Commit product and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sky/arcade/SkyDancerArcadeProgress.ts app/CartGameMenu.tsx app/SkyDancerArcadeMode.tsx tests/sky-arcade-run.test.ts
          git commit -m 'Arcade Run V11.5: add mastery reward track'
          git rm -f .github/workflows/arcade-v115-mastery-rewards-once.yml scripts/apply-arcade-v115-mastery-rewards.py .v115-mastery-rewards-trigger
          git commit -m 'Remove V11.5 mastery reward work files'
          git push origin HEAD:main
