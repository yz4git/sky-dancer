name: Arcade Run V40.36 enemy attack visual coherence

on:
  push:
    branches:
      - chatgpt/v4036-enemy-attack-visual-coherence
    paths:
      - .github/workflows/arcade-run-v4036-enemy-attack-visual-coherence-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply V40.36 visual coherence pass
        run: python3 scripts/arcade-run-v4036-enemy-attack-visual-coherence.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify related Arcade Run rendering contracts
        run: |
          npm run check:arcade
          node --import tsx --test tests/sky-arcade-v4035-projectile-visibility.test.ts tests/sky-arcade-v4036-enemy-attack-visual-coherence.test.ts
          npm run lint
          npm run test:pwa
          npm run test:pages
          npm run validate:artifact
      - name: Commit verified V40.36 visual pass
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeWebGLDemo.ts \
                  src/sky/arcade/SkyDancerArcadeCanvasDemo.ts \
                  tests/sky-arcade-v4035-projectile-visibility.test.ts \
                  tests/sky-arcade-v4036-enemy-attack-visual-coherence.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "Arcade Run V40.36: make enemy attacks visually coherent"
          git push origin HEAD:chatgpt/v4036-enemy-attack-visual-coherence
