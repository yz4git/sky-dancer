name: Apply V24 Pre Cross Separation Once

on:
  push:
    branches: [arcade-run-v24-aircraft-behavior-20260908]
    paths:
      - ".github/v24-pre-cross-separation.py"
      - ".github/workflows/v24-pre-cross-separation-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arcade-run-v24-aircraft-behavior-20260908
      - run: python3 .github/v24-pre-cross-separation.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeRuntime.ts
          git commit -m "Arcade Run V24: establish separation before cross-pass"
          git push origin HEAD:arcade-run-v24-aircraft-behavior-20260908
