name: SKY RAID V34 Stick Release

on:
  push:
    paths:
      - ".github/workflows/sky-raid-v34-stick-release-once.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          rm -rf .audit-runtime artifacts/sky-raid-v34-stick-release
          mkdir -p .audit-runtime artifacts/sky-raid-v34-stick-release
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Apply V34 stick repair
        run: |
          python3 .github/skyraid-v34-stick-release.py
          python3 .github/skyraid-v34-normalize.py
          git diff --check
      - name: Validate product
        run: |
          npm run test:fast
          npm run check:arcade
          npm run lint
          npm run build:pages
      - name: iPhone WebGL stick release audit
        run: |
          python3 -m http.server 4177 --bind 127.0.0.1 --directory out >/tmp/v34-stick.log 2>&1 &
          echo $! >/tmp/v34-stick.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4177/ >/dev/null && break; sleep 1; done
          node scripts/webgl-sky-raid-v34-stick-release.mjs
          kill $(cat /tmp/v34-stick.pid) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-raid-v34-stick-release-audit
          path: artifacts/sky-raid-v34-stick-release
          retention-days: 7
      - name: Commit product
        run: |
          rm -f .github/skyraid-v34-stick-release.py
          rm -f .github/skyraid-v34-normalize.py
          rm -f scripts/webgl-sky-raid-v34-stick-release.mjs
          rm -f .github/workflows/sky-raid-v34-stick-release-once.yml
          git diff --check
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add app/CartRogueGame.tsx app/SkyDancerArcadeVirtualPad.tsx tests/sky-sky-raid.test.ts .github scripts
          git diff --cached --check
          git commit -m "Harden iPhone flight stick release"
          git push origin HEAD:main
