name: Arcade Run V40.5 Route-Reactive Final Boss

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/arcade-run-v405-route-reactive-final-boss-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply V40.5 route-reactive final boss
        run: |
          python3 scripts/arcade-run-v405-route-reactive-final-boss-fix.py
          python3 scripts/arcade-run-v405-route-reactive-final-boss.py
          python3 scripts/arcade-run-v405-route-reactive-final-boss-snapshot-fix.py
          python3 scripts/arcade-run-v405-route-reactive-final-boss-compat-fix.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify V40.5 route-reactive final boss
        run: |
          npm run check:arcade
          node --import tsx --test tests/sky-arcade-v405-route-reactive-final-boss.test.ts tests/sky-arcade-v404-rival-ace.test.ts tests/sky-arcade-v40-world-break-phase6.test.ts tests/sky-arcade-v403-world-break-recovery.test.ts tests/sky-arcade-v402-world-break-celebration.test.ts
          npm run test:fast
          npm run lint
          npm run build:pages
      - name: Commit verified V40.5 final boss
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeV405RouteReactiveFinalBoss.ts src/sky/arcade/SkyDancerArcadeRuntime.ts src/sky/arcade/SkyDancerArcadeModels.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts src/sky/arcade/SkyDancerArcadeCanvasDemo.ts app/SkyDancerArcadeMode.tsx app/SkyDancerArcadeMode.module.css tests/sky-arcade-v405-route-reactive-final-boss.test.ts tests/sky-arcade-bosses.test.ts
          git commit -m "Arcade Run V40.5: make final boss route-reactive"
          git push origin HEAD:main
