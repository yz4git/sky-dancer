name: Arcade V11 Evolution Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcade-v11-evolution-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply V11 Arcade Evolution
        run: python3 scripts/apply-arcade-v11.py
      - name: Existing arcade regression
        run: npm run test:rules
      - name: V11 timeline regression
        run: node --import tsx --test tests/sky-arcade-v11.test.ts
      - name: Arcade typecheck
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Pages production build
        run: npm run build:pages
      - name: Commit V11 product
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply-arcade-v11.py .github/workflows/arcade-v11-evolution-once.yml
          git add src/sky/arcade/SkyDancerArcadeV11Timeline.ts src/sky/arcade/SkyDancerArcadeRuntime.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts app/SkyDancerArcadeMode.tsx app/SkyDancerArcadeProduct.module.css tests/sky-arcade-v11.test.ts docs/ARCADE_V11_EVOLUTION.md
          git commit -m 'Arcade V11.0: stage-authored timeline evolution'
          git push origin HEAD:main
      - name: Dispatch Pages for product commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
