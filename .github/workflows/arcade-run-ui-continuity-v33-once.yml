name: Arcade Run V33 UI continuity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/arcade-run-ui-continuity-v33-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply V33 UI continuity patch
        run: python3 scripts/arcade-run-ui-continuity-v33.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Arcade Run
        run: |
          npm run check:arcade
          node --import tsx --test tests/sky-arcade-v33-ui-continuity.test.ts
          npm run test:fast
          npm run lint
          npm run build:pages
      - name: Commit verified V33 polish
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeWebGLDemo.ts app/SkyDancerArcadeMode.tsx app/SkyDancerArcadeMode.module.css tests/sky-arcade-v33-ui-continuity.test.ts
          git commit -m "Arcade Run V33: smooth route and boss HUD exits"
          git push origin HEAD:main
