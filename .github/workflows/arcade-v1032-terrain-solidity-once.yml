name: Arcade V10.3.2 Terrain Solidity Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arcade-v1032-terrain-solidity-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply V10.3.2 terrain solidity patch
        run: |
          python3 scripts/apply-arcade-v1032-terrain-solidity.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/sky-arcade-run.test.ts')
          s=p.read_text()
          old='  assert.match(world, /PlaneGeometry\\(260,114,48,30\\)/);\n'
          new='  assert.match(world, /SURFACE_CHUNK_DEPTH = CHUNK_LENGTH \\+ 32/);\n  assert.match(world, /PlaneGeometry\\(260,SURFACE_CHUNK_DEPTH,48,36\\)/);\n'
          assert old in s, 'legacy terrain density contract changed'
          p.write_text(s.replace(old,new,1))
          PY
      - name: Arcade rules regression
        run: npm run test:rules
      - name: Arcade typecheck
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Pages production build
        run: npm run build:pages
      - name: Commit product and cleanup temporary files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeReferenceWorld.ts src/sky/arcade/SkyDancerArcadeReferenceMaterials.ts tests/sky-arcade-reference.test.ts tests/sky-arcade-run.test.ts
          git commit -m "Arcade Run V10.3.2: keep terrain and river surfaces solid"
          git push
          git rm -f scripts/apply-arcade-v1032-terrain-solidity.py .github/workflows/arcade-v1032-terrain-solidity-once.yml
          git commit -m "Remove V10.3.2 temporary terrain pass files"
          git push
