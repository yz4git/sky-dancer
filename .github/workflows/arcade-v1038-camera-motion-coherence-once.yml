name: Arcade V10.3.8 Camera Motion Coherence Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arcade-v1038-camera-motion-coherence-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply V10.3.8 camera coherence patch
        run: python3 scripts/apply-v1038-camera-motion-coherence.py
      - name: Arcade rules regression
        run: npm run test:rules
      - name: Arcade typecheck
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Pages production build
        run: npm run build:pages
      - name: Commit product and cleanup temporary files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeWebGLDemo.ts tests/sky-arcade-run.test.ts
          git commit -m "Arcade Run V10.3.8: damp camera motion coherently"
          git rm -f \
            scripts/apply-v1038-camera-motion-coherence.py \
            .github/workflows/arcade-v1038-camera-motion-coherence-once.yml \
            scripts/webgl-arcade-v1038-continuous-motion-audit.mjs \
            .github/workflows/arcade-v1038-continuous-motion-audit-once.yml
          git commit -m "Remove V10.3.8 camera motion work files"
          git push
