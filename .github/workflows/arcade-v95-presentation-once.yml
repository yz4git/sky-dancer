name: Arcade V9.5 Presentation Overdrive Once

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-arcade-v95-presentation.py
      - scripts/fix-arcade-world-type-narrowing.py
      - .github/workflows/arcade-v95-presentation-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply V9.5 presentation pass
        run: python3 scripts/apply-arcade-v95-presentation.py
      - name: Fix existing Arcade world type narrowing
        run: python3 scripts/fix-arcade-world-type-narrowing.py
      - name: Arcade rules regression
        run: npm run test:rules
      - name: Arcade typecheck
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Pages production build
        run: npm run build:pages
      - name: Commit V9.5 product code and remove temporary workflow
        run: |
          rm -f scripts/apply-arcade-v95-presentation.py scripts/fix-arcade-world-type-narrowing.py .github/workflows/arcade-v95-presentation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Arcade Run V9.5: cinematic presentation overdrive"
          git push origin HEAD:main
