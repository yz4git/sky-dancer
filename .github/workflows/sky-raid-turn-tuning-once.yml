name: SKY RAID steering tuning one-shot

on:
  push:
    paths:
      - .github/workflows/sky-raid-turn-tuning-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply SKY RAID steering tuning
        run: python3 .github/skyraid-turn-tuning.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate steering tuning
        run: |
          npm run test:fast
          npm run lint
      - name: Commit steering tuning
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/SkyDancerSkyRaid.ts tests/sky-sky-raid.test.ts
          git commit -m "Slow SKY RAID high-deflection steering"
          git push origin HEAD:main
