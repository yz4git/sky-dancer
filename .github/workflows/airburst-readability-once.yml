name: Airburst Readability Once

on:
  push:
    branches: [main]
    paths:
      - ".github/airburst-readability-once.mjs"
      - ".github/workflows/airburst-readability-once.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply airburst readability pass
        run: node .github/airburst-readability-once.mjs
      - name: Fast tests
        run: npm run test:fast
      - name: Pages tests
        run: npm run test:pages
      - name: Arcade checks
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Validate artifact
        run: npm run validate:artifact
      - name: Commit validated product change and remove one-shot files
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git rm .github/airburst-readability-once.mjs .github/workflows/airburst-readability-once.yml
          git add src/sky/SkyDancerAirCombatFxV2.ts
          git diff --cached --check
          git commit -m "Localize aerial impact bursts"
          git push origin HEAD:main
