name: Arcade V10 Evolution Final Audit Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/arcade-v10-evolution-final-audit-once.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Inject deterministic V10 audit bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/sky/arcade/SkyDancerArcadeWebGLDemo.ts')
          s=p.read_text()
          old='''    this.lastFrame = performance.now();\n    this.animationFrame = requestAnimationFrame(this.frame);\n  }'''
          new='''    this.lastFrame = performance.now();\n    this.animationFrame = requestAnimationFrame(this.frame);\n    if (typeof window !== "undefined" && window.location.search.includes("v10Audit=1")) {\n      (window as unknown as { __skyV10Audit?: (mode: string) => unknown }).__skyV10Audit = (mode: string) => this.runV10FinalAudit(mode);\n    }\n  }'''
          assert old in s
          s=s.replace(old,new,1)
          anchor='''  private applyEnemyHitReaction(impact: SkyDancerArcadeImpactSnapshot, snapshot: SkyDancerArcadeSnapshot, heavyCraft: boolean): void {'''
          method='''  private runV10FinalAudit(mode: string): unknown {\n    type AuditEnemy = { id: number; boss: boolean; alive: boolean; age: number; depth: number; armor: number; maxArmor: number; hp: number; maxHp: number; weakpointOpen: boolean; bossPhase: 1 | 2 | 3 };\n    const auditRuntime = this.runtime as unknown as {\n      enemies: AuditEnemy[];\n      spawnEnemy(kind: "fighter", x: number, y: number, depth: number, maneuver: "approach", sign: number): void;\n      damageEnemy(enemy: AuditEnemy, amount: number, missile: boolean): void;\n      updateEnemies(delta: number, turboActive: boolean): void;\n    };\n    const syncNow = () => {\n      const snapshot = this.runtime.getSnapshot();\n      this.sync(snapshot, 1 / 60);\n      this.cinematic.render(this.scene, this.camera, snapshot.turboActive, this.presentationFx);\n      this.onSnapshot(snapshot);\n      this.previousSnapshot = snapshot;\n      return snapshot;\n    };\n    if (mode === "status") {\n      const snapshot = this.runtime.getSnapshot();\n      return { ok: true, status: snapshot.status, stage: snapshot.stage.id, hp: snapshot.playerHp, stageEventSerial: snapshot.stageEventSerial, formationBreaks: snapshot.formationBreaks, armorBreaks: snapshot.armorBreaks, bossKills: snapshot.bossKills };\n    }\n    if (mode === "stage-event") {\n      this.runtime.triggerStageEvolutionForTests(.2);\n      const snapshot = syncNow();\n      return { ok: true, stageEventSerial: snapshot.stageEventSerial, stageEventLabel: snapshot.stageEventLabel, hazards: snapshot.hazards.length, intensity: snapshot.stageEventIntensity };\n    }\n    if (mode === "stage-hazards") {\n      for (let i = 0; i < 125; i += 1) this.runtime.step(1 / 60);\n      const snapshot = syncNow();\n      return { ok: true, hazards: snapshot.hazards.length, stageTime: snapshot.stageTimeSeconds };\n    }\n    if (mode === "formation-setup") {\n      const before = new Set(auditRuntime.enemies.map((enemy) => enemy.id));\n      auditRuntime.spawnEnemy("fighter", -.72, .12, 18, "approach", -1);\n      auditRuntime.spawnEnemy("fighter", 0, -.04, 20, "approach", 1);\n      auditRuntime.spawnEnemy("fighter", .72, .14, 22, "approach", 1);\n      const ids = auditRuntime.enemies.filter((enemy) => !before.has(enemy.id)).map((enemy) => enemy.id);\n      this.scene.userData.v10FormationIds = ids;\n      const snapshot = syncNow();\n      return { ok: true, ids, enemies: snapshot.enemies.filter((enemy) => ids.includes(enemy.id)).map((enemy) => ({ id: enemy.id, role: enemy.role, armor: enemy.armor })) };\n    }\n    if (mode === "formation-break") {\n      const ids = Array.isArray(this.scene.userData.v10FormationIds) ? this.scene.userData.v10FormationIds as number[] : [];\n      for (const id of ids) {\n        const enemy = auditRuntime.enemies.find((candidate) => candidate.id === id && candidate.alive);\n        if (enemy) auditRuntime.damageEnemy(enemy, 9999, false);\n      }\n      const snapshot = syncNow();\n      return { ok: true, formationBreaks: snapshot.formationBreaks, bestChain: snapshot.bestChain, score: snapshot.score };\n    }\n    if (mode === "boss-1") {\n      this.runtime.setBossHpRatioForTests(.94);\n      const boss = auditRuntime.enemies.find((enemy) => enemy.boss && enemy.alive);\n      if (!boss) return { ok: false, reason: "boss-missing" };\n      boss.depth = 33; boss.age = .35; auditRuntime.updateEnemies(0, false);\n      const snapshot = syncNow();\n      const view = snapshot.enemies.find((enemy) => enemy.boss);\n      return { ok: true, phase: snapshot.bossPhase, armor: view?.armor ?? 0, maxArmor: view?.maxArmor ?? 0, coreOpen: snapshot.bossWeakpointOpen };\n    }\n    if (mode === "armor-break") {\n      const boss = auditRuntime.enemies.find((enemy) => enemy.boss && enemy.alive);\n      if (!boss) return { ok: false, reason: "boss-missing" };\n      auditRuntime.damageEnemy(boss, 100, true);\n      const snapshot = syncNow();\n      const view = snapshot.enemies.find((enemy) => enemy.boss);\n      return { ok: true, armorBreaks: snapshot.armorBreaks, armor: view?.armor ?? 0, phase: snapshot.bossPhase };\n    }\n    if (mode === "boss-2") {\n      this.runtime.setBossHpRatioForTests(.58);\n      const boss = auditRuntime.enemies.find((enemy) => enemy.boss && enemy.alive);\n      if (!boss) return { ok: false, reason: "boss-missing" };\n      boss.depth = 29; boss.age = 2.05; auditRuntime.updateEnemies(0, false);\n      const snapshot = syncNow();\n      return { ok: true, phase: snapshot.bossPhase, coreOpen: snapshot.bossWeakpointOpen, phaseSerial: snapshot.bossPhaseSerial, hp: snapshot.bossHp };\n    }\n    if (mode === "boss-3") {\n      this.runtime.setBossHpRatioForTests(.24);\n      const boss = auditRuntime.enemies.find((enemy) => enemy.boss && enemy.alive);\n      if (!boss) return { ok: false, reason: "boss-missing" };\n      boss.depth = 25.5; boss.age = 1.2; auditRuntime.updateEnemies(0, false);\n      const snapshot = syncNow();\n      return { ok: true, phase: snapshot.bossPhase, coreOpen: snapshot.bossWeakpointOpen, phaseSerial: snapshot.bossPhaseSerial, hp: snapshot.bossHp };\n    }\n    if (mode === "boss-kill") {\n      const boss = auditRuntime.enemies.find((enemy) => enemy.boss && enemy.alive);\n      if (!boss) return { ok: false, reason: "boss-missing" };\n      auditRuntime.damageEnemy(boss, 99999, true);\n      const snapshot = syncNow();\n      return { ok: true, bossKills: snapshot.bossKills, bossActive: snapshot.bossActive, score: snapshot.score };\n    }\n    return { ok: false, reason: "unknown-mode" };\n  }\n\n'''
          assert anchor in s
          s=s.replace(anchor,method+anchor,1)
          p.write_text(s)
          PY
      - name: Audit-only typecheck
        run: npm run check:arcade
      - name: Build Pages
        run: npm run build:pages
      - name: Start local Pages server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-v10-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-v10-http.log
          exit 1
      - name: Capture V10 evolved arcade gameplay
        run: node scripts/webgl-arcade-v10-evolution-final-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-dancer-v10-evolution-final-${{ github.sha }}
          path: artifacts/arcade-v10-evolution-final
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary V10 audit files
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/webgl-arcade-v10-evolution-final-audit.mjs .github/workflows/arcade-v10-evolution-final-audit-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove V10 temporary evolution audit files"
          git push
