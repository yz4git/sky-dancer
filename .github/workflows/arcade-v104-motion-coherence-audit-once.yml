name: Arcade V10.4 Motion Coherence Visual Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcade-v104-motion-coherence-audit-once.yml'

permissions:
  contents: write

env:
  SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version
      - name: Inject deterministic V10.4 motion audit bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/SkyDancerArcadeMode.tsx');s=p.read_text()
          needle='''        demoRef.current = demo;\n      }'''
          insert='''        demoRef.current = demo;\n        const auditDemo = demo as SkyDancerArcadeWebGLDemo;\n        (globalThis as unknown as { __skyDancerV104MotionAudit?: { sample: (params: { stageId: string; progress: number; moveX: number; moveY: number; turbo: boolean; label: string; frame: number }) => unknown } }).__skyDancerV104MotionAudit = {\n          sample: ({ stageId, progress, moveX, moveY, turbo, label, frame }) => {\n            const target = auditDemo as unknown as Record<string, any>;\n            cancelAnimationFrame(Number(target.animationFrame) || 0); target.animationFrame = 0;\n            const runtime = target.runtime as Record<string, any>;\n            const stage = skyDancerArcadeStageById(stageId as any);\n            runtime.stage = stage; runtime.status = "running"; runtime.statusBeforePause = "running";\n            runtime.stageTime = stage.durationSeconds * progress; runtime.distance = runtime.stageTime * stage.courseSpeed; runtime.runTimeSeconds = runtime.stageTime;\n            runtime.playerHp = 100; runtime.playerX = 0; runtime.playerY = 0; runtime.enemies = []; runtime.projectiles = []; runtime.hazards = []; runtime.impactEvents = [];\n            runtime.setMove(moveX,moveY); runtime.setTurbo(turbo); runtime.setFire(false); runtime.setLock(false);\n            let snapshot = runtime.getSnapshot(); target.previousSnapshot = snapshot;\n            for (let i=0;i<18;i+=1) { runtime.step(1/60); runtime.enemies=[]; runtime.projectiles=[]; runtime.hazards=[]; runtime.impactEvents=[]; runtime.playerHp=100; snapshot=runtime.getSnapshot(); target.sync(snapshot,1/60); target.previousSnapshot=snapshot; }\n            target.camera.updateMatrixWorld(); target.cinematic.render(target.scene,target.camera,snapshot.turboActive,target.presentationFx); target.onSnapshot(snapshot);\n            const root = target.scene.getObjectByName("arcade-course-environment");\n            const backdrop = target.scene.getObjectByName("arcade-product-backdrop") as any;\n            const chunks = root ? root.children.filter((child:any)=>/^arcade-course-chunk-/.test(child.name)) : [];\n            const trackedNames = ["arcade-continuous-terrain-ribbon","arcade-city-river-ribbon-surface","arcade-city-bank-left","arcade-city-bank-right","arcade-ice-course-fissure-outer","arcade-volcano-course-ribbon-outer"];\n            const layers = trackedNames.map((name)=>target.scene.getObjectByName(name)).filter(Boolean) as any[];\n            const numbers:number[] = [];\n            const pushObject=(obj:any)=>numbers.push(obj.position.x,obj.position.y,obj.position.z,obj.rotation.x,obj.rotation.y,obj.rotation.z);\n            if(backdrop)pushObject(backdrop); chunks.forEach(pushObject); layers.forEach(pushObject);\n            return {\n              label, frame, stageId:snapshot.stage.id, distance:snapshot.distance, playerX:snapshot.playerX, playerY:snapshot.playerY,\n              camera:[target.camera.position.x,target.camera.position.y,target.camera.position.z,target.camera.rotation.x,target.camera.rotation.y,target.camera.rotation.z],\n              backdrop:backdrop?[backdrop.position.x,backdrop.position.y,backdrop.position.z,backdrop.rotation.x,backdrop.rotation.y,backdrop.rotation.z]:null,\n              backdropUnified:Boolean(backdrop?.userData?.arcadeUnifiedHorizonFrameV104),\n              chunkCount:chunks.length, chunkUnified:chunks.every((chunk:any)=>chunk.userData.arcadeSingleCourseFrameV104===true),\n              chunkState:chunks.map((chunk:any)=>[chunk.position.x,chunk.position.y,chunk.position.z,chunk.rotation.y,chunk.rotation.x,chunk.rotation.z]),\n              layerState:layers.map((layer:any)=>({name:layer.name,position:[layer.position.x,layer.position.y,layer.position.z],rotation:[layer.rotation.x,layer.rotation.y,layer.rotation.z]})),\n              finite:numbers.every(Number.isFinite),\n            };\n          },\n        };\n      }'''
          assert needle in s,'WebGL demo attachment block changed';p.write_text(s.replace(needle,insert,1))
          PY
      - name: Audit bridge typecheck
        run: npm run check:arcade
      - name: Build audit target
        run: npm run build:pages
      - name: Start local Pages target
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-dancer-v104-motion-http.log 2>&1 &
          for i in {1..30}; do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/sky-dancer-v104-motion-http.log; exit 1
      - name: Capture V10.4 moving background sequences
        run: node scripts/webgl-arcade-v104-motion-coherence-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-dancer-v104-motion-coherence-${{ github.sha }}
          path: artifacts/arcade-v104-motion-coherence
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary motion audit files
        if: success()
        run: |
          set -euo pipefail
          git checkout -- app/SkyDancerArcadeMode.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/webgl-arcade-v104-motion-coherence-audit.mjs .github/workflows/arcade-v104-motion-coherence-audit-once.yml
          git commit -m "Remove V10.4 motion coherence audit files"
          git pull --rebase origin main
          git push origin HEAD:main
