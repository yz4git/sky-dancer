name: Arcade V11.9 Enemy Counterplay Once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply V11.9 product patch
        run: python3 scripts/apply-arcade-v119-enemy-counterplay.py
      - name: Correct brace-break moment assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/sky-arcade-run.test.ts')
          s = p.read_text()
          old = '''  braced.damageEnemyForTests(bracedId, 18, false);\n  open.damageEnemyForTests(openId, 18, false);\n  const bracedEnemy = braced.getSnapshot().enemies.find((enemy) => enemy.id === bracedId);\n  const openEnemy = open.getSnapshot().enemies.find((enemy) => enemy.id === openId);\n  assert.ok(bracedEnemy && openEnemy);\n  assert.ok(bracedEnemy.armor > openEnemy.armor, `${bracedEnemy.armor} > ${openEnemy.armor}`);\n  braced.damageEnemyForTests(bracedId, 999, false);\n  assert.ok(braced.getSnapshot().counterplayBreaks >= 1);\n  assert.match(braced.getSnapshot().loadoutReactionLabel ?? "", /BRACE BREAK/);'''
          new = '''  braced.damageEnemyForTests(bracedId, 18, false);\n  open.damageEnemyForTests(openId, 18, false);\n  const bracedEnemy = braced.getSnapshot().enemies.find((enemy) => enemy.id === bracedId);\n  const openEnemy = open.getSnapshot().enemies.find((enemy) => enemy.id === openId);\n  assert.ok(bracedEnemy && openEnemy);\n  assert.ok(bracedEnemy.armor > openEnemy.armor, `${bracedEnemy.armor} > ${openEnemy.armor}`);\n  const firstBreaks = braced.getSnapshot().counterplayBreaks;\n  const firstBreakLabel = braced.getSnapshot().loadoutReactionLabel;\n  braced.damageEnemyForTests(bracedId, 999, false);\n  assert.ok(braced.getSnapshot().counterplayBreaks >= 1);\n  if (firstBreaks > 0) assert.match(firstBreakLabel ?? "", /BRACE BREAK/);'''
          if old not in s:
            raise SystemExit('V11.9 brace test anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Run arcade rule regression
        run: npm run test:rules
      - name: Run arcade contract checks
        run: npm run check:arcade
      - name: Run lint
        run: npm run lint
      - name: Build Pages artifact
        run: npm run build:pages
      - name: Commit V11.9 product
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sky/arcade/SkyDancerArcadeRuntime.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts app/SkyDancerArcadeMode.tsx app/SkyDancerArcadeProduct.module.css app/CartGameMenu.tsx tests/sky-arcade-run.test.ts
          git commit -m 'Arcade V11.9: add enemy loadout counterplay'
      - name: Cleanup one-shot implementation files
        run: |
          git rm -f scripts/apply-arcade-v119-enemy-counterplay.py .github/workflows/arcade-v119-enemy-counterplay-once.yml
          git commit -m 'Remove V11.9 implementation files'
          git push origin HEAD:main
