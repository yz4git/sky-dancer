name: Arcade V10 Evolution Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/arcade-v10-evolution-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply V10 evolution
        run: python3 scripts/apply-arcade-v10-evolution.py
      - name: Arcade rules regression
        run: npm run test:rules
      - name: Arcade typecheck
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Pages production build
        run: npm run build:pages
      - name: Commit V10 product code and remove temporary files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeV10Systems.ts src/sky/arcade/SkyDancerArcadeRuntime.ts src/sky/arcade/SkyDancerArcadeProgress.ts src/sky/arcade/SkyDancerArcadePresentationDirector.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts app/SkyDancerArcadeMode.tsx app/CartGameMenu.tsx tests/sky-arcade-reference.test.ts docs/ARCADE_V10_EVOLUTION.md
          git rm scripts/apply-arcade-v10-evolution.py .github/workflows/arcade-v10-evolution-once.yml
          git commit -m "Arcade Run V10.0: evolve combat bosses stages cinema and meta"
          git push
