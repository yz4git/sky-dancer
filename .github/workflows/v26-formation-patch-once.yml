name: Apply V26 Formation Runtime Once

on:
  push:
    branches: [arcade-run-v26-formation-tactics-20260911]
    paths:
      - ".github/v26-formation-patch.py"
      - ".github/workflows/v26-formation-patch-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arcade-run-v26-formation-tactics-20260911
      - run: python3 .github/v26-formation-patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeRuntime.ts
          git commit -m "Arcade Run V26: integrate formation tactics"
          git push origin HEAD:arcade-run-v26-formation-tactics-20260911
