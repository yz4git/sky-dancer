name: Arcade Run V40.6 Final Boss Presentation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/arcade-run-v406-final-boss-presentation-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply V40.6 final boss presentation
        run: |
          python3 scripts/arcade-run-v406-final-boss-presentation.py
          python3 scripts/arcade-run-v406-final-boss-presentation-fix.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify V40.6 final boss presentation
        run: |
          npm run check:arcade
          node --import tsx --test tests/sky-arcade-v406-final-boss-presentation.test.ts tests/sky-arcade-v405-route-reactive-final-boss.test.ts tests/sky-arcade-v404-rival-ace.test.ts tests/sky-arcade-v403-world-break-recovery.test.ts tests/sky-arcade-v402-world-break-celebration.test.ts
          npm run test:fast
          npm run lint
          npm run build:pages
      - name: Commit verified V40.6 presentation
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeV406FinalBossPresentation.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts src/sky/arcade/SkyDancerArcadeCanvasDemo.ts tests/sky-arcade-v406-final-boss-presentation.test.ts
          git commit -m "Arcade Run V40.6: finish final boss presentation"
          git push origin HEAD:main

# retry: preserve V40.5 finalBossSerial presentation contract
