# V8 real-screen audit: faster flight, close dogfight silhouettes, overtakes and curved-course readability.
name: Sky Dancer Arcade Run Reference Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/SkyDancerArcadeMode.tsx"
      - "app/SkyDancerArcadeMode.module.css"
      - "app/SkyDancerArcadeProduct.module.css"
      - "src/sky/arcade/**"
      - "scripts/webgl-arcade-run-reference-audit.mjs"
      - ".github/workflows/arcade-run-reference-audit.yml"

permissions:
  contents: read

jobs:
  arcade-run-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version
      - run: npm run build:pages
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-dancer-arcade-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-dancer-arcade-http.log
          exit 1
      - run: node scripts/webgl-arcade-run-reference-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-dancer-arcade-reference-${{ github.sha }}
          path: artifacts/arcade-run-reference
          if-no-files-found: error
          retention-days: 14
