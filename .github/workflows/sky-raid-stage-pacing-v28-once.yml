name: SKY RAID V28 stage pacing one-shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sky-raid-stage-pacing-v28-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply V28 stage pacing
        run: |
          node --check .github/sky-raid-v28-stage-pacing.mjs
          node .github/sky-raid-v28-stage-pacing.mjs
          git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate product
        run: |
          npm run test:fast
          npm run check:arcade
          npm run lint

      - name: Build Pages audit artifact
        run: npm run build:pages

      - name: Browser setup
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime artifacts/sky-raid-stage-pacing-v28
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/sky-raid-v28-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-raid-v28-http.log
          exit 1

      - name: Real-time first-act WebGL playcheck
        run: node scripts/webgl-sky-raid-stage-pacing-v28.mjs

      - name: Upload V28 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-raid-stage-pacing-v28-audit
          path: artifacts/sky-raid-stage-pacing-v28
          if-no-files-found: warn
          retention-days: 7

      - name: Commit V28 product and remove one-shot harness
        if: success()
        run: |
          rm .github/workflows/sky-raid-stage-pacing-v28-once.yml
          rm .github/sky-raid-v28-stage-pacing.mjs
          rm scripts/webgl-sky-raid-stage-pacing-v28.mjs
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/SkyDancerSkyRaidRules.ts src/sky/SkyDancerSkyRaid.ts tests/sky-sky-raid.test.ts .github/workflows/sky-raid-stage-pacing-v28-once.yml .github/sky-raid-v28-stage-pacing.mjs
          git diff --cached --check
          git commit -m "Slow SKY RAID stage pacing"
          git push origin HEAD:main
