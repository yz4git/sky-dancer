name: SKY RAID V28 stage pacing one-shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sky-raid-stage-pacing-v28-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply V28 stage pacing
        run: |
          node --check .github/sky-raid-v28-stage-pacing.mjs
          node .github/sky-raid-v28-stage-pacing.mjs
          git diff --check

      - name: Inject webdriver-only audit clock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/cart/CartRoguePhase67TurboHunt.ts")
          source = path.read_text()
          marker = """function updateDirector(session: MutableHuntSession, state: TurboHuntState, delta: number): void {\n  state.elapsed += delta;"""
          replacement = """function updateDirector(session: MutableHuntSession, state: TurboHuntState, delta: number): void {\n  // Webdriver-only time positioning for the V28 pacing screen audit.\n  if (typeof window !== \"undefined\" && typeof navigator !== \"undefined\" && navigator.webdriver) {\n    const forcedElapsed = (window as unknown as { __skyRaidAuditElapsedSeconds?: unknown }).__skyRaidAuditElapsedSeconds;\n    if (typeof forcedElapsed === \"number\" && Number.isFinite(forcedElapsed)) state.elapsed = Math.max(0, forcedElapsed);\n  }\n  state.elapsed += delta;"""
          if marker not in source:
              raise SystemExit("V28 audit clock marker missing")
          path.write_text(source.replace(marker, replacement, 1))
          PY
          cat > scripts/webgl-sky-raid-stage-pacing-v28.mjs <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          import { pathToFileURL } from "node:url";

          const playwrightUrl = pathToFileURL(path.join(process.cwd(), ".audit-runtime/node_modules/playwright-core/index.js")).href;
          const playwrightModule = await import(playwrightUrl);
          const chromium = playwrightModule.chromium ?? playwrightModule.default?.chromium;
          if (!chromium) throw new Error("playwright chromium export missing");

          const out = "artifacts/sky-raid-stage-pacing-v28";
          fs.mkdirSync(out, { recursive: true });
          let browser; let context; let page;
          const watchdog = setTimeout(() => process.exit(124), 90000);

          async function sample(label) {
            const diagnostic = await page.evaluate(() => {
              const snap = window.__v28RaidSnapshot;
              const roles = window.__skyRaidGetRoleReadability?.().roles ?? [];
              return {
                elapsed: Number(snap?.elapsedSeconds ?? 0),
                actIndex: Number(snap?.actIndex ?? -1),
                actId: String(snap?.actId ?? ""),
                actElapsed: Number(snap?.actElapsedSeconds ?? 0),
                remaining: Number(snap?.actSecondsRemaining ?? 0),
                kills: Number(snap?.actKills ?? 0),
                target: Number(snap?.actKillTarget ?? 0),
                activeRoles: roles.filter((role) => role.kitVisible).length,
                bodyText: (document.body.innerText ?? "").replace(/\s+/g, " ").trim().slice(0, 1200),
              };
            });
            await page.screenshot({ path: path.join(out, `${label}.png`), timeout: 6000 });
            return diagnostic;
          }

          try {
            browser = await chromium.launch({
              headless: true,
              executablePath: process.env.SKY_DANCER_CHROME_PATH || "/usr/bin/google-chrome",
              args: ["--use-angle=swiftshader", "--enable-webgl", "--enable-unsafe-swiftshader", "--ignore-gpu-blocklist", "--disable-dev-shm-usage"],
            });
            context = await browser.newContext({ viewport: { width: 844, height: 390 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true });
            page = await context.newPage();
            const errors = [];
            page.on("pageerror", (error) => errors.push(String(error)));
            page.on("console", (message) => { if (message.type() === "error" && !/404/.test(message.text())) errors.push(message.text()); });

            await page.goto(`http://127.0.0.1:4173?menu=1&v28=${Date.now()}`, { waitUntil: "networkidle", timeout: 30000 });
            await page.evaluate(() => {
              window.__v28RaidSnapshot = null;
              window.addEventListener("sky-dancer-sky-raid-snapshot", (event) => { window.__v28RaidSnapshot = event.detail; });
            });
            await page.locator("button").filter({ hasText: /^\s*SKY RAID/i }).first().click({ force: true, timeout: 10000 });
            await page.waitForTimeout(100);
            await page.locator("button").filter({ hasText: /START/i }).last().click({ force: true, timeout: 10000 });
            await page.locator('canvas[aria-label="Sky Dancer WebGL game view"]').waitFor({ state: "visible", timeout: 20000 });
            await page.waitForFunction(() => window.__v28RaidSnapshot?.gameMode === "sky-raid", null, { timeout: 12000 });

            // Opening is genuinely played rather than clock-positioned.
            const shot = page.locator("button").filter({ hasText: /^\s*SHOT/i }).first();
            const turbo = page.locator("button").filter({ hasText: /^\s*TURBO/i }).first();
            let nextShotAt = 0.7;
            while (Number(await page.evaluate(() => window.__v28RaidSnapshot?.elapsedSeconds ?? 0)) < 3) {
              const elapsed = Number(await page.evaluate(() => window.__v28RaidSnapshot?.elapsedSeconds ?? 0));
              if (elapsed >= nextShotAt) {
                await shot.click({ force: true, timeout: 1500 }).catch(() => {});
                nextShotAt += 0.9;
              }
              await page.waitForTimeout(100);
            }
            const samples = [];
            samples.push(await sample("checkpoint-03s-real"));

            // Later points use a webdriver-only audit clock so SwiftShader slowness does not
            // turn a 46 simulation-second review into several wall-clock minutes.
            for (const checkpoint of [22, 43, 46]) {
              await page.evaluate((elapsed) => { window.__skyRaidAuditElapsedSeconds = elapsed; }, checkpoint);
              await page.waitForFunction((elapsed) => Number(window.__v28RaidSnapshot?.elapsedSeconds ?? 0) >= elapsed, checkpoint, { timeout: 8000, polling: 50 });
              await turbo.click({ force: true, timeout: 1500 }).catch(() => {});
              await page.waitForTimeout(350);
              samples.push(await sample(`checkpoint-${String(checkpoint).padStart(2, "0")}s`));
            }

            if (samples[0].actIndex !== 0 || samples[0].remaining < 39 || samples[0].remaining > 43.5 || samples[0].target !== 7) {
              throw new Error(`bad opening duration: ${JSON.stringify(samples[0])}`);
            }
            if (samples[1].actIndex !== 0 || samples[1].remaining < 21 || samples[1].remaining > 24.5) {
              throw new Error(`old 24 s boundary still advances act: ${JSON.stringify(samples[1])}`);
            }
            if (samples[2].actIndex !== 0 || samples[2].remaining > 2.5) {
              throw new Error(`act advanced before 45 s: ${JSON.stringify(samples[2])}`);
            }
            if (samples[3].actIndex !== 1 || samples[3].actId !== "red-canyon" || samples[3].actElapsed > 2.5 || samples[3].target !== 8) {
              throw new Error(`act did not transition near 45 s: ${JSON.stringify(samples[3])}`);
            }
            if (samples.some((entry) => entry.activeRoles < 3)) throw new Error(`combat population became unreadably sparse: ${JSON.stringify(samples)}`);
            if (errors.length) throw new Error(`browser errors: ${JSON.stringify(errors)}`);

            fs.writeFileSync(path.join(out, "summary.json"), JSON.stringify({ viewport: { width: 844, height: 390, dpr: 2 }, samples, errors }, null, 2));
            console.log("SKY RAID V28 STAGE PACING PASS", JSON.stringify(samples));
          } catch (error) {
            try {
              fs.writeFileSync(path.join(out, "failure.txt"), String(error?.stack ?? error));
              await page?.screenshot({ path: path.join(out, "failure.png"), timeout: 6000 });
            } catch {}
            throw error;
          } finally {
            clearTimeout(watchdog);
            try { await page?.evaluate(() => { delete window.__skyRaidAuditElapsedSeconds; }); } catch {}
            await context?.close().catch(() => {});
            await browser?.close().catch(() => {});
          }
          EOF
          git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate product
        run: |
          npm run test:fast
          npm run check:arcade
          npm run lint

      - name: Build Pages audit artifact
        run: npm run build:pages

      - name: Browser setup
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime artifacts/sky-raid-stage-pacing-v28
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/sky-raid-v28-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-raid-v28-http.log
          exit 1

      - name: Hybrid first-act WebGL playcheck
        run: node scripts/webgl-sky-raid-stage-pacing-v28.mjs

      - name: Restore audit-only clock injection
        if: always()
        run: git restore src/cart/CartRoguePhase67TurboHunt.ts

      - name: Upload V28 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-raid-stage-pacing-v28-audit
          path: artifacts/sky-raid-stage-pacing-v28
          if-no-files-found: warn
          retention-days: 7

      - name: Commit V28 product and remove one-shot harness
        if: success()
        run: |
          rm .github/workflows/sky-raid-stage-pacing-v28-once.yml
          rm .github/sky-raid-v28-stage-pacing.mjs
          rm scripts/webgl-sky-raid-stage-pacing-v28.mjs
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/SkyDancerSkyRaidRules.ts src/sky/SkyDancerSkyRaid.ts tests/sky-sky-raid.test.ts .github/workflows/sky-raid-stage-pacing-v28-once.yml .github/sky-raid-v28-stage-pacing.mjs
          git diff --cached --check
          git commit -m "Slow SKY RAID stage pacing"
          git push origin HEAD:main
