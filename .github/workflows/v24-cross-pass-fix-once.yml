name: Apply V24 Cross Pass Fix Once

on:
  push:
    branches: [arcade-run-v24-aircraft-behavior-20260908]
    paths:
      - ".github/v24-cross-pass-fix.py"
      - ".github/workflows/v24-cross-pass-fix-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arcade-run-v24-aircraft-behavior-20260908
      - name: Apply fix
        run: python3 .github/v24-cross-pass-fix.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeRuntime.ts tests/sky-arcade-v24-flight-dynamics.test.ts
          git commit -m "Arcade Run V24: preserve cross-pass separation"
          git push origin HEAD:arcade-run-v24-aircraft-behavior-20260908
