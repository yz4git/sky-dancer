name: SKY RAID V23 enemy packages once

on:
  push:
    paths:
      - .github/workflows/sky-raid-enemy-packages-v23-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
      PATCH_B64:             bihwbGF5ZXJIZWFkaW5nKSAqIGxlYWQ7CiAgICAgICAgY29uc3QgdGFyZ2V0WiA9IHB6ICsgTWF0aC5jb3MocGxheWVySGVhZGluZykgKiBsZWFkOwogICAgICAgIHRhcmdldEhlYWRpbmcgPSBNYXRoLmF0YW4yKHRhcmdldFggLSBlbmVteS54LCB0YXJnZXRWIC0gZW5lbXku eik7CiAgICAgICAgdGFyZ2V0SGVhZGluZyA9IG5vcm1hbGl6ZUFuZ2xlKHRhcmdldEhlYWRpbmcgKyBNYXRoLnNpbmhtZW1vcnkuY2xvY2sgKiAwLjgyICsgKHNpZGUgPiAwID8gMCA6IE1hdGguUEkpKSAqIDAuMTYpOwogICAgICB9CiAgICB9Jyc      
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply V23 enemy package pass
        run: |
          python3 - <<'PY'
          import base64, os
          payload = base64.b64decode(os.environ['PATCH_B64'])
          exec(compile(payload, '<sky-raid-v23-patch>', 'exec'))
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate enemy package pass
        run: |
          npm run test:fast
          npm run lint
      - name: Inject visual audit hooks
        run: python3 scripts/inject-sky-raid-v17-audit-hook.py
      - name: Build Pages artifact
        run: npm run build:pages
      - name: Run real-browser SKY RAID audit
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime artifacts/sky-raid-v23
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/sky-raid-v23-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node scripts/webgl-sky-raid-camera-edge-v17.mjs
          cp -R artifacts/sky-raid-v17/. artifacts/sky-raid-v23/
      - name: Restore audit-only injections
        if: always()
        run: git restore src/sky/SkyDancerSkyRaidFlight.ts src/sky/SkyDancerCombatDecisionV45.ts src/sky/SkyDancerAirCombatFxV18.ts
      - name: Commit reviewed implementation
        run: |
          rm -f .github/workflows/sky-raid-enemy-packages-v23-once.yml .github/workflows/sky-raid-combat-handoff-v21-once.yml
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Specialize SKY RAID enemy packages by act"
          git push origin HEAD:main
      - name: Upload audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-raid-v23-enemy-package-audit
          path: artifacts/sky-raid-v23
          if-no-files-found: warn
          retention-days: 7
