name: Arcade V9.6.1 Missile Plume Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/arcade-v961-missile-plume-once.yml"

permissions:
  contents: write

concurrency:
  group: arcade-v961-missile-plume-once
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SKY_DANCER_V961_REVISION: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply V9.6.1 plume amplification
        run: python3 scripts/apply-missile-v961.py
      - name: Arcade rules regression
        run: npm run test:rules
      - name: Arcade typecheck
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Pages production build
        run: npm run build:pages
      - name: Commit V9.6.1 product code and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeProductPresentation.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts tests/sky-arcade-run.test.ts tests/sky-arcade-reference.test.ts
          git rm .github/workflows/arcade-v961-missile-plume-once.yml scripts/apply-missile-v961.py
          git commit -m "Arcade Run V9.6.1: amplify missile white-smoke plume"
          git push origin HEAD:main
