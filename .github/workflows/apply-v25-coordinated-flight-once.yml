name: Apply Arcade V25 Coordinated Flight Once

on:
  push:
    branches: [arcade-run-v25-coordinated-flight-20260911]
    paths:
      - ".github/apply-v25-coordinated-flight.py"
      - ".github/workflows/apply-v25-coordinated-flight-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arcade-run-v25-coordinated-flight-20260911
      - name: Apply V25 coordinated flight patch
        run: python3 .github/apply-v25-coordinated-flight.py
      - name: Commit patched runtime and renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeRuntime.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts
          if git diff --cached --quiet; then
            echo "V25 patch already applied"
            exit 0
          fi
          git commit -m "Arcade Run V25: coordinated-turn enemy flight"
          git push origin HEAD:arcade-run-v25-coordinated-flight-20260911
