name: V40.18 Environment Framing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v4018-environment-framing.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply V40.18 environment framing
        run: python3 scripts/arcade-run-environment-framing-v4018.py
      - name: Verify targeted Arcade Run paths
        run: |
          npm run check:arcade
          node --import tsx --test \
            tests/sky-arcade-v4012-run-rhythm.test.ts \
            tests/sky-arcade-v4015-stage-readability.test.ts \
            tests/sky-arcade-v4017-foreground-clearance.test.ts \
            tests/sky-arcade-v4018-environment-framing.test.ts
      - name: Commit verified V40.18
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeV4018EnvironmentFraming.ts src/sky/arcade/SkyDancerArcadeReferenceWorld.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts tests/sky-arcade-v4018-environment-framing.test.ts
          git commit -m "Arcade Run V40.18: frame climax environment"
          git push origin HEAD:main
