name: Arcade V10.5.2 Ground Connectors Once

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-arcade-v1052-ground-connectors.py
      - .github/workflows/arcade-v1052-ground-connectors-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply V10.5.2 terrain grounding
        run: python3 scripts/patch-arcade-v1052-ground-connectors.py
      - name: Arcade rules regression
        run: npm run test:rules
      - name: Arcade typecheck
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Pages production build
        run: npm run build:pages
      - name: Commit product and cleanup temporary work files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeReferenceWorld.ts src/sky/arcade/SkyDancerArcadeModels.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts tests/sky-arcade-reference.test.ts
          git commit -m "Arcade V10.5.2: ground structural supports to terrain"
          git rm scripts/patch-arcade-v1052-ground-connectors.py .github/workflows/arcade-v1052-ground-connectors-once.yml
          git commit -m "Remove V10.5.2 grounding work files"
          git push origin HEAD:main
