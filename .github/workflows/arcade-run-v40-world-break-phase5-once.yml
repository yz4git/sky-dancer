name: Arcade Run V40 World Break Phase 5

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/arcade-run-v40-world-break-phase5-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply V40 World Break phase 5
        run: python3 scripts/arcade-run-v40-world-break-phase5.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify V40 World Break phase 5
        run: |
          npm run check:arcade
          node --import tsx --test tests/sky-arcade-v40-world-break.test.ts tests/sky-arcade-v40-world-break-phase2.test.ts tests/sky-arcade-v40-world-break-phase3.test.ts tests/sky-arcade-v40-world-break-phase4.test.ts tests/sky-arcade-v40-world-break-phase5.test.ts
          npm run test:fast
          npm run lint
          npm run build:pages
      - name: Commit verified V40 phase 5
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeV40WorldBreak.ts src/sky/arcade/SkyDancerArcadeRuntime.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts src/sky/arcade/SkyDancerArcadeCanvasDemo.ts app/SkyDancerArcadeMode.tsx app/SkyDancerArcadeMode.module.css tests/sky-arcade-v40-world-break.test.ts tests/sky-arcade-v40-world-break-phase5.test.ts
          git commit -m "Arcade Run V40: add neon pursuit and magma pressure"
          git push origin HEAD:main
