name: Arcade V11.8 Loadout Reactions Once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply V11.8 product patch
        run: python3 scripts/apply-arcade-v118-loadout-reactions.py
      - name: Migrate V11.7 doctrine wording contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/sky-arcade-run.test.ts')
          s = p.read_text()
          replacements = {
            'assert.match(menuSource, /FUSION LINK · TURBO BOOSTS FIRE \\+ LOCK/);': 'assert.match(menuSource, /FUSION LINK/);',
            'assert.match(menuSource, /RAPID MULTI · WIDE LOCK · TWIN RIPPLE/);': 'assert.match(menuSource, /RAPID MULTI/);',
            'assert.match(menuSource, /TWIN BURST · DUAL CANNON · HIGH RATE/);': 'assert.match(menuSource, /TWIN BURST/);',
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing stale V11.7 contract: {old}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Run arcade rule regression
        run: npm run test:rules
      - name: Run arcade contract checks
        run: npm run check:arcade
      - name: Run lint
        run: npm run lint
      - name: Build Pages artifact
        run: npm run build:pages
      - name: Commit V11.8 product
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sky/arcade/SkyDancerArcadeRuntime.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts app/SkyDancerArcadeMode.tsx app/SkyDancerArcadeProduct.module.css app/CartGameMenu.tsx tests/sky-arcade-run.test.ts
          git commit -m 'Arcade V11.8: reward loadout-specific combat reactions'
      - name: Cleanup one-shot implementation files
        run: |
          git rm -f scripts/apply-arcade-v118-loadout-reactions.py .github/workflows/arcade-v118-loadout-reactions-once.yml
          git commit -m 'Remove V11.8 implementation files'
          git push origin HEAD:main
