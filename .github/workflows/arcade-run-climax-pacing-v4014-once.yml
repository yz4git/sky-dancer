name: Arcade Run V40.14 climax pacing
# Retry after preserving first-ingress behavior while allowing deterministic phase tests.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/arcade-run-climax-pacing-v4014-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply V40.14 climax pacing patch
        run: |
          python3 scripts/arcade-run-climax-pacing-v4014.py
          python3 scripts/arcade-run-climax-pacing-v4014-testhook-fix.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify relevant Arcade Run climax paths
        run: |
          npm run check:arcade
          node --import tsx --test \
            tests/sky-arcade-v4014-climax-pacing.test.ts \
            tests/sky-arcade-v32-transition-polish.test.ts \
            tests/sky-arcade-bosses.test.ts \
            tests/sky-arcade-run.test.ts
      - name: Commit verified V40.14 polish
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeRuntime.ts tests/sky-arcade-v4014-climax-pacing.test.ts
          if git diff --cached --quiet; then
            echo "No V40.14 changes to commit"
            exit 0
          fi
          git commit -m "Arcade Run V40.14: pace boss opening and exit"
          git push origin HEAD:main
