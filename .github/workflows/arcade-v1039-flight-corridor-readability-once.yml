name: Arcade V10.3.9 Flight Corridor Readability Once
on:
  push:
    paths:
      - '.github/workflows/arcade-v1039-flight-corridor-readability-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply V10.3.9 readability patch
        run: python3 scripts/apply-v1039-flight-corridor-readability.py
      - name: Arcade rules regression
        run: npm run test:rules
      - name: Arcade typecheck
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Pages production build
        run: npm run build:pages
      - name: Commit product and cleanup temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sky/arcade/SkyDancerArcadeReferenceWorld.ts tests/sky-arcade-reference.test.ts
          git commit -m 'Arcade Run V10.3.9: preserve readable near-flight corridor'
          rm -f scripts/apply-v1039-flight-corridor-readability.py .github/workflows/arcade-v1039-flight-corridor-readability-once.yml
          git add -A
          git commit -m 'Remove V10.3.9 flight corridor work files'
          git pull --rebase origin main
          git push origin HEAD:main
