name: Test Hygiene Once

on:
  push:
    paths:
      - ".github/workflows/test-hygiene-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply test hygiene cleanup
        run: |
          python3 .github/test-hygiene-cleanup.py
          git diff --check
      - name: Fast behavioral tests
        run: npm run test:fast
      - name: Pages build and render
        run: npm run test:pages
      - name: Arcade TypeScript check
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Validate artifact
        run: npm run validate:artifact
      - name: Commit verified cleanup
        run: |
          rm -f .github/test-hygiene-cleanup.py
          rm -f .github/workflows/test-hygiene-once.yml
          git diff --check
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add -A package.json tests .github
          git diff --cached --check
          git commit -m "Prune and consolidate test suite"
          git push origin HEAD:main
