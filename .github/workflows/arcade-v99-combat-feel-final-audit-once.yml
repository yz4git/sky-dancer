name: Arcade V9.9 Combat Feel Final Audit Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/arcade-v99-combat-feel-final-audit-once.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Inject deterministic audit-only target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/sky/arcade/SkyDancerArcadeWebGLDemo.ts')
          s=p.read_text()
          old='''    this.lastFrame = performance.now();\n    this.animationFrame = requestAnimationFrame(this.frame);\n  }'''
          new='''    this.lastFrame = performance.now();\n    this.animationFrame = requestAnimationFrame(this.frame);\n    if (typeof window !== "undefined" && window.location.search.includes("v99Audit=2")) {\n      (window as unknown as { __skyV99Audit?: (mode: string) => unknown }).__skyV99Audit = (mode: string) => this.runV99FinalAudit(mode);\n    }\n  }'''
          assert old in s
          s=s.replace(old,new,1)

          sync_old='''  private sync(snapshot: SkyDancerArcadeSnapshot, delta: number): void {\n    this.presentationFx = this.presentationDirector.update(snapshot, this.previousSnapshot, delta);'''
          sync_new='''  private sync(snapshot: SkyDancerArcadeSnapshot, delta: number): void {\n    if (typeof window !== "undefined" && window.location.search.includes("v99Audit=2") && !snapshot.enemies.some((enemy) => enemy.id === 990001)) {\n      snapshot.enemies.push({ id: 990001, kind: "bomber", x: .45, y: .05, depth: 22, hp: 88, maxHp: 88, locked: false, boss: false, phase: 0, maneuver: "approach" });\n    }\n    this.presentationFx = this.presentationDirector.update(snapshot, this.previousSnapshot, delta);'''
          assert sync_old in s
          s=s.replace(sync_old,sync_new,1)

          anchor='''  private applyEnemyHitReaction(impact: SkyDancerArcadeImpactSnapshot, snapshot: SkyDancerArcadeSnapshot, heavyCraft: boolean): void {'''
          method='''  private runV99FinalAudit(mode: string): unknown {\n    const id = 990001;\n    const group = this.enemyGroups.get(id);\n    if (mode === "status") return { ready: Boolean(group), position: group?.position.toArray() ?? null, rotation: group ? [group.rotation.x, group.rotation.y, group.rotation.z] : null };\n    if (!group) return { ok: false, reason: "audit-target-not-ready" };\n    const snapshot = this.runtime.getSnapshot();\n    const impact: SkyDancerArcadeImpactSnapshot = { serial: 990000 + (mode === "missile" ? 2 : 1), enemyId: id, kind: "bomber", x: .45, y: .05, depth: 22, hpBefore: 88, hpAfter: 70, maxHp: 88, boss: false, missile: mode === "missile", destroyed: false };\n    if (mode === "gun" || mode === "missile") {\n      this.applyEnemyHitReaction(impact, snapshot, true);\n      const reaction = this.enemyHitReactions.get(id);\n      this.cameraImpactKick = Math.max(this.cameraImpactKick, mode === "missile" ? .24 : .06);\n      return { ok: true, mode, reaction: reaction ? { ...reaction } : null, before: { position: group.position.toArray(), roll: group.rotation.z, pitch: group.rotation.x } };\n    }\n    if (mode === "debris") {\n      const position = group.position.clone();\n      this.presentation.emitHeavyExplosion(position, true);\n      this.cameraImpactKick = Math.max(this.cameraImpactKick, .38);\n      return { ok: true, mode, position: position.toArray() };\n    }\n    if (mode === "player") {\n      this.playerDamageKick = 1;\n      this.playerDamageSign = -1;\n      this.cameraImpactKick = Math.max(this.cameraImpactKick, .3);\n      this.cameraShake = Math.min(.8, this.cameraShake + .4);\n      this.presentation.emitBurst(this.player.position, .45);\n      return { ok: true, mode, playerPosition: this.player.position.toArray() };\n    }\n    return { ok: false, reason: "unknown-mode" };\n  }\n\n'''
          assert anchor in s
          s=s.replace(anchor,method+anchor,1)
          p.write_text(s)
          PY
      - name: Audit-only typecheck
        run: npm run check:arcade
      - name: Build Pages
        run: npm run build:pages
      - name: Start local Pages server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-v99-final-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-v99-final-http.log
          exit 1
      - name: Capture V9.9 kinetic combat feel
        run: node scripts/webgl-arcade-v99-combat-feel-final-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-dancer-v99-combat-feel-final-${{ github.sha }}
          path: artifacts/arcade-v99-combat-feel-final
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary audit files
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/webgl-arcade-v99-combat-feel-final-audit.mjs .github/workflows/arcade-v99-combat-feel-final-audit-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove V9.9 final combat feel audit files"
          git push
