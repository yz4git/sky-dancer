name: Apply Arcade Run curved-course V6.1 once

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply-arcade-course-v61.py"
      - ".github/workflows/arcade-course-v61-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python3 scripts/apply-arcade-course-v61.py
      - run: npm run test:rules
      - run: npm run lint
      - run: npm run build:pages
      - name: Commit V6.1 course readability
        run: |
          rm -f scripts/apply-arcade-course-v61.py .github/workflows/arcade-course-v61-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Arcade Run V6.1: stronger readable course turns" || exit 0
          git push origin main
