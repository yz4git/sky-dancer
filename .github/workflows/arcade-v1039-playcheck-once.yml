name: Arcade V10.3.9 iPhone Playcheck Once
on:
  push:
    paths:
      - '.github/workflows/arcade-v1039-playcheck-once.yml'
permissions:
  contents: write
jobs:
  playcheck:
    runs-on: ubuntu-24.04
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"module"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version
      - name: Build Pages target
        run: npm run build:pages
      - name: Start local Pages target
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-dancer-v1039-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-dancer-v1039-http.log
          exit 1
      - name: Play and capture iPhone landscape review
        run: node scripts/webgl-arcade-v1039-playcheck.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sky-dancer-v1039-playcheck-${{ github.sha }}
          path: artifacts/arcade-v1039-playcheck
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary playcheck files
        if: always()
        run: |
          rm -f scripts/webgl-arcade-v1039-playcheck.mjs .github/workflows/arcade-v1039-playcheck-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove V10.3.9 playcheck files'
          git pull --rebase origin main
          git push origin HEAD:main
