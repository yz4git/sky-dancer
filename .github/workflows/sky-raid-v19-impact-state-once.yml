name: SKY RAID V20 peripheral speed one-shot

on:
  push:
    paths:
      - .github/workflows/sky-raid-v19-impact-state-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply V20 authoritative Turbo presentation fix
        run: python3 .github/skyraid-v19-impact-state.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate implementation
        run: |
          npm run test:fast
          npm run lint
      - name: Commit V20 Turbo presentation fix
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/SkyDancerSkyRaid.ts scripts/webgl-sky-raid-camera-edge-v17.mjs tests/sky-sky-raid.test.ts
          git commit -m "Drive SKY RAID V20 speed FX from Turbo model"
          git push origin HEAD:main
