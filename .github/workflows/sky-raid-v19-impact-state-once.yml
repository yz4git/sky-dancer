name: SKY RAID V19 authoritative impact one-shot

on:
  push:
    paths:
      - .github/workflows/sky-raid-v19-impact-state-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply authoritative kill feedback fix
        run: python3 .github/skyraid-v19-impact-state.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate implementation
        run: |
          npm run test:fast
          npm run lint
      - name: Commit impact fix
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/SkyDancerPlayerWeapons.ts src/sky/SkyDancerAirCombatFxV18.ts tests/sky-sky-raid.test.ts
          git commit -m "Preserve SKY RAID kill feedback across formation recycling"
          git push origin HEAD:main
