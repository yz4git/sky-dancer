name: Arcade Run V40.8 Cinematic Focus

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/arcade-run-v408-cinematic-focus-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply V40.8 cinematic focus
        run: python3 scripts/arcade-run-v408-cinematic-focus.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify V40.8 cinematic focus
        run: |
          npm run check:arcade
          node --import tsx --test tests/sky-arcade-v408-cinematic-focus.test.ts tests/sky-arcade-v407-full-run-polish.test.ts tests/sky-arcade-v406-final-boss-presentation.test.ts tests/sky-arcade-v405-route-reactive-final-boss.test.ts
          npm run test:fast
          npm run lint
          npm run build:pages
      - name: Commit verified V40.8 focus pass
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeV408CinematicFocus.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts src/sky/arcade/SkyDancerArcadeCanvasDemo.ts app/SkyDancerArcadeMode.tsx app/SkyDancerArcadeMode.module.css tests/sky-arcade-v408-cinematic-focus.test.ts
          git commit -m "Arcade Run V40.8: add cinematic scene focus"
          git push origin HEAD:main
