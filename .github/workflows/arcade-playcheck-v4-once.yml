name: Apply Arcade Run playcheck V4 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arcade-playcheck-v4-once.yml"
      - "scripts/apply-arcade-playcheck-v4.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python3 scripts/apply-arcade-playcheck-v4.py
      - run: npm run test:rules
      - run: npm run lint
      - run: npm run build:pages
      - name: Commit V4 improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/SkyDancerArcadeMode.tsx app/SkyDancerArcadeMode.module.css src/sky/arcade/SkyDancerArcadeCamera.ts src/sky/arcade/SkyDancerArcadeRuntime.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts tests/sky-arcade-run.test.ts
          git rm -f scripts/apply-arcade-playcheck-v4.py .github/workflows/arcade-playcheck-v4-once.yml
          git commit -m "Arcade Run playcheck V4 threat and framing polish"
          git push origin main
