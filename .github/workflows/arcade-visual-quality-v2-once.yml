name: Arcade visual quality V2 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply arcade visual quality pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply visual hierarchy pass
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          materials = "src/sky/arcade/SkyDancerArcadeReferenceMaterials.ts"
          replace_once(materials,
              'export const ARCADE_FOG_NEAR = 100;\nexport const ARCADE_FOG_FAR = 660;',
              'export const ARCADE_FOG_NEAR = 88;\nexport const ARCADE_FOG_FAR = 560;')
          replace_once(materials,
              '    zenith: new THREE.Color(city ? 0x285c87 : stage.palette.sky),\n    horizon: new THREE.Color(city ? 0xf8bd76 : stage.palette.fog),\n    fog: new THREE.Color(city ? 0xadadad : stage.palette.fog),\n    cloudLight: new THREE.Color(city ? 0xffe4b3 : night ? 0x7283b5 : stage.biome === "storm" ? 0x90a5b9 : 0xeaf6ff),\n    cloudShadow: new THREE.Color(city ? 0x516080 : stage.biome === "storm" ? 0x253e5b : night ? 0x151e43 : 0x557b98),\n    key: city ? 0xffd298 : night ? 0x98b4ff : stage.biome === "volcano" ? 0xff774a : 0xffe7c4,\n    keyIntensity: city ? 3.0 : night ? 1.4 : 2.5,\n    ambient: city ? .95 : night ? .8 : 1.3,',
              '    zenith: new THREE.Color(city ? 0x0b6198 : stage.palette.sky),\n    horizon: new THREE.Color(city ? 0xffb866 : stage.palette.fog),\n    fog: new THREE.Color(city ? 0x879caf : stage.palette.fog),\n    cloudLight: new THREE.Color(city ? 0xffddb0 : night ? 0x7283b5 : stage.biome === "storm" ? 0x90a5b9 : 0xeaf6ff),\n    cloudShadow: new THREE.Color(city ? 0x405d78 : stage.biome === "storm" ? 0x253e5b : night ? 0x151e43 : 0x557b98),\n    key: city ? 0xffc77b : night ? 0x98b4ff : stage.biome === "volcano" ? 0xff774a : 0xffe7c4,\n    keyIntensity: city ? 3.35 : night ? 1.4 : 2.5,\n    ambient: city ? .7 : night ? .8 : 1.3,')
          replace_once(materials,
              '        float bank=smoothstep(.5,.73,cloud)*smoothstep(-.02,.19,d.y)*(1.0-smoothstep(.5,.85,d.y));\n        vec3 cloudColor=mix(vec3(.22,.3,.43),mix(vec3(.95,.71,.41),vec3(.71,.8,.92),upper),glow*.7+.3);\n        c=mix(c,cloudColor,bank*(.54+.3*storm)*(1.0-night*.65));',
              '        float bank=smoothstep(.53,.77,cloud)*smoothstep(-.03,.2,d.y)*(1.0-smoothstep(.48,.83,d.y));\n        vec3 cloudColor=mix(vec3(.18,.29,.43),mix(vec3(1.03,.65,.3),vec3(.65,.82,1.0),upper),glow*.75+.22);\n        c=mix(c,cloudColor,bank*(.36+.28*storm)*(1.0-night*.65));')
          replace_once(materials,
              '        vec2 fuv=vec2(abs(vFacadeNormal.x)>.5?facade.z:facade.x,facade.y);\n        vec2 cell=fract(fuv*vec2(.88,.62));\n        vec2 cellID=floor(fuv*vec2(.88,.62));\n        float windowMask=step(.22,cell.x)*step(cell.x,.73)*step(.22,cell.y)*step(cell.y,.7);\n        float wall=1.0-step(.5,abs(vFacadeNormal.y));\n        float floorLine=1.0-smoothstep(.025,.075,cell.y);\n        diffuseColor.rgb*=1.0-wall*(windowMask*.28+floorLine*.16);',
              '        vec2 fuv=vec2(abs(vFacadeNormal.x)>.5?facade.z:facade.x,facade.y);\n        vec2 cell=fract(fuv*vec2(.48,.36));\n        vec2 cellID=floor(fuv*vec2(.48,.36));\n        float windowMask=step(.25,cell.x)*step(cell.x,.72)*step(.28,cell.y)*step(cell.y,.69);\n        float wall=1.0-step(.5,abs(vFacadeNormal.y));\n        float floorLine=1.0-smoothstep(.018,.05,cell.y);\n        float verticalPanel=smoothstep(.82,.94,fract(fuv.x*.075+vBuildingSeed*.031));\n        diffuseColor.rgb*=1.0-wall*(windowMask*.14+floorLine*.055+verticalPanel*.09);')
          replace_once(materials,
              '        totalEmissiveRadiance+=lightColor*windowMask*wall*occupied*(.65+arcadeNight*.9);',
              '        totalEmissiveRadiance+=lightColor*windowMask*wall*occupied*(.38+arcadeNight*1.0);')
          replace_once(materials,
              '  material.customProgramCacheKey=()=>"arcade-city-facade-reference-v1";',
              '  material.customProgramCacheKey=()=>"arcade-city-facade-reference-v2";')
          replace_once(materials,
              '        float fog=smoothstep(100.0,630.0,vDepth);\n        c=mix(c,fogColor,fog);\n        gl_FragColor=vec4(c,soft*(.72+billow*.22)*(1.0-fog*.75));',
              '        float fog=smoothstep(90.0,545.0,vDepth);\n        c=mix(c,fogColor,fog);\n        float edgeLight=pow(max(0.0,1.0-facing),2.5)*light;\n        c+=lit*edgeLight*.13;\n        gl_FragColor=vec4(c,soft*(.42+billow*.13)*(1.0-fog*.82));')
          old_water = '''        vec2 uv=vWorld.xz;
        float ripples=fbm(uv*vec2(.23,1.8)+vec2(time*.1,time*.7));
        float glint=pow(max(0.0,sin(uv.y*2.5+time*1.1)+ripples-.3),6.0);
        float sunPath=exp(-pow((uv.x+13.0)/14.0,2.0));
        vec3 water=mix(vec3(.035,.16,.21),vec3(.05,.22,.31),ripples);
        water+=mix(vec3(.9,.39,.08),vec3(.04,.4,.7),night)*sunPath*(.1+min(2.0,glint)*.5);
        water=mix(water,fogColor,smoothstep(110.0,660.0,vDepth));
        gl_FragColor=vec4(water,1.0);'''
          new_water = '''        vec2 uv=vWorld.xz;
        float broad=fbm(uv*vec2(.055,.24)+vec2(time*.018,time*.12));
        float cross=fbm(uv*vec2(.17,.075)+vec2(-time*.055,time*.035)+17.0);
        float ripples=mix(broad,cross,.34);
        float glint=pow(max(0.0,cross*.9+broad*.55-.63),5.0);
        float sunPath=exp(-pow((uv.x+11.0)/18.0,2.0));
        vec3 water=mix(vec3(.025,.13,.19),vec3(.035,.27,.38),ripples);
        water+=mix(vec3(1.05,.42,.07),vec3(.04,.42,.78),night)*sunPath*(.075+glint*.48);
        water=mix(water,fogColor,smoothstep(105.0,560.0,vDepth));
        gl_FragColor=vec4(water,1.0);'''
          replace_once(materials, old_water, new_water)

          world = "src/sky/arcade/SkyDancerArcadeReferenceWorld.ts"
          replace_once(world,
              '    const hemi=new THREE.HemisphereLight(0xc5dcf5,0x253142,palette.ambient);\n    const key=new THREE.DirectionalLight(palette.key,palette.keyIntensity);\n    key.position.copy(ARCADE_SUN_DIRECTION).multiplyScalar(250);\n    const rim=new THREE.DirectionalLight(0x64d6ff,.85);\n    rim.position.set(80,25,45);',
              '    const hemi=new THREE.HemisphereLight(0xc9e7ff,0x172938,palette.ambient);\n    const key=new THREE.DirectionalLight(palette.key,palette.keyIntensity);\n    key.position.copy(ARCADE_SUN_DIRECTION).multiplyScalar(250);\n    const rim=new THREE.DirectionalLight(0x55cfff,1.05);\n    rim.position.set(80,25,45);')
          replace_once(world,
              '      const towers=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),paint(0x66768a),150);\n      towers.name="arcade-distant-metropolis";\n      for(let i=0;i<150;i++){\n        const x=(random(i+19)-.5)*760;\n        const h=12+random(i+117)*62;\n        this.matrixObject.position.set(x,-34+h/2,-300-random(i+613)*220);\n        this.matrixObject.scale.set(3+random(i+13)*9,h,4+random(i+201)*10);',
              '      const towers=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),paint(0x526b7d),108);\n      towers.name="arcade-distant-metropolis";\n      for(let i=0;i<108;i++){\n        const x=(random(i+19)-.5)*790;\n        const hero=i%13===0;\n        const h=14+random(i+117)*55+(hero?35:0);\n        this.matrixObject.position.set(x,-39+h/2,-315-random(i+613)*250);\n        this.matrixObject.scale.set((hero?2.7:4)+random(i+13)*8,h,(hero?3.4:5)+random(i+201)*9);')
          old_city = '''  private addCity(group:THREE.Group,stage:SkyDancerArcadeStageDefinition,index:number,facade:THREE.Material):void {
    const count=48;
    const towers=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),facade,count);
    towers.name="arcade-product-city-towers-"+index;
    const roofs=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),paint(0x53616d),count);
    const spires=new THREE.InstancedMesh(new THREE.CylinderGeometry(.14,.23,1,6),paint(0x697989),16);
    let n=0;let a=0;
    for(const side of [-1,1])for(let row=0;row<4;row++)for(let lane=0;lane<6;lane++){
      const seed=index*229+n*11;
      const h=lane===0 ? 10+random(seed+3)*17 : 16+random(seed+4)*53;
      const w=4+random(seed+13)*5.4;
      const d=5.4+random(seed+29)*7;
      const x=side*(29+lane*14+random(seed+7)*5);
      const z=-43+row*27+random(seed+61)*6;
      this.matrixObject.position.set(x,-25+h/2,z);
      this.matrixObject.scale.set(w,h,d);this.matrixObject.rotation.set(0,0,0);this.matrixObject.updateMatrix();
      towers.setMatrixAt(n,this.matrixObject.matrix);
      towers.setColorAt(n,new THREE.Color(stage.biome==="night"?0x253552:0x596974).lerp(new THREE.Color(0xadb3b2),random(seed+37)*.5));
      this.matrixObject.position.y=-25+h+1;
      this.matrixObject.scale.set(w*.61,2,d*.66);this.matrixObject.updateMatrix();roofs.setMatrixAt(n,this.matrixObject.matrix);
      if(n%3===0){
        const height=3+random(seed+119)*5;
        this.matrixObject.position.y=-23+h+height/2;this.matrixObject.scale.set(1,height,1);this.matrixObject.updateMatrix();
        spires.setMatrixAt(a++,this.matrixObject.matrix);
      }
      n++;
    }
    towers.computeBoundingSphere();roofs.computeBoundingSphere();spires.count=a;spires.computeBoundingSphere();
    group.add(towers,roofs,spires);
    mesh(group,new THREE.BoxGeometry(250,1,114),paint(0x263747),0,-26);
    if(this.water){const river=mesh(group,new THREE.PlaneGeometry(40,114),this.water,-.4,-25.35);river.rotation.x=-Math.PI/2;}
    const bank=paint(0x66757e),road=paint(0x182936),light=paint(0xffb66a,0xff8e36);
    for(const side of [-1,1]){
      mesh(group,new THREE.BoxGeometry(2.4,1.3,114),bank,side*21,-25.1);
      mesh(group,new THREE.BoxGeometry(3.5,.12,114),road,side*24,-24.32);
      mesh(group,new THREE.BoxGeometry(.07,.06,112),light,side*24,-24.22);
      for(let r=0;r<4;r++)mesh(group,new THREE.BoxGeometry(83,.14,2.2),road,side*66,-24.6,-53+r*28);
    }
    if(index%3===1){
      mesh(group,new THREE.BoxGeometry(52,.9,4),bank,0,-18.5,0);
      mesh(group,new THREE.BoxGeometry(51,.05,2.5),road,0,-18,0);
      for(const side of [-1,1]){
        mesh(group,new THREE.CylinderGeometry(.55,.7,9,8),bank,side*18,-21,0);
        mesh(group,new THREE.BoxGeometry(52,.06,.08),light,0,-17.85,side*1.65);
      }
    }
  }'''
