name: Arcade visual quality V2 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply arcade visual quality pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply visual hierarchy pass
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if count != 1: raise SystemExit(f"{path}: expected 1 match, got {count}: {old[:90]!r}")
              p.write_text(text.replace(old,new,1))

          m="src/sky/arcade/SkyDancerArcadeReferenceMaterials.ts"
          rep(m,"export const ARCADE_FOG_NEAR = 100;","export const ARCADE_FOG_NEAR = 88;")
          rep(m,"export const ARCADE_FOG_FAR = 660;","export const ARCADE_FOG_FAR = 560;")
          rep(m,'zenith: new THREE.Color(city ? 0x285c87 : stage.palette.sky)','zenith: new THREE.Color(city ? 0x0b6198 : stage.palette.sky)')
          rep(m,'horizon: new THREE.Color(city ? 0xf8bd76 : stage.palette.fog)','horizon: new THREE.Color(city ? 0xffb866 : stage.palette.fog)')
          rep(m,'fog: new THREE.Color(city ? 0xadadad : stage.palette.fog)','fog: new THREE.Color(city ? 0x879caf : stage.palette.fog)')
          rep(m,'cloudLight: new THREE.Color(city ? 0xffe4b3 : night ? 0x7283b5 : stage.biome === "storm" ? 0x90a5b9 : 0xeaf6ff)','cloudLight: new THREE.Color(city ? 0xffddb0 : night ? 0x7283b5 : stage.biome === "storm" ? 0x90a5b9 : 0xeaf6ff)')
          rep(m,'cloudShadow: new THREE.Color(city ? 0x516080 : stage.biome === "storm" ? 0x253e5b : night ? 0x151e43 : 0x557b98)','cloudShadow: new THREE.Color(city ? 0x405d78 : stage.biome === "storm" ? 0x253e5b : night ? 0x151e43 : 0x557b98)')
          rep(m,'key: city ? 0xffd298 : night ? 0x98b4ff : stage.biome === "volcano" ? 0xff774a : 0xffe7c4','key: city ? 0xffc77b : night ? 0x98b4ff : stage.biome === "volcano" ? 0xff774a : 0xffe7c4')
          rep(m,'keyIntensity: city ? 3.0 : night ? 1.4 : 2.5','keyIntensity: city ? 3.35 : night ? 1.4 : 2.5')
          rep(m,'ambient: city ? .95 : night ? .8 : 1.3','ambient: city ? .7 : night ? .8 : 1.3')
          rep(m,'float bank=smoothstep(.5,.73,cloud)*smoothstep(-.02,.19,d.y)*(1.0-smoothstep(.5,.85,d.y));','float bank=smoothstep(.53,.77,cloud)*smoothstep(-.03,.2,d.y)*(1.0-smoothstep(.48,.83,d.y));')
          rep(m,'vec3 cloudColor=mix(vec3(.22,.3,.43),mix(vec3(.95,.71,.41),vec3(.71,.8,.92),upper),glow*.7+.3);','vec3 cloudColor=mix(vec3(.18,.29,.43),mix(vec3(1.03,.65,.3),vec3(.65,.82,1.0),upper),glow*.75+.22);')
          rep(m,'c=mix(c,cloudColor,bank*(.54+.3*storm)*(1.0-night*.65));','c=mix(c,cloudColor,bank*(.36+.28*storm)*(1.0-night*.65));')
          rep(m,'vec2 cell=fract(fuv*vec2(.88,.62));','vec2 cell=fract(fuv*vec2(.48,.36));')
          rep(m,'vec2 cellID=floor(fuv*vec2(.88,.62));','vec2 cellID=floor(fuv*vec2(.48,.36));')
          rep(m,'float windowMask=step(.22,cell.x)*step(cell.x,.73)*step(.22,cell.y)*step(cell.y,.7);','float windowMask=step(.25,cell.x)*step(cell.x,.72)*step(.28,cell.y)*step(cell.y,.69);')
          rep(m,'float floorLine=1.0-smoothstep(.025,.075,cell.y);','float floorLine=1.0-smoothstep(.018,.05,cell.y);')
          rep(m,'diffuseColor.rgb*=1.0-wall*(windowMask*.28+floorLine*.16);','float verticalPanel=smoothstep(.82,.94,fract(fuv.x*.075+vBuildingSeed*.031)); diffuseColor.rgb*=1.0-wall*(windowMask*.14+floorLine*.055+verticalPanel*.09);')
          rep(m,'totalEmissiveRadiance+=lightColor*windowMask*wall*occupied*(.65+arcadeNight*.9);','totalEmissiveRadiance+=lightColor*windowMask*wall*occupied*(.38+arcadeNight*1.0);')
          rep(m,'arcade-city-facade-reference-v1','arcade-city-facade-reference-v2')
          rep(m,'float fog=smoothstep(100.0,630.0,vDepth);','float fog=smoothstep(90.0,545.0,vDepth);')
          rep(m,'gl_FragColor=vec4(c,soft*(.72+billow*.22)*(1.0-fog*.75));','float edgeLight=pow(max(0.0,1.0-facing),2.5)*light; c+=lit*edgeLight*.13; gl_FragColor=vec4(c,soft*(.42+billow*.13)*(1.0-fog*.82));')
          rep(m,'float ripples=fbm(uv*vec2(.23,1.8)+vec2(time*.1,time*.7));','float broad=fbm(uv*vec2(.055,.24)+vec2(time*.018,time*.12)); float cross=fbm(uv*vec2(.17,.075)+vec2(-time*.055,time*.035)+17.0); float ripples=mix(broad,cross,.34);')
          rep(m,'float glint=pow(max(0.0,sin(uv.y*2.5+time*1.1)+ripples-.3),6.0);','float glint=pow(max(0.0,cross*.9+broad*.55-.63),5.0);')
          rep(m,'float sunPath=exp(-pow((uv.x+13.0)/14.0,2.0));','float sunPath=exp(-pow((uv.x+11.0)/18.0,2.0));')
          rep(m,'vec3 water=mix(vec3(.035,.16,.21),vec3(.05,.22,.31),ripples);','vec3 water=mix(vec3(.025,.13,.19),vec3(.035,.27,.38),ripples);')
          rep(m,'water+=mix(vec3(.9,.39,.08),vec3(.04,.4,.7),night)*sunPath*(.1+min(2.0,glint)*.5);','water+=mix(vec3(1.05,.42,.07),vec3(.04,.42,.78),night)*sunPath*(.075+glint*.48);')
          rep(m,'water=mix(water,fogColor,smoothstep(110.0,660.0,vDepth));','water=mix(water,fogColor,smoothstep(105.0,560.0,vDepth));')

          w="src/sky/arcade/SkyDancerArcadeReferenceWorld.ts"
          rep(w,'new THREE.HemisphereLight(0xc5dcf5,0x253142,palette.ambient)','new THREE.HemisphereLight(0xc9e7ff,0x172938,palette.ambient)')
          rep(w,'new THREE.DirectionalLight(0x64d6ff,.85)','new THREE.DirectionalLight(0x55cfff,1.05)')
          rep(w,'paint(0x66768a),150','paint(0x526b7d),108')
          rep(w,'for(let i=0;i<150;i++){','for(let i=0;i<108;i++){')
          rep(w,'const h=12+random(i+117)*62;','const hero=i%13===0; const h=14+random(i+117)*55+(hero?35:0);')
          rep(w,'this.matrixObject.position.set(x,-34+h/2,-300-random(i+613)*220);','this.matrixObject.position.set(x,-39+h/2,-315-random(i+613)*250);')
          rep(w,'this.matrixObject.scale.set(3+random(i+13)*9,h,4+random(i+201)*10);','this.matrixObject.scale.set((hero?2.7:4)+random(i+13)*8,h,(hero?3.4:5)+random(i+201)*9);')
          rep(w,'const h=lane===0 ? 10+random(seed+3)*17 : 16+random(seed+4)*53;','const hero=lane>1 && random(seed+97)>.77; const h=lane===0 ? 9+random(seed+3)*14 : 15+random(seed+4)*45+(hero?22:0);')
          rep(w,'const w=4+random(seed+13)*5.4;','const w=(hero?3.2:4.1)+random(seed+13)*(hero?3.4:5.1);')
          rep(w,'const d=5.4+random(seed+29)*7;','const d=5+random(seed+29)*6.5;')
          rep(w,'const x=side*(29+lane*14+random(seed+7)*5);','const x=side*(31+lane*15+random(seed+7)*4.2);')
          rep(w,'towers.setColorAt(n,new THREE.Color(stage.biome==="night"?0x253552:0x596974).lerp(new THREE.Color(0xadb3b2),random(seed+37)*.5));','towers.setColorAt(n,new THREE.Color(stage.biome==="night"?0x172d4b:0x39586b).lerp(new THREE.Color(stage.biome==="night"?0x536b8e:0x94abba),.12+random(seed+37)*.62));')
          rep(w,'if(n%3===0){','if(hero || n%3===0){')
          rep(w,'const height=3+random(seed+119)*5;','const height=3+random(seed+119)*(hero?10:5);')
          rep(w,'mesh(group,new THREE.BoxGeometry(250,1,114),paint(0x263747),0,-26);','mesh(group,new THREE.BoxGeometry(250,1,114),paint(stage.biome==="night"?0x111d31:0x213746),0,-26);')
          rep(w,'const bank=paint(0x66757e),road=paint(0x182936),light=paint(0xffb66a,0xff8e36);','const bank=paint(stage.biome==="night"?0x314559:0x506879),road=paint(0x132635),light=paint(0xffc06e,0xff963b);')
          rep(w,'const cloud=new THREE.InstancedMesh(new THREE.SphereGeometry(1,12,8),mat,30);','const cloud=new THREE.InstancedMesh(new THREE.SphereGeometry(1,12,8),mat,["cloud","storm"].includes(stage.biome)?30:18);')
          rep(w,'for(let cluster=0;cluster<5;cluster++)for(let puff=0;puff<6;puff++){','for(let cluster=0;cluster<(inCloud?5:3);cluster++)for(let puff=0;puff<6;puff++){')
          rep(w,'const baseX=side*(inCloud?14:24)+side*random(seed+3)*28;','const baseX=side*(inCloud?18:38)+side*random(seed+3)*(inCloud?30:34);')
          rep(w,'const baseZ=-42+cluster*21;','const baseZ=-44+cluster*(inCloud?21:37);')
          rep(w,'const radius=3.2+random(seed+puff*17)*4.4;','const radius=(inCloud?3.2:2.1)+random(seed+puff*17)*(inCloud?3.6:2.2);')
          rep(w,'this.matrixObject.position.set(baseX+(puff%3-1)*5,-12+random(seed)*4+Math.floor(puff/3)*1.8,baseZ+(puff%2?4:-4));','this.matrixObject.position.set(baseX+(puff%3-1)*(inCloud?5:4),-12+random(seed)*3+Math.floor(puff/3)*1.4,baseZ+(puff%2?4:-4));')
          rep(w,'if(!inCloud)this.matrixObject.position.y-=3;','if(!inCloud)this.matrixObject.position.y-=5;')
          rep(w,'this.matrixObject.scale.set(radius*1.65,radius*.72,radius*1.25);','this.matrixObject.scale.set(radius*1.55,radius*.62,radius*1.2);')

          c="src/sky/arcade/SkyDancerArcadeCinematicRenderer.ts"
          rep(c,'bloomStrength:{value:.18}','bloomStrength:{value:.23}')
          rep(c,'vec2 r=texel*3.5;','vec2 r=texel*3.2;')
          rep(c,'vec3 halo=bright(vUv)*.2;','vec3 halo=bright(vUv)*.22;')
          rep(c,'float edge=smoothstep(.24,.62,length(p));','float edge=smoothstep(.25,.66,length(p));')
          rep(c,'vec3 result=(source+halo*bloomStrength)*(1.0-edge*.16);','vec3 result=(source+halo*bloomStrength)*(1.0-edge*.12); float luma=dot(result,vec3(.2126,.7152,.0722)); result=mix(vec3(luma),result,1.08); result=(result-.5)*1.055+.5; result+=vec3(.025,.006,-.012)*smoothstep(.62,1.25,luma); result+=vec3(-.012,.002,.024)*(1.0-smoothstep(.16,.5,luma));')
          rep(c,'gl_FragColor=vec4(result,1.0);','gl_FragColor=vec4(max(result,vec3(0.0)),1.0);')
          rep(c,'turbo ? .28 : .16','turbo ? .36 : .22')

          p="src/sky/arcade/SkyDancerArcadeProductPresentation.ts"
          rep(p,'mix(vec3(3.6,.66,.05),vec3(6.0,3.6,1.3),a)','mix(vec3(5.2,.48,.025),vec3(7.4,4.7,1.55),a)')
          rep(p,'const count = this.smoke ? 7 : 23;','const count = this.smoke ? 5 : 30;')
          rep(p,'particle.duration = this.smoke ? .85 + noise(seed + 4) * .8 : .25 + noise(seed + 4) * .6;','particle.duration = this.smoke ? .7 + noise(seed + 4) * .65 : .28 + noise(seed + 4) * .62;')
          rep(p,'particle.size = (this.smoke ? 1.4 + noise(seed + 5) * 2.4 : .25 + noise(seed + 5) * .6) * scale;','particle.size = (this.smoke ? 1.15 + noise(seed + 5) * 1.9 : .28 + noise(seed + 5) * .72) * scale;')
          rep(p,'(1 - t) * (this.smoke ? .65 : 1)','(1 - t) * (this.smoke ? .46 : 1)')
          rep(p,'new THREE.Color(enemy ? 0xffa65e : 0xfff0d6)','new THREE.Color(enemy ? 0xff6654 : 0xc8f7ff)')
          rep(p,'width: enemy ? .13 : .2','width: enemy ? .16 : .23')
          rep(p,'color: 0xc8eafa, transparent: true, opacity: .08','color: 0xd7f6ff, transparent: true, opacity: .065')
          rep(p,'snapshot.turboActive ? .35 : .055','snapshot.turboActive ? .42 : .045')

          g="src/sky/arcade/SkyDancerArcadeWebGLDemo.ts"
          rep(g,'projectile.owner === "player-missile" ? 0x64e9ff : 0xfff3ad','projectile.owner === "player-missile" ? 0x64e9ff : 0xc8f8ff')
          rep(g,'new THREE.ConeGeometry(0.12, 0.72, 7)','new THREE.ConeGeometry(0.13, 0.84, 7)')
          rep(g,'new THREE.CylinderGeometry(0.035, 0.06, projectile.owner === "enemy" ? 1.1 : 0.78, 5)','new THREE.CylinderGeometry(0.04, 0.072, projectile.owner === "enemy" ? 1.3 : 1.55, 5)')
          rep(g,'this.cameraShake = Math.min(.35, this.cameraShake + .06);','this.cameraShake = Math.min(.38, this.cameraShake + .075);')
          rep(g,'-target.depth), .35);','-target.depth), .52);')

          css="app/SkyDancerArcadeMode.module.css"
          rep(css,'top:max(70px,calc(env(safe-area-inset-top) + 66px));transform:translateX(-50%);width:min(520px,58vw)','top:max(76px,calc(env(safe-area-inset-top) + 72px));transform:translateX(-50%);width:min(400px,44vw)')
          rep(css,'padding:3px 6px;border:1px solid rgba(255,255,255,.16);border-radius:5px;background:rgba(6,13,30,.32);opacity:.48','padding:2px 5px;border:1px solid rgba(255,255,255,.12);border-radius:5px;background:rgba(6,13,30,.2);opacity:.34')
          rep(css,'transform:scale(1.02);border-color:#ffe06b;background:rgba(23,28,39,.48);box-shadow:0 0 12px rgba(255,209,75,.2);opacity:.92','transform:scale(1.015);border-color:rgba(255,224,107,.78);background:rgba(23,28,39,.34);box-shadow:0 0 9px rgba(255,209,75,.14);opacity:.78')

          t="tests/sky-arcade-run.test.ts"
          rep(t,'assert.match(css, /\\.routeOverlay\\{[^}]*top:max\\(70px/);','assert.match(css, /\\.routeOverlay\\{[^}]*top:max\\(76px/);')
          rep(t,'assert.match(css, /\\.routeOption\\{padding:3px 6px/);','assert.match(css, /\\.routeOption\\{padding:2px 5px/);')
          PY
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Commit visual quality pass
        shell: bash
        run: |
          rm .github/workflows/arcade-visual-quality-v2-once.yml
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Arcade visual quality V2: depth, materials, effects"
          git push origin HEAD:main
