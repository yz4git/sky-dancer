name: Arcade Speed Dogfight V8 One Shot

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/apply-arcade-speed-dogfight-v8.py"
      - ".github/workflows/arcade-speed-dogfight-v8-once.yml"

permissions:
  contents: write

concurrency:
  group: arcade-speed-dogfight-v8-once
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply V8 speed and dogfight pass
        run: python3 scripts/apply-arcade-speed-dogfight-v8.py
      - name: Rules regression
        run: npm run test:rules
      - name: Lint
        run: npm run lint
      - name: Pages production build
        run: npm run build:pages
      - name: Commit V8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Arcade Run V8: faster flight and close dogfights"
          git push origin HEAD:main
