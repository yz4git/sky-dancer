name: Arcade V10.3.8 Stage Handoff Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arcade-v1038-stage-handoff-audit-once.yml"

permissions:
  contents: write

env:
  SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome

jobs:
  handoff-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version
      - name: Inject deterministic V10.3.8 stage handoff bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/SkyDancerArcadeMode.tsx');s=p.read_text()
          needle='''        demoRef.current = demo;\n      }'''
          insert='''        demoRef.current = demo;\n        const auditDemo = demo as SkyDancerArcadeWebGLDemo;\n        let handoffTargetStage = "dawn-city";\n        (globalThis as unknown as { __skyDancerV1038HandoffAudit?: { prepare: (params: { from: string; to: string; label: string }) => unknown; step: () => unknown } }).__skyDancerV1038HandoffAudit = {\n          prepare: ({ from, to }) => {\n            const target = auditDemo as unknown as Record<string, any>;\n            cancelAnimationFrame(Number(target.animationFrame) || 0); target.animationFrame = 0;\n            const runtime = target.runtime as Record<string, any>;\n            const fromStage = skyDancerArcadeStageById(from as any);\n            runtime.stage=fromStage; runtime.status="running"; runtime.statusBeforePause="running"; runtime.stageTime=fromStage.durationSeconds*.96; runtime.distance=runtime.stageTime*fromStage.courseSpeed; runtime.runTime=runtime.stageTime;\n            runtime.playerX=.45; runtime.playerY=-.28; runtime.playerVX=0; runtime.playerVY=0; runtime.playerHp=100; runtime.turbo=80; runtime.enemies=[]; runtime.projectiles=[]; runtime.hazards=[]; runtime.impactEvents=[]; runtime.nextWaveAt=1e9; runtime.nextHazardAt=1e9; runtime.bossSpawned=true; runtime.bossDefeated=true; runtime.stageSerial=Number(runtime.stageSerial||0)+1;\n            target.environment.setStage(fromStage); target.currentStageId=fromStage.id; target.clearEntityVisuals(); target.presentation.setStage();\n            let snapshot=runtime.getSnapshot(); target.previousSnapshot=snapshot;\n            for(let i=0;i<90;i++){target.sync(snapshot,1/60);target.previousSnapshot=snapshot;}\n            target.camera.updateMatrixWorld(); target.cinematic.render(target.scene,target.camera,snapshot.turboActive,target.presentationFx); target.onSnapshot(snapshot);\n            handoffTargetStage=to;\n            return {stageId:snapshot.stage.id,cameraQuaternion:[target.camera.quaternion.x,target.camera.quaternion.y,target.camera.quaternion.z,target.camera.quaternion.w]};\n          },\n          step: () => {\n            const target=auditDemo as unknown as Record<string, any>; const runtime=target.runtime as Record<string, any>;\n            const nextStage=skyDancerArcadeStageById(handoffTargetStage as any);\n            if(runtime.stage.id!==nextStage.id){runtime.stage=nextStage;runtime.stageTime=0;runtime.distance=0;runtime.stageSerial=Number(runtime.stageSerial||0)+1;runtime.status="running";runtime.enemies=[];runtime.projectiles=[];runtime.hazards=[];runtime.impactEvents=[];}\n            const snapshot=runtime.getSnapshot(); target.sync(snapshot,1/60); target.previousSnapshot=snapshot; target.camera.updateMatrixWorld(); target.cinematic.render(target.scene,target.camera,snapshot.turboActive,target.presentationFx); target.onSnapshot(snapshot);\n            const backdrop=target.scene.getObjectByName("arcade-product-backdrop") as any;\n            return {stageId:snapshot.stage.id,cameraQuaternion:[target.camera.quaternion.x,target.camera.quaternion.y,target.camera.quaternion.z,target.camera.quaternion.w],backdrop:backdrop?[backdrop.position.x,backdrop.position.y,backdrop.position.z,backdrop.rotation.x,backdrop.rotation.y,backdrop.rotation.z]:[99]};\n          },\n        };\n      }'''
          assert needle in s,'WebGL demo attachment block changed';p.write_text(s.replace(needle,insert,1))
          PY
      - name: Audit bridge typecheck
        run: npm run check:arcade
      - name: Build audit target
        run: npm run build:pages
      - name: Start local Pages target
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-dancer-v1038-handoff-http.log 2>&1 &
          for i in {1..30}; do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/sky-dancer-v1038-handoff-http.log; exit 1
      - name: Capture V10.3.8 stage handoffs
        run: node scripts/webgl-arcade-v1038-stage-handoff-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-dancer-v1038-stage-handoff-audit-${{ github.sha }}
          path: artifacts/arcade-v1038-stage-handoff-audit
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary handoff audit files
        if: success()
        run: |
          set -euo pipefail
          git checkout -- app/SkyDancerArcadeMode.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/webgl-arcade-v1038-stage-handoff-audit.mjs .github/workflows/arcade-v1038-stage-handoff-audit-once.yml
          git commit -m "Remove V10.3.8 stage handoff audit files"
          git push
