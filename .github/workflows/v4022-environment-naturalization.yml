name: Sky Dancer V40.25 Signature Naturalization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v4022-environment-naturalization.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply V40.25 signature naturalization
        run: python3 scripts/arcade-run-v4025-signature-naturalization.py
      - name: Run related Arcade verification
        run: |
          npm run check:arcade
          node --import tsx --test \
            tests/sky-arcade-v13-flagship.test.ts \
            tests/sky-arcade-v16-setpiece-pass.test.ts \
            tests/sky-arcade-v4022-environment-naturalization.test.ts \
            tests/sky-arcade-v4023-natural-rock-masses.test.ts \
            tests/sky-arcade-v4025-signature-setpiece-naturalization.test.ts
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version
      - name: Build Pages artifact
        run: npm run build:pages
      - name: Start production preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-dancer-v4025-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-dancer-v4025-http.log
          exit 1
      - name: Capture all eleven stages after naturalization
        run: node scripts/webgl-all-stage-visual-audit.mjs
      - name: Upload V40.25 visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-dancer-v4025-signature-naturalization-${{ github.sha }}
          path: artifacts/all-stage-visual
          if-no-files-found: error
          retention-days: 7
      - name: Commit V40.25 implementation
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeV11Setpieces.ts \
                  tests/sky-arcade-v4025-signature-setpiece-naturalization.test.ts
          git commit -m "Arcade Run V40.25: naturalize signature canyon walls"
          git push origin HEAD:main
