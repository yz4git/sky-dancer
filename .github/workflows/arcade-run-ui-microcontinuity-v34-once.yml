name: Arcade Run V34 centered HUD exit validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/arcade-run-ui-microcontinuity-v34-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Preserve centered HUD transforms during exit
        run: python3 scripts/arcade-run-ui-microcontinuity-v34-transform-fix.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Arcade Run
        run: |
          npm run check:arcade
          node --import tsx --test tests/sky-arcade-v33-ui-continuity.test.ts tests/sky-arcade-v34-ui-microcontinuity.test.ts
          npm run test:fast
          npm run lint
          npm run build:pages
      - name: Commit verified V34 transform polish
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add app/SkyDancerArcadeMode.module.css tests/sky-arcade-v34-ui-microcontinuity.test.ts
          git commit -m "Arcade Run V34.1: preserve HUD position through exits"
          git push origin HEAD:main
