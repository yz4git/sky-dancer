name: SKY RAID V21 combat handoff one-shot

on:
  push:
    paths:
      - .github/workflows/sky-raid-combat-handoff-v21-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply combat handoff review pass
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              source = path.read_text()
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one marker in {path_str}: {old[:100]!r}")
              path.write_text(source.replace(old, new, 1))

          replace_once(
              "src/sky/SkyDancerSkyRaidRules.ts",
              "export const SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS = 104;\nexport const SKY_DANCER_SKY_RAID_TARGET_SECONDS = 120;",
              "export const SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS = 104;\nexport const SKY_DANCER_SKY_RAID_TARGET_SECONDS = 120;\n\n// Free-flight kills need enough time for a real bank/reacquire/lock handoff on phone.\n// This is intentionally longer than the old 4.2 s timer but still short enough to reward momentum.\nexport const SKY_DANCER_SKY_RAID_CHAIN_GRACE_SECONDS = 5.6;\n\n// The flagship card is an entrance cue, not a persistent combat overlay.\nexport const SKY_DANCER_SKY_RAID_BOSS_CUE_SECONDS = 2.4;\n\nexport function skyDancerSkyRaidBossCueActive(elapsedSeconds: number, bossForced: boolean): boolean {\n  if (!bossForced) return false;\n  const local = elapsedSeconds - SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS;\n  return local >= 0 && local < SKY_DANCER_SKY_RAID_BOSS_CUE_SECONDS;\n}",
          )

          replace_once(
              "src/sky/SkyDancerSkyRaid.ts",
              "  SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS,\n  skyDancerSkyRaidActFor,",
              "  SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS,\n  SKY_DANCER_SKY_RAID_CHAIN_GRACE_SECONDS,\n  skyDancerSkyRaidActFor,",
          )
          replace_once(
              "src/sky/SkyDancerSkyRaid.ts",
              "      state.chainTimer = 4.2;",
              "      state.chainTimer = SKY_DANCER_SKY_RAID_CHAIN_GRACE_SECONDS;",
          )

          replace_once(
              "app/SkyDancerSkyRaidOverlay.tsx",
              "} from \"../src/sky/SkyDancerSkyRaid\";\nimport legacyStyles",
              "} from \"../src/sky/SkyDancerSkyRaid\";\nimport { skyDancerSkyRaidBossCueActive } from \"../src/sky/SkyDancerSkyRaidRules\";\nimport legacyStyles",
          )
          replace_once(
              "app/SkyDancerSkyRaidOverlay.tsx",
              "  const killCueVisible = snapshot.killCueSecondsRemaining > 0;\n  const accent",
              "  const killCueVisible = snapshot.killCueSecondsRemaining > 0;\n  const bossCueVisible = skyDancerSkyRaidBossCueActive(snapshot.elapsedSeconds, snapshot.bossForced);\n  const accent",
          )
          replace_once(
              "app/SkyDancerSkyRaidOverlay.tsx",
              "      {snapshot.bossForced && !snapshot.clear && (",
              "      {bossCueVisible && !snapshot.clear && (",
          )

          replace_once(
              "tests/sky-sky-raid.test.ts",
              "  SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS,\n  skyDancerSkyRaidActFor,",
              "  SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS,\n  SKY_DANCER_SKY_RAID_BOSS_CUE_SECONDS,\n  SKY_DANCER_SKY_RAID_CHAIN_GRACE_SECONDS,\n  skyDancerSkyRaidActFor,",
          )
          replace_once(
              "tests/sky-sky-raid.test.ts",
              "  skyDancerSkyRaidPressure,\n  skyDancerSkyRaidRushActive,",
              "  skyDancerSkyRaidPressure,\n  skyDancerSkyRaidRushActive,\n  skyDancerSkyRaidBossCueActive,",
          )

          test_marker = '''test("SKY RAID scoring rewards chain, Turbo and formation rush", () => {'''
          tests = '''test("SKY RAID free-flight chain window supports a bank, reacquire and relock handoff", () => {\n  assert.ok(SKY_DANCER_SKY_RAID_CHAIN_GRACE_SECONDS >= 5);\n  assert.ok(SKY_DANCER_SKY_RAID_CHAIN_GRACE_SECONDS < 7);\n  const raidSource = readFileSync(new URL("../src/sky/SkyDancerSkyRaid.ts", import.meta.url), "utf8");\n  assert.match(raidSource, /state\\.chainTimer = SKY_DANCER_SKY_RAID_CHAIN_GRACE_SECONDS/);\n});\n\ntest("SKY RAID flagship cue is a short entrance card instead of a persistent combat banner", () => {\n  const trigger = SKY_DANCER_SKY_RAID_BOSS_TRIGGER_SECONDS;\n  assert.equal(skyDancerSkyRaidBossCueActive(trigger - 0.01, true), false);\n  assert.equal(skyDancerSkyRaidBossCueActive(trigger, true), true);\n  assert.equal(skyDancerSkyRaidBossCueActive(trigger + SKY_DANCER_SKY_RAID_BOSS_CUE_SECONDS - 0.01, true), true);\n  assert.equal(skyDancerSkyRaidBossCueActive(trigger + SKY_DANCER_SKY_RAID_BOSS_CUE_SECONDS, true), false);\n  assert.equal(skyDancerSkyRaidBossCueActive(trigger, false), false);\n  const overlaySource = readFileSync(new URL("../app/SkyDancerSkyRaidOverlay.tsx", import.meta.url), "utf8");\n  assert.match(overlaySource, /bossCueVisible = skyDancerSkyRaidBossCueActive/);\n  assert.match(overlaySource, /\\{bossCueVisible && !snapshot\\.clear && \\(/);\n  assert.doesNotMatch(overlaySource, /\\{snapshot\\.bossForced && !snapshot\\.clear && \\(/);\n});\n\n'''
          replace_once("tests/sky-sky-raid.test.ts", test_marker, tests + test_marker)
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate product implementation
        run: |
          npm run test:fast
          npm run lint

      - name: Inject webdriver-only audit hooks
        run: python3 scripts/inject-sky-raid-v17-audit-hook.py

      - name: Build audited Pages artifact
        run: npm run build:pages

      - name: Browser setup
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime artifacts/sky-raid-v17
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/sky-raid-v21-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-raid-v21-http.log
          exit 1

      - name: Real browser WebGL playcheck
        run: node scripts/webgl-sky-raid-camera-edge-v17.mjs

      - name: Restore audit-only source injections
        if: always()
        run: git restore src/sky/SkyDancerSkyRaidFlight.ts src/sky/SkyDancerCombatDecisionV45.ts src/sky/SkyDancerAirCombatFxV18.ts

      - name: Commit reviewed combat handoff pass
        run: |
          rm .github/workflows/sky-raid-combat-handoff-v21-once.yml
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/SkyDancerSkyRaidRules.ts src/sky/SkyDancerSkyRaid.ts app/SkyDancerSkyRaidOverlay.tsx tests/sky-sky-raid.test.ts .github/workflows/sky-raid-combat-handoff-v21-once.yml
          git diff --cached --check
          git commit -m "Polish SKY RAID combat handoff rhythm"
          git push origin HEAD:main

      - name: Upload visual audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-raid-v21-combat-handoff-audit
          path: artifacts/sky-raid-v17
          if-no-files-found: warn
          retention-days: 7
