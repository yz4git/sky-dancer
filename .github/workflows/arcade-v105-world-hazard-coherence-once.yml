name: Arcade V10.5 World Hazard Coherence Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcade-v105-world-hazard-coherence-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply V10.5 world hazard coherence pass
        run: python3 scripts/apply-v105-world-hazard-coherence.py
      - name: Arcade rules regression
        run: npm run test:rules
      - name: Arcade typecheck
        run: npm run check:arcade
      - name: Lint
        run: npm run lint
      - name: Pages production build
        run: npm run build:pages
      - name: Commit product and cleanup temporary work files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sky/arcade/SkyDancerArcadeRuntime.ts src/sky/arcade/SkyDancerArcadeModels.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts tests/sky-arcade-run.test.ts
          git commit -m 'Arcade Run V10.5: anchor structural hazards to course world'
          git push origin HEAD:main
          git rm .github/workflows/arcade-v105-world-hazard-coherence-once.yml scripts/apply-v105-world-hazard-coherence.py
          git commit -m 'Remove V10.5 world hazard work files'
          git push origin HEAD:main
