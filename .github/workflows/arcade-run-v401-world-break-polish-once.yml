name: Arcade Run V40.1 World Break Polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/arcade-run-v401-world-break-polish-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply V40.1 World Break polish
        run: |
          python3 scripts/arcade-run-v401-world-break-polish.py
          python3 scripts/arcade-run-v401-world-break-polish-fix.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify V40.1 World Break polish
        run: |
          npm run check:arcade
          node --import tsx --test tests/sky-arcade-v401-world-break-polish.test.ts tests/sky-arcade-v40-world-break-phase6.test.ts
          npm run test:fast
          npm run lint
          npm run build:pages
      - name: Commit verified V40.1 polish
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/sky/arcade/SkyDancerArcadeV401WorldBreakPolish.ts src/sky/arcade/SkyDancerArcadeWebGLDemo.ts app/SkyDancerArcadeMode.tsx app/SkyDancerArcadeMode.module.css tests/sky-arcade-v401-world-break-polish.test.ts
          git commit -m "Arcade Run V40.1: brief World Break signatures"
          git push origin HEAD:main
