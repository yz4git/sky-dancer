name: Arcade V9.4.1 Final All Stage Sweep Once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/arcade-v941-final-all-stage-sweep-once.yml"

permissions:
  contents: write

concurrency:
  group: arcade-v941-final-all-stage-sweep-once
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SKY_DANCER_CHROME_PATH: /usr/bin/google-chrome
      SKY_DANCER_AUDIT_DIR: artifacts/arcade-v941-final-all-stage-sweep
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser controller
        run: |
          rm -rf .audit-runtime
          mkdir -p .audit-runtime
          printf '{"private":true,"type":"commonjs"}\n' > .audit-runtime/package.json
          npm install --prefix .audit-runtime --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          google-chrome --version
      - run: npm run build:pages
      - name: Start local Pages build
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/sky-dancer-v941-final-sweep-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sky-dancer-v941-final-sweep-http.log
          exit 1
      - name: Capture final all eleven stages
        run: node scripts/webgl-arcade-v941-final-all-stage-sweep.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-dancer-v941-final-all-stage-sweep-${{ github.sha }}
          path: artifacts/arcade-v941-final-all-stage-sweep
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary final sweep files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/arcade-v941-final-all-stage-sweep-once.yml scripts/webgl-arcade-v941-final-all-stage-sweep.mjs
          git commit -m "Remove V9.4.1 temporary final all-stage sweep files"
          git push origin HEAD:main
